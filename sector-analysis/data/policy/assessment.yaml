headline: >-
  The FY2027 budget, approved on 24 Nov 2026, is a smaller, debt-financed budget built on a rebound in oil output: spending falls 3%
  to SAR 1,392bn, the deficit is SAR 190.6bn (3.6% of GDP), and borrowing will lean on domestic and private channels. For Energy,
  the 2027 story is volumes recovering and the crisis price premium fading. For Banks, it is tighter, costlier funding and slower
  project lending, partly offset by support for households and contractors.
intro: >-
  This section is forward-looking and separate from the historical results and like-for-like calculations. It separates confirmed
  budget figures and enacted measures from preliminary figures, policy signals and our own interpretation. Every fact carries a dated
  source; click an id to see it. Directions and significance are our assessment, with a confidence level. They are quantified only where
  the evidence allows.
