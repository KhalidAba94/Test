sections:
  - heading: "1. What is confirmed (final budget and enacted measures)"
    paras:
      - {text: "FY2027 final budget: expenditure SAR 1,392.1bn, revenue SAR 1,201.5bn, deficit SAR 190.6bn (3.6% of GDP). The headline figures are unchanged from the 30 Sep pre-budget statement.", refs: ["F-040", "F-023"]}
      - {text: "2026 revised: deficit SAR 245bn (4.9% of GDP) against SAR 165bn budgeted, and real GDP −2.1% (the pre-budget statement said −3.6%), with oil activity −14.6% through Q3. Crude supply averaged 7.9 mb/d in Jan–Sep 2026 (−15%), 'primarily due to the impact of the closure of the Strait of Hormuz'.", refs: ["F-042", "F-043", "F-045", "F-053", "F-028"]}
      - {text: "Spending mix, 2027 vs 2026 estimate: military SAR 263bn (+3%); health and social development SAR 256bn (−16%, partly a reclassification after health clusters moved to the Health Holding Company, and partly 2026 crisis spending); education SAR 195bn (−5%); municipal services SAR 93bn (+12%); economic resources SAR 98bn (−5%); infrastructure and transport SAR 38bn (−7%); general items, incl. a mega-projects allocation, SAR 272bn (+6%). Capex is SAR 178bn (−2.1% vs the 2026 estimate, which the Ministry links to military spending brought forward into 2026; +10% vs the FY2026 budget). Financing expenses rise 31.1% to SAR 93bn.", refs: ["F-050", "F-046", "F-052"]}
      - {text: "Total government subsidies fall 61.6% to SAR 18bn, mainly lower support to electricity and water companies, as tariffs rise from 1 Jan 2027 (industrial electricity 23 halalas/kWh). Allowances for some public employees rise to offset this, and the Citizen Account is extended to end-2027.", refs: ["F-046", "F-055", "F-098", "F-097", "F-102"]}
      - {text: "Debt is projected at SAR 1,733bn at end-2026 and SAR 1,923bn at end-2027 (35.9% of GDP). Actual debt at end-Q3 2026 was already SAR 1,773.6bn; the budget notes that the year-end figure may differ. Government reserves at SAMA stay at SAR 399bn. Fitch's narrower measure of government-entity deposits at SAMA is about SAR 370bn, near a five-year low.", refs: ["F-048", "F-079", "F-049", "B-013"]}
      - {text: "Other enacted measures relevant to listed companies:", refs: ["F-099", "F-062", "B-018", "B-005", "B-024", "V-016", "V-017"]}
      - {text: "• An amended Government Tenders and Procurement Law: no new contracts while payments are outstanding, per the Implementing Regulations."}
      - {text: "• SANED wage support."}
      - {text: "• A government-led marine insurance pool for shipments to Saudi ports."}
      - {text: "• SAMA's 1% countercyclical buffer (from 25 May 2026)."}
      - {text: "• A +25 bp repo rise to 4.50% (16 Sep 2026)."}
      - {text: "• Direct foreign access to listed shares (1 Feb 2026)."}
      - {text: "• ZATCA's Domestic Minimum Top-up Tax from 1 Jan 2027, with regulations pending."}
      - {text: "• Higher Nitaqat wage floors (SAR 5,000, then SAR 6,000)."}
  - heading: "2. Stated intentions and policy signals (not yet measures)"
    paras:
      - {text: "Financing: the final Budget Statement says 2027 borrowing 'will focus on domestic and private market channels'. This is a stated intention; the size and mix come with the NDMC 2027 borrowing plan, not yet published. The 2027 net borrowing need (debt +SAR 190bn) is smaller than 2026's (+SAR 214bn estimated).", refs: ["F-085", "F-084", "F-048"]}
      - {text: "The Finance Minister speaks of efforts to 'reschedule some projects, and restructure a number of projects and programs', and sets 'no upper limits' on military and security needs. He wants to avoid crowding out private borrowers and sees no need to draw on reserves. No project list or amount is published.", refs: ["F-069", "F-065"]}
      - {text: "Privatisation: a move to a National Privatization Strategy with about 202 projects in the pipeline. Government share sales remain a financing option, but none is announced.", refs: ["V-019"]}
      - {text: "Energy: plans to raise East-West Pipeline throughput to about 10 mb/d are under consideration (preliminary engineering, no final investment decision). Maximum sustainable capacity stays at 12 mb/d. OPEC+ sets 2027 levels on 29 Nov 2026.", refs: ["E-043", "V-009", "E-042", "V-007"]}
      - {text: "Press reports of giga-project scaling-back are unverified and are not used.", refs: ["F-105"]}
  - heading: "3. How the budget and policy reach listed companies"
    paras:
      - {text: "Nine channels matter for these sectors:"}
      - {text: "1. Oil volumes and prices."}
      - {text: "2. Government borrowing and government deposits, which reach bank liquidity and funding costs."}
      - {text: "3. The size and timing of government, PIF and government-entity spending, which drives corporate lending and drilling demand."}
      - {text: "4. Regulated prices, subsidies and feedstock costs."}
      - {text: "5. Household income support and living costs, which reach retail credit."}
      - {text: "6. Interest rates."}
      - {text: "7. Capital rules."}
      - {text: "8. Tax (the new minimum top-up tax)."}
      - {text: "9. Security, which drives volumes, shipping and credit quality."}
      - {text: "Exposure differs within each sector. In Energy:"}
      - {text: "• Aramco carries the price and volume exposure."}
      - {text: "• Bahri carries the freight-rate and security exposure."}
      - {text: "• The drillers carry the activity and refinancing exposure; ADES is now diversified abroad, Arabian Drilling is Saudi-focused."}
      - {text: "• Petro Rabigh carries the margin and feedstock exposure, with Aramco as its backstop."}
      - {text: "In Banks, exposure depends on four things:"}
      - {text: "• Corporate vs retail mix."}
      - {text: "• Funding: demand vs term deposits, and how far loans exceed deposits."}
      - {text: "• Whether the bank's margin rises or falls with rates. Floating-rate corporate lenders gained in the 2023 hikes; fixed-rate retail and Islamic lenders lost margin then and recovered in the cuts."}
      - {text: "• Foreign units, which matter for the top-up tax."}
  - heading: "4. Scenarios and what we cannot assess yet"
    paras:
      - {text: "Base case (the budget's): output recovers in 2027 and the crisis premium fades. Energy revenue is then volume-led and roughly stable to higher. Shipping and refining earnings normalise down. Bank credit growth is around 8% (Fitch) with steady funding pressure.", refs: ["F-044", "B-033"]}
      - {text: "Downside: the escalation since 30 Sep 2026 persists. Tankers were hit in Hormuz on 21 and 25 Nov, and banks report a significant escalation as a subsequent event. Then volumes stay constrained and prices high, which favours Aramco's price, Bahri's rates and refiners' margins. It also means higher credit costs for banks, weaker non-oil activity and a larger deficit and borrowing need.", refs: ["V-018", "E-021"]}
      - {text: "Still pending, with impacts that depend on them marked as conditional:"}
      - {text: "• The NDMC 2027 borrowing plan."}
      - {text: "• The list of rescheduled projects."}
      - {text: "• The 2027 oil-revenue assumption (not published in the budget)."}
      - {text: "• OPEC+ 2027 levels."}
      - {text: "• January 2027 fuel and feedstock price notices."}
      - {text: "• The top-up tax regulations."}
      - {text: "No change to Zakat rules for 2027 was found (search to 26 Nov 2026).", refs: ["F-084", "F-046", "V-007", "V-016"]}
      - {text: "Our interpretation does not change any historical figure or like-for-like calculation in this analysis."}
  - heading: "5. Other sectors: first map of channels (to be completed in the roll-out)"
    paras:
      - {text: "These are preliminary channels, Low confidence until each sector's companies are analysed:", refs: ["F-046", "F-055", "F-099", "B-028", "B-031", "F-062", "V-016"]}
      - {text: "• Utilities: tariff rises from 1 Jan 2027 and lower government support to electricity and water companies (most of the 61.6% cut in total subsidies)."}
      - {text: "• Materials and petrochemicals: feedstock and fuel price notices, refining margins, and the top-up tax for large groups."}
      - {text: "• Capital goods and construction: project rescheduling, offset by the contractor-payment rule."}
      - {text: "• Consumer sectors: household allowances against higher utility bills."}
      - {text: "• Real estate and REITs: the rent freeze, land release and foreign ownership."}
      - {text: "• Insurance: the marine insurance pool, and health spending, which is partly reclassified."}
      - {text: "• Transportation: shipping security."}
      - {text: "Aldrees (fuel retail), which the Saudi Exchange lists in Energy, is exposed to regulated fuel prices and diesel costs."}
sector_notes:
  Energy:
    opportunities: ["Volume recovery towards OPEC+ required levels if flows normalise", "Bypass export capacity (East-West pipeline expansion under consideration)", "Rig reactivations (Arabian Drilling notified to resume all suspended offshore rigs in Aug 2026) and the gas programme"]
    risks: ["Persisting disruption or renewed attacks on facilities, pipelines and tankers", "Normalisation of crisis freight rates and refining margins", "Refinancing for leveraged drillers (Arabian Drilling sukuk due Feb 2027)", "Minimum top-up tax for large multinational groups (regulations pending)"]
    indicators: ["Saudi crude output (one series, monthly)", "OPEC+ 29 Nov 2026 decision", "Brent and VLCC rates", "Hormuz and Red Sea traffic", "January 2027 fuel and feedstock price notices", "Aramco FY2026 results (Mar 2027)"]
  Banks:
    opportunities: ["Foreign demand for SAR sukuk after J.P. Morgan index inclusion (29 Jan 2027)", "Utilities and municipal lending", "Faster contractor payments if the procurement rule is enforced", "Margin support at asset-sensitive banks after the Sep 2026 hike"]
    risks: ["Deposit competition and higher funding costs", "Credit costs if the escalation persists", "Loan growth well below the 2022–25 pace", "Top-up tax on low-taxed foreign units"]
    indicators: ["NDMC 2027 borrowing plan", "3M SAIBOR and time-deposit share", "Monthly bank credit, deposits and mortgages (SAMA)", "Quarterly impairments and overlays", "ZATCA top-up tax regulations"]
