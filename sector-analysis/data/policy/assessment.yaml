headline: >-
  The FY2027 budget, approved on 24 Nov 2026, plans spending of SAR 1,392bn (3% below the 2026 estimated outturn but 6% above the
  FY2026 budget) and a deficit of SAR 190.6bn (3.6% of GDP). It is financed by borrowing that the budget says will lean on domestic and
  private channels. It assumes a strong rebound in oil output. For Energy, the 2027 outcome depends on whether flows normalise: a
  volume-led recovery is net positive, while persisting disruption is not. For Banks, the main effects are steady pressure on funding
  costs, loan growth well below the 2022–25 pace, and a credit-quality risk if the escalation since 30 Sep continues. Support for
  households and contractors and a small rate rise partly offset these.
intro: >-
  This section is forward-looking and kept separate from the historical results and like-for-like calculations. It separates the
  confirmed final budget and enacted measures from preliminary figures, stated intentions, policy signals and our own interpretation.
  Every fact carries a dated source; click an id to see it. Directions and significance are our assessment, each with a confidence level.
  We quantify only where the evidence allows, and any illustration states its assumptions. An independent reviewer challenged an earlier
  draft; the changes are listed in the review log.
