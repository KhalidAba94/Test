# Limitations that remain after the close-out, by design or because the
# evidence does not exist in the filings. Read by build/export_review_log.py.
limitations:
- limitation: Underlying (adjusted) net profit is not shown, except Bank Aljazira FY2025
  why: Net profit can only be adjusted for a one-off if the filing gives the item's tax or zakat effect and the minority share. Subtracting a pre-tax gain from net profit would overstate the adjustment
    (tax) and ignore attribution (minority interests). None of the material items except one meets the rule.
  evidence: '25 register and material items (over 5% of attributable profit) were read in the notes: tax reconciliations give only aggregate lines (e.g. ''non-taxable income'', ''loss not subject to tax''),
    and no filing states the minority share of an item. Only Bank Aljazira''s FY2025 prior-year zakat charge (SAR 77.6m) qualifies: it is itself zakat, and the bank has no minority interests (FY2025 annual
    p.83). Aramco''s adjusted net income (non-IFRS) is before minority interests and is quoted, not adopted. data/review/underlying_profit_check.csv'
  disclosed: Every one-off row ('Tax and minority share' column) in the workbook and HTML; METHODOLOGY.md (one-offs); Bank Aljazira FY2025 driver text
- limitation: Like-for-like (and for some, organic) growth is not determinable in some company-years
  why: The step that separates like-for-like from reported growth is not disclosed. An estimate is not turned into a confirmed figure, and an absence of disclosure is not recorded as a zero.
  evidence: 'SNB: every year (Türkiye and Pakistan units: FX and hyperinflation effects not quantified). Alinma: FY2025 and 9M 2026 (income of deconsolidated funds not disclosed). SAIB: FY2025 (an unexplained
    SAR 536m of other income, about 12.8 pp of prior-year income, which the filing neither explains nor labels non-recurring). Petro Rabigh: new-capacity step not determinable (no operating report in the
    archive). Data/adjustments_parts/*.csv'
  disclosed: Each company's like-for-like bridge (n.d. rows with the reason); METHODOLOGY.md ('Banks', 'No inferred zeros')
- limitation: 'Cost of risk: small residual basis differences for five bank-period groups'
  why: Cost of risk is now on one basis (ECL on loans and financing, from the credit-risk note, over average net loans), but some notes do not separate every element.
  evidence: 'Riyad: the loan charge includes off-balance-sheet commitments, not separable. Albilad: gross of recoveries (recoveries not disclosed). SAB: the write-off/recovery line is attributed to loans.
    SNB 9M 2025 and 9M 2026: derived as income-statement line less investment ECL (interims do not split the loan charge). SAIB 9M 2026: approximate (recoveries given only as ''SAR 170 million''). data/banks/ecl_loans.csv
    (flags column)'
  disclosed: Banks sector data note; COR and ECL_LOANS definitions (Metrics sheet, HTML glossary); each ECL_LOANS figure's note in the source drawer
- limitation: No saudiexchange.sa link for older filings
  why: The archive manifests carry exchange links only for recent filings, and the Saudi Exchange website refuses automated access from this environment (Akamai 'Access Denied' even after the host was allowed),
    so links for the remaining filings could not be looked up.
  evidence: Environment network allowlist updated to include saudiexchange.sa; every request returned 'Access Denied'. The locator for every figure is the archive file path plus PDF page (or the XBRL row),
    which is complete.
  disclosed: HTML Sources view and source drawer; workbook Coverage sheet
- limitation: Some figures are sums of printed lines rather than one printed number
  why: The XBRL file reports some items as one figure where the statements print the parts (e.g. zakat plus income tax, PP&E depreciation plus amortisation plus right-of-use depreciation, or a loan ECL
    charge less recoveries). The figure is kept, and each part is traced instead.
  evidence: 'Full trace: 77 figures had every component found on the PDF page automatically; in the manual review 82 figures were confirmed from their printed components. No figure remains unlocated (data/trace/full_trace.csv,
    data/trace/full_review.csv).'
  disclosed: data/trace/full_trace.csv (trace_status and reviewer outcome); Full_trace_summary sheet of Review_Log.xlsx
- limitation: SAIB FY2025 other income of SAR 536m is unexplained
  why: The filing gives no note, no cash-flow add-back and no explanation; it arose in Q4 2025. It is kept in reported profit and flagged, not removed.
  evidence: 1030_SAIB/2025_Annual_filed2026-02-08.pdf p.10 (income statement, image page read by OCR), p.14, p.78
  disclosed: SAIB narrative (FY2025 driver and one-offs)
- limitation: Aldrees is excluded from Energy in every period
  why: 'Scope decision, not a data gap: the Saudi Exchange moved Aldrees (4200) from Energy to Consumer Discretionary Distribution & Retail with effect from 14 Sep 2025 (GICS), and the pilot applies the
    current classification to all periods (constant universe).'
  evidence: Exchange announcement reported by Argaam, 8 Sep 2025 (policy item E-060); Luberef (2223) is classed in Materials since listing.
  disclosed: Energy sector page (classification note); METHODOLOGY.md s.5
by_issue:
  H-R-012: 'Page references are fixed; saudiexchange.sa links for older filings cannot be added from this environment (manifests list only recent filings; the exchange website refuses automated access).
    Accepted: archive file + page is the locator.'
