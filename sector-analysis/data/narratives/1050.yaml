ticker: "1050"
headline: >-
  BSF grew attributable profit at a 14.4% annual rate from FY2022 to FY2025, faster than income (9.5% a year), mainly because its
  cost of risk fell from 99 bp in FY2023 to 46 bp in FY2025; in 9M 2026 profit rose 6.9% with a stable margin (2.83% annualised)
  and ROE on ordinary equity of 12.5%, but loan growth now leans on central-bank and interbank funding (loan-to-deposit 113.4%).
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income. Banks have no discrete 'capacity' additions, so like-for-like equals organic growth.
    No acquisitions, disposals or discontinued operations affected TOI. One material one-off revenue item is removed under
    'accounting / other': a SAR 296m gain in FY2024 on the sale of equity investments that had never been recorded. On that basis
    organic TOI growth was 0.4% in FY2024 (reported 3.6%) and 12.2% in FY2025 (reported 9.1%).
  perimeter_changes:
    - {event: "Subsidiaries Saudi Fransi Insurance Agency, Sofinco Saudi Fransi and Saudi Fransi Digital Ventures being liquidated (liquidation-basis statements)", date: "2024-2025", effect: "Still consolidated; no deconsolidation in the window; no adjustment", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.15"}
  capacity_changes: []
  fx_exposure: "Domestic, riyal-based business; the only foreign investment is a fully impaired 20% associate in Syria (carrying SAR 9.7m). No FX translation effect is identified."
  price_volume_support: >-
    Net special commission income can be split into volume (growth in average total assets) and margin (income ÷ average total
    assets) using the balance sheets. The bank's own margin disclosures are not used because definitions differ between banks.
  confidence: "High"
price_volume:
  - {period: "FY2023 vs FY2022", text: "We calculate that net special commission income rose SAR 1,409m: volume +SAR 543m (+6.8 pp of prior TOI; average assets +8.5%) and margin +SAR 865m (+10.8 pp; 2.87% to 3.23%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1050-FY2023-NSCI", "1050-FY2023-TA", "1050-FY2022-TA"]}
  - {period: "FY2025 vs FY2024", text: "We calculate that net special commission income rose SAR 809m, almost all volume (+SAR 798m, +8.3 pp of prior TOI; average assets +10.1%); the margin was flat at 2.88% to 2.89% (+SAR 11m, +0.1 pp).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1050-FY2025-NSCI", "1050-FY2025-TA", "1050-FY2024-TA"]}
  - {period: "9M 2026 vs 9M 2025", text: "We calculate that net special commission income rose SAR 387m: volume +SAR 419m (+5.3 pp of prior TOI; average assets +6.5%) and margin −SAR 33m (−0.4 pp; annualised 2.84% to 2.83%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1050-9M2026-NSCI", "1050-9M2026-TA", "1050-9M2025-NSCI"]}
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "TOI +16.3% and attributable profit +18.1%: net special commission income +21.9% as the margin widened to 3.23%; other income −17.3%. Costs +13.9% (cost-to-income 32.4%). The ECL charge on loans rose 22.4% (cost of risk 89 bp to 99 bp).", source: "facts", refs: ["1050-FY2023-TOI", "1050-FY2023-NI_ATTR", "1050-FY2023-IMPAIR_FIN"]}
    - {period: "FY2024", driver: "TOI +3.6% (organic +0.4%) and profit +7.6%: net special commission income +0.6% as the margin fell to 2.88%; other income +39.7%, including a SAR 296m gain on equity investments found unrecorded and sold in Q4 2024. Costs +12.8% (cost-to-income 35.3%). The loan ECL charge fell 31.5% (cost of risk 60 bp).", source: "1050_BSF/2024_Annual_filed2025-02-05.pdf p.137", refs: ["1050-FY2024-TOI", "1050-FY2024-NI_ATTR", "1050-FY2024-OTHER_OI"]}
    - {period: "FY2025", driver: "TOI +9.1% (organic +12.2%) and profit +17.8%: net special commission income +10.3% on volume; net fees −1.7%; gains on FVOCI and non-trading investments SAR 118.0m. Costs +4.4% (cost-to-income 33.8%). The loan ECL charge fell 14.9% (cost of risk 46 bp), helped by recoveries of written-off loans of SAR 407.3m (FY2024: SAR 144.0m).", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.11, p.62", refs: ["1050-FY2025-TOI", "1050-FY2025-NI_ATTR", "1050-FY2025-IMPAIR_FIN"]}
    - {period: "9M2026", driver: "TOI +6.4% and profit +6.9%: net special commission income +6.0% (volume), other income +18.9%, net fees −1.7%. Costs +6.9% (cost-to-income 32.9%). Loan ECL +3.3% (cost of risk 44 bp vs 45 bp, annualised) after overlays the bank says it recorded for the regional situation (amount not disclosed). ROE on ordinary equity 12.5% annualised, unchanged from 9M 2025.", source: "1050_BSF/2026_Q3_filed2026-10-26.pdf p.4, p.39", refs: ["1050-9M2026-TOI", "1050-9M2026-NI_ATTR", "1050-9M2026-IMPAIR_FIN"]}
  one_offs:
    - {item: "Gain on sale of equity investments held in prior years but not recorded (IAS 8 correction); P&L line not stated", period: "FY2024", amount_sar_m: 296.0, line: "Within TOI (trading income from securities was SAR 333.4m)", source: "1050_BSF/2024_Annual_filed2025-02-05.pdf p.137", tax_nci: "Tax/zakat effect not disclosed; no minority interests: after-tax effect not determinable, profit kept as reported (checked in the notes)"}
    - {item: "Reversal of ECL on off-balance-sheet exposures", period: "FY2023", amount_sar_m: -81.5, line: "Impairment reversal for investments, financial assets and others, net", source: "1050_BSF/2023_Annual_filed2024-02-13.pdf p.61", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Gains on FVOCI / non-trading investments (9M 2026: SAR 105.3m)", period: "FY2025", amount_sar_m: 118.0, line: "Gains on FVOCI / non-trading investments, net", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.11", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Gain on disposal of property and equipment", period: "FY2025", amount_sar_m: 36.2, line: "Other operating income", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.81", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Recoveries of written-off loans jumped (FY2024: SAR 144.0m); they recur each year and are netted in the loan ECL charge", period: "FY2025", amount_sar_m: 407.3, line: "Impairment charge for expected credit losses on loans and advances, net", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.62", tax_nci: "Recurring part of the impairment line, not a one-off: not adjusted"}
    - {item: "ZATCA zakat settlement for years to 2017 (SAR 1,510.7m, charged to retained earnings in 2018, settled by end-2023): no P&L effect in FY2022-9M2026", period: "2018-2023", amount_sar_m: null, line: "Retained earnings (2018)", source: "1050_BSF/2023_Annual_filed2024-02-13.pdf p.77"}
developments:
  - {date: "2024-Q3", category: "financing", text: "Issued SAR 3bn Tier I sukuk at 6.0% under an SAR 8bn programme; Tier I capital SAR 8bn at end-2024.", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.76"}
  - {date: "2024", category: "financing", text: "Bonus issue raised share capital from SAR 12.05bn to SAR 25bn (from statutory reserve and retained earnings; no change in equity).", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.13"}
  - {date: "2024-Q4", category: "event", text: "Management found equity investments held in prior years that had not been recorded; they were restated into 31 Dec 2023 retained earnings (+SAR 282.8m) and sold in Q4 2024 for a SAR 296m gain.", source: "1050_BSF/2024_Annual_filed2025-02-05.pdf p.137"}
  - {date: "2025-Q2 / 2025-Q4", category: "financing", text: "Issued USD 650m Additional Tier I notes at 6.375% (Q2), called the SAR 5bn 2020 Tier I sukuk and issued SAR 2.5bn at 6.4% (Q4); Tier I capital SAR 7.9bn at end-2025.", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.76; 1050_BSF/2026_Q3_filed2026-10-26.pdf p.7"}
  - {date: "2025", category: "financing", text: "Debt securities and term loans rose from SAR 15.5bn to SAR 38.9bn, including a new USD 4bn certificate-of-deposit programme.", source: "1050_BSF/2025_Annual_filed2026-02-02.pdf p.10; 1050_BSF/2026_Q3_filed2026-10-26.pdf p.28"}
  - {date: "2026-01 to 2026-09", category: "financing", text: "Amounts due to SAMA rose from SAR 5.0bn to SAR 17.2bn and due to banks from SAR 7.9bn to SAR 15.0bn, while customer deposits rose 4.1% to SAR 203.2bn; loans grew 7.2% to SAR 230.4bn.", source: "1050_BSF/2026_Q3_filed2026-10-26.pdf p.3"}
  - {date: "2026-02-28 onward", category: "event", text: "The bank reports stress tests on oil-price scenarios and expert credit judgement, and states that ECL overlays were recorded because the effects cannot be fully captured by the models (amount not disclosed). It states that after 30 Sep 2026 the situation in the Kingdom escalated significantly, with the impact uncertain.", source: "1050_BSF/2026_Q3_filed2026-10-26.pdf p.39"}
what_it_means:
  improved: "Credit costs: cost of risk fell from 99 bp (FY2023) to 46 bp (FY2025) and 44 bp annualised in 9M 2026, lifting ROE on ordinary equity from 9.8% (FY2022) to 11.9% (FY2025) and 12.5% annualised in 9M 2026."
  weakened: "Fees and funding: net fees grew 2.1% a year in FY2022-FY2025 and fell 1.7% in both FY2025 and 9M 2026, and loan-to-deposit rose from 100.9% (FY2022) to 113.4% at Sep 2026, with SAR 19.4bn more owed to SAMA and banks in 9M 2026."
  why: "FY2025 income growth was volume-led (+8.3 pp of prior TOI from balance-sheet growth, margin flat at 2.89%); profit grew faster than income because impairments fell, partly on SAR 407m of recoveries of written-off loans."
  uncertain: "Whether credit costs stay low after the post-30 September escalation (overlays recorded but not quantified), and fair-value swings in the investment book: an other comprehensive loss of SAR 1,459m in 9M 2026 left ordinary equity at SAR 42,469m, below SAR 42,722m at Dec 2025."
confidence_overall: "High"
data_notes:
  - "9M 2025 restatement of 31 Dec 2024 (+SAR 530.9m to investments and other reserves): an IAS 8 correction. FVOCI equity investments historically carried at cost were remeasured to fair value, applied at 1 Jan 2024; the 2024 P&L and OCI effect was judged insignificant and not restated. FY2023 equity here uses the restated opening balance from the FY2025 AFS, and FY2022 equity includes the separate +282.8m correction from the FY2024 AFS (note 45), so FY2023 and FY2024 ROE are on a consistent basis. FY2022 ROE averages the FY2021 closing equity as reported (no restated FY2021 balance is published) with the restated FY2022 closing balance, so it is slightly understated (9.75% vs 9.79%). Source: 1050_BSF/2025_Q3_filed2025-10-27.pdf p.34; 2025_Annual p.13, p.139."
  - "Tier 1 overrides: T1_COST for FY2022-9M2026 from the statement of changes in equity ('Tier 1 Sukuk / Tier I capital related cost'). T1_SUKUK for 30 Sep 2026 was missing and is set to SAR 7,937.5m (p.3). EQ_ATTR equals total equity including Tier I capital at every date (30 Sep 2026: 50,406.1 = 42,468.6 + 7,937.5)."
  - "IMPAIR_FIN override: XBRL took the loans-only ECL line for full years but added the separate 'investments, financial assets and others' line for 9M 2025 and 9M 2026. The 9M values are set to the loans line (705.9 and 729.1) so the series is consistent."
  - "XBRL tags BSF's zakat charge as 'profit from discontinued operations' for FY2021-FY2025 and leaves zakat blank; corrected (ZAKAT_TAX populated, NI_DISC removed, NI_CONT = NI). BSF has no discontinued operations."
  - "The FY2022 AFS primary statements are image pages; FY2022 income figures come from the FY2023 AFS comparatives."
