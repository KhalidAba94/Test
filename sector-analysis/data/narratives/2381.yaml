what_it_means:
  improved: "Free cash flow turned positive in FY2025 (SAR 353m) and 9M 2026 (SAR 140m) as capex fell, and the land-rig segment result rose 5.3% in 9M 2026."
  weakened: "Revenue fell 5.1% in FY2025 and 8.1% in 9M 2026, the operating margin dropped from 23.0% (FY2023) to 4.9% (FY2025), and attributable profit went from SAR 605m to a loss of SAR 75.3m."
  why: "Saudi Aramco's 2024-2025 suspensions, terminations and non-renewals cut offshore revenue by 32.5% in FY2025, while higher depreciation (SAR 958m in FY2025), finance costs and impairments of SAR 105m and SAR 114m weighed on profit; 2026 brought further conflict-related offshore suspensions."
  uncertain: "Rig counts and day rates are not disclosed, so the effect of new rigs cannot be separated from lost contracts, and refinancing of the SAR 2.0bn sukuk due in February 2027 was still under discussion at 30 Sep 2026."
confidence_overall: "Medium"
data_notes:
  - "The dataset shows attributable profit growth FY2025/FY2024 of -123.4%; profit turned into a loss, so under METHODOLOGY s.1 it should read n.m. (absolute change -SAR 396.6m)."
  - "Operating income equals the P&L subtotal before finance costs (FY2025 SAR 168.3m, p.10). EBITDA adds back the FY2024 and FY2025 impairments (SAR 105.0m, SAR 114.3m), so EBITDA excludes them while operating income includes them."
  - "FY2024 capex is flagged R (SAR 1,910.3m vs 1,859.7m in the FY2024 XBRL); both annual reports show PP&E additions of SAR 1,859.7m plus intangible additions of SAR 50.6m, so the difference is the capex definition, not a restatement."
  - "Total assets at 31 Dec 2025 are SAR 10,177.2m as re-presented in the 9M 2026 interim (SAR 10,089.4m in the FY2025 AFS) after mobilisation costs were grossed up (SAR 87.8m); no profit effect."
  - "The impairment add-backs used for FY2022 and FY2023 EBITDA differ between filings (FY2022 SAR 20.6m vs 0.05m first reported; FY2023 nil vs SAR 15.0m) and were not verified; the effect on EBITDA is below 1.5%."
  - "Primary statements are scanned; figures come from XBRL and the text notes, and the FY2025 P&L was checked visually."
