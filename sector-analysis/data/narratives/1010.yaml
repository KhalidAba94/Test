ticker: "1010"
headline: >-
  Riyad Bank grew attributable profit at a 14.0% annual rate from FY2022 to FY2025 by growing loans 15.5% a year and cutting
  cost-to-income from 32.4% to 29.6%; but its margin on assets has narrowed every year since FY2023 (3.33% to 2.69%, and 2.57%
  annualised in 9M 2026), so 9M 2026 profit growth slowed to 4.6% while the bank funded growth with debt and SAR 11.4bn of new
  Tier 1 sukuk (loan-to-deposit 117.0% at 30 Sep 2026).
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income. Banks have no discrete 'capacity' additions, so like-for-like equals organic growth.
    No acquisitions, disposals of subsidiaries or discontinued operations were found in FY2022-9M2026, so organic growth equals
    reported growth in every comparison.
  perimeter_changes:
    - {event: "Associate RSA (21.4%) exchanged for a 14.35% FVOCI stake in National Life and General Insurance (fair value SAR 194.3m)", date: "2022", effect: "Associate below TOI; no TOI effect", source: "1010_RIBL/2022_Annual_filed2023-02-21.pdf p.49"}
  capacity_changes: []
  fx_exposure: "Almost all business is in Saudi riyals (pegged to the US dollar); no FX translation effect is identified."
  price_volume_support: >-
    Net special commission income can be split into volume (growth in average total assets) and margin (income ÷ average total
    assets) using the balance sheets. The bank's own margin disclosures are not used because definitions differ between banks.
  confidence: "High"
price_volume:
  - {period: "FY2023 vs FY2022", text: "We calculate that net special commission income rose SAR 2,362m: average assets grew 8.9% (volume +SAR 896m, +6.6 pp of prior TOI) and the margin on average assets widened from 2.93% to 3.33% (rate +SAR 1,466m, +10.8 pp).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1010-FY2023-NSCI", "1010-FY2023-TA", "1010-FY2022-TA"]}
  - {period: "FY2025 vs FY2024", text: "We calculate that net special commission income rose only SAR 198m: volume added SAR 2,037m (+11.8 pp of prior TOI) as average assets grew 15.8%, but the margin fell from 3.07% to 2.69% (rate −SAR 1,839m, −10.6 pp).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1010-FY2025-NSCI", "1010-FY2025-TA", "1010-FY2024-TA"]}
  - {period: "9M 2026 vs 9M 2025", text: "We calculate that net special commission income rose SAR 577m: volume +SAR 1,059m (+7.7 pp of prior TOI; average assets +11.0%) partly offset by margin −SAR 483m (−3.5 pp; annualised 2.69% to 2.57%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1010-9M2026-NSCI", "1010-9M2026-TA", "1010-9M2025-NSCI"]}
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "TOI +16.9% and attributable profit +14.6%: net special commission income +23.5% as the margin widened to 3.33%; net fees −1.8%. Operating costs +12.7% (cost-to-income 31.3%). The impairment charge on financing rose 82.5% (cost of risk 0.45% to 0.73%).", source: "facts", refs: ["1010-FY2023-TOI", "1010-FY2023-NI_ATTR", "1010-FY2023-IMPAIR_FIN"]}
    - {period: "FY2024", driver: "TOI +8.7% and profit +15.9%: net special commission income +3.7% as the margin fell to 3.07%, but net fees +25.4% and other income +29.1%; impairments −13.6% (cost of risk 0.55%); cost-to-income 30.6%.", source: "facts", refs: ["1010-FY2024-TOI", "1010-FY2024-NI_ATTR", "1010-FY2024-FEES_NET"]}
    - {period: "FY2025", driver: "TOI +6.3% and profit +11.7%: net special commission income only +1.5% (margin 2.69%); net fees +16.3%; other income +28.9%, including SAR 138.5m gains on disposal of non-trading investments. Costs +2.8%, so cost-to-income fell to 29.6%. Impairments −16.0% (cost of risk 0.39%); recoveries of written-off loans were SAR 897m vs SAR 596m.", source: "1010_RIBL/2025_Annual_filed2026-02-10.pdf p.53, p.65", refs: ["1010-FY2025-TOI", "1010-FY2025-NI_ATTR", "1010-FY2025-IMPAIR_FIN"]}
    - {period: "9M2026", driver: "TOI +5.0% and profit +4.6%: net special commission income +6.0%; net fees −17.4% (corporate banking fees SAR 1,683m vs 2,035m) while trading income rose to SAR 1,387m from SAR 703m. Costs +1.4% (cost-to-income 28.7%). The credit-impairment line fell 11.2% only because of a SAR 178m reversal on other financial assets; the ECL charge on loans rose to SAR 1,082m from SAR 935m (we calculate loan-only cost of risk 0.38% vs 0.36%, annualised). An investment impairment of SAR 191m and zakat +20.3% also weighed.", source: "1010_RIBL/2026_Q3_filed2026-10-29.pdf p.5, p.28, p.35", refs: ["1010-9M2026-TOI", "1010-9M2026-NI_ATTR", "1010-9M2026-IMPAIR_FIN", "1010-9M2026-FEES_NET"]}
  one_offs:
