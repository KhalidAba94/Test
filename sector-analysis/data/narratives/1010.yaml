developments:
  - {date: "2022-02 / 2022-10", category: "financing", text: "First Additional Tier 1 sukuk: USD 750m 'Green' sukuk (Feb 2022) and SAR 3.75bn by private placement (Sep-Oct 2022); Tier 1 sukuk SAR 6.6bn at end-2022.", source: "1010_RIBL/2023_Annual_filed2024-03-03.pdf p.52"}
  - {date: "2024-09 / 2025-01", category: "financing", text: "Further AT1: USD 750m (proceeds 3 Oct 2024) and SAR 2bn at 6% (Jan 2025); Tier 1 sukuk SAR 11.4bn at end-2025.", source: "1010_RIBL/2025_Annual_filed2026-02-10.pdf p.57"}
  - {date: "2025-01 / 2025-07", category: "financing", text: "Called USD 1.5bn Tier 2 sukuk at par and issued USD 1.25bn Tier 2 sukuk at 6.209%.", source: "1010_RIBL/2025_Annual_filed2026-02-10.pdf p.57"}
  - {date: "2025", category: "financing", text: "Debt securities and term loans rose from SAR 13.3bn to SAR 47.9bn (term loans SAR 16.1bn; other issuances SAR 23.3bn) as loans grew faster than deposits (+16.6% vs +8.3%).", source: "1010_RIBL/2025_Annual_filed2026-02-10.pdf p.57"}
  - {date: "2026-01 to 2026-09", category: "financing", text: "Issued SAR 11.4bn of AT1 (incl. SAR 10bn at 6.50%), doubling Tier 1 sukuk to SAR 22.8bn (Tier 1 ratio 18.2% vs 16.0% at Dec 2025); issued USD 1bn and SGD 300m Tier 2 notes and called SAR 3bn Tier 2 sukuk (Feb 2026).", source: "1010_RIBL/2026_Q3_filed2026-10-29.pdf p.29, p.37"}
  - {date: "2026", category: "financing", text: "Bonus shares raised share capital from SAR 30bn to SAR 40bn (from statutory reserve and retained earnings; no change in equity).", source: "1010_RIBL/2026_Q3_filed2026-10-29.pdf p.7"}
  - {date: "2026-02-28 onward", category: "event", text: "The bank reports that the regional situation deteriorated from 28 Feb 2026 (Strait of Hormuz, shipping). It runs periodic stress tests and recalibrates staging, ECL assumptions and scenario weights, but discloses no quantified overlay. It states that after 30 Sep 2026 the situation in the Kingdom escalated significantly, creating heightened credit, liquidity and operational risk, with the impact uncertain.", source: "1010_RIBL/2026_Q3_filed2026-10-29.pdf p.39"}
what_it_means:
  improved: "Efficiency: cost-to-income fell from 32.4% in FY2022 to 29.6% in FY2025 and 28.7% in 9M 2026, and ROE on ordinary equity rose from 14.4% (FY2022) to 15.9% in FY2024 and 16.0% in FY2025."
  weakened: "Margin and funding: net special commission income ÷ average assets fell from 3.33% (FY2023) to 2.69% (FY2025) and 2.57% annualised in 9M 2026, and loans outgrew deposits (FY2022-FY2025 CAGR 15.5% vs 11.4%; loan-to-deposit 117.0% at Sep 2026)."
  why: "Income growth now comes from volume: balance-sheet growth added 11.8 pp of prior TOI in FY2025 and 7.7 pp in 9M 2026, while the lower margin took off 10.6 pp and 3.5 pp; there were no acquisitions."
  uncertain: "Credit costs after the post-30 September escalation (the loan ECL charge already rose 15.7% in 9M 2026), and the cost of the doubled Tier 1 sukuk: ROE on ordinary equity was 15.6% annualised in 9M 2026 vs 16.3% in 9M 2025."
confidence_overall: "High"
data_notes:
  - "9M 2025 restatement of 31 Dec 2024 (+SAR 451.5m to investments and other reserves): an IAS 8 correction of error. The bank's equity interest in the Saudi Credit Bureau (SIMAH), held at FVOCI, had been carried at net asset value instead of fair value. Profit was not affected. The same +451.5m was applied to opening 2024 equity in the FY2025 AFS (p.12), but FY2023 equity is kept as reported, so FY2024 average equity mixes bases; restating the opening would lower FY2024 ROE by 0.06 pp. Source: 1010_RIBL/2025_Q3_filed2025-10-28.pdf p.13; 2025_Annual p.38."
  - "Tier 1 overrides: XBRL EQ_ATTR for FY2022 and FY2023 excluded Tier 1 sukuk (49,602.2 and 53,695.6), and T1_SUKUK was missing for FY2021-FY2023. Both were replaced from the FY2023 balance sheet (total equity 56,173.3 and 60,258.1; sukuk 6,571.1 and 6,562.5; nil at end-2021), so EQ_ATTR includes the sukuk at every date and EQ_ATTR − T1_SUKUK is ordinary equity."
  - "Tier 1 sukuk distributions (T1_COST) are taken from the statement of changes in equity. FY2023 is the total row (319.0m), of which 8.6m was charged against the sukuk column itself (unexplained in the filing)."
  - "XBRL tags the zakat charge as 'profit from discontinued operations' for FY2024-FY2025 and omits FY2025 zakat; corrected (zakat FY2025 SAR 1,196.8m; no discontinued operations)."
  - "IMPAIR_FIN is the single P&L line 'impairment charge for credit losses and other financial assets', the same basis as other banks. It includes non-loan items: the loan-only charge was SAR 1,082m in 9M 2026 vs the line's SAR 904m (note 8e, p.28)."
  - "Derivative margin balances were grossed up from due from/to banks into other assets/liabilities in FY2025 AFS and 9M 2026 comparatives (balance sheet only). FY2022 and 9M 2025 segment results were re-presented without a stated reason; totals are unchanged."
