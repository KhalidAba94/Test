ticker: "2222"
headline: >-
  Revenue and profit fell every year from the 2022 peak as crude prices and the government's price-equalisation income declined;
  9M 2026 rebounded (revenue +15.2%, attributable profit +36.1%) because a 29% higher realised crude price and much stronger
  downstream earnings outweighed a 15% fall in liquids output during the Hormuz disruption, helped by a SAR 25.9bn one-off gain.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue (other income related to sales excluded). Perimeter = revenue of acquired businesses for the
    months not owned in the prior period (Valvoline global products from 1 Mar 2023, Aramco Fuels Poland from 30 Nov 2022, Esmax
    from 1 Mar 2024) less revenue of disposed businesses for the months not owned in the current period (Hadeed, sold 31 May 2024).
    Disposals below the 0.5% materiality threshold (SABIC Film & Sheet, SABIC ETP) are not adjusted. New capacity (e.g. Jafurah gas,
    first gas Dec 2025) is not separately disclosed, so like-for-like is not determinable and organic growth is the closest measure.
  perimeter_changes:
    - {event: "Aramco Fuels Poland acquired", date: "2022-11-30", effect: "SAR 2,043m revenue in Dec 2022; full-year 2023 contribution not disclosed (estimated)", source: "2222_SAUDI_ARAMCO/2023_Annual_filed2024-03-11.pdf p.72"}
    - {event: "Valvoline global products business acquired", date: "2023-03-01", effect: "SAR 9,428m revenue Mar–Dec 2023; full-year pro-forma SAR 11,189m", source: "2222_SAUDI_ARAMCO/2023_Annual_filed2024-03-11.pdf p.71"}
    - {event: "Esmax (Chile fuels retail) acquired", date: "2024-03-01", effect: "SAR 7,796m revenue Mar–Dec 2024; Jan–Feb pro-forma SAR 1,564m", source: "2222_SAUDI_ARAMCO/2025_Annual_filed2026-03-10.pdf p.73"}
    - {event: "Hadeed (SABIC steel) sold to PIF", date: "2024-05-31", effect: "metal products revenue SAR 13,054m in FY2023, SAR 5,211m in FY2024 (Jan–May)", source: "2222_SAUDI_ARAMCO/2025_Annual_filed2026-03-10.pdf p.67, p.73"}
    - {event: "PRefChem (Malaysia joint operation) stake sold to PETRONAS", date: "2026-09-02", effect: "revenue for the lost month not disclosed; SAR 25,902m gain", source: "2222_SAUDI_ARAMCO/2026_Q3_filed2026-11-03.pdf"}
  capacity_changes:
    - {event: "Jafurah unconventional gas: first gas", date: "2025-12", effect: "revenue contribution not disclosed", source: "sector policy fact base (E-series)"}
  fx_exposure: "Revenue is largely USD-linked and the riyal is pegged; non-pegged currency effects are not disclosed and are not material at group level."
  price_volume_support: >-
    Annual filings in the archive contain financial statements only (no realised prices or volumes), so an annual price/volume split
    is not determinable. The 9M 2026 interim report discloses the realised crude price and liquids production, which supports a split
    of crude oil revenue for 9M 2026 vs 9M 2025.
  confidence: "Medium (perimeter effects are at most 1.6 pp in any year; one estimate is Low confidence)"
price_volume:
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Crude oil revenue rose SAR 40.1bn (+7.6%) to SAR 570.3bn. The realised crude price rose 29.2% ($91.7 vs $71.0/bbl), so we
      calculate a price effect of about +SAR 154.6bn (+13.2 pp of group revenue) and an implied volume effect of about −SAR 114.4bn
      (−9.8 pp), consistent with liquids production down 15.2% (8,934 vs 10,536 thousand b/d). Refined and chemical product revenue
      added a further SAR 124.6bn (+10.6 pp), which the filings do not split between price and volume.
    basis: "calculated (price effect = prior crude revenue x price change; volume = remainder)"
    confidence: "Medium"
    source: "2222_SAUDI_ARAMCO/2026_Q3_filed2026-11-03.pdf p.1 (prices), p.6 (production), p.40 (revenue by product)"
    refs: ["2222-9M2026-REV", "2222-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue −17.6% and attributable profit −24.2%: crude oil revenue fell 22.1% (SAR 1,076.7bn → 838.6bn) and other income related to sales fell 21.7%. EBITDA margin (on revenue plus other income related to sales) eased from 54.5% to 52.0%.", source: "2023_Annual_filed2024-03-11.pdf p.65", refs: ["2222-FY2023-REV", "2222-FY2023-NI_ATTR"]}
    - {period: "FY2024", driver: "Revenue −1.0% but attributable profit −13.0%: crude revenue −4.2% while refined and chemical revenue +2.4%; downstream EBIT turned negative (−SAR 11.0bn) and impairments of SAR 11.8bn were recognised. EBITDA margin (same base) 48.7%.", source: "2025_Annual_filed2026-03-10.pdf p.36, p.67", refs: ["2222-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue −4.8% and attributable profit −11.6%: crude revenue −12.1% to SAR 706.0bn, price-equalisation income −31.9% to SAR 111.9bn, and impairment and held-for-sale losses of SAR 32.4bn (mostly downstream and SABIC Europe / ETP). Upstream EBIT SAR 731.9bn; downstream EBIT −SAR 9.6bn after SAR 20.4bn of losses on assets held for sale.", source: "2025_Annual_filed2026-03-10.pdf p.36, p.66", refs: ["2222-FY2025-NI_ATTR", "2222-FY2025-EBITDA_C"]}
    - {period: "9M2026", driver: "Attributable profit +36.1% (management's adjusted net income +22.0% to SAR 368.9bn). Upstream EBIT rose only 3.1% (higher prices offset by lower volumes and higher royalties); downstream EBIT rose from SAR 9.1bn to SAR 138.2bn, including the SAR 25.9bn PRefChem gain. Other income related to sales doubled (+99.0%) as the gap between international and regulated domestic prices widened.", source: "2026_Q3_filed2026-11-03.pdf p.15, p.35–36", refs: ["2222-9M2026-NI_ATTR", "2222-9M2026-OIRS"]}
    - {period: "FY2022–FY2025", driver: "Capex rose 34.9% (SAR 141.2bn → 190.4bn) while operating cash flow fell 26.8%, so free cash flow fell from SAR 557.0bn to 320.4bn; capex rose from 6.2% to 11.4% of revenue plus other income related to sales.", source: "cash-flow statements (XBRL section 300700)", refs: ["2222-FY2025-CAPEX", "2222-FY2025-FCF"]}
  one_offs:
    - {item: "PP&E impairment, mainly downstream", period: "FY2022", amount_sar_m: 3690, line: "within D&A as then presented", source: "2022 AFS", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Hadeed fair-value loss on classification as held for sale", period: "FY2023", amount_sar_m: 3219, line: "loss on remeasurement of assets held for sale", source: "2023 AFS", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Impairment and held-for-sale remeasurement losses (as re-presented)", period: "FY2024", amount_sar_m: 11834, line: "Impairment and held for sale remeasurement losses", source: "2025_Annual_filed2026-03-10.pdf", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Impairment and held-for-sale losses: downstream PP&E SAR 14.6bn, facility closure SAR 4.5bn, SABIC Europe SAR 8.6bn, SABIC ETP SAR 4.8bn", period: "FY2025", amount_sar_m: 32425, line: "Impairment and held for sale remeasurement losses", source: "2025_Annual_filed2026-03-10.pdf", tax_nci: "Tax/zakat effect not disclosed; minority share not disclosed: after-tax effect not determinable, profit kept as reported (checked in the notes)"}
    - {item: "Impairment and held-for-sale losses (9M 2025, as re-presented)", period: "9M2025", amount_sar_m: 8886, line: "Impairment and held for sale remeasurement losses", source: "2026_Q3_filed2026-11-03.pdf", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Gain on sale of PRefChem equity interest", period: "9M2026", amount_sar_m: 25902, line: "gain on sale of equity interest in an affiliate (operating income)", source: "2026_Q3_filed2026-11-03.pdf", tax_nci: "Tax/zakat effect not disclosed; minority share not disclosed. Only the company's own adjusted net income (non-IFRS, before minority interests) removes it: quoted, not adopted"}
    - {item: "Management adjusting items, net (gain) — excluded from adjusted net income", period: "9M2026", amount_sar_m: -21844, line: "non-IFRS reconciliation", source: "2026_Q3_filed2026-11-03.pdf p.15", tax_nci: "Company measure (adjusted net income, non-IFRS, before minority interests): quoted, not adopted"}
