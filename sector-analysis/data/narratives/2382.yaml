ticker: "2382"
headline: >-
  Acquisitions and newly bought rigs lifted revenue at a 39.4% annual rate, from SAR 2,467m in FY2022 to SAR 6,689m in FY2025; in 9M 2026
  revenue rose 44.0% with Shelf Drilling consolidated, but attributable profit fell 23.0% as finance and overhead costs rose, and we estimate
  that revenue of the business owned before Shelf fell by about 18% (Low confidence).
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Perimeter = revenue of acquired businesses for the months not owned in the prior period: Emerald Driller
    (27 May 2022), Seadrill GCC Operations (18 Oct 2022), Vantage's Topaz rig and Rig Finance Ltd (30 Oct 2024), Shelf Drilling (25 Nov 2025)
    and Saudi Arabian Saipem (15 Sep 2026). We use disclosed IFRS 3 contributions where they cover the period; otherwise the disclosed
    full-year pro-forma revenue less the post-acquisition contribution, or annualised post-acquisition revenue (Medium), and for Shelf in
    9M 2026 the FY2025 pro-forma x 9/12 (Low). New capacity (14 rigs bought in 2022 to start work in 2023, two more bought for 2023 delivery,
    later refurbishments) cannot be quantified because rig counts, rig days and day rates are not disclosed, so like-for-like growth is not
    determinable and organic growth is the closest available measure.
  perimeter_changes:
    - {event: "Emerald Driller Company (3 offshore jack-ups, Qatar) acquired by the parent and transferred into the group under common control", date: "2022-05-27", effect: "SAR 201.1m revenue 27 May-31 Dec 2022 (disclosed); full-year 2022 pro-forma SAR 254.8m; bargain-purchase gain SAR 244.9m", source: "2382_ADES/2022_Annual_filed2024-10-09.pdf p.36"}
    - {event: "Seadrill GCC Operations Ltd and 7 subsidiaries (7 offshore jack-ups, KSA) acquired for SAR 2,554.8m", date: "2022-10-18", effect: "SAR 98.2m revenue to 31 Dec 2022 (disclosed); full-year 2022 pro-forma SAR 484.4m; bargain-purchase gain SAR 177.3m", source: "2382_ADES/2022_Annual_filed2024-10-09.pdf p.37"}
    - {event: "Topaz jack-up and Rig Finance Ltd (Soehanah jack-up) acquired from Vantage, Southeast Asia, for SAR 726.1m", date: "2024-10-30", effect: "SAR 40.5m revenue to 31 Dec 2024 (disclosed); full-year 2024 pro-forma SAR 243.3m; bargain-purchase gain SAR 7.5m", source: "2382_ADES/2025_Annual_filed2026-03-29.pdf p.45"}
    - {event: "16.5% of Shelf Drilling bought (held at fair value through profit or loss), then 100% of Shelf Drilling Ltd acquired (consideration SAR 1,922.6m; borrowings assumed SAR 5,096.8m)", date: "2025-08 / 2025-11-25", effect: "SAR 388.9m revenue 25 Nov-31 Dec 2025 (disclosed); full-year 2025 pro-forma SAR 3,871.8m; bargain-purchase gain SAR 21.2m (provisional)", source: "2382_ADES/2025_Annual_filed2026-03-29.pdf p.44; 2382_ADES/2026_Q3_filed2026-11-09.pdf p.21-22"}
    - {event: "Saudi Arabian Saipem Ltd (3 owned and 2 leased premium jack-ups with customer contracts) acquired for SAR 1,133.9m", date: "2026-09-15", effect: "SAR 26.1m revenue to 30 Sep 2026 (disclosed); 9M 2026 pro-forma SAR 627.0m; provisional bargain-purchase gain SAR 77.8m", source: "2382_ADES/2026_Q3_filed2026-11-09.pdf p.20-21"}
  capacity_changes:
    - {event: "14 new rigs bought for SAR 1,924m plus SAR 885m of refurbishment, to start operating in 2023", date: "2022", effect: "revenue not disclosed", source: "2382_ADES/2022_Annual_filed2024-10-09.pdf p.47"}
    - {event: "Two rigs bought from Maple Maritime (SAR 168.75m) and Deep Drilling 1 (SAR 45.9m) for delivery in 2023", date: "2023", effect: "revenue not disclosed", source: "2382_ADES/2022_Annual_filed2024-10-09.pdf p.72"}
    - {event: "Capital projects completed and transferred to rigs: SAR 4,831m (2023), SAR 3,198m (2024), SAR 1,438m (2025)", date: "2023 to 2025", effect: "revenue not disclosed", source: "2382_ADES/2023_Annual_filed2024-03-07.pdf p.41; 2382_ADES/2024_Annual_filed2025-03-04.pdf p.50; 2382_ADES/2025_Annual_filed2026-03-29.pdf p.56"}
  fx_exposure: "Operations in more than 20 countries, but the company states it is not significantly exposed to currency risk because major transactions are in USD (riyal pegged); no FX adjustment is made. Revenue by currency is not disclosed."
  price_volume_support: >-
    Not determinable. The filings give no fleet rig count, utilisation, rig days, day rates or backlog (only the rigs in each acquisition).
    Revenue is split by geography and by type (units operations, lease, projects, catering), which shows where revenue moved but not why.
  confidence: "Low (perimeter estimates are Medium for FY2023-FY2025 and Low for 9M 2026; new capacity not determinable)"
price_volume:
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Shelf added new geographies (West/Central Africa SAR 918m vs SAR 40.4m for Nigeria in 9M 2025, Norway SAR 292m, other countries
      SAR 400m) and enlarged others (Southeast Asia +73.1%, India +139.6%, Egypt +51.9%). The Saudi segment, the largest, fell 13.1%
      (SAR 2,755m to SAR 2,395m) and Qatar 22.1%; the company reports temporary suspensions of certain rigs in the GCC in 2026. Day rates and
      rig days are not disclosed, so price and volume cannot be separated.
    basis: "disclosed (geographic segments); price/volume split not determinable"
    confidence: "High for the segment amounts; the split is not determinable"
    source: "2382_ADES/2026_Q3_filed2026-11-09.pdf p.18-19 (segments), p.34 (note 17)"
    refs: ["2382-9M2026-REV", "2382-9M2025-REV"]
  - period: "FY2025 vs FY2024"
    text: >-
      Saudi segment revenue fell 12.8% (SAR 4,143m to SAR 3,612m) while Southeast Asia rose from SAR 181m to SAR 610m (Vantage rigs for a full
      year plus Shelf from 25 Nov); units-operations (drilling) revenue rose 2.0%. Day rates and rig days are not disclosed.
    basis: "disclosed (geographic segments, revenue by type); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "2382_ADES/2025_Annual_filed2026-03-29.pdf p.41-42 (segments), p.46 (revenue by type)"
    refs: ["2382-FY2025-REV", "2382-FY2024-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue +75.6%, of which we estimate 21.1 pp from the full-year effect of Emerald Driller and Seadrill GCC (organic +54.5%); the Saudi segment rose 82.0%, covering Seadrill GCC's first full year and the rigs bought in 2022 that were due to start work in 2023. Attributable profit rose only 13.2% because FY2022 included SAR 422m of bargain-purchase gains; finance costs rose to SAR 711m. Net margin 10.2%.", source: "2382_ADES/2024_Annual_filed2025-03-04.pdf p.37 (segments), p.8; 2382_ADES/2022_Annual_filed2024-10-09.pdf p.5, p.32, p.47", refs: ["2382-FY2023-REV", "2382-FY2023-NI_ATTR", "2382-FY2022-NI_ATTR"]}
    - {period: "FY2024", driver: "Revenue +43.1% (organic +42.2%) with the Saudi segment up 44.8% and new India and Southeast Asia revenue; attributable profit +81.5% to SAR 802m; net margin 12.9%. Share-based payment expense was SAR 111m.", source: "2382_ADES/2025_Annual_filed2026-03-29.pdf p.10, p.42", refs: ["2382-FY2024-REV", "2382-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue +7.9% but organic -1.6% (we estimate; Shelf added SAR 389m from 25 Nov and the Vantage rigs about SAR 203m), with the Saudi segment down 12.8%. Attributable profit +1.9% to SAR 818m, including an SAR 88.8m gain on remeasuring the earlier Shelf stake, a SAR 21.2m bargain-purchase gain and SAR 93.7m of insurance income, less SAR 79.2m of acquisition costs; net finance costs rose to SAR 941m. EBITDA margin 53.2%.", source: "2382_ADES/2025_Annual_filed2026-03-29.pdf p.10 (P&L), p.13 (cash flow), p.41-42, p.44-45", refs: ["2382-FY2025-REV", "2382-FY2025-NI_ATTR", "2382-FY2025-EBITDA_C"]}
    - {period: "9M2026", driver: "Revenue +44.0% but attributable profit -23.0% (SAR 597m to SAR 460m): the gross margin fell to 34.1% from 38.0% (we calculate), G&A rose 79.7% to SAR 588m, other expenses (net) were SAR 154m (SAR 42.4m) and net finance costs rose 46.1% to SAR 976m after borrowings reached SAR 20,250m at end-2025 (SAR 12,057m a year earlier). A provisional SAR 77.8m bargain-purchase gain (Saipem) helped 9M 2026, while 9M 2025 included an SAR 85.7m gain on the Shelf stake. Operating income (PBT + net finance costs) +12.7%; EBITDA margin 45.1% (54.0%).", source: "2382_ADES/2026_Q3_filed2026-11-09.pdf p.7 (P&L); 2382_ADES/2025_Annual_filed2026-03-29.pdf p.61 (borrowings)", refs: ["2382-9M2026-REV", "2382-9M2026-NI_ATTR", "2382-9M2025-NI_ATTR", "2382-9M2026-OPINC"]}
    - {period: "FY2022-9M2026", driver: "Capex fell from SAR 3,923m (FY2022) to SAR 1,838m (FY2025), 27.5% of revenue, and free cash flow turned positive in FY2024 (SAR 620m) and FY2025 (SAR 1,143m); 9M 2026 free cash flow was SAR 966m (SAR 557m) before SAR 1,125m paid for Saipem.", source: "cash-flow statements; 2382_ADES/2026_Q3_filed2026-11-09.pdf p.10", refs: ["2382-FY2022-CAPEX", "2382-FY2025-CAPEX", "2382-FY2025-FCF", "2382-9M2026-FCF"]}
