what_it_means:
  improved: "Revenue rose from SAR 2,467m (FY2022) to SAR 6,689m (FY2025) and by 44.0% in 9M 2026, and free cash flow turned positive from FY2024 (SAR 1,143m in FY2025) as capex fell to 27.5% of revenue."
  weakened: "Profit did not keep pace: attributable profit grew 1.9% in FY2025 and fell 23.0% in 9M 2026, the net margin fell from 12.7% to 6.8% and annualised ROE to 9.0%, while net finance costs rose 46.1%."
  why: "Most growth came from acquisitions and newly bought rigs: we estimate perimeter effects of 21.1 pp in FY2023 and 9.5 pp in FY2025 and organic growth of -1.6% in FY2025 and about -18% in 9M 2026, with the Saudi segment down 12.8% in FY2025 and 13.1% in 9M 2026, while borrowings rose to SAR 20,250m with the Shelf deal."
  uncertain: "The 9M 2026 organic estimate relies on Shelf's FY2025 pro-forma revenue (Low confidence), the Saipem bargain-purchase gain is provisional, and the company has not quantified the effect of the 2026 GCC rig suspensions."
confidence_overall: "Medium"
data_notes:
  - "9M 2026 has no XBRL file; 9M 2026 and 9M 2025 figures come from the interim PDF (overrides 2382_9M.csv). Operating income for every period is calculated as PBT + finance costs - finance income (ADES has no operating-profit line), so it includes bargain-purchase gains, fair-value gains and acquisition costs. The XBRL 'Operating profit' tag (FY2023 SAR 1,341.3m, FY2024 SAR 1,933.3m, FY2025 SAR 2,046.1m) equals gross profit less G&A only; it is not used or published."
  - "FY2022 EBITDA (SAR 1,140m) includes the SAR 422.3m bargain-purchase gains; the SAR 236.6m trade-receivable impairment is no longer added back (it is an operating cost; independent audit fix). Excluding the gains, EBITDA is SAR 718m (EBITDA_U), so FY2023/FY2022 EBITDA growth (+79.2%) understates the operating improvement (EBITDA_U growth +184.6%). 9M 2025 EBITDA excludes the SAR 85.7m fair-value gain and 9M 2026 the SAR 77.8m bargain-purchase gain, so 9M EBITDA growth excluding one-offs is +20.8%. EBITDA also excludes impairments and their reversals of property and equipment and of the joint-venture investment (FY2023 SAR 5.0m charge; FY2024 SAR 45.7m net reversal; FY2025 SAR 28.1m; 9M 2025 SAR 11.5m), read from the cash-flow statements in the full review."
  - "FY2022 comes from special-purpose financial statements prepared for the IPO (unmodified opinion with an emphasis of matter on the basis of preparation). The FY2023 AFS covers 28 Dec 2022 - 31 Dec 2023 and shows FY2022 only in note 30 (p.60), with the same revenue and net profit but PBT of SAR 453.0m instead of SAR 468.3m (SAR 15.4m moved from income tax to other taxes) and gross profit of SAR 891.4m, which the XBRL does not tag. These latest-presented figures are used through overrides_parts/2382_fix.csv (PBT and income tax flagged R; FY2022 operating income SAR 736.8m)."
  - "FY2024 capex is flagged R in the data (SAR 2,376.3m vs 3,088.5m in the FY2024 XBRL), but the PDFs show PP&E purchases of SAR 2,375.1m in both years; the XBRL change comes from whether 'acquisition of business' (SAR 712.1m) was tagged as capex. It is not a restatement."
  - "Shelf and Saipem purchase-price allocations are provisional. EPS comparatives in the 9M 2026 interim are restated for the 1:1 bonus issue."
