what_it_means:
  improved: "Scale with efficiency: TOI grew 14.3% a year from FY2022 to FY2025 while cost-to-income fell from 34.7% to 31.2%, and ROE on ordinary equity rose from 13.1% (FY2022) to 17.8% (FY2024)."
  weakened: "Margin and funding: the margin on average assets fell from 3.50% (FY2023) to 3.19% (FY2025) and 3.11% (9M 2026 annualised), and in FY2025 loans grew faster than deposits (+13.6% vs +8.0%), taking loans to deposits to 101.0%."
  why: "Growth was volume-led (average assets +14.5% in FY2025), and a growing share of capital is Tier 1 sukuk whose costs (SAR 150m in FY2022, SAR 505m in FY2025, SAR 622m in 9M 2026) are charged to equity, so ROE on ordinary equity fell even in years when profit rose."
  uncertain: "Credit costs: 9M 2026 net impairments of SAR 956m were held down by SAR 630m of recoveries, and the bank flags higher credit and liquidity risk after 30 Sep 2026; organic growth is not determinable because the income of deconsolidated funds is not disclosed."
confidence_overall: "Medium"
data_notes:
  - "No restatement of 31 Dec 2024 equity or investments in the 9M 2025 interim (total equity SAR 41,442m in both); the bank only 'rearranged or reclassified' some comparatives for presentation."
  - "Primary statements (balance sheet, income statement, changes in equity) are image pages in all Alinma PDFs; Tier 1 costs and other checks were read visually."
  - "Tier 1 costs (statement of changes in equity) are distributions only: FY2022 SAR 150.0m, FY2023 200.0m, FY2024 321.9m, FY2025 504.5m, 9M 2025 393.5m, 9M 2026 621.6m. Issuance transaction costs also charged to retained earnings (FY2024 15.1m; 9M 2025 13.9m; FY2025 21.0m; 9M 2026 24.2m) are excluded because they are not distributions."
  - "Tier 1 sukuk carrying amounts in the facts match the filings at every date (SAR 5,000m FY2021-FY2023 to SAR 14,379m at Sep 2026), and 'Total equity' includes them at every date (no non-controlling interest), so no Tier 1 or equity override was needed."
  - "The ECL charge on financing (IMPAIR_FIN) is the sum of the two income-statement lines (financing net of recoveries, plus other financial assets), as for total impairments; financing alone was SAR 1,030m (FY2025), SAR 747m (9M 2025) and SAR 943m (9M 2026)."
  - "Capital ratios are disclosed only as rounded whole percentages (CET1 14%, Tier 1 19%, total 21% at Sep 2026)."
