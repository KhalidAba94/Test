  - {date: "2024-11-28", category: "financing", text: "Issued a USD-denominated Additional Tier 1 sustainable sukuk (SAR 2.81bn); Tier I sukuk SAR 5.3bn at end-2024 and end-2025.", source: "1030_SAIB/2025_Annual_filed2026-02-08.pdf p.104"}
  - {date: "2025", category: "financing", text: "First term loans on the balance sheet (SAR 2.79bn at end-2025; SAR 3.36bn at 30 Sep 2026).", source: "1030_SAIB/2026_Q3_filed2026-11-01.pdf p.3"}
  - {date: "2026-05-03", category: "financing", text: "Issued SAR 1.85bn Tier I sukuk (total SAR 7.2bn); Tier 1 ratio 18.74% at 30 Sep 2026.", source: "1030_SAIB/2026_Q3_filed2026-11-01.pdf p.42, p.41"}
