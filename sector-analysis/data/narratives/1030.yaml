what_it_means:
  improved: "Scale and cost control: loans grew 17.6% a year in FY2022-FY2025 while pre-impairment costs grew 6.0% a year, so cost-to-income fell from 44.1% to 35.9% (40.3% in 9M 2026, a period without the large other-income item)."
  weakened: "Margin: net special commission income ÷ average assets fell from 2.86% (FY2023) to 2.14% (FY2025) and 1.99% annualised in 9M 2026, so net special commission income fell 0.3% in FY2025 and rose only 2.0% in 9M 2026 while total assets grew 8.5% year on year."
  why: "The lower margin offset balance-sheet growth almost one for one (FY2025: volume +12.6 pp, margin −12.8 pp of prior TOI). FY2025 profit growth of 24.3% depended on SAR 536m of other income that the filing does not explain and that did not recur in 9M 2026."
  uncertain: "The nature of the FY2025 other income; the size of the ECL overlays recorded in 2026 (not disclosed) as the post-30 September escalation unfolds; and the outcome of the pending American Express Saudi Arabia sale."
confidence_overall: "Medium"
data_notes:
  - "FY2025 total assets (SAR 172,825m) are the Dec 2025 comparative of the 9M 2026 interim, which moved SAR 104.7m of Saudi Central Bank balances (note 9 and note 24); the audited FY2025 statements show SAR 172,720m. The latest presentation is used, as for every restated comparative (full review)."
  - "9M 2025 restatement of 31 Dec 2024 (+SAR 402.7m to investments and other reserves): an IAS 8 correction. An FVOCI equity investment historically valued at cost was remeasured to fair value; +361.7m relates to opening 1 Jan 2024 reserves and +41.0m to 2024 OCI. Profit was not affected. The note does not name the investee (SIMAH is listed among SAIB's strategic equity holdings). FY2023 equity here uses the restated opening balance from the FY2025 AFS, so FY2024 ROE is on a consistent basis. Source: 1030_SAIB/2025_Q3_filed2025-10-30.pdf p.38; 2025_Annual p.13, p.106."
  - "Tier 1 overrides: T1_COST for FY2022-9M2026 from the statement of changes in equity (image pages read visually). Amounts are uneven between quarters (Q4 2025 = FY2025 334.7m less 9M 2025 184.7m = SAR 150.1m). Facts T1_SUKUK match the filings at every date, and EQ_ATTR ('equity attributable to bank's equity holders') includes the sukuk, so no T1_SUKUK or EQ_ATTR override was needed."
  - "IMPAIR_FIN override: the XBRL-derived value was 0.0 in every period. Replaced with the P&L line 'Provisions for credit and other losses' (FY2025 SAR 354.9m; 9M 2026 SAR 182.0m), the caption config/mapping_banks.json maps to IMPAIR_FIN and the same basis as other banks. It includes non-loan items (loans-only FY2025 SAR 379.3m; FY2022 includes SAR 25.8m of real-estate provisions). Interim filings do not split the line."
  - "FY2025 'Other income' of SAR 536.1m is unexplained in the AFS; the adjustments register marks FY2025 organic growth 'not determinable'."
  - "Primary statements in all focus PDFs are image pages; figures were read visually and checked against the XBRL where available."
