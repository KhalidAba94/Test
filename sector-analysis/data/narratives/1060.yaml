ticker: "1060"
headline: >-
  SAB grew attributable profit at a 20.5% annual rate from FY2022 to FY2025, driven by the 2023 jump in its margin on assets (2.52%
  to 3.08%), 15-20% annual loan growth and a fall in cost-to-income from 37.9% to 30.3%; since FY2023 the margin has narrowed (2.72%
  in FY2025, 2.55% annualised in 9M 2026), so 9M 2026 pre-tax profit fell 0.9% and attributable profit rose 2.8% only because of a
  lower tax charge.
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income. Banks have no discrete 'capacity' additions, so like-for-like equals organic growth.
    FY2023 vs FY2022 is adjusted for the acquisition of HSBC Saudi Arabia's asset management, margin lending and brokerage lines
    (15 Sep 2022; estimated +SAR 164m, Medium confidence) and for the FY2022 bargain-purchase gain (SAR 108.6m), giving organic growth
    of 31.1% against 31.7% reported. SABB Takaful (merged into Walaa in Oct 2022) is a discontinued operation shown below continuing
    profit, so it is outside TOI in both years and needs no adjustment. FY2024 onward: no perimeter changes; organic equals reported.
  perimeter_changes:
    - {event: "HSBC Saudi Arabia's asset management, margin lending and retail brokerage lines acquired by SAB Invest (IFRS 3) for SAR 1,216.8m", date: "2022-09-15", effect: "Management estimates SAR 233m operating income for full-year 2022; we estimate +SAR 164m (E) of FY2023 TOI for the period not owned in FY2022 (+1.7 pp)", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.94"}
    - {event: "SABB Takaful (subsidiary) merged into Walaa; SAB's Walaa stake held at FVOCI; presented as discontinued operations (FY2022 net loss SAR 53.9m incl. SAR 6.6m loss on disposal; FY2021 loss SAR 30.2m)", date: "2022-10-19", effect: "Excluded from TOI in FY2021 and FY2022; no TOI bridge effect", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.96"}
  capacity_changes: []
  fx_exposure: "Domestic, riyal-based business; no FX translation effect is identified."
  price_volume_support: >-
    Net special commission income can be split into volume (growth in average total assets) and margin (income ÷ average total
    assets) using the balance sheets. FY2024 and 9M 2025 net special commission income were restated for a SAR 107.6m / 108.3m
    reclassification from fees, but FY2023 was not, so the FY2024/FY2023 split is not like-for-like; FY2025/FY2024 and 9M 2026/9M 2025
    are on the same basis.
  confidence: "Medium"
price_volume:
  - {period: "FY2023 vs FY2022", text: "We calculate that net special commission income rose SAR 2,933m: volume +SAR 1,064m (+11.0 pp of prior TOI; average assets +14.4%) and margin +SAR 1,870m (+19.4 pp; 2.52% to 3.08%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1060-FY2023-NSCI", "1060-FY2023-TA", "1060-FY2022-TA"]}
  - {period: "FY2025 vs FY2024", text: "We calculate that net special commission income rose SAR 495m: volume +SAR 1,438m (+10.3 pp of prior TOI; average assets +12.9%) offset by margin −SAR 942m (−6.7 pp; 2.94% to 2.72%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1060-FY2025-NSCI", "1060-FY2025-TA", "1060-FY2024-NSCI"]}
  - {period: "9M 2026 vs 9M 2025", text: "We calculate that net special commission income rose SAR 241m: volume +SAR 843m (+7.7 pp of prior TOI; average assets +9.7%) offset by margin −SAR 602m (−5.5 pp; annualised 2.73% to 2.55%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1060-9M2026-NSCI", "1060-9M2026-TA", "1060-9M2025-NSCI"]}
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "TOI +31.7% (organic +31.1%) and attributable profit +45.0%: net special commission income +39.6% as the margin rose to 3.08%; net fees +29.2%. Costs +12.3%, so cost-to-income fell to 32.4%. The ECL charge rose 26.3% (cost of risk 0.28%). Zakat and tax included a SAR 109.5m prior-year charge.", source: "1060_SAB/2023_Annual_filed2024-02-15.pdf p.68", refs: ["1060-FY2023-TOI", "1060-FY2023-NI_ATTR", "1060-FY2023-NSCI"]}
    - {period: "FY2024", driver: "TOI +10.3% and profit +15.3%: net special commission income +7.6% and net fees +17.2% (both distorted by about 1 pp and 9 pp because only FY2024 is restated for the fee reclassification); costs +4.3% (cost-to-income 30.6%); ECL +0.6% (cost of risk 0.24%), although the purchase-price-allocation release from the Alawwal merger fell to SAR 248m from SAR 486m.", source: "1060_SAB/2025_Annual_filed2026-02-15.pdf p.91, p.118", refs: ["1060-FY2024-TOI", "1060-FY2024-NI_ATTR", "1060-FY2024-IMPAIR_FIN"]}
    - {period: "FY2025", driver: "TOI +5.0% and profit +4.7%: net special commission income +4.5% as the margin fell to 2.72%; net fees −1.1%; other income +14.6%. Costs +4.0% (cost-to-income 30.3%). ECL +24.3% (cost of risk 0.25%): the loan ECL charge was SAR 1,403m, offset by net recoveries of SAR 661m including a SAR 721m PPA release. Share of associates fell to SAR 141m from SAR 205m. ROE on ordinary equity 12.2%.", source: "1060_SAB/2025_Annual_filed2026-02-15.pdf p.91", refs: ["1060-FY2025-TOI", "1060-FY2025-NI_ATTR", "1060-FY2025-IMPAIR_FIN"]}
    - {period: "9M2026", driver: "TOI +1.1% and pre-tax profit −0.9%: net special commission income +2.8% (margin 2.55% annualised); net fees −21.5% as fee expense rose 10.0% on flat gross fee income; gains on FVOCI debt instruments SAR 238.6m vs SAR 49.2m. Costs +2.3% (cost-to-income 30.1%). ECL +21.2% (cost of risk 0.23% vs 0.21%, annualised); Q3 2026 alone was SAR 362m vs SAR 82m after the bank updated its macroeconomic models and changed forecast provider. Zakat and tax fell to SAR 731m from SAR 974m (income tax SAR 236.8m vs SAR 456.0m, unexplained), so attributable profit rose 2.8%. ROE on ordinary equity 11.9% vs 12.6%.", source: "1060_SAB/2026_Q3_filed2026-10-28.pdf p.5, p.29", refs: ["1060-9M2026-TOI", "1060-9M2026-PBT", "1060-9M2026-NI_ATTR", "1060-9M2026-ZAKAT_TAX"]}
  one_offs:
    - {item: "Bargain-purchase gain on the HSBC Saudi Arabia business lines (provisional SAR 155.4m, restated)", period: "FY2022", amount_sar_m: 108.6, line: "Other operating income", source: "1060_SAB/2023_Annual_filed2024-02-15.pdf p.94"}
    - {item: "Business acquisition integration and transaction costs (FY2021: SAR 37m)", period: "FY2022", amount_sar_m: 54.0, line: "Salaries (7m) and general and administrative expenses (47m)", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.95"}
    - {item: "Net loss from discontinued operations (SABB Takaful), incl. SAR 6.6m loss on disposal", period: "FY2022", amount_sar_m: -53.9, line: "Net loss from discontinued operations", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.96"}
    - {item: "Prior-year zakat and income tax charged after ZATCA 2019-2020 assessments", period: "FY2023", amount_sar_m: 109.5, line: "Zakat and income tax", source: "1060_SAB/2023_Annual_filed2024-02-15.pdf p.68"}
    - {item: "Gain on FVOCI debt instruments (9M 2025: SAR 49.2m); loss on amortised-cost investments SAR 16.3m", period: "9M2026", amount_sar_m: 238.6, line: "Gain / (loss) on FVOCI debt instruments, net", source: "1060_SAB/2026_Q3_filed2026-10-28.pdf p.5"}
    - {item: "Purchase-price-allocation releases from purchased credit-impaired (POCI) accounts of the 2019 Alawwal merger, netted in the ECL charge (FY2022 616m, FY2023 486m, FY2024 248m, FY2025 721m). They recur every year, so they are not removed and no underlying profit is shown", period: "FY2025", amount_sar_m: 721.0, line: "Provision for expected credit losses, net", source: "1060_SAB/2025_Annual_filed2026-02-15.pdf p.91"}
developments:
  - {date: "2022-09-15", category: "M&A", text: "SAB Invest acquired HSBC Saudi Arabia's asset management, margin lending and retail brokerage lines for SAR 1,216.8m (bargain purchase SAR 108.6m after the final purchase price allocation).", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.94; 1060_SAB/2023_Annual_filed2024-02-15.pdf p.94"}
  - {date: "2022-10-19", category: "M&A", text: "SABB Takaful merged into Walaa and ceased to exist; SAB's resulting Walaa shares are held at FVOCI.", source: "1060_SAB/2022_Annual_filed2023-02-14.pdf p.96"}
  - {date: "2023-10-31 / 2024-12-12", category: "financing", text: "First Additional Tier 1 sukuk: SAR 4bn floating (Oct 2023), then SAR 4bn (SAR 3.65bn fixed at 6.07% and SAR 0.35bn floating) in Dec 2024.", source: "1060_SAB/2023_Annual_filed2024-02-15.pdf p.60; 1060_SAB/2025_Annual_filed2026-02-15.pdf p.74"}
  - {date: "2024", category: "mix", text: "SAR 12.5bn at 31 Dec 2023 (SAR 8.1bn at 1 Jan 2023) was reclassified from due to banks to customer deposits after a review of the balances; the loan-to-deposit series breaks between FY2022 and FY2023.", source: "1060_SAB/2024_Annual_filed2025-02-10.pdf p.114"}
  - {date: "2025-05 / 2025-07", category: "financing", text: "Issued USD AT1 sukuk (SAR 2.44bn at 6.50%) and SAR 2.0bn AT1 at 6.30%; AT1 SAR 12.4bn at end-2025 (no issuance in 9M 2026). Also called SAR 5bn Tier 2 sukuk and issued USD 1.25bn Tier 2 notes at 5.95%.", source: "1060_SAB/2025_Annual_filed2026-02-15.pdf p.14, p.74; 1060_SAB/2026_Q3_filed2026-10-28.pdf p.24"}
  - {date: "2026-01 to 2026-09", category: "financing", text: "Took a USD 1.25bn three-year syndicated term loan; due to banks rose from SAR 25.7bn to SAR 37.4bn while customer deposits rose 0.7% to SAR 325.4bn and loans 8.9%; loan-to-deposit 99.9% at 30 Sep 2026.", source: "1060_SAB/2026_Q3_filed2026-10-28.pdf p.4, p.24"}
  - {date: "2026-Q3", category: "event", text: "The bank reports targeted assessments of its financing portfolio for significant increases in credit risk, an update of its macroeconomic models and a change of forecast provider in Q3 2026. It states that the financial impact of the regional situation is uncertain and that it will judge whether further ECL adjustments are needed; it quantifies no overlay and, unlike some peers, includes no post-period escalation note.", source: "1060_SAB/2026_Q3_filed2026-10-28.pdf p.29, p.34"}
  - {date: "2026", category: "regulation", text: "The bank reports that zakat and income-tax assessments for 2019-2023 are closed and settled, and 2024 is under ZATCA review.", source: "1060_SAB/2026_Q3_filed2026-10-28.pdf p.26"}
what_it_means:
  improved: "Efficiency and returns: cost-to-income fell from 37.9% (FY2022) to 30.3% (FY2025), and ROE on ordinary equity rose from 9.0% (FY2022) to 12.9% (FY2024) before easing to 12.2% (FY2025)."
  weakened: "Margin and fees: net special commission income ÷ average assets fell from 3.08% (FY2023) to 2.72% (FY2025) and 2.55% annualised in 9M 2026, net fees fell 21.5% in 9M 2026, and pre-tax profit fell 0.9% in 9M 2026."
  why: "Balance-sheet growth still adds about 8-10 pp of prior TOI (FY2025 +10.3 pp; 9M 2026 +7.7 pp), but the lower margin took off 6.7 pp and 5.5 pp; reported credit costs are low partly because of PPA releases from the Alawwal merger (SAR 721m in FY2025)."
  uncertain: "Credit costs after the Q3 2026 model change (Q3 ECL SAR 362m vs SAR 82m a year earlier) and the regional situation; and whether the lower 9M 2026 income-tax charge, which the interim does not explain, persists."
confidence_overall: "Medium"
data_notes:
  - "9M 2025 restatement of 1 Jan 2024 and 31 Dec 2024 (+SAR 1,160.6m to investments and equity): two IAS 8 corrections of error. (1) An FVOCI equity investment carried at net asset value instead of fair value: +918.5m to other reserves. (2) An equity investment held but not recorded in prior years, now at FVSI: +242.1m to retained earnings. 2024 P&L and OCI were judged insignificant and not restated. FY2023 equity is kept as reported, so FY2024 average equity mixes bases; restating the opening would lower FY2024 ROE by 0.13 pp. Source: 1060_SAB/2025_Q3_filed2025-11-02.pdf p.30; 2025_Annual p.118."
  - "Tier 1 overrides: T1_SUKUK set to 0 at 31 Dec 2021 and 2022 (no AT1 line on the balance sheet; AT1 opening balance nil at 1 Jan 2023). T1_COST is 0 for FY2022-FY2023 (first AT1 issued 31 Oct 2023, no payment in 2023) and taken from 'Additional Tier 1 Sukuk payments' in the statement of changes in equity for FY2024-9M2026, excluding issuance costs. EQ_ATTR equals total equity including AT1 from FY2023; at FY2021 it excludes SAR 102.2m of non-controlling interest (SABB Takaful)."
  - "AT1 carrying amounts are slightly below face value (e.g. SAR 4.0bn issue carried at 3,985.0m); the filings do not explain the difference."
  - "Corporate management fees (SAR 107.6m net in FY2024; 108.3m in 9M 2025) were reclassified from fee income to special commission income; FY2023 and earlier were not restated, so FY2024/FY2023 growth in fees and NSCI is not like-for-like (TOI unaffected)."
  - "FY2022 figures are as restated in the FY2023 AFS after the purchase price allocation (TOI 9,697.0 to 9,650.2; attributable profit 4,874.2 to 4,827.6). NI_DISC for FY2021-FY2022 is genuine (SABB Takaful)."
  - "IMPAIR_FIN is the single P&L line 'Provision for expected credit losses, net', including commitments, other financial assets and POCI PPA releases (same basis as other banks)."
  - "Primary statements in the FY2022-FY2025 AFS are image pages; equity-statement and balance-sheet figures were read visually."
