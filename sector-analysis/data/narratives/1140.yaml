what_it_means:
  improved: "Credit costs: impairments fell from SAR 551m (FY2022) to SAR 130m (FY2024) and SAR 181m (FY2025), which let attributable profit grow 13.6% a year while TOI grew 6.1% a year; ROE on ordinary equity rose from 16.4% to 17.6% in FY2024."
  weakened: "Margin and 2026 momentum: the margin on average assets slipped from 3.23% (FY2022) to 2.90% (FY2025) and 2.83% (9M 2026 annualised), and in 9M 2026 impairments rose 55.7%, net fees fell 6.0% and ROE on ordinary equity fell to 15.0%."
  why: "Income growth came from volume (average assets +10.0% in FY2025) rather than margin, and FY2025 TOI was lifted 2.6 pp by a one-off property gain; from 2025 Tier 1 sukuk costs are charged to equity, reducing the profit left for ordinary shareholders."
  uncertain: "Credit quality: non-performing financing rose 22% between Dec 2025 and Sep 2026 and the bank gives no overlay amount for the regional conflict; the Tier 2 call lowered the total capital ratio to 17.41%."
confidence_overall: "High"
data_notes:
  - "Islamic bank: net income from financing and investments (financing and investment income less the return paid on deposits and other financial liabilities) is shown in the net special commission income (NSCI) row so that it can be added up with conventional banks; fees, other income, costs and impairments are mapped as for conventional banks."
  - "No restatement of 31 Dec 2024 equity or investments in the 9M 2025 interim (total equity SAR 16,693m in both). The only IAS 8 item (FY2025 AFS note 40; 9M 2026 note 19) reclassified Tier 1 sukuk held as investments from amortised cost to FVOCI, described as immaterial, with no restated totals."
  - "Tier 1 sukuk: none before May 2025. The existing FY2022 value of 0 is correct; zeros were added for FY2021 and FY2023 (FY2023 was empty). Albilad's 'Total equity' (no non-controlling interest) includes the Tier 1 sukuk, so equity attributable includes it at every date and ordinary equity = total equity - Tier 1 sukuk."
  - "Tier 1 costs come from the statement of changes in equity ('Tier 1 Sukuk costs'): SAR 85.2m (FY2025), 5.7m (9M 2025), 143.4m (9M 2026); FY2022-FY2024 are zero. The line is not split between distributions and issuance costs; the 9M 2025 amount is far below one coupon on SAR 2,438m at 6.5%, so it probably reflects issuance costs (our inference)."
  - "The impairment charge is a single income-statement line covering financing, investments, due from banks and commitments; the interims give no split, so the ECL charge on financing (IMPAIR_FIN) equals total impairments in every period. Financing alone was SAR 199m in FY2025 (AFS p.59)."
  - "The FY2025 property gain is disclosed only in the cash-flow statement; its income-statement line is inferred (Medium confidence)."
  - "The 9M 2026 review was by EY and KPMG (FY2025: EY and PwC)."
