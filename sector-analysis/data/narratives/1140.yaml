    - {item: "No zakat settlements, large recoveries or items labelled non-recurring found FY2022-9M 2026. Underlying profit is not shown because the zakat effect of the property gain is not disclosed.", period: "FY2022-9M2026", amount_sar_m: null, line: "n/a", source: "evidence 1140.yaml one_offs"}
