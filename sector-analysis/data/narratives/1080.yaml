what_it_means:
  improved: "Scale and efficiency: TOI grew 12.9% a year from FY2022 to FY2025, cost-to-income fell from 35.8% to 33.8%, and the ECL charge fell from SAR 880m to SAR 693m (cost of risk 0.65% to 0.38%)."
  weakened: "Margin and returns to ordinary shareholders: the margin on average assets fell from 3.38% (FY2024) to 3.05% (FY2025) and 2.98% (9M 2026 annualised), and ROE on ordinary equity fell from 13.3% to 12.3% and then 11.7% (annualised) as Tier 1 sukuk costs reached SAR 451m in 9M 2026."
  why: "Balance-sheet growth kept adding income (volume +SAR 1,025m in FY2025), but funding costs rose faster than asset yields, and growth since 2025 has been funded partly with Tier 1 sukuk whose distributions are charged to equity rather than profit."
  uncertain: "The size of the ECL overlay for the regional conflict is not disclosed while non-performing loans rose 14% between Dec 2025 and Sep 2026; the AHEL sale is not complete."
confidence_overall: "High"
data_notes:
  - "9M 2025 restatement of 31 Dec 2024: the 9M 2025 interim corrected unlisted FVOCI equity investments that had been carried at cost (IAS 8 error, not a policy change): investments and other reserves +SAR 604.5m, no income-statement effect. The FY2025 AFS then cut retained earnings by SAR 71.8m for a deferred-tax correction, so 31 Dec 2024 equity attributable is SAR 38,652m vs SAR 38,119m originally (+SAR 532.7m, +1.4%). The facts already use the restated figures."
  - "Equity overrides (latest restated figure, methodology s.1): FY2023 equity attributable = SAR 36,250m (FY2025 AFS restated 1 Jan 2024 balance; originally SAR 35,069m) and FY2022 = SAR 33,043m (FY2024 AFS restated 1 Jan 2023; originally SAR 32,334m). FY2024 ROE now uses opening and closing equity on the same restated basis; FY2022 and FY2023 ROE still mix bases because 31 Dec 2021 was never restated; on the original unrestated equity they would be 0.1 pp (FY2022: 9.7% vs 9.6%) and 0.3 pp (FY2023: 12.1% vs 11.7%) higher."
  - "FY2024 annual XBRL is unreadable; FY2024 facts come from the FY2025 comparatives. Differences from the original FY2024 PDF (p.9-10): TOI SAR 9,425m vs 9,500m (-0.8%, AHEL discontinued); net special commission income 7,927m vs 7,972m (-0.6%, a SAR 47.8m reclassification to dividend income and AHEL); operating expenses before impairment 3,067m vs 3,128m (AHEL); total assets 248,840m vs 248,307m (+0.2%); equity attributable 38,652m vs 38,119m (+1.4%, IAS 8 corrections); attributable profit unchanged at SAR 4,966m."
  - "FY2023 net special commission income (SAR 7,259m) and net fees (SAR 515m) are overridden with the FY2024 AFS comparatives, which moved SAR 122m from fees to financing income; the facts had the original FY2023 figures because the FY2024 XBRL is unreadable. FY2023/FY2022 fee and financing growth therefore straddle the reclassification (on the original basis fees grew 16.6% in FY2023). FY2023 total assets stay at the original SAR 220,683m (restated 221,422m; +0.3%, below materiality)."
  - "Impairment overrides: the XBRL-derived ECL charge (IMPAIR_FIN) included OREO items in FY2023 (+SAR 322m) and 9M 2025 (-SAR 100m); both now use the ECL line only (SAR 670m and SAR 541m), as in other years. Total impairments (IMPAIR_TOTAL) keep the OREO items."
  - "Tier 1 sukuk: none before Feb 2025, so the existing FY2024 value of 0 is correct; FY2021-FY2023 zeros were added. Tier 1 costs (SAR 187m FY2025, 117m 9M 2025, 451m 9M 2026) come from the statement of changes in equity. ANB's 'total equity attributable to equity holders' includes the Tier 1 sukuk at every date."
  - "Capital ratios at 31 Dec 2025 differ between the FY2025 AFS (CET1 16.44%) and the 9M 2026 comparative (16.74%) because operational-risk RWA was re-presented without explanation."
