    - {item: "Impairment charge on other real estate owned (repossessed property; separate line, outside the ECL charge)", period: "FY2023", amount_sar_m: 322.0, line: "Impairment charge on other real estate owned", source: "1080_ANB/2023_Annual_filed2024-02-14.pdf p.11, p.61"}
