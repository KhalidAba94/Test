ticker: "1080"
headline: >-
  ANB grew attributable profit at an 18.6% annual rate from FY2022 to FY2025, mostly in FY2023 when rising rates lifted its
  margin on average assets from 2.78% to 3.35%; growth slowed to 3.0% in FY2025 as that margin fell to 3.05%, and the Tier 1
  sukuk it began issuing in 2025 (SAR 12,080m by Sep 2026) mean profit for ordinary shareholders fell 4.4% in 9M 2026 even
  though attributable profit rose 4.1%.
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income (TOI). Banks have no discrete 'capacity' additions, so like-for-like equals organic
    growth. The only perimeter item that touches TOI is Arabian Heavy Equipment Leasing (AHEL, 87.5%), shown as a discontinued
    operation from the FY2025 AFS. FY2025 vs FY2024 and 9M 2026 vs 9M 2025 exclude AHEL in both periods. For FY2024 vs FY2023 the
    facts compare a re-presented FY2024 (without AHEL) with an FY2023 that includes it, so we take organic growth from the FY2024
    AFS, which shows both years with AHEL (10.9% vs 10.0% reported). The 2022 partial sale of associate Saudi Home Loans is
    equity-accounted and does not touch TOI.
  perimeter_changes:
    - {event: "Saudi Home Loans (associate): 30% of the holding sold in its IPO; 29.4% retained", date: "2022-Q1", effect: "Equity-accounted; SAR 36.05m gain below TOI; no TOI effect", source: "1080_ANB/2022_Annual_filed2023-02-23.pdf p.52"}
    - {event: "Arabian Heavy Equipment Leasing (AHEL, 87.5%) classified as held for sale and discontinued operation", date: "2025", effect: "AHEL TOI SAR 75.0m (FY2024) and SAR 67.5m (FY2025) removed from continuing TOI; FY2024/FY2023 bridge step -SAR 75.0m (-0.9 pp)", source: "1080_ANB/2025_Annual_filed2026-02-09.pdf p.88"}
  capacity_changes: []
  fx_exposure: "Operations are in Saudi Arabia apart from one foreign branch; no non-pegged subsidiary, so FX translation is nil for the bridge."
  price_volume_support: >-
    Net special commission income can be split into volume (growth in average total assets) and margin (income / average total
    assets) from the balance sheets in the filings. The bank's own NIM disclosure is not used because definitions differ between banks.
  confidence: "High"
price_volume:
  - {period: "FY2023 vs FY2022", text: "Net special commission income rose SAR 1,622m (+28.8%): average assets grew 7.0% (volume +SAR 392m, +5.7 pp of prior TOI) and the margin on average assets rose from 2.78% to 3.35% (rate +SAR 1,230m, +17.9 pp). About SAR 122m of the rise is a reclassification from fees in the FY2024 AFS comparative.", basis: "calculated", confidence: "High", source: "facts NSCI, TA; 1080_ANB/2024_Annual_filed2025-02-13.pdf p.10", refs: ["1080-FY2023-NSCI", "1080-FY2022-NSCI", "1080-FY2023-TA"]}
  - {period: "FY2025 vs FY2024", text: "Net special commission income rose only SAR 170m (+2.2%): volume added SAR 1,025m (+10.9 pp of prior TOI) as average assets grew 12.9%, but the margin fell from 3.38% to 3.05% (rate -SAR 854m, -9.1 pp) as special commission expense rose 9.7% against 5.5% for income.", basis: "calculated", confidence: "High", source: "facts NSCI, TA, SCI_GROSS, SCE", refs: ["1080-FY2025-NSCI", "1080-FY2025-TA", "1080-FY2025-SCE", "1080-FY2025-SCI_GROSS"]}
  - {period: "9M 2026 vs 9M 2025", text: "Net special commission income rose SAR 420m (+6.9%): volume +SAR 629m (+8.4 pp of prior TOI) with average assets up 10.3%, partly offset by a lower margin (annualised 3.07% to 2.98%; rate -SAR 209m, -2.8 pp).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1080-9M2026-NSCI", "1080-9M2025-NSCI", "1080-9M2026-TA"]}
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "TOI +24.8% and attributable profit +32.6%: net special commission income +28.8% as asset yields repriced; a SAR 156m gain on sale of non-trading instruments (nil in FY2022); the ECL charge fell 23.8% to SAR 670m. A SAR 322m impairment of other real estate owned (OREO) was charged. Cost-to-income fell to 33.2% from 35.8%.", source: "1080_ANB/2023_Annual_filed2024-02-14.pdf p.11", refs: ["1080-FY2023-TOI", "1080-FY2023-NI_ATTR", "1080-FY2023-IMPAIR_FIN", "1080-FY2023-IMPAIR_TOTAL"]}
    - {period: "FY2024", driver: "TOI +10.0% reported (+10.9% with AHEL in both years) and attributable profit +22.0%: volume-led financing income (+9.2%), net fees +37.7% on the re-presented FY2023 base, ECL charge -3.8% to SAR 645m, OREO impairment SAR 119m, and share of associates up to SAR 145m from SAR 20m. ROE on ordinary equity 13.3%.", source: "1080_ANB/2024_Annual_filed2025-02-13.pdf p.10", refs: ["1080-FY2024-TOI", "1080-FY2024-NI_ATTR", "1080-FY2024-FEES_NET", "1080-FY2024-SHARE_JV"]}
    - {period: "FY2025", driver: "TOI +4.9% and attributable profit +3.0%: the margin squeeze held financing income to +2.2%; net fees +23.9%; operating expenses +8.8% (cost-to-income 33.8%). The ECL charge rose 7.4% to SAR 693m, but total impairments fell 22.4% to SAR 593m because of a SAR 100m OREO impairment reversal in Q3 2025. First Tier 1 sukuk costs of SAR 187m cut profit for ordinary shareholders to SAR 4,929m (-0.7%); ROE on ordinary equity 12.3%.", source: "1080_ANB/2025_Annual_filed2026-02-09.pdf p.10, p.12", refs: ["1080-FY2025-TOI", "1080-FY2025-NI_ATTR", "1080-FY2025-IMPAIR_FIN", "1080-FY2025-IMPAIR_TOTAL", "1080-FY2025-T1_COST"]}
    - {period: "9M2026", driver: "TOI +5.6% and attributable profit +4.1%, but Tier 1 sukuk costs rose to SAR 451m from SAR 117m, so profit for ordinary shareholders fell 4.4% and EPS fell to SAR 1.86 from SAR 1.94. Net fees fell 9.7%. The ECL charge fell 15.8% to SAR 455m (cost of risk 0.30% annualised vs 0.40%), although the bank states it recorded management overlays for the regional conflict (amount not disclosed) and non-performing loans rose to SAR 2,127m from SAR 1,864m at Dec 2025. ROE on ordinary equity 11.7% annualised vs 13.0%.", source: "1080_ANB/2026_Q3_filed2026-10-26.pdf p.4, p.6, p.15, p.34", refs: ["1080-9M2026-TOI", "1080-9M2026-NI_ATTR", "1080-9M2026-T1_COST", "1080-9M2026-IMPAIR_FIN", "1080-9M2026-FEES_NET"]}
  one_offs:
