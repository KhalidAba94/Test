  - {period: "FY2025 vs FY2024", text: "Net special commission income rose SAR 1,432m (+5.2%): volume +SAR 2,239m (+6.2 pp of prior TOI) with average assets up 8.1%, partly offset by margin (2.59% to 2.52%; rate -SAR 807m, -2.2 pp). The International segment contributed SAR 200m of the increase; the rest of the bank grew 4.6%.", basis: "calculated", confidence: "High", source: "facts NSCI, TA; 1180_SNB/2025_Annual_filed2026-02-04.pdf p.75", refs: ["1180-FY2025-NSCI", "1180-FY2025-TA"]}
  - {period: "9M 2026 vs 9M 2025", text: "Net special commission income rose SAR 1,785m (+8.3%): volume +SAR 1,512m (+5.2 pp of prior TOI) with average assets up 7.0%, and margin +SAR 274m (+0.9 pp; annualised 2.50% to 2.53%) as special commission expense fell 4.0%. The International segment contributed SAR 539m of the increase; the rest of the bank grew 5.9%.", basis: "calculated", confidence: "High", source: "facts NSCI, TA, SCE; 1180_SNB/2026_Q3_filed2026-10-28.pdf p.39", refs: ["1180-9M2026-NSCI", "1180-9M2025-NSCI", "1180-9M2026-TA", "1180-9M2026-SCE"]}
