  drivers:
    - {period: "FY2023", driver: "TOI +4.8% and attributable profit +7.7%: financing income +2.7% (margin squeeze) and other income +22.6%; impairments fell 45.3% to SAR 923m; operating expenses +5.8% (cost-to-income 29.9%). The IAS 29 monetary loss rose to SAR 523m. ROE on ordinary equity 12.4%.", source: "1180_SNB/2023_Annual_filed2024-02-13.pdf p.14, p.17", refs: ["1180-FY2023-TOI", "1180-FY2023-NI_ATTR", "1180-FY2023-IMPAIR_FIN"]}
    - {period: "FY2024", driver: "TOI +4.2% (+9.2% excluding the International segment, whose TOI fell 46.6% to SAR 1,662m) and attributable profit +5.9%: financing income +2.6%, net fees +11.5% on the re-presented basis; operating expenses +6.4%; impairments +10.4% to SAR 1,019m after SAR 2,523m of recoveries (SAR 1,367m on purchased credit-impaired loans). The International segment made a SAR 112m loss before tax. ROE on ordinary equity 12.3%.", source: "1180_SNB/2025_Annual_filed2026-02-04.pdf p.10, p.53, p.75", refs: ["1180-FY2024-TOI", "1180-FY2024-NI_ATTR", "1180-FY2024-IMPAIR_FIN"]}
    - {period: "FY2025", driver: "TOI +8.8% and attributable profit +18.0%: financing income +5.2%, net fees +12.7%, other income +29.9% (gains on non-FVIS instruments SAR 559m vs SAR 77m). Operating expenses fell 10.4% to SAR 9,872m as other G&A fell 32.2% to SAR 2,171m and depreciation 17.0%; cost-to-income fell to 25.2% from 30.6%. Impairments SAR 1,034m (+1.5%) after SAR 1,713m of recoveries. ROE on ordinary equity 13.4%.", source: "1180_SNB/2025_Annual_filed2026-02-04.pdf p.10, p.53", refs: ["1180-FY2025-TOI", "1180-FY2025-NI_ATTR", "1180-FY2025-OPEX_PRE", "1180-FY2025-IMPAIR_FIN"]}
    - {period: "9M2026", driver: "TOI +4.5% (+2.5% excluding the International segment) and attributable profit +4.6%: financing income +8.3% and net fees +6.3%, but other income -17.8% (FVIS gains SAR 1,565m vs SAR 2,272m; other operating expenses, net SAR 1,516m vs SAR 1,236m); operating expenses +4.1%. The net impairment charge was SAR 2.6m vs SAR 92.6m: financing allowances took a SAR 2,193m charge, but credit-related commitments showed a SAR 1,114m net reversal/settlement (SAR 967m on purchased credit-impaired exposures) and Wholesale a net reversal of SAR 883m. The bank sees no significant ECL impact from the regional conflict. ROE on ordinary equity 13.3% annualised vs 13.5%.", source: "1180_SNB/2026_Q3_filed2026-10-28.pdf p.5, p.27, p.36, p.39, p.45", refs: ["1180-9M2026-TOI", "1180-9M2026-NI_ATTR", "1180-9M2026-IMPAIR_FIN", "1180-9M2026-OTHER_OI"]}
