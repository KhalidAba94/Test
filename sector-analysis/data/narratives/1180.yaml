what_it_means:
  improved: "Profitability: ROE on ordinary equity rose from 12.0% (FY2022) to 13.4% (FY2025) and cost-to-income fell from 29.6% to 25.2%, mostly because FY2025 operating expenses fell 10.4% while TOI rose 8.8%."
  weakened: "Margin and funding: the margin on average assets fell from 2.83% (FY2022) to 2.52% (FY2025), and loans grew faster than deposits (FY2022-FY2025 CAGR 10.2% vs 3.8%), taking loans to deposits from 96.0% to 114.7%."
  why: "Growth came from balance-sheet volume and lower costs rather than margin, while the International segment swings the top line (-SAR 1,450m in FY2024, +SAR 637m in 9M 2026) for reasons the filings do not split between currency, inflation accounting and business growth."
  uncertain: "Credit costs: the 9M 2026 net charge of SAR 2.6m rests on reversals and settlements that may not repeat, and the bank flags higher credit and liquidity risk after 30 Sep 2026; the cause of the FY2025 fall in other G&A is not disclosed."
confidence_overall: "Medium"
data_notes:
  - "Impairment check: the 9M impairment charges in the facts (SAR 92.6m for 9M 2025, SAR 2.6m for 9M 2026) match the income statements (9M 2025 interim p.5; 9M 2026 interim p.5), as does FY2025 (SAR 1,034m, AFS p.10). No override was made. The low 9M figures come from net reversals (Wholesale -SAR 302m in 9M 2025 and -SAR 883m in 9M 2026) and settlements of purchased credit-impaired commitments (-SAR 397m and -SAR 967m); the interims do not disclose recoveries. Cost of risk is therefore about 2 bp (9M 2025) and 0 bp (9M 2026) annualised, against 15 bp for FY2025."
  - "No restatement of 31 Dec 2024 equity in the 9M 2025 interim (opening equity attributable SAR 192,565m in both)."
  - "Tier 1 costs ('Tier 1 Sukuk related costs', from 2026 'Additional Tier 1 Capital related costs') come from the statement of changes in equity: SAR 567.9m (FY2022), 772.5m (FY2023), 764.1m (FY2024), 1,037.3m (FY2025), 855.1m (9M 2025), 887.8m (9M 2026). Tier 1 carrying amounts and 'equity attributable to equity holders of the Bank' (which includes Tier 1) match the filings at every date, so no other equity override was needed."
  - "FY2024 net fees were re-presented in the FY2025 AFS (SAR 4,377m vs 4,600m originally; TOI 36,033m vs 36,038m). FY2023 was not re-presented, so FY2024/FY2023 fee growth (+11.5%) straddles the change; on the FY2024 AFS basis it was +17.2%."
  - "Other G&A expenses: 9M 2025 SAR 2,236m but FY2025 SAR 2,171m, so Q4 2025 was a net credit of about SAR 65m; the FY2025 AFS gives no explanation. This lifts FY2025 profit and cost-to-income comparisons."
  - "FX and IAS 29 bridge steps are 'not determinable'; growth excluding the International segment is our calculation from the segment notes (FY2022 segment TOI as re-presented in the FY2023 AFS, SAR 2,575m)."
  - "SNB is largest in the sector by both FY2025 TOI and attributable profit (SAR 25,013m vs Al Rajhi SAR 24,792m)."
