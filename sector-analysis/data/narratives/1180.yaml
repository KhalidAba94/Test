ticker: "1180"
headline: >-
  SNB, the sector's largest bank by FY2025 total operating income (SAR 39,195m, about SAR 101m more than Al Rajhi), grew
  attributable profit at a 10.4% annual rate from FY2022 to FY2025 on income growth of 5.9% a year, helped by a 10.4% fall in
  FY2025 operating expenses and low impairments; in 9M 2026 total operating income rose 4.5%, but almost half of the increase came
  from its inflation-accounted International segment (Türkiye and Pakistan), and a net impairment charge of only SAR 2.6m
  supported a 4.6% rise in profit.
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income (TOI). Banks have no discrete 'capacity' additions, so like-for-like equals organic
    growth. No acquisitions, disposals or discontinued operations were found FY2023-9M 2026 (Samba Bank Ltd, Pakistan, stopped being
    held for sale in FY2022 and is consolidated in every period compared). The FX and IAS 29 steps are not determinable: Türkiye
    Finans (TFKB) is restated for hyperinflation and translated at closing rates, and the filings give neither the International
    segment's local-currency income nor the rates needed to remove FX. Organic growth is therefore not shown. As the closest
    available measure we show growth excluding the International segment (calculated from the segment note): +3.4% (FY2023),
    +9.2% (FY2024), +7.7% (FY2025) and +2.5% (9M 2026), against reported +4.8%, +4.2%, +8.8% and +4.5%.
  perimeter_changes:
    - {event: "Samba Bank Ltd (SBL, Pakistan, 84.51%) ceased to be held for sale and was consolidated again", date: "2022", effect: "Consolidated in FY2022 and all later periods; no effect on the comparisons shown", source: "1180_SNB/2022_Annual_filed2023-02-06.pdf p.108"}
  capacity_changes: []
  fx_exposure: >-
    International segment (TFKB 67.03%, Turkish lira, under IAS 29 since Q2 2022; SBL 84.51%, Pakistani rupee) made up SAR 2,163m
    or 5.5% of FY2025 TOI and SAR 2,098m or 6.9% of 9M 2026 TOI. Its TOI moved +SAR 537m (FY2023), -SAR 1,450m (FY2024),
    +SAR 500m (FY2025) and +SAR 637m (9M 2026); these changes mix business growth, lira translation and inflation restatement.
    The IAS 29 net monetary loss (below TOI) was SAR 309m (FY2022), 523m (FY2023), 266m (FY2024), 293m (FY2025) and 247m (9M 2026).
  price_volume_support: >-
    Net special commission income can be split into volume (growth in average total assets) and margin (income / average total
    assets) from the balance sheets. The segment note also gives International net special commission income, so its share of the
    change can be shown.
  confidence: "Medium"
price_volume:
