what_it_means:
  improved: "Little improved: the share of associates' results rose from a small loss in FY2022 to SAR 5.3m in FY2025, and 9M 2026 brought the first revenue (SAR 1.1m) through the Lawazem acquisition."
  weakened: "Profit fell from SAR 28.2m (FY2022) to losses of SAR 53.5m (FY2024) and SAR 60.2m (FY2025), the 9M 2026 loss widened to SAR 27.4m, and attributable equity fell from SAR 439m to SAR 256m at 30 Sep 2026."
  why: "Dividend income shrank from SAR 34.5m (FY2022) to SAR 4.2m (FY2025) after the company moved its shares into a discretionary FVTPL portfolio, which lost SAR 44.9m in FY2024, SAR 51.5m in FY2025 and SAR 22.5m in 9M 2026, while overheads continued."
  uncertain: "Results depend on Saudi share-price movements, and the new businesses (manufacturing, green ammonia, storage) and the proposed SAR 300m rights issue are too recent to assess."
confidence_overall: "High"
data_notes:
  - "SARCO has no revenue before Q3 2026 (SAR 1.1m in 9M 2026), so revenue-based ratios are blank for FY2022-FY2025 and shown as n.m. for 9M 2026 under the SAR 10m materiality rule."
  - "Operating income (OPINC) for SARCO is PBT + finance costs - finance income with investment results (dividends, associates, FVTPL gains and losses) kept inside, so it is close to PBT. The XBRL 'Operating profit' tag for 9M (-SAR 9.1m and -SAR 7.3m, not used) is gross profit less G&A only; the company's own '(loss)/profit from operations' line is -SAR 24.9m (9M 2026) and -SAR 16.5m (9M 2025)."
  - "Growth rates that cross from profit to loss, or start from a base below SAR 10m (e.g. capex, which was under SAR 1m a year until 2025), are shown as n.m. under METHODOLOGY s.1."
  - "FY2024 G&A was re-presented in the FY2025 AFS to include right-of-use depreciation (SAR 0.1m); net loss unchanged. The FY2023 AFS is fully scanned; FY2023 figures were taken from the FY2024 AFS comparatives."
  - "Net loss (SAR 27.5m) and attributable loss (SAR 27.4m) differ in 9M 2026 by the 15% non-controlling interest in Lawazem."
