ticker: "2380"
headline: >-
  Petro Rabigh lost money every year from FY2022 to FY2025 (attributable loss SAR 4,693m in FY2023 and SAR 3,899m in FY2025) as revenue
  fell from SAR 55,952m to SAR 35,008m, then earned SAR 6,702m in 9M 2026 on revenue up 113.6%, which it attributes to higher crude-linked
  prices during the regional conflict, against a 9M 2025 base cut by a 60-day full-site shutdown.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Petro Rabigh is a single company with no subsidiaries, acquisitions or disposals, and no new units were
    commissioned in the period, so perimeter and new-capacity effects are nil. The only adjustment is presentational: FY2024 revenue was
    restated from SAR 39,349m to SAR 38,662m to net marketer re-charges against revenue (IFRS 15), while FY2023 remains on the old gross
    basis, so the FY2024/FY2023 comparison removes the SAR 686.9m netting. Planned shutdowns (Phase II, Dec 2022 to Jan 2023; full-site
    turnaround, Apr to Jun 2025) are volume effects inside like-for-like.
  perimeter_changes:
    - {event: "None: single-entity company with no subsidiaries", date: "FY2022 to 9M2026", effect: "nil", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.13"}
    - {event: "Saudi Aramco bought a further 22.5% of Class A shares from Sumitomo Chemical (Aramco 60%, Sumitomo 15%, public 25%)", date: "2025-10-08", effect: "shareholder change only; no perimeter effect", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.14"}
  capacity_changes:
    - {event: "Planned maintenance shutdown of the Phase II facilities", date: "2022-12-01 to 2023-01-23", effect: "lower volumes in Dec 2022 and Jan 2023, not quantified; maintenance, not a capacity change", source: "2380_PETRO_RABIGH/2023_Annual_filed2024-03-25.pdf p.30"}
    - {event: "Full-complex Turnaround and Inspection: all units shut for about 60 days from 15 Apr 2025", date: "2025-04-15", effect: "company reports a significant decrease in revenue and cost of revenue in 9M 2025 and FY2025; not quantified", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.28; 2380_PETRO_RABIGH/2025_Q3_filed2025-11-11.pdf p.10"}
    - {event: "No new units commissioned; capital work in progress relates to plant-enhancement projects not yet in use", date: "FY2022 to 9M2026", effect: "none identified", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.28"}
  fx_exposure: "Products are sold through marketers at USD-linked prices and the riyal is pegged; no FX translation effect."
  price_volume_support: >-
    Not determinable. The financial statements disclose no production, sales volumes or realised prices. They give revenue by segment
    (refined products, petrochemicals) and by destination, and the provisional-to-final pricing adjustment (-SAR 259m in FY2025;
    +SAR 124m in 9M 2026 vs -SAR 124m in 9M 2025).
  confidence: "High (no perimeter changes and the restatement amount is disclosed; that no capacity was added rests on the financial statements alone)"
price_volume:
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue rose SAR 27,676m: refined products +SAR 23,174m (+121.6%) and petrochemicals +SAR 4,502m (+84.9%). By destination, sales in
      Saudi Arabia rose 132.2% and to the rest of the Middle East (mainly Egypt) 285.4%. The 9M 2025 base includes the 60-day full-site
      shutdown, so part of the increase is volume recovery; the company attributes the improvement mainly to higher crude oil prices. Volumes
      are not disclosed, so the split is not determinable.
    basis: "disclosed (segment and destination revenue); price/volume split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.10 (geopolitical note), p.13-14 (segments and destinations)"
    refs: ["2380-9M2026-REV", "2380-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue -20.3% and the operating result swung from a SAR 12.2m profit to a SAR 2,603m loss: refined products revenue fell 20.5% and its operating result went from +SAR 1,466m to -SAR 1,807m; net financial charges (PBT less operating result, we calculate) rose from SAR 1,079m to SAR 2,190m. Attributable loss SAR 4,693m (FY2022: SAR 1,115m). The filings do not explain the margin squeeze.", source: "2380_PETRO_RABIGH/2023_Annual_filed2024-03-25.pdf p.27; 2380_PETRO_RABIGH/2024_Annual_filed2025-03-19.pdf p.26 (segments)", refs: ["2380-FY2023-REV", "2380-FY2023-OPINC", "2380-FY2023-NI_ATTR", "2380-FY2023-PBT"]}
    - {period: "FY2024", driver: "Revenue -13.3% as reported, or -11.8% before the IFRS 15 netting restatement (we calculate); operating loss SAR 2,571m, little changed; net financial charges SAR 2,175m; a tax credit of SAR 203m; attributable loss SAR 4,545m. The founding shareholders waived SAR 3,750m of loans, booked directly in equity, not in profit.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.23-24, p.44; 2380_PETRO_RABIGH/2024_Annual_filed2025-03-19.pdf p.12", refs: ["2380-FY2024-REV", "2380-FY2024-OPINC", "2380-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue -9.5% in the year of the 60-day turnaround: petrochemicals revenue fell 26.6% and its operating loss widened to SAR 1,882m, while the refined products loss narrowed to SAR 577m. Net financial charges fell to SAR 1,433m; the company used the SAR 5,264m capital injection of Oct 2025 to prepay debt. Attributable loss narrowed to SAR 3,899m; EBITDA margin 2.0%.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.23 (segments), p.14 (capital increase), p.28 (turnaround)", refs: ["2380-FY2025-REV", "2380-FY2025-NI_ATTR", "2380-FY2025-EBITDA_C"]}
    - {period: "9M2026", driver: "Gross profit SAR 8,325m vs a loss of SAR 1,813m; refined products operating result SAR 8,770m (9M 2025: -SAR 811m) while petrochemicals still lost SAR 1,039m (-SAR 1,517m). Financial charges fell to SAR 796m (SAR 1,182m) and financial income rose to SAR 179m (SAR 15.2m). Zakat and tax were SAR 412m against a net credit of SAR 202m. Attributable profit SAR 6,702m vs a loss of SAR 3,292m; net margin 12.9%.", source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.4 (P&L), p.13 (segments and reconciliation)", refs: ["2380-9M2026-GP", "2380-9M2026-NI_ATTR", "2380-9M2025-NI_ATTR"]}
    - {period: "9M2026", driver: "Operating cash flow SAR 13,035m (9M 2025: -SAR 44.1m) and free cash flow SAR 12,016m; trade and other payables rose by SAR 8,297m to SAR 26,013m over the nine months. Retained earnings of SAR 2,768m replaced accumulated losses of SAR 9,191m after the profit and a SAR 5,264m capital reduction set against losses.", source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.6 (balance sheet), p.7 (changes in equity), p.9", refs: ["2380-9M2026-CFO", "2380-9M2026-FCF"]}
    - {period: "FY2022-FY2025", driver: "Capex rose from SAR 889m (FY2024) to SAR 3,782m in FY2025, the turnaround year, so free cash flow was -SAR 1,631m.", source: "cash-flow statements (XBRL section 300700); 2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.23", refs: ["2380-FY2025-CAPEX", "2380-FY2025-FCF"]}
  one_offs:
    - {item: "Waiver of revolving shareholder loans by the founding shareholders, including accrued commission (credited to accumulated losses in equity, not to profit)", period: "FY2024", amount_sar_m: 3750, line: "Statement of changes in equity", source: "2380_PETRO_RABIGH/2024_Annual_filed2025-03-19.pdf p.12"}
    - {item: "Waiver of the remaining revolving shareholder loans (equity, not profit)", period: "FY2025", amount_sar_m: 1875, line: "Statement of changes in equity", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.13"}
    - {item: "Gain on derecognition of right-of-use assets and lease liabilities", period: "FY2025", amount_sar_m: 40.1, line: "Other income, net", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.25"}
    - {item: "Tax credit (deferred tax), not described as non-recurring; FY2025 tax charge SAR 5.3m", period: "FY2024", amount_sar_m: 203.3, line: "Tax", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.24"}
