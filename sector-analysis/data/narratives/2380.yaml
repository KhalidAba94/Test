  - {date: "2023", category: "financing", text: "Equity bridge loans restructured into unequal annual instalments from Dec 2024 to Dec 2027, still guaranteed by the founding shareholders.", source: "2380_PETRO_RABIGH/2023_Annual_filed2024-03-25.pdf p.35"}
  - {date: "2024-08-07", category: "financing", text: "Founding shareholders' support package: waiver of SAR 5,625m of revolving shareholder loans (SAR 3,750m in 2024, SAR 1,875m in Jan 2025) and a SAR 5,263.6m equity injection.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.13"}
  - {date: "2025-04-15", category: "operations", text: "Full-complex Turnaround and Inspection lasting about 60 days; production of refined and petrochemical products was suspended.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.28"}
  - {date: "2025-10-08", category: "strategy", text: "Saudi Aramco raised its holding of Class A shares to 60% by buying 22.5% from Sumitomo Chemical.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.14"}
  - {date: "2025-10-15", category: "financing", text: "Received SAR 5,263.6m for new unlisted Class B shares issued to Aramco and Sumitomo and used it to prepay debt.", source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf p.14"}
  - {date: "2026-03 onward", category: "event", text: "The company reports that the regional conflict disrupted energy markets and marine logistics but had no direct material impact on its operations, and that higher crude oil prices contributed significantly to the improved results. Its Q1 and Q2 2026 notes added that the Rabigh complex is on the Red Sea and does not depend on the affected maritime corridors; the 9M 2026 note no longer includes that sentence.", source: "2380_PETRO_RABIGH/2026_Q1_filed2026-04-30.pdf p.10; 2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.10"}
  - {date: "2026-03-29", category: "financing", text: "Shareholders approved a capital reduction writing SAR 5,263.65m off accumulated losses (capital back to SAR 16,710m).", source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.10"}
  - {date: "2026-09-30", category: "financing", text: "Current liabilities exceeded current assets by SAR 6,321m (end-2025: SAR 13,731m).", source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf p.9"}
what_it_means:
  improved: "In 9M 2026 a SAR 3,292m attributable loss turned into a SAR 6,702m profit on revenue up 113.6%, with a 12.9% net margin and SAR 12,016m of free cash flow."
  weakened: "From FY2022 to FY2025 revenue fell 14.5% a year and the company lost money every year (attributable losses of SAR 1,115m to SAR 4,693m), with an EBITDA margin of 2.0% or less from FY2023 to FY2025."
  why: "Refined products drove both phases: its operating result went from SAR 1,466m (FY2022) to -SAR 1,807m (FY2023) and to SAR 8,770m in 9M 2026, which the company attributes to higher crude oil prices during the regional conflict; the 9M 2025 base was also cut by a 60-day full-site turnaround, and petrochemicals stayed loss-making (-SAR 1,039m in 9M 2026)."
  uncertain: "Volumes and prices are not disclosed, so the price, volume and turnaround effects cannot be separated, and the 9M 2026 profit rests on conflict-period market conditions."
confidence_overall: "Medium"
data_notes:
  - "Restatement: FY2024 revenue restated from SAR 39,349.1m to SAR 38,662.1m and gross profit from -SAR 985.0m to -SAR 1,672.0m in the FY2025 AFS; shipping, handling, insurance, customs and storage charges re-charged by the marketers are now netted against revenue (IFRS 15) instead of being shown in selling and marketing expenses. No effect on operating or net loss; all in Petrochemicals. FY2022-FY2023 were not restated, so FY2024/FY2023 growth mixes bases (adjusted in the bridge)."
  - "9M operating income is calculated (PBT + financial charges - financial income) and equals the reviewed P&L's operating result (9M 2026 SAR 7,731.1m; 9M 2025 -SAR 2,327.5m, p.4). The XBRL 'Operating profit' tag kept as OPINC_REP for the 9M periods excludes 'Other income, net' (SAR 56.5m and SAR 110.2m) and should not be used."
  - "The dataset shows growth for GP (-134.4%), OPINC (-21,386.8%) and CFO (-136.2%) for FY2023/FY2022 although the sign changes; under METHODOLOGY s.1 these should read n.m. The same applies to FCF in FY2023/FY2022 and FY2025/FY2024."
  - "Equity attributable equals total equity (no non-controlling interests); ROE is negative for FY2022-FY2025 because of the losses."
  - "Note 4 of the FY2025 AFS gives revenue from external customers of SAR 34,871m (2024: SAR 39,087m); the 2024 figure appears to be on the pre-restatement basis and is not reconciled to the restated SAR 38,662m."
  - "The geographic basis changed in the FY2025 AFS (Saudi Arabia shown separately from the rest of the Middle East), so destination trends before FY2024 are not comparable. Primary statements are scanned; P&L figures were checked against the segment reconciliation and, for 9M 2026, visually."
