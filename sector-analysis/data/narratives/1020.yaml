developments:
  - {date: "2023", category: "financing", text: "Issued SAR 2bn Additional Tier 1 sukuk at 6% (SAR 5bn programme), adding to the USD-denominated SAR 1.875bn AT1 issued in 2021.", source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf p.79"}
