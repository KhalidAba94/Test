ticker: "1020"
headline: >-
  Bank Aljazira's profit fell 8.0% in FY2023 when its margin on assets dropped from 2.38% to 1.94%, then rose 20.7% and 22.3% in
  FY2024-FY2025 on 14-20% annual loan growth and a lower cost-to-income ratio (58.2% to 52.4%); in 9M 2026 profit rose 15.4%, but
  Tier 1 sukuk costs rose to SAR 336m from SAR 130m, so ROE on ordinary equity fell to 8.7% (annualised) from 9.5%.
lfl_basis:
  definition_used: >-
    Standard bridge on total operating income. Banks have no discrete 'capacity' additions, so like-for-like equals organic growth.
    No acquisitions, disposals or discontinued operations affected TOI in FY2022-9M2026; the only perimeter event was a larger stake
    in an equity-accounted associate, whose results sit below TOI. Organic growth therefore equals reported growth. Aljazira is an
    Islamic bank: 'net income from investments and financing' is mapped to net special commission income.
  perimeter_changes:
    - {event: "Additional 7.05% of associate AlJazira Takaful Ta'awuni (26.03% to 33.08%)", date: "2024-Q2", effect: "Consideration SAR 76.2m; still an associate (below TOI); no TOI effect", source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf p.67"}
  capacity_changes: []
  fx_exposure: "Domestic, riyal-based business; no FX translation effect is identified."
  price_volume_support: >-
    Net financing income can be split into volume (growth in average total assets) and margin (income ÷ average total assets) using
    the balance sheets. The bank's own yield and margin disclosures are not used because definitions differ between banks.
  confidence: "High"
price_volume:
  - {period: "FY2023 vs FY2022", text: "We calculate that net financing income fell SAR 233m: average assets grew 12.2% (volume +SAR 319m, +9.1 pp of prior TOI) but the margin fell from 2.38% to 1.94% (rate −SAR 551m, −15.8 pp) as funding costs rose (special commission expense SAR 3,890m vs SAR 1,308m).", basis: "calculated", confidence: "High", source: "facts NSCI, TA, SCE", refs: ["1020-FY2023-NSCI", "1020-FY2023-TA", "1020-FY2023-SCE"]}
  - {period: "FY2025 vs FY2024", text: "We calculate that net financing income rose SAR 365m, almost all volume (+SAR 344m, +9.1 pp of prior TOI; average assets +13.1%); the margin was flat (1.89% to 1.90%, +SAR 21m, +0.6 pp).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1020-FY2025-NSCI", "1020-FY2025-TA", "1020-FY2024-TA"]}
  - {period: "9M 2026 vs 9M 2025", text: "We calculate that net financing income rose SAR 290m: volume +SAR 261m (+8.0 pp of prior TOI; average assets +11.7%) and margin +SAR 29m (+0.9 pp; annualised 1.90% to 1.92%).", basis: "calculated", confidence: "High", source: "facts NSCI, TA", refs: ["1020-9M2026-NSCI", "1020-9M2026-TA", "1020-9M2025-NSCI"]}
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "TOI −4.6% and attributable profit −8.0%: net financing income −8.9% on the margin squeeze, partly offset by net fees +12.3%; impairments −20.0% (cost of risk 41 bp to 31 bp). Costs +1.1%, but cost-to-income rose to 58.2% as income fell.", source: "facts", refs: ["1020-FY2023-TOI", "1020-FY2023-NI_ATTR", "1020-FY2023-NSCI"]}
    - {period: "FY2024", driver: "TOI +13.3% and profit +20.7%: net financing income +10.9% on loan growth of 20.0%; other income +31.4%, including a SAR 68.1m gain on sale of other real estate. Impairment on financing +38.6% (ECL on loans +26.5%; cost of risk 33 bp), but a SAR 42.6m reversal of real-estate impairment lowered total impairments. Cost-to-income 56.0%.", source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf p.66, p.86", refs: ["1020-FY2024-TOI", "1020-FY2024-NI_ATTR", "1020-FY2024-IMPAIR_TOTAL"]}
    - {period: "FY2025", driver: "TOI +18.1% and profit +22.3%: net financing income +13.9%, net fees +21.5%, other income +35.1%; costs +10.4%, so cost-to-income fell to 52.4%. Impairments +11.4% (cost of risk 37 bp) after recoveries of written-off debts of SAR 154.3m (FY2024: SAR 26.8m). Zakat rose to SAR 280m from SAR 174m, including a SAR 77.6m prior-year charge. Excluding prior-year zakat in both years (FY2025 charge SAR 77.6m; FY2024 credit SAR 2.5m), attributable profit rose 28.9%; this adjustment needs no tax effect because it is itself zakat, and the bank has no minority interests. FY2024 still includes a SAR 68.1m gain on other real estate whose zakat effect is not disclosed.", source: "1020_BJAZ/2025_Annual_filed2026-02-05.pdf p.60, p.83", refs: ["1020-FY2025-TOI", "1020-FY2025-NI_ATTR", "1020-FY2025-ZAKAT_TAX"]}
    - {period: "9M2026", driver: "TOI +9.2% and profit +15.4%: net financing income +13.0% (loans +14.4% year on year), net fees −9.5%, other income +15.6%; costs +7.4% (cost-to-income 51.8%). Impairments −6.5%, although ECL on loans rose 9.4% (cost of risk 29 bp vs 30 bp, annualised, as loans grew faster) with recoveries of SAR 186.7m vs SAR 150.9m. Tier 1 sukuk costs were SAR 336m vs SAR 130m, so profit for ordinary shareholders grew much less than reported profit.", source: "1020_BJAZ/2026_Q3_filed2026-10-29.pdf p.6, p.28", refs: ["1020-9M2026-TOI", "1020-9M2026-NI_ATTR", "1020-9M2026-T1_COST"]}
  one_offs:
    - {item: "Gain on sale of property and equipment", period: "FY2022", amount_sar_m: 52.8, line: "Other operating income", source: "1020_BJAZ/2022_Annual_filed2023-02-12.pdf p.85", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Gain on sale of property and equipment", period: "FY2023", amount_sar_m: 19.4, line: "Other operating income", source: "1020_BJAZ/2023_Annual_filed2024-02-13.pdf p.83", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Gain on sale of other real estate", period: "FY2024", amount_sar_m: 68.1, line: "Other operating income", source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf p.86", tax_nci: "Tax/zakat effect not disclosed; no minority interests: after-tax effect not determinable, profit kept as reported (checked in the notes)"}
    - {item: "Reversal of prior-year impairment on other real estate", period: "FY2024", amount_sar_m: -42.6, line: "Impairment on other real estate (operating expenses)", source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf p.66", tax_nci: "Under 5% of attributable profit: tax effect not checked; profit kept as reported"}
    - {item: "Prior-year zakat charge (2019 and 2021 assessments of SAR 77.6m and SAR 65.5m are under objection)", period: "FY2025", amount_sar_m: 77.6, line: "Zakat", source: "1020_BJAZ/2025_Annual_filed2026-02-05.pdf p.83", tax_nci: "Itself zakat, so no further tax effect; no minority interests: after-tax attributable effect SAR -77.6m (determinable)"}
    - {item: "ZATCA settlement of zakat for 2006-2017 (SAR 551m, paid in instalments to Dec 2023): no P&L effect in FY2022-9M2026", period: "2018-2023", amount_sar_m: null, line: "Zakat (historical)", source: "1020_BJAZ/2023_Annual_filed2024-02-13.pdf p.84"}
