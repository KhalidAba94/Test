  - {date: "2026-01 to 2026-09", category: "financing", text: "Customer deposits rose SAR 14.5bn (cash-flow statement) to SAR 129.8bn; loan-to-deposit 95.0% at 30 Sep 2026.", source: "1020_BJAZ/2026_Q3_filed2026-10-29.pdf p.7"}
  - {date: "2026-02-28 onward", category: "event", text: "The bank reports that it shifted ECL scenario weights toward the downside scenario because of the regional situation and assessed the resulting ECL impact as not material. It states that after 30 Sep 2026 the situation in the Kingdom escalated significantly, creating heightened credit, liquidity and operational risk, with the impact uncertain.", source: "1020_BJAZ/2026_Q3_filed2026-10-29.pdf p.54"}
what_it_means:
  improved: "Operating leverage: cost-to-income fell from 58.2% (FY2023) to 52.4% (FY2025) and 51.8% in 9M 2026, and attributable profit rose 20.7% and 22.3% in FY2024 and FY2025."
  weakened: "The margin has not recovered from the 2023 drop (2.38% in FY2022, 1.90% in FY2025, 1.92% annualised in 9M 2026), and Tier 1 sukuk costs of SAR 336m in 9M 2026 (vs SAR 130m) cut ROE on ordinary equity to 8.7% annualised from 9.5%, while ordinary equity grew only 2.3% year on year against loan growth of 14.4%."
  why: "Growth is volume-led: balance-sheet growth added about 8-10 pp of prior-year TOI in each period measured, while the margin took off 15.8 pp in FY2023 and added only 0.6-0.9 pp in FY2025 and 9M 2026."
  uncertain: "Credit costs after the post-30 September escalation, which the bank judged not yet material at 30 Sep 2026; capital headroom, with a CET1 ratio of 11.20% at 30 Sep 2026."
confidence_overall: "High"
data_notes:
  - "Islamic bank: net income from financing and investments (financing and investment income less the return paid on deposits and other financial liabilities) is shown in the net special commission income (NSCI) row so that it can be added up with conventional banks; fees, other income, costs and impairments are mapped as for conventional banks."
  - "9M 2025 restatement of 31 Dec 2024 (+SAR 212.6m to investments, other reserves and equity): an IAS 8 correction of error. An FVOCI equity investment had been carried at cost (31 Dec 2023) and net asset value (31 Dec 2024) instead of fair value. Profit was not affected. Opening 1 Jan 2024 investments were also restated, and FY2023 equity here uses the restated opening balance, so FY2024 ROE is on a consistent basis. The FY2025 AFS also reclassified a SAR 460m investment from FVOCI to FVIS (no equity effect). Source: 1020_BJAZ/2025_Q3_filed2025-10-29.pdf p.45; 2025_Annual p.139."
  - "Tier 1 overrides: T1_COST for FY2022-9M2026 from the statement of changes in equity ('Tier 1 Sukuk related costs'; image pages read visually), excluding sukuk issuance costs. Facts T1_SUKUK (1,875 / 1,875 / 3,875 / 3,875 / 6,750; 6,750 at Sep 2025; 8,214 at Sep 2026) match the filings, and EQ_ATTR equals total equity including the sukuk at every date, so no override was needed."
  - "IMPAIR_FIN is the single P&L line 'impairment charge for financing and other financial assets, net' (same basis as other banks). The financing-only charge differs, e.g. FY2025 SAR 379.5m vs line SAR 353.7m (note p.60)."
  - "All primary statements in the focus PDFs are image pages; balance-sheet and equity-statement figures were read visually."
  - "The 9M 2026 interim reclassified cash-management balances from other assets to cash (31 Dec 2024 +465.4m; 30 Sep 2025 +496.3m); no profit or equity effect."
