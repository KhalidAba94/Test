what_it_means:
  improved: "Revenue rose every year from FY2022 to FY2025 (6.4% a year) and attributable profit faster (32.7% a year), lifting the net margin from 12.1% to 23.5%; in 9M 2026 revenue rose 268.4% and attributable profit 586.7%."
  weakened: "Free cash flow turned negative in FY2024 and FY2025 (-SAR 2,073m and -SAR 1,036m) as capex peaked at SAR 5,479m, and in 9M 2026 operating cash flow (+82.9%) lagged profit as amounts due from related parties rose to SAR 11,519m."
  why: "Crude oil transportation produced SAR 18,092m of the SAR 19,013m rise in 9M 2026 revenue, which management attributes to higher freight rates and vessel utilisation during the regional conflict; earlier growth came alongside fleet additions (VLCCs rose from 38 to 50 between end-2023 and end-2025) and stronger chemical tanker earnings in FY2023-FY2024."
  uncertain: "The filings do not show how much growth came from new vessels rather than rates, and 80% of 9M 2026 revenue came from the Aramco group at conflict-period spot rates, with SAR 11,489m still owed by that group at 30 Sep 2026."
confidence_overall: "Medium"
data_notes:
  - "Operating income (OPINC) is calculated as PBT + finance cost - finance income - share of equity-accounted results, which equals the 'Operating profit' line in the audited and reviewed statements (e.g. FY2025 SAR 2,725.5m, p.9; 9M 2026 SAR 10,000.8m, p.5). The XBRL 'Operating profit' tag kept as OPINC_REP excludes 'Other income' (FY2025 SAR 107.4m; FY2023 SAR 340.3m) and should not be used as the reported figure."
  - "Gross profit (GP) is 'gross profit before bunker subsidy'. The unconditional government bunker subsidy (FY2025 SAR 301.1m; 9M 2026 SAR 189.9m vs SAR 238.9m) is added below it and is not in revenue."
  - "9M 2025 comparatives were reclassified in the 9M 2026 interim (SAR 112.3m moved out of operating costs; G&A, a new marketing line and other income changed); no effect on net profit. GP 9M 2025 is therefore SAR 1,801.8m (R) vs SAR 1,689.5m first reported."
  - "FY2022 operating cash flow uses the FY2023 AFS comparative (SAR 1,989.5m, override 4030_fix.csv); FY2023 CFO is the FY2024 AFS comparative (SAR 3,560.6m vs SAR 3,642.9m first reported). Capex = additions to PP&E, projects under construction and intangibles."
  - "The dataset shows FCF growth FY2024/FY2023 as -208.3%; the sign changes (positive to negative), so under METHODOLOGY s.1 it should read n.m. (calc.growth only treats a non-positive prior value as n.m.)."
  - "Primary statements in the PDFs are scanned images; the P&L pages used here were checked visually. Non-controlling interests (NCC 80%, BDB 60%) explain the gap between net profit and attributable profit (9M 2026 SAR 246.6m)."
