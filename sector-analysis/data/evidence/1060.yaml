ticker: "1060"
company: "Saudi Awwal Bank (SAB; formerly The Saudi British Bank, SABB)"
# Units: SAR '000 unless stated. Pages are physical PDF pages (1-based).
# FY2022-FY2024 and FY2025 AFS primary statements are image pages; values marked [image] were read visually.

restatements:
  - period_restated: "1 Jan 2024, 30 Sep 2024 and 31 Dec 2024"
    item: "Investments, net (two equity investments)"
    from: 98412224
    to: 99572794
    unit: "SAR '000"
    reason: "Two corrections of prior-period errors under IAS 8 (not a change in accounting policy): (1) FVOCI equity investment valued at net asset value instead of fair value: +918,484 to investments and other reserves; (2) an equity investment not recorded in prior years, now classified FVSI: +242,086 to investments and retained earnings. Total +1,160,570 to investments and equity at 1 Jan 2024 and 31 Dec 2024. P&L/OCI impact for 2024 deemed insignificant, comparatives not restated."
    source: "1060_SAB/2025_Q3_filed2025-11-02.pdf"
    page: 30
    quote: "the Bank corrected the valuation of its interest in an equity investment ... historically valued at net asset value instead of fair value"
  - period_restated: "31 Dec 2024"
    item: "Other reserves"
    from: -2818768
    to: -1900284
    unit: "SAR '000"
    reason: "FVOCI equity revaluation +918,484 (IAS 8)."
    source: "1060_SAB/2025_Annual_filed2026-02-15.pdf"
    page: 118
    quote: "Other reserves (2,818,768) 918,484 (1,900,284)"
  - period_restated: "31 Dec 2024"
    item: "Retained earnings"
    from: 11464384
    to: 11706470
    unit: "SAR '000"
    reason: "Previously unrecorded equity investment recognised at FVSI +242,086 (IAS 8)."
    source: "1060_SAB/2025_Annual_filed2026-02-15.pdf"
    page: 118
    quote: "Management has identified an equity investment held by the Bank that was not recorded in prior years."
  - period_restated: "1 Jan 2024"
    item: "Investments, net / equity attributable"
    from: 96566836
    to: 97727406
    unit: "SAR '000"
    reason: "Same two IAS 8 corrections applied at 1 Jan 2024 (retained earnings 9,708,134 -> 9,950,220; other reserves (1,414,343) -> (495,859)); 1 Jan 2025 equity attributable 60,321,183 -> 61,481,753."
    source: "1060_SAB/2025_Annual_filed2026-02-15.pdf"
    page: 118
    quote: "Investments, net 96,566,836 1,160,570 97,727,406"
  - period_restated: "FY2024 and 9M2025 income statement"
    item: "Corporate management fees reclassified from fee and commission income to special commission income"
    from: 1449562
    to: 1341957
    unit: "SAR '000"
    reason: "IFRS 9 requirement; FY2024 net fees reduced by SAR 107.6m net (gross fee income 3,997,013 -> 3,880,761; fee expense 2,547,451 -> 2,538,804). 9M2025 net fees reduced by SAR 108.3m (1,168,064 -> 1,059,711). Net income unchanged."
    source: "1060_SAB/2025_Annual_filed2026-02-15.pdf"
    page: 118
    quote: "the Bank has reclassified corporate management fee previously recorded in fee and commission income to special commission income amounting to SAR107.6 million, net"
  - period_restated: "FY2022 (in FY2023 AFS)"
    item: "Net income FY2022 after zakat and tax"
    from: 4872148
    to: 4825595
    unit: "SAR '000"
    reason: "Completion of purchase price allocation for the 15 Sep 2022 acquisition of HSBC Saudi Arabia business lines: bargain purchase gain reduced from provisional SAR 155.4m to SAR 108.6m. Total operating income 9,697,028 -> 9,650,228 (-46,800); goodwill and intangibles, retained earnings and total equity -46,553 (54,683,204 -> 54,636,651); EPS 2.40 -> 2.38."
    source: "1060_SAB/2023_Annual_filed2024-02-15.pdf"
    page: 95
    quote: "Net income for the year after Zakat and tax 4,872,148 (46,553) 4,825,595"
  - period_restated: "31 Dec 2023 and 1 Jan 2023 (in FY2024 AFS)"
    item: "SAR 12.5bn (1 Jan 2023: SAR 8.1bn) reclassified from due to banks to customers' deposits"
    from: null
    to: null
    unit: "SAR '000"
    reason: "IAS 8 presentation change after management re-evaluation found balances were customer deposits; 30 Sep 2024 equivalent SAR 15.77bn (9M2025 note 22). No P&L/equity effect."
    source: "1060_SAB/2024_Annual_filed2025-02-10.pdf"
    page: 114
    quote: "the liability balances amounting to SAR 12.5 billion as of 31 December 2023 (1 January 2023: SAR 8.1 billion) were reclassified"
  - period_restated: "FY2021 (in FY2022 AFS)"
    item: "Certain G&A expenses reclassified to fee and commission expense and other operating income"
    from: null
    to: null
    unit: "SAR '000"
    reason: "Presentation change from expense allocation review; related party note also restated."
    source: "1060_SAB/2022_Annual_filed2023-02-14.pdf"
    page: 96
    quote: "Certain expenses which had previously been included in general and administrative expenses, are now included in fee and commission expense"
  - period_restated: "31 Dec 2024 capital ratios"
    item: "CET1 / Tier 1 / total capital ratio comparatives"
    from: "15.43% / 17.90% / 19.69% (FY2024 AFS)"
    to: "15.61% / 18.06% / 19.84% (FY2025 AFS)"
    unit: "%"
    reason: "No reason stated; coincides with the +1,160,570 equity restatement."
    source: "1060_SAB/2025_Annual_filed2026-02-15.pdf"
    page: 116
    quote: "Common Equity Tier 1 Capital (CET1) 14.84% 15.61%"

