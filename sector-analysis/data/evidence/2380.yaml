significant_events:
  - date: "2022-06-08"
    event: "Rights issue SAR 7,950m approved; capital raised from SAR 8,760m to SAR 16,710m; proceeds used to capitalise founding shareholder loans and partially repay equity bridge loans (SAR 1,940.5m)"
    financial_effect: "Share capital +SAR 7,950m; rights issue cost SAR 47.01m in equity"
    source: "2380_PETRO_RABIGH/2022_Annual_filed2023-03-19.pdf"
    page: 39
    quote: "the Company increased its share capital from Saudi Riyals 8,760 million to Saudi Riyals 16,710 million."
  - date: "2022-12-31"
    event: "Current liabilities exceeded current assets by SAR 14,670m, mainly SAR 9,309.5m equity bridge loan due 20 Mar 2023 guaranteed by founding shareholders"
    financial_effect: "Liquidity / going concern consideration"
    source: "2380_PETRO_RABIGH/2022_Annual_filed2023-03-19.pdf"
    page: 12
    quote: "the Company's current liabilities exceed the current assets by Saudi Riyals 14,670 million, primarily due to the equity bridge loan"
  - date: "2023"
    event: "Equity bridge loans restructured: repayable in unequal annual instalments Dec 2024 to Dec 2027, still guaranteed by founding shareholders; extension fee SAR 135m"
    financial_effect: "Debt restructuring"
    source: "2380_PETRO_RABIGH/2023_Annual_filed2024-03-25.pdf"
    page: 35
    quote: "have been restructured (the restructured EBLs) and are now repayable in unequal annual instalments commencing from December 2024 to December 2027"
  - date: "2024-08-07"
    event: "Founding shareholders' turnaround package: waiver of SAR 5,625m revolving shareholder loans (3,750m in 2024, 1,875m in Jan 2025) and SAR 5,263.6m equity injection"
    financial_effect: "Shareholder support"
    source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf"
    page: 13
    quote: "Waiver of the revolving shareholder loans (RSL) provided to the Company, totaling to Saudi Riyals 5,625 million (USD 1,500 million)."
  - date: "2025-10-15"
    event: "Capital increase SAR 5,263.6m via 526.36m unlisted Class B shares to Aramco and Sumitomo (SAR 2,631.8m each); proceeds used to prepay debt"
    financial_effect: "Share capital SAR 16,710m -> SAR 21,973.6m; debt prepayment"
    source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf"
    page: 14
    quote: "On October 15, 2025, the Company received the proceeds of Saudi Riyals 5,263.6 million and utilized these funds to prepay a portion of its debts"
  - date: "2026-03-29"
    event: "Capital reduction approved by EGM (CMA approval 12 Feb 2026): Class A nominal value SAR 10 -> SAR 6.85; SAR 5,263.65m written off against accumulated losses"
    financial_effect: "Accumulated losses reduced by SAR 5,263.65m; capital back to SAR 16,710m"
    source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf"
    page: 10
    quote: "convened the shareholders' Extraordinary General Assembly meeting on March 29, 2026 that approved this share capital decrease."
  - date: "2026 (from 28 Feb 2026 conflict)"
    event: "Geopolitical developments disrupted regional/global energy markets; marine logistics pressure, shipping disruptions and vessel constraints; no direct material impact on operations; higher crude prices improved market conditions"
    financial_effect: "Contributed significantly to improved 9M2026 performance (net profit SAR 6,702m vs loss SAR 3,292m)"
    source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf"
    page: 10
    quote: "these developments have not had a direct material impact on the Company's operations, financial position or financial performance."
  - date: "2026-09-30"
    event: "Accumulated losses turned to retained earnings SAR 2,768m; current liabilities exceed current assets by SAR 6,321m (31 Dec 2025: SAR 13,731m)"
    financial_effect: "Balance sheet repair"
    source: "2380_PETRO_RABIGH/2026_Q3_filed2026-11-01.pdf"
    page: 9
    quote: "the Company has retained earnings amounting to Saudi Riyals 2,768 million (December 31, 2025: accumulated losses of Saudi Riyals 9,191 million)."
  - date: "2025-12-31"
    event: "Comprehensive loss SAR 3,902m; accumulated losses SAR 9,191m (41.83% of capital); net current liabilities SAR 13,731m"
    financial_effect: "Going concern basis relied on business plan and founding shareholder support"
    source: "2380_PETRO_RABIGH/2025_Annual_filed2026-03-12.pdf"
    page: 13
    quote: "the accumulated losses reached Saudi Riyals 9,191 million (December 31, 2024: Saudi Riyals 7,154 million) representing 41.83%"

