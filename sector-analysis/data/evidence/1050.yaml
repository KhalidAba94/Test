restatements:
  - period_restated: "31 Dec 2024 and 1 Jan 2024 (also 30 Sep 2024)"
    item: "Investments, net (FVOCI equity investments)"
    from: 60288858
    to: 60819754
    unit: "SAR '000"
    reason: "Correction under IAS 8 (presented as correction of error, not a change in accounting policy): FVOCI equity investments historically valued at cost revalued to fair value (+530,896 to investments and other reserves/FVOCI reserve). Applied at 1 Jan 2024 (total equity 41,403,998 -> 41,934,894). P&L and OCI effect for 2024 'insignificant', not restated."
    source: "1050_BSF/2025_Q3_filed2025-10-27.pdf"
    page: 34
    quote: "the Bank corrected valuation of its interest in an equity investment that is classified as investment at Fair Value through Other Comprehensive Income which was historically valued at cost"
  - period_restated: "31 Dec 2024"
    item: "Other reserves"
    from: -1132836
    to: -601940
    unit: "SAR '000"
    reason: "Same IAS 8 correction (+530,896). Total equity 31 Dec 2024 restated to 47,137,898."
    source: "1050_BSF/2025_Annual_filed2026-02-02.pdf"
    page: 139
    quote: "Investments, net 60,288,858 530,896 60,819,754 Other reserves (1,132,836) 530,896 (601,940)"
  - period_restated: "1 Jan 2024 opening equity"
    item: "FVOCI reserve / total equity attributable"
    from: 36403998
    to: 36934894
    unit: "SAR '000"
    reason: "'Impact on prior years adjustment' 530,896 in FY2025 AFS statement of changes in equity."
    source: "1050_BSF/2025_Annual_filed2026-02-02.pdf"
    page: 13
    quote: "Impact on prior years adjustment 44 - - - - 530,896 ... 530,896 - 530,896"
  - period_restated: "31 Dec 2024 (note 6 disclosure) / 30 Sep 2025"
    item: "Reclassification within FVOCI from debt instruments to equity/other investments: SAR 931m (FY2025 AFS) / SAR 843m (9M2025)"
    from: null
    to: null
    unit: "SAR '000"
    reason: "IAS 8 correction of classification; disclosure note restated only; P&L/OCI effect insignificant."
    source: "1050_BSF/2025_Annual_filed2026-02-02.pdf"
    page: 139
    quote: "the Bank corrected the classification of some of its investments from Investments at FVOCI - Debt instruments to Investments at FVOCI - Equity/other investments amounting 931 million"
  - period_restated: "31 Dec 2023 (and 1 Jan 2023, 30 Sep 2024)"
    item: "Investments and retained earnings (unrecorded equity investments)"
    from: 48467289
    to: 48750066
    unit: "SAR '000"
    reason: "Correction of prior-period error (FY2024 AFS note 45): equity investments held in prior years were not recorded; identified in 2024, classified FVTPL and sold in Q4 2024 with a gain of SAR 296m in FY2024 income. Retained earnings 31 Dec 2023 11,428,181 -> 11,710,958 (+282,777); 2023 P&L not restated."
    source: "1050_BSF/2024_Annual_filed2025-02-05.pdf"
    page: 137
    quote: "management identified equity investments in which the Bank held interest, in prior years. These were not recorded in the prior year's consolidated financial statements."
  - period_restated: "30 Sep 2024 (in 9M2025 interim)"
    item: "Retained earnings / investments at 30 Sep 2024"
    from: 13474271
    to: 13757048
    unit: "SAR '000"
    reason: "Restatement (a) +282,777 (unrecorded equity investments) plus restatement (b) +530,896 to other reserves; investments 57,385,839 -> 58,199,512."
    source: "1050_BSF/2025_Q3_filed2025-10-27.pdf"
    page: 34
    quote: "Retained earnings 13,474,271 282,777 - 13,757,048"
  - period_restated: "31 Dec 2023 and 31 Dec 2024 capital ratios"
    item: "Capital ratio comparatives differ from originally reported"
    from: "2023: 16.68/18.92/19.54; 2024: 15.63/18.81/19.69"
    to: "2023: 16.76/18.99/19.60 (FY2024 AFS); 2024: 15.75/18.92/19.79 (FY2025 AFS)"
    unit: "%"
    reason: "No reason stated in capital note; coincides with the two equity restatements."
    source: "1050_BSF/2025_Annual_filed2026-02-02.pdf"
    page: 137
    quote: "Common Equity Tier I ratio 16.20% 15.75%"

