    explanation: "The XBRL values match the PDFs. There is no presentation change: ECL remains a separate line below operating income, and 'Other operating expenses, net' is a separate pre-existing line (FY2022 (1,034,738); FY2023 (1,300,111); FY2024 (1,368,710); FY2025 (1,649,309); 9M2025 (1,235,684); 9M2026 (1,516,222)). The interims give no breakdown of that line. The low 9M charges come from net reversals in the Wholesale segment ((302,164) 9M2025; (882,985) 9M2026) and from POCI reversals/settlements on credit-related commitments ((396,739) 9M2025; (967,426) 9M2026). The FY2025 annual shows recoveries of written-off financing of 1,712,992 (POCI 394,813) inside the charge. The interims do not disclose the recoveries amount."
