    to: null
    unit: "SAR '000"
    reason: "No reason stated; see segments."
    source: "1030_SAIB/2026_Q3_filed2026-11-01.pdf"
    page: 26
    quote: "Total operating income 1,008,003 1,352,466 595,500 210,171 3,166,140"

