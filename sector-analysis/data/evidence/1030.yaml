ticker: "1030"
company: "The Saudi Investment Bank (SAIB)"
# Units: SAR '000 unless stated. Pages are physical PDF pages (1-based).
# Primary statements are image-only in all focus PDFs; values marked [image] were read visually.

restatements:
  - period_restated: "31 Dec 2024 (and 30 Sep 2024)"
    item: "Investments (FVOCI equity investment)"
    from: 40431316
    to: 40834059
    unit: "SAR '000"
    reason: "Correction under IAS 8 (presented as correction of error, not a change in accounting policy): an FVOCI equity investment historically valued at cost was revalued to fair value. +402,743 to investments and other reserves at 31 Dec 2024 and 30 Sep 2024. Of this, +361,725 relates to 1 Jan 2024 opening other reserves ((1,008,408) -> (646,683)) and +41,018 to FY2024/9M2024 OCI (232,161 -> 273,179 FY2024; 187,131 -> 228,149 9M2024). No effect on net income. The 9M2025 interim (note 7, p18) lists SIMAH among SAIB strategic equity holdings, but the restatement note does not name the investee."
    source: "1030_SAIB/2025_Q3_filed2025-10-30.pdf"
    page: 38
    quote: "the Group corrected its valuation of its equity interest in an equity investment that is classified as investment at Fair Value through Other Comprehensive Income which was historically valued at cost"
  - period_restated: "31 Dec 2024"
    item: "Other reserves (equity)"
    from: -967752
    to: -565009
    unit: "SAR '000"
    reason: "Same IAS 8 correction; total equity at 31 Dec 2024 restated to 21,131,357."
    source: "1030_SAIB/2025_Annual_filed2026-02-08.pdf"
    page: 106
    quote: "These adjustments are considered as correction as per IAS 8"
  - period_restated: "1 Jan 2024"
    item: "Other reserves opening balance"
    from: -1008408
    to: -646683
    unit: "SAR '000"
    reason: "Opening effect of the FVOCI equity revaluation (+361,725); restated opening total equity 17,596,778."
    source: "1030_SAIB/2025_Annual_filed2026-02-08.pdf"
    page: 13
    quote: "Balances at the beginning of the year - restated ... (646,683) ... 17,596,778 [image]"
  - period_restated: "31 Dec 2024 capital ratios"
    item: "CET1 / Tier 1 / total capital ratio comparatives"
    from: "14.19% / 19.09% / 19.71% (FY2024 AFS)"
    to: "14.48% / 19.35% / 19.96% (FY2025 AFS comparatives)"
    unit: "%"
    reason: "No reason stated; consistent in direction with the +402,743 equity restatement (not confirmed by filing)."
    source: "1030_SAIB/2025_Annual_filed2026-02-08.pdf"
    page: 101
    quote: "CET I Ratio 14.31% 14.48%"
  - period_restated: "FY2021 (comparatives in FY2022 AFS)"
    item: "Income statement reclassification: fees -> special commission income; Deposit Insurance Premium -> special commission expense; IT technical services from rent to G&A"
    from: null
    to: null
    unit: "SAR '000"
    reason: "Fee income net 333,771 -> 326,423 (-7,348 EIR-integral fees to special commission income 2,812,644 -> 2,819,992); special commission expense 452,930 -> 467,594 (+14,664 deposit insurance premium from G&A); rent 137,745 -> 69,581; other G&A 308,111 -> 361,611; total operating income 2,767,712 -> 2,753,048; net income unchanged 1,061,656. Also balance-sheet reclassifications at 31 Dec 2021 (cash management accounts, retail receivables, goodwill 18.29m to intangibles, dividends payable)."
    source: "1030_SAIB/2022_Annual_filed2023-03-05.pdf"
    page: 111
    quote: "Expenses pertaining to Deposit Insurance Premium Fund were reclassified from Other general and administrative expenses to Special commission expense."
  - period_restated: "30 Sep 2025 / 31 Dec 2025 comparatives in 9M2026"
    item: "SAR 135m reclassified from cash and balances with SAMA to due to banks/SAMA"
    from: null
    to: null
    unit: "SAR '000"
    reason: "Presentation; no impact on net income, equity or cash flows."
    source: "1030_SAIB/2026_Q3_filed2026-11-01.pdf"
    page: 44
    quote: "An amount of 135 million has been reclassified from cash and balances with Saudi Central Bank"
  - period_restated: "9M2025 segments (in 9M2026 interim)"
