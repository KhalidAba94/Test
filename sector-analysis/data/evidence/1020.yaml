ticker: "1020"
company: "Bank AlJazira (aljazira bank)"
# Units: SAR '000 unless stated. Pages are physical PDF pages (1-based).
# Primary statements (SFP, income, equity, cash flow) are image-only pages in all focus PDFs; values marked [image] were read visually.

restatements:
  - period_restated: "31 Dec 2024 and 1 Jan 2024 (also 30 Sep 2024)"
    item: "Investments, net (FVOCI equity investment)"
    from: 36193723
    to: 36406356
    unit: "SAR '000"
    reason: "Correction of prior-period error under IAS 8 (not a change in accounting policy): an FVOCI equity investment had been valued at cost (31 Dec 2023) and net asset value (31 Dec 2024) instead of fair value; fair value higher by SAR 212.63m. Other reserves, equity attributable and total equity +212,633; no P&L effect. Opening 1 Jan 2024 investments 34,442,290 -> 34,654,923."
    source: "1020_BJAZ/2025_Q3_filed2025-10-29.pdf"
    page: 45
    quote: "the Bank corrected the valuation of its interest in an equity investment ... historically valued at cost and net assets value as at 31 December 2023 and 31 December 2024"
  - period_restated: "31 Dec 2024"
    item: "Total equity"
    from: 17201697
    to: 17414330
    unit: "SAR '000"
    reason: "Same IAS 8 correction (+212,633 other reserves). Equity attributable to shareholders 13,326,697 -> 13,539,330."
    source: "1020_BJAZ/2025_Annual_filed2026-02-05.pdf"
    page: 139
    quote: "This adjustment is considered as correction of errors as per IAS 8"
  - period_restated: "31 Dec 2024"
    item: "Reclassification of SAR 460m investment from FVOCI to FVIS/FVTPL"
    from: null
    to: null
    unit: "SAR '000"
    reason: "IAS 8 retrospective reclassification: embedded downside-protection in a Share Purchase Agreement meant instrument was not equity; held at FVIS 1,794,618 -> 2,254,618, FVOCI 13,315,238 -> 13,067,871 (incl. +212,633). No effect on total assets, profit or equity."
    source: "1020_BJAZ/2025_Annual_filed2026-02-05.pdf"
    page: 139
    quote: "the Group has retrospectively reclassified the carrying amount of SAR 460 million from FVOCI to FVIS"
  - period_restated: "31 Dec 2024, 1 Jan 2024, 30 Sep 2025"
    item: "Cash management company balances reclassified from Other assets to Cash and balances with SAMA"
    from: null
    to: null
    unit: "SAR '000"
    reason: "IAS 7 reclassification: 31 Dec 2024 +465,421 (cash 6,118,369 -> 6,583,790); 1 Jan 2024 +280,436; 30 Sep 2025 +496,290. No P&L or equity effect."
    source: "1020_BJAZ/2026_Q3_filed2026-10-29.pdf"
    page: 53
    quote: "the Group reclassified certain balances held with cash management companies from Other assets to Cash and balances with SAMA"
  - period_restated: "1 Jan 2022 opening retained earnings"
    item: "Retained earnings / financing, net"
    from: 1017350
    to: 956277
    unit: "SAR '000"
    reason: "Change in accounting treatment: reassessment of timing of recognition of financing-related fees (integral to effective profit rate); prior-period impact deemed insignificant, so SR 61.07m debited to retained earnings at 1 Jan 2022 against financing, net."
    source: "1020_BJAZ/2022_Annual_filed2023-02-12.pdf"
    page: 22
    quote: "the identified fees has been adjusted from the carrying value of financing, net with a corresponding debit to retained earnings as at 1 January 2022, amounting to SR 61.07 million"
  - period_restated: "FY2021 (comparatives in FY2022 AFS)"
    item: "Fees from banking services, net reclassified to income from investments and financings"
    from: 638473
    to: 546376
    unit: "SAR '000"
    reason: "Financing-related fees and directly attributable expenses moved from fees to 'Income from investments and financings' (+92,097). Fee income 1,134,868 -> 1,008,960; fee expense (496,395) -> (462,584). No net income effect."
    source: "1020_BJAZ/2022_Annual_filed2023-02-12.pdf"
    page: 140
    quote: "the financing related fee and directly attributable expenses which were previously booked as fees have been reclassified from Fees from banking services to Income from investments and financings"
  - period_restated: "FY2023 segment comparatives (in FY2024 AFS)"
    item: "Segment results restated for new Funds Transfer Pricing policy (Q2 2024)"
    from: null
    to: null
    unit: "SAR '000"
    reason: "Updated FTP policy; prior-year segment comparatives restated. Pool income allocation methodology for investment account holders also changed."
    source: "1020_BJAZ/2024_Annual_filed2025-02-10.pdf"
    page: 91
    quote: "the Bank updated its Funds Transfer Pricing (FTP) policy, resulting in modifications to segment performance reporting"

