open_questions:
  - "Capex definition: XBRL FY2024 capex 3,087.2m appears to include acquisition of business (712,134k) whereas 2,376.3m = PP&E + intangibles; the PDFs show PP&E purchases 2,375,110k in both filings. Analyst must pick a consistent definition."
  - "ADES income statement has no operating profit line; 'operating profit' for 9M2026 must be defined by the analyst (derived pre-finance-cost profit provided)."
  - "Shelf Drilling consolidated from 25 Nov 2025 only (FY2025 contribution 388.9m revenue); 9M2026 includes full Shelf period, so 9M2026 vs 9M2025 growth is largely acquisition-driven (pro-forma full-year Shelf revenue 3,871.8m)."
  - "Saudi Arabian Saipem and Shelf PPAs are provisional; bargain purchase gains may be adjusted within 12 months."
  - "Emerald Driller contribution text says 'to 27 May 2022' (acquisition date) - drafting inconsistency."
