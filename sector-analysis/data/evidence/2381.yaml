significant_events:
  - date: "2022-11-07"
    event: "IPO and listing on Tadawul: 26.7m shares (17.7m sold by existing shareholders + 9.0m new shares) at SAR 100; 30% free float"
    financial_effect: "Primary proceeds from 9.0m new shares (gross SAR 900m implied by offer price x shares; net not extracted)"
    source: "2381_ARABIAN_DRILLING/2022_Annual_filed2023-03-19.pdf"
    page: 13
    quote: "issuance of 9,000,000 new shares."
  - date: "2022"
    event: "Issued SAR 2.0bn Sukuk, single balloon repayment 3 Feb 2027"
    financial_effect: "Current liabilities exceed current assets from 3 Feb 2026 (SAR 1.6bn at 30 Sep 2026)"
    source: "2381_ARABIAN_DRILLING/2026_Q3_filed2026-11-08.pdf"
    page: 11
    quote: "the Group's current liabilities exceed its current assets by Saudi Riyals 1.6 billion as of 30 September 2026."
  - date: "2026-02-03 / 2026-02-26"
    event: "Breach of 1:1 current-ratio covenant on Murabaha facility from 3 Feb 2026; waiver obtained 26 Feb 2026 valid until 31 Mar 2027; Sukuk refinancing under discussion"
    financial_effect: "Going-concern disclosure; no material uncertainty paragraph"
    source: "2381_ARABIAN_DRILLING/2026_Q3_filed2026-11-08.pdf"
    page: 11
    quote: "obtained the waiver from the lender for the breach of loan covenant related to the current ratio which is valid until 31 March 2027"
  - date: "2026 (Middle East conflict)"
    event: "Sustained geopolitical conflict; temporary suspensions of rigs by customers; business plan updated for impairment testing"
    financial_effect: "Not material to assumptions as of 30 Sep 2026; potential impact cannot be reliably estimated"
    source: "2381_ARABIAN_DRILLING/2026_Q3_filed2026-11-08.pdf"
    page: 11
    quote: "The Group is actively monitoring risks and uncertainties related to its operations including temporary suspensions of rigs by the customers."
  - date: "2026 Q1"
    event: "Q1 2026 interim: due to the geopolitical conflict, drilling contracts for certain offshore rigs were suspended by the customer; treated as impairment indicator"
    financial_effect: "Impairment test at 31 Mar 2026 (pre-tax WACC 11.40%): no impairment loss identified"
    source: "2381_ARABIAN_DRILLING/2026_Q1_filed2026-05-10.pdf"
    page: 15
    quote: "drilling contracts for certain offshore rigs were suspended by the customer. This event was identified as an impairment indicator"
  - date: "2024"
    event: "MoE curtailed production-capacity expansion; Saudi Aramco reduced contracted rigs (suspensions/non-renewals/termination)"
    financial_effect: "Impairment indicators; SAR 105m impairment; lower FY2024-FY2025 offshore revenue"
    source: "2381_ARABIAN_DRILLING/2024_Annual_filed2025-03-12.pdf"
    page: 34
    quote: "Saudi Arabian Oil Company (Saudi Aramco) adjusting the number of its required offshore and onshore contracted rigs downwards."
  - date: "2025-03-11"
    event: "Dividend SAR 1.35/share (SAR 119.96m) approved (2024: SAR 3.87/share, SAR 344.8m); no 2026 dividend disclosed in 9M2026"
