open_questions:
  - "9M2025 restatement is an IAS 8 error correction (FVOCI unlisted equity valued at cost), not a change in accounting policy. The 604,482 uplift hits investments and other reserves (OCI) only; no P&L effect."
  - "31 Dec 2025 capital ratios differ between the FY2025 annual (CET1 16.44%, T1 19.51%, CAR 20.02%; op-risk RWA 12,256,651) and the 9M2026 interim comparatives (16.74%, 19.86%, 20.38%; op-risk RWA 7,774,176). The interim gives no explanation."
  - "FY2022 annual PDF primary statements (pp.2-13) are image-only; FY2022 figures were taken from FY2023 annual comparatives (text layer). FY2022 segment and capital notes were readable."
  - "The FY2025 annual restates retained earnings at 1 Jan 2024 by (71,825) for deferred tax, and the 9M2025 interim restated it by +708,862. These are different restatement layers; the FY2025 annual SoCE restatement line shows other reserves +543,739 and retained earnings (71,825) against the FY2024 annual's 'previously presented' balances, which already included the 708,862."
  - "LCR and NSFR are not disclosed in the financial statements PDFs (Pillar 3 disclosures are not in the archive)."
  - "No ECL overlay amount for the 2026 geopolitical situation is quantified in the 9M2026 interim."
