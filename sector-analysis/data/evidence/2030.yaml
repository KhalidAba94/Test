special_extractions:
  - name: "SARCO nature of business and result drivers"
    description: "Licensed for refining/petrochemicals etc. but present activity limited to investing in local companies. Until Q3 2026 it had no revenue. Results come from (1) dividend income on listed equities (FY2022 34.5m, mainly SIIG shares held at FVTOCI until 2024), (2) equity-accounted share of Arab Tank Terminals Ltd (27%) - small (FY2022 -0.12m to FY2025 +5.29m), and (3) from 2024, fair-value swings on a discretionary Tadawul share portfolio at FVTPL (losses 44.9m FY2024, 51.5m FY2025, 22.5m 9M2026), which drove net losses. In 2026 it started diversifying (Lawazem manufacturing, Clean Energy green ammonia project, new associates) and proposed a SAR 300m rights issue."
    source: "2030_SARCO/2025_Annual_filed2026-04-02.pdf"
    page: 11
    quote: "its activity is limited to the investments sector, and it has no other business sectors."
    net_profit_by_period:
      FY2022: {value: 28230062, source: "2030_SARCO/2022_Annual_filed2023-03-31.pdf", page: 8}
      FY2023: {value: 7701643, source: "2030_SARCO/2023_Annual_filed2024-03-21.pdf", page: 8}
      FY2024: {value: -53487697, source: "2030_SARCO/2025_Annual_filed2026-04-02.pdf", page: 8}
      FY2025: {value: -60182955, source: "2030_SARCO/2025_Annual_filed2026-04-02.pdf", page: 8}
      9M2026: {value: -27467755, attributable_to_owners: -27352248, source: "2030_SARCO/2026_Q3_filed2026-11-18.pdf", page: 5}
      9M2025: {value: -22078546, source: "2030_SARCO/2026_Q3_filed2026-11-18.pdf", page: 5}
    unit: "SAR"
    note: "The brief's description ('profit comes from the share of results of an investee') is only partly borne out: associate share is a minor line; dividends (to 2023) and FVTPL losses (2024 on) dominate."

