<script id="data" type="application/json">{"as_of":"25 November 2026 (filings to 30 September 2026; FY2027 budget approved 24 November 2026)","guide":{"as_of":"25 November 2026 (filings to 30 September 2026; FY2027 budget approved 24 November 2026)","intro":"Financial analysis of the Saudi-listed Energy (6 companies) and Banks (10 banks) sectors for FY2022\u2013FY2025 and the first nine months of 2026. It is built from the 'Tadawul Financials' archive of Saudi Exchange filings: audited annual and reviewed interim financial statements as PDFs, plus the exchange's XBRL renderings. Every figure can be traced to its file and page. This is the pilot for a template that will then be applied to the other sectors.","sections":[{"heading":"Start here: the five rules behind every number","lines":["Full years (FY2022\u2013FY2025) and the 2026 year-to-date (9M 2026 = 1 January to 30 September) are always shown apart. 9M 2026 is compared only with 9M 2025, never with a full year.","Each year uses the latest restated figure: the comparative in the most recent filing that shows that year. Where this differs from what was first reported, the figure carries an R chip and the original value is shown.","Sector totals and ratios are built from summed company figures. A sector cost-to-income ratio is total costs \u00f7 total income, not an average of bank ratios.","Sector growth uses a matched sample: only companies with figures in both periods. The number of companies in each total is shown.","Like-for-like growth separates the existing business from acquisitions, disposals, currency and new capacity. Where the filings do not allow this, it says 'not determinable' instead of guessing."]},{"heading":"Periods","lines":["Compound annual growth (CAGR) 2022\u201325 = (FY2025 \u00f7 FY2022)^(1/3) \u2212 1, i.e. three years of compounding. A 2022\u201326 CAGR needs full-year 2026 results (expected Feb\u2013Apr 2027) and is not shown.","CAGR and growth are 'n.m.' (not meaningful) when the starting value is zero or negative, e.g. a loss-making year.","9M ratios that divide by a balance-sheet amount (ROE, ROA, cost of risk, margin on assets) are annualised (\u00d7 12/9). Income figures are never annualised.","All 16 companies report to 31 December; no fiscal-year changes were found."]},{"heading":"Numbers and labels","lines":["Units: SAR million unless stated. Filings in SAR or SAR '000 were converted using the rounding level declared in each filing, then checked against the next year's comparatives to catch unit errors.","Click (or tap) any underlined figure to see its source file, the XBRL row or PDF page, whether it was restated, and a link to the original on saudiexchange.sa.","Chips: R = restated comparative used; C = calculated by us (formula shown); PDF = taken from the PDF because the XBRL file was missing, unreadable or mis-tagged. No chip = disclosed as printed.","A dash (\u2013) means the figure is not available. Missing figures are never filled with zeros or estimates.","Yellow cells are partial-year (9M) figures."]},{"heading":"Reported vs like-for-like growth","lines":["Reported growth \u2212 perimeter (acquisitions/disposals) \u2212 FX translation \u2212 hyperinflation \u2212 accounting/presentation changes = organic growth.","Organic growth \u2212 revenue from new capacity added in the period (new rigs, vessels, branches) = like-for-like growth of the existing business.","Price, tariff and rate changes in the existing business are part of like-for-like growth. They are not treated as non-organic.","The Saudi riyal is pegged to the US dollar, so FX is nil for SAR and USD business; it matters only for other currencies (e.g. Turkish lira).","Each adjustment shows its basis (disclosed, calculated, estimated, not determinable), its source page and a confidence level."]},{"heading":"Sector measures","lines":["Banks: total operating income (TOI); net special commission income (Islamic banks' net financing and investment income mapped to it); net fees; operating expenses before impairment; cost-to-income = pre-impairment costs \u00f7 TOI; cost of risk = credit impairment \u00f7 average net financing; ROE = (attributable profit \u2212 Tier 1 sukuk distributions) \u00f7 average ordinary equity.","Energy: IFRS revenue (Aramco's 'other income related to sales', the government compensation for regulated domestic prices, is shown separately and kept out of sector revenue); operating income; EBITDA calculated consistently as operating income + depreciation, amortisation and impairment from the cash-flow statement; net margin; capex; free cash flow.","Operating measures (production, rigs, fleet) are quoted only where they appear in the filings in the archive; the archive holds financial statements, not operating reports."]},{"heading":"Confidence","lines":["High: company-disclosed amount or simple arithmetic on audited/reviewed figures.","Medium: disclosed inputs combined with one stated assumption.","Low: proxies or management commentary without amounts.","Not determinable: disclosure is insufficient, so no number is shown."]},{"heading":"Budget and policy section","lines":["This forward-looking section never feeds the historical figures or like-for-like calculations.","It separates the final approved budget (FY2027, approved 24 Nov 2026) from the preliminary pre-budget statement (30 Sep 2026), ministerial statements, regulatory measures and our own interpretation.","Each impact gives a channel, direction, timing, significance and confidence. It is quantified only where the evidence supports it."]},{"heading":"Applying the template to the remaining sectors","lines":["1. Download the sector folder and exclude files marked STALE / DO-NOT-USE or UNKNOWN-PERIOD (they exist in other sectors of the archive).","2. Run build/run_pipeline.sh: XBRL parsing \u2192 metric mapping \u2192 latest-restated selection \u2192 PDF page location \u2192 overrides \u2192 derived metrics \u2192 source register \u2192 analytics.","3. Add co <script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECT = {energy:'Energy', banks:'Banks'};
const FY = ['FY2022','FY2023','FY2024','FY2025'], YTD=['9M2025','9M2026'];
const PAIRS = ['FY2023/FY2022','FY2024/FY2023','FY2025/FY2024','9M2026/9M2025'];
const PL = {FY2021:'FY2021',FY2022:'FY2022',FY2023:'FY2023',FY2024:'FY2024',FY2025:'FY2025','9M2025':'9M 2025','9M2026':'9M 2026'};
const PAIRL = {'FY2023/FY2022':'FY23 vs FY22','FY2024/FY2023':'FY24 vs FY23','FY2025/FY2024':'FY25 vs FY24','9M2026/9M2025':'9M26 vs 9M25'};
const isNum = x => typeof x === 'number' && isFinite(x);
const fm = x => isNum(x) ? (x<0?'(':'') + Math.abs(x).toLocaleString('en-US',{maximumFractionDigits: Math.abs(x)<100?1:0}) + (x<0?')':'') : (x==='n.m.'?'n.m.':'–');
const fp = x => isNum(x) ? (x*100).toFixed(1)+'%' : (x==='n.m.'?'n.m.':'–');
const fpp = x => isNum(x) ? (x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+' pp' : '–';
const fg = x => isNum(x) ? (x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%' : (x==='n.m.'?'n.m.':'–');
const coName = t => { for (const S of ['Energy','Banks']) if (D.sectors[S].companies[t]) return D.sectors[S].companies[t].name; return t; };
const coSector = t => D.sectors.Energy.companies[t] ? 'Energy' : 'Banks';
const mname = m => (D.metrics[m]&&D.metrics[m].name) || m;
let FIGS = {}; let figN = 0;
function figBtn(t, p, m, v, fmt){
  const id = 'f'+(figN++); FIGS[id] = {t,p,m};
  const s = (D.sectors[coSector(t)].companies[t].series[m]||{})[p];
  const chip = s ? (s.note && s.note.indexOf('OVERRIDE')===0 ? '<span class="chip O" title="Taken from PDF">PDF</span>' : (s.prov && s.prov!=='D' ? `<span class="chip ${s.prov}" title="${s.prov==='R'?'Restated comparative':'Calculated'}">${s.prov}</span>`:'')) : '';
  const txt = (fmt||fm)(v);
  if (!s) return txt;
  return `<button class="fig" data-fig="${id}" aria-label="${esc(mname(m))} ${PL[p]} ${txt}: show source">${txt}</button>${chip}`;
}
function sumFig(S, scope, m, p, v){
  const id = 'f'+(figN++); FIGS[id] = {S, scope, m, p, sum:true};
  return `<button class="fig" data-fig="${id}">${fm(v)}</button>`;
}
// ---------------------------------------------------------------- drawer
function openDrawer(html){ $('#dbody').innerHTML = html; const d=$('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#dclose').focus(); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); }
$('#dclose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
function srcLink(sid){
  if(!sid) return '–';
  return sid.split(' | ').map(x=>{ const s=D.sources[x]; const nm=esc(x.split('/').pop());
    return s && s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${nm}</a> <span class="src">(${esc(s.type||'')}${s.assurance?', '+esc(s.assurance):''})</span>` : nm; }).join('<br>');
}
function figDetails(f){
  if (f.sum){
    const sc = D.sectors[f.S]; const blk = sc.sector[f.scope][f.m].totals[f.p];
    const rows = sc.tickers.filter(t=> f.scope==='all' || t!==sc.sector.largest_by_top_line_FY2025).map(t=>{

function lines(opts){

function bridgeFor(S,t,pair){
  const c=D.sectors[S].companies[t], top=D.sectors[S].config.top_line; const rep=c.growth[top][pair];
  const [cur,pri]=pair.split('/'); const prior=((c.series[top]||{})[pri]||{}).v;
  const adj=D.adjustments.filter(a=>a.ticker===t && a.comparison===pair);
  const steps=[['perimeter','Perimeter'],['fx','FX'],['hyperinflation','Hyperinflation'],['accounting_other','Accounting / other'],['new_capacity','New capacity']];
  const val={}, nd={}, basis={};
  steps.forEach(([k])=>{ const xs=adj.filter(a=>a.bridge_step===k); nd[k]=xs.some(a=>a.basis==='not determinable'); val[k]=xs.reduce((s,a)=>s+(parseFloat(a.amount_sar_m)||0),0)/(prior||NaN); basis[k]=xs; });
  const preND=['perimeter','fx','hyperinflation','accounting_other'].some(k=>nd[k]);
  const org = (!isNum(rep)||preND)?null: rep-['perimeter','fx','hyperinflation','accounting_other'].reduce((s,k)=>s+(isNum(val[k])?val[k]:0),0);
  const lfl = (org==null||nd.new_capacity)?null: org-(isNum(val.new_capacity)?val.new_capacity:0);
  return {rep, org, lfl, val, nd, basis, adj, preND};
}

  const bad=Object.entries(D.sources).filter(([k,v])=>v.status!=='used');
  h+=`<h2>Files with flags (${bad.length} of ${Object.keys(D.sources).length})</h2><div class="scroller"><table><tr><th>File</th><th>Status</th><th>Reason</th></tr>${bad.map(([k,v])=>`<tr><td>${v.url?`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(k)}</a>`:esc(k)}</td><td>${esc(v.status)}</td><td style="white-space:normal;text-align:left">${esc(v.reason)}</td></tr>`).join('')}</table></div>`;
  return h;
}
// ---------------------------------------------------------------- router
const jump = $('#jumpco');
jump.innerHTML = `<option value="">Go to a company…</option>` + ['Energy','Banks'].map(S=>`<optgroup label="${S}">${D.sectors[S].tickers.map(t=>`<option value="${t}">${esc(coName(t))}</option>`).join('')}</optgroup>`).join('');
jump.addEventListener('change', ()=>{ if (jump.value) location.hash='co-'+jump.value; });
function render(){
  FIGS={}; figN=0; closeDrawer();
  const v=(location.hash||'#overview').slice(1)||'overview'; let html='', nav=v;
  if (v==='energy'||v==='banks') html=viewSector(v);
  else if (/^co-\d{4}$/.test(v) && (D.sectors.Energy.companies[v.slice(3)]||D.sectors.Banks.companies[v.slice(3)])) { html=viewCompany(v.slice(3)); nav=coSector(v.slice(3)).toLowerCase(); }
  else if (v==='budget') html=viewBudget(); else if (v==='method') html=viewMethod(); else if (v==='data') html=viewData();
  else { html=viewOverview(); nav='overview'; }
  $('#main').innerHTML=html;
  document.querySelectorAll('nav.main a').forEach(a=>a.toggleAttribute('aria-current', a.dataset.v===nav) || (a.dataset.v===nav && a.setAttribute('aria-current','page')));
  document.querySelectorAll('nav.main a').forEach(a=>{ if(a.dataset.v===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  jump.value = /^co-/.test(v) ? v.slice(3) : '';
  document.title = 'Saudi Sector Financials';
  wire(v);
}
function wire(v){
  document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click', ()=>{ const S=SECT[v]; scopeState[S]=b.dataset.scope; const y=window.scrollY; render(); window.scrollTo(0,y); }));
  const ps=$('#pairsel'); if(ps) ps.addEventListener('change', ()=>{ pairState[SECT[v]]=ps.value; const y=window.scrollY; render(); window.scrollTo(0,y); });
  const cs=$('#cosel'); if(cs) cs.addEventListener('change', ()=>{ location.hash='co-'+cs.value; });
  const bs=$('#brsel'); if(bs) bs.addEventListener('change', ()=>{ window.__bridgePair=window.__bridgePair||{}; window.__bridgePair[bs.dataset.t]=bs.value; const y=window.scrollY; render(); window.scrollTo(0,y); });
  const cf=$('#clsf'), sf=$('#secf'); const ff=()=>{ document.querySelectorAll('#itbl tr[data-cls]').forEach(r=>{ r.hidden = (cf.value && r.dataset.cls!==cf.value) || (sf.value && r.dataset.sec!==sf.value && r.dataset.sec!=='All'); }); };
  if(cf){ cf.addEventListener('change',ff); sf.addEventListener('change',ff); }
  const cv=$('#covf'); if(cv) cv.addEventListener('change', ()=>{ document.querySelectorAll('#covt tr[data-sec]').forEach(r=>{ r.hidden = cv.value && r.dataset.sec!==cv.value; }); });
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); $('#main').focus({preventScroll:true}); });
render();
})();
</script>
