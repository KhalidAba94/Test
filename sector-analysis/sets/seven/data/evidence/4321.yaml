special_extractions:
  - name: "Finance-line layout used for FIN_COST / FIN_INC (stage A)"
    note: "FIN_COST = finance costs over loans and borrowings + finance costs over lease and other financial liabilities + contract modification loss on related-party receivables (inside 'net finance costs'); FIN_INC = finance income on related-party balances + finance income on time deposits. Our operating income then equals the printed 'Profit before net finance costs, share of loss of EAI and zakat' (FY2025 SAR 2,015,142,759, p.11)."
    source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf"
    page: 11

open_questions:
  - "Revenue of the Mall of Dhahran (handed back around February 2025) and of the mall sold in 2025 is not disclosed, so the perimeter effect on FY2025 and 9M2026 revenue cannot be measured."
  - "The FY2025 FS (p.63) date the court termination of the Mall of Dhahran lease to July 2025; the 2026 Q3 interim (p.36) says December 2024."
  - "No gross leasable area, occupancy, visitor numbers or like-for-like rent growth in the financial statements; occupancy appears only as a valuation input range."
  - "The 9M2026 swap fair-value gain (cash-flow add-back SAR 92,963,657) is not shown separately on the face; we assume it is netted in 'finance costs over loans and borrowings' (note 14 says it was recognised in profit or loss)."
