open_questions:
- The nature of the FY2023 fines and penalties (SAR 4.08m) is not described.
- Revenue by product is not given after FY2024, so mix changes in FY2025 and 9M 2026 cannot be shown.
- Dammam revenue rose 25.8% in 9M 2026 after falling 3.6% in FY2025; the filings do not explain it.
- Release of the SAR 4m GFSA provision after the October 2026 judgment is expected after the period; not yet in the figures.
