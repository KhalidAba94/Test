open_questions:
- The FY2025 "tax expense" of 50.6m in other operating expense (9M 2025 29.7m, 9M 2026 9.1m) is not explained; VAT payable fell from 335.9m to 11.8m in 2025.
- The FY2023 revenue re-presented in the FY2024 annual (-561.0m) is smaller than the revenue of the operations shown as discontinued (827.9m); the rest of the re-presentation is not explained.
- Whether the brand whose assets were sold in 2025 (note 33B) was still in continuing revenue in 9M 2025 is not disclosed.
