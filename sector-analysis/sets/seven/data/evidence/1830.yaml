open_questions:
- 'Other (expense)/income, net of (10.1m) in Q3 2026 (9M: (9.6m)) is not explained in the notes; it is kept inside operating income.'
- Revenue of Altathir Al-Riyadiyeh (acquired June 2023) is not disclosed, so the FY2023 and FY2024 perimeter effects are not determinable.
- Centre openings and closures are not disclosed in the statements, so new capacity cannot be separated from like-for-like growth.
