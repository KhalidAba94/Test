  - item: "Fact-sheet year-to-date figures versus the audited statements"
    detail: "The Q4 2025 fact sheet shows FY2025 direct revenues SAR 190,036,266 and net profit SAR 23,383,989; the audited FY2025 statements show revenue from properties SAR 196.7m and profit SAR 18.4m. FY2024 fact sheet: direct revenues SAR 177,939,703, net profit SAR 26,691,333 (audited 187.6m and 26.7m). Fact-sheet figures are preliminary and not comparable with audited full years."
    source: "4338_ALAHLI_REIT_1/2025_Q4_filed2026-09-13.pdf; 4338_ALAHLI_REIT_1/2024_Q4_filed2026-09-17.pdf"
    page: 1
    quote: "Direct Revenues 190,036,266"
