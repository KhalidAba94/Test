open_questions:
  - "The 9M 2026 fact sheet shows direct revenues up 23.4% and net profit up 169.0% on 9M 2025, but gives no explanation and no property split; hotel occupancy rose from 47% to 73% and mall occupancy from 97% to 99% (charts). The driver cannot be confirmed until audited or reviewed statements are filed."
  - "Fact-sheet full-year figures differ from the audited statements (FY2025 net profit 23.4m vs 18.4m), so the 9M figures may also be revised."
  - "Revenue from the AlAndalus Mall expansion completed in 2024 is not disclosed."
