open_questions:
- FY2022 revenue of the Iran and Sudan operations (removed from FY2023 by re-presentation) is not disclosed, so the FY2023/FY2022 perimeter effect cannot be measured.
- 'FY2023 revenue of KUGU (Turkey), removed from FY2024 by the FY2025 re-presentation, is not disclosed (FY2024: SR 941.1m).'
- USCE revenue since consolidation on 31 Dec 2024 is not disclosed; Egypt revenue rose from SR 3.8bn to SR 5.7bn in FY2025.
- The FY2025 annual restates FY2024 non-controlling interests by SR 10.4m (also at 1 Jan 2024) without an explanatory note.
- Composition of 9M2025 other operating income (SR 122.8m) is not given in the interim text pages.
