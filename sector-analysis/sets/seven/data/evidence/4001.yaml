open_questions:
- The filings do not say how much of the 9M 2026 shrinkage charge (SAR 123.7m) relates to earlier periods; management describes it as based on a physical count, not as non-recurring.
- Store openings, store count and like-for-like sales are not in the statements, so new-capacity and LFL growth cannot be measured.
- Egyptian pound translation effect on the Egypt subsidiary (about 2% of retail sales) is not disclosed.
- FY2022 and FY2023 revenue are not on the FY2024/FY2025 basis (reclassifications and the Mueen IFRS 15 change were applied only to the immediately preceding year).
