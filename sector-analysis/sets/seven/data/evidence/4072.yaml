open_questions:
  - "Revenue from the Saudi government funding programme (other operating revenues, note 5) swings with production milestones (FY2025 1,146,760; 9M 2026 393,617 vs 663,457). The filings do not say how much funding is committed for 2026."
  - "Broadcast and technical services revenue fell to 402,657 in 9M 2026 from 858,109; the notes do not name the customers or explain the fall (Q3 2026 only 14,837)."
  - "Revenue earned in Egypt (416,324 in FY2025) is not split by currency, so the effect of the Egyptian pound's fall cannot be measured."
