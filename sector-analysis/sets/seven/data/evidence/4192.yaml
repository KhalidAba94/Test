open_questions:
  - "Why gross margin fell to 15.4% in FY2024 (cost of revenue +15.6% on revenue +1.6%) while inventories fell from SAR 410m to SAR 283m is not explained in the statements; no inventory write-down is shown in the FY2024 cash-flow statement."
  - "Revenue of new branches, openings and closures within each year, and same-store sales are not disclosed; the branch count was 73 at both end-2024 and end-2025 although new leases of SAR 70.4m were added and some terminated in 2025."
  - "The revenue split by channel (retail branches, e-commerce, wholesale) is given for FY2022 and in 2023 interims only."
  - "Rent paid to the chairman rose to SAR 9.4m in 9M2026 (9M2025: SAR 5.9m) after the 2024 sale of land and building to him (2026 Q3 p.14); whether the sold property is leased back is not stated."
