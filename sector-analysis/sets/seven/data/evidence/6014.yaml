open_questions:
  - "Revenue of the 29 Makkah and Taif branches (from 1 October 2025) is not disclosed, so the perimeter effect in FY2025 and 9M 2026 is not determinable."
  - "Other income 'Others' rose to 12,202,615 in FY2025 from 5,294,139; the note does not say what it contains (the 2026 Q3 interim mentions supplier volume rebates)."
  - "Lebanon is a hyperinflationary economy but the filings show no IAS 29 restatement for the Lebanese subsidiary; its size is not disclosed."
  - "The lease-modification and PP&E-disposal results are added back in the cash-flow statement, but the income-statement line that holds them is not named."
