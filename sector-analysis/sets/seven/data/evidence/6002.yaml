open_questions:
  - "No like-for-like or same-store sales growth and no revenue for opened or closed restaurants in any filing; new capacity is not determinable."
  - "The filings do not explain why gross profit fell 23.6% in FY2024 (restaurants and catering gross profit SR 159.1m to SR 98.1m) or why it recovered in FY2025; the cost note shows rent expenses up SR 14.1m in FY2024 and employee costs in cost of revenues down SR 46.4m in FY2025."
