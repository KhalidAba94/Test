open_questions:
  - "The FY2023 segment note shows office revenue of exactly SAR 45,817,490 in both FY2022 and FY2023, although Yassmin Al-Andalus Tower was bought in 2023; the purchase date and the tower's revenue are not disclosed."
  - "Manafea Al-Andalus (sold effective 1 Jan 2025) revenue in FY2024 is not disclosed, so the perimeter effect on FY2025 cannot be measured."
  - "The 24.4% revenue rise in 9M 2026 (retail +18.5%, hospitality +62.3%, office +30.6%) is not explained in the interim; we cannot tell whether the Al-Andalus Mall expansion, the hotel renovation or rent changes drove it."
  - "No gross leasable area, visitor numbers or hotel occupancy are given; occupancy appears only as valuation inputs."
