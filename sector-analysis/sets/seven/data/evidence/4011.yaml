open_questions:
  - "FY2024 'Others miscellaneous' expense of SAR 14.3m (FY2023: SAR 3.9m) is not explained; it roughly offsets the SAR 17.6m FX gain in the same line."
  - "The FY2023 annual mentions a SAR 4.0m fair-value adjustment on a 2023 gold forward contract without saying whether it was a gain or a loss or which line it sits in (FY2024 annual p.43)."
  - "Egypt's share of gold revenue, the average EGP rates used for translation and the basis of the 'average devaluation' figures are not disclosed, so the FX effect on revenue cannot be calculated."
  - "Store counts and like-for-like sales are not disclosed; capital work in progress relates to retail stores due in 2026."
  - "Line in which the FY2025 impairment loss on gold inventories (SAR 8.8m) sits is not named."
