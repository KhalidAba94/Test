open_questions:
- Revenue of the three hotels acquired on 7 May 2026 is not disclosed; rent paid to the ultimate parent fell from SR 34.3m to SR 23.0m
  (9M), which suggests some of them were already leased and operated by Baan, but the filing does not say so.
- FY2022 revenue of the two hotels moved to management agreements in 2023 is not disclosed, so the FY2023 and FY2024 perimeter effects
  are not determinable.
- The FY2025 full-year income statement has not yet been restated for note 15 (only the balance sheets and 9M 2025 are); the FY2026
  annual will restate it.
