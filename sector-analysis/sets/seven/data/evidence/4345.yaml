open_questions:
  - "Why units in issue fell by 4,090,000 to 113,910,000 and Almakan Mall Tabuk left the asset list in Q2 2026; the quarterly statements refer only to a 'specific event' announcement."
  - "The Q3 2026 NAV per unit (book) of 6.47 does not reconcile with net assets of SAR 699.3m over 113.91m units (6.14)."
  - "Revenue of the properties bought and sold in 2023-2024 (Signature, Sifr, Aljawhara, Jazl, Al Khair Mall) is not disclosed, so perimeter effects for FY2023-FY2025 cannot be measured except Bin Jalawi's 2025 revenue."
  - "Whether the SAR 1.2m management fee waiver (fund report) was booked in FY2024 profit."
