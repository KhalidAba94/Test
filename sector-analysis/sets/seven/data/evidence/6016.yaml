open_questions:
  - "SHOVEL's post-acquisition FY2025 revenue is 7,053,261 in the FY2025 annual (note 10, p.26; '7.1 million' in note 22, p.30) but 8,321,447 in the 9M 2026 interim (note 7, p.14). We use the audited figure."
  - "The FY2025 annual calls the Iqama-fee change a correction of an error (IAS 8, note 30); the 9M 2026 interim calls it a change in accounting policy (note 14)."
  - "The 30 Sep 2025 balance sheet was not re-presented, so 9M 2025 total assets and equity are on the pre-restatement basis (about 2.2m higher)."
  - "No restaurant count or same-store sales are disclosed for the Burgerizzr chain, so new-capacity effects cannot be measured."
  - "The nature of the 'transfer from assets under construction to cost of revenue' (FY2025 1,361,452; 9M 2026 521,001) is not explained."
  - "Purchase price allocation for SHOVEL is provisional; goodwill (7,993,001) may change in the FY2026 annual."
