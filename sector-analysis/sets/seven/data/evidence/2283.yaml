open_questions:
- Revenue of Al-Kenan Arabia in 9M 2026 (consolidated from 1 Dec 2025) is not disclosed; its pro-forma full-year 2025 revenue was SAR 16.88m (FY2025
  annual p.31). Feed revenue rose 57.1% in 9M 2026, so part of that rise may be acquired, but the split is not determinable.
- 'Whether new Mill C (Qassim) and the Mill A upgrade (Jeddah) started production in 2026: projects under progress fell from SAR 138.9m to SAR
  64.6m in 9M 2026 (2026 Q3 p.17), but no commissioning date or capacity is given.'
- Acquisition costs in 9M 2025 (Al-Manar closed on 18 Sep 2025) are not separately disclosed in the interim.
- The GFSA claim (SAR 2m provided) was still under review at end-2025; no later outcome is disclosed.
