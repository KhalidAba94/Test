open_questions:
- Revenue of Pure Beverages since 31 July 2025 (and pro-forma) is not disclosed, so the FY2025 and 9M2026 perimeter effects cannot be measured.
- No constant-currency revenue is given for Egypt and Jordan (IDJ); the FX effect of Egyptian pound devaluations cannot be measured.
- The 9M2025 associate gain (43.6m, 2025 Q3) and the FY2025 gain (75.4m) are measured differently (recovery costs); the 2026 Q3 interim does not restate the 9M2025 amount.
