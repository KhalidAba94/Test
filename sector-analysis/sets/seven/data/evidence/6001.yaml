open_questions:
- 'FX translation effect on revenue is not determinable: no EGP revenue or average exchange rates are disclosed.'
- >-
  Saudi segment revenue rose 35.9% in FY2024 (354.2m to 481.3m) while Egypt fell 7.5%; the filings give no explanation of the Saudi
  increase.
- >-
  The P&L line holding the FY2024 provisions written back (13.5m cash-flow add-back) is not named; we assume other income, net (12.0m
  in FY2024).
- >-
  FY2022 operating cash flow is after finance cost paid (11.4m); from FY2023 (restated) finance cost paid is in financing, so FY2022
  CFO is not on the same basis.
