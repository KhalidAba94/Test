special_extractions:
  - item: "Quarterly statements vs audited revenue"
    detail: "The four 2025 quarterly statements give rental income of 24.2m + 24.8m + 25.3m + 27.2m = SAR 101.5m, against audited rental plus hotel revenue of SAR 124.4m; the quarterly figure is on a different (undefined) basis. Quarterly NAV and total assets are at fair value."
    source: "4336_MULKIA_REIT/2025_Q4_filed2026-01-14.pdf"
    page: 4
    quote: "All numbers shown in the factsheet are based on total fair value"

open_questions:
  - "The quarterly 'rental income' measure does not reconcile with audited revenue (2025: SAR 101.5m vs SAR 124.4m), so 9M revenue growth (+1.9%) is on the statements' own basis only."
  - "The FY2024 revenue of Al-Maather (from 24 Jul 2024) and the January 2025 revenue of Al Yasmin are not disclosed, so the perimeter effects cannot be measured."
  - "The fund report's property revenues for 2025 (sum about SAR 103m) do not reconcile with audited revenue of SAR 124.4m; the hotel appears to be shown net."
