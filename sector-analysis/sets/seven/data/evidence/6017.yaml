open_questions:
  - "Joint Preparation Company for Meals: the FY2024 AFS (p.58-59) calls the February 2024 purchase of the remaining 40% an equity transaction, but also shows an acquisition table with revenue 'from the acquisition date'. We treat it as no perimeter change because the company was a consolidated 60% subsidiary in FY2022-FY2023 (FY2023 AFS p.13)."
  - "Snoonu's 9M 2026 revenue is not disclosed, so the perimeter effect in 9M 2026 cannot be separated from growth in Bahrain and Kuwait."
  - "SOL Company for Trading (35%, consolidated from 26 Dec 2023): its FY2024 revenue is not disclosed; the 'Other activities' segment rose from 14.6m to 72.8m in FY2024."
