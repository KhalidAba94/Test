open_questions:
- NADEC related-party sales are labelled 'including VAT' in both the FY2024 and FY2025 annuals but differ by a factor of 1.15 for 2024 (SAR 24.04m
  vs SAR 20.90m); NADEC's own filings would show which basis is right.
- The jump in loan-cost amortisation to SAR 12.4m in FY2025 is not explained in a note; we infer it follows the SAR 174.5m principal repayment.
- The FY2023 rise in gross margin (49.3% vs 45.7%) coincided with a SAR 13.2m reversal of the slow-moving inventory provision; its P&L line is
  not named, so its margin effect is not quantified.
- Revenue by product is not given in the 2026 Q3 interim, so 9M 2026 mix is not determinable.
