open_questions:
- Revenue by product (flour, feed, bran) is disclosed only for FY2022, so mix changes after FY2022 cannot be shown.
- Al Jowf revenue rose 31.3% in FY2025 and 26.6% in 9M 2026; the filings do not say whether new capacity or prices drove it.
- Capital work in progress was SAR 46.9m at end-2025 after SAR 137.1m of PP&E additions in FY2025, so some projects (including the Al Jumum expansion)
  were brought into use in 2025, but no capacity or start date is given.
