  - {date: "2023-07-31", category: "M&A", text: "Sold Al-Sharq Warehouse Complex for SAR 158.1m (gain SAR 21.8m); long-term borrowings fell from SAR 748m to SAR 608m in 2023.", source: "4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.24, p.28"}
