ticker: "4339"
headline: >-
  Derayah REIT's rental revenue fell from SAR 123m (FY2022) to SAR 100m (FY2025) after a warehouse sale and tenant defaults at Smart Tower
  and Motoon Tower; net profit fell from SAR 47.2m to SAR 8.7m, we calculate FFO of SAR 31.5m in FY2025 against SAR 65.8m in FY2022, and
  distributions exceeded FFO in every year (payout 118.8% in FY2025) while LTV stayed near 40%.
lfl_basis:
  definition_used: >-
    Revenue is rental income from real estate investments; capital gains on property sales, FVTPL gains and other income are excluded. Perimeter
    = properties sold (no acquisitions in FY2022-9M2026). The filings give no revenue by property, so the revenue removed by the two sales is not
    determinable and like-for-like growth cannot be shown.
  perimeter_changes:
    - {event: "Al-Sharq Warehouse Complex sold for SAR 158.1m (gain SAR 21.8m)", date: "2023-07-31", effect: "revenue removed not disclosed; properties 26 to 25", source: "4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.24, p.9; 4339_DERAYAH_REIT/2023_Q3_filed2023-10-12.pdf p.2"}
    - {event: "Dammam Labor Housing (1) sold for SAR 5.1m (loss SAR 0.1m)", date: "2024-08-01", effect: "revenue removed not disclosed; properties 25 to 24 in the quarterly statements", source: "4339_DERAYAH_REIT/2024_Annual_filed2025-03-27.pdf p.24, p.9"}
  capacity_changes:
    - {event: "No acquisitions or developments; quarterly statements report 'New Properties: None'", date: "2023-2026", effect: "none identified", source: "4339_DERAYAH_REIT/2025_Annual_filed2026-03-30.pdf p.11; 4339_DERAYAH_REIT/2026_Q3_filed2026-10-19.pdf p.2"}
  fx_exposure: "All properties are in Saudi Arabia; no FX effect."
  price_volume_support: "Not determinable. The fund reports leasable-area occupancy (96%, 95%, 92% in FY2023-FY2025) but no rents per square metre or revenue by property."
  confidence: "Low (disposal effects not determinable)"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Rental income rose 3.1% to SAR 100m while the company reports leasable-area occupancy falling from 95% to 92%; Smart Tower, 17.16% of
      annual rent, was in litigation with its main tenant. The split between rent levels and occupancy is not determinable.
    basis: "disclosed (rental income, occupancy); split not determinable"
    confidence: "Low"
    source: "4339_DERAYAH_REIT/2025_Annual_filed2026-03-30.pdf p.9, p.34; 4339_DERAYAH_REIT/2025_Annual_filed2026-04-01.pdf p.6-7"
    refs: ["4339-FY2025-REV", "4339-FY2024-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Rental income fell 15.9% to SAR 103m after the July 2023 sale of Al-Sharq Warehouse Complex and arrears at Smart Tower and Motoon Tower (expected credit losses SAR 16.7m vs SAR 4.1m). Net profit fell 14.7% to SAR 40.3m (net margin 38.9%; ROE 4.6%), supported by a SAR 21.8m sale gain and a SAR 15.7m impairment reversal, both outside FFO. We calculate FFO down 59.3% to SAR 26.8m; distributions fell 49.7% to SAR 37.8m, 141.4% of FFO. SAR 140m of the loan was repaid, and LTV fell to 40.2%.", source: "4339_DERAYAH_REIT/2024_Annual_filed2025-03-27.pdf p.8-11, p.28; 4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.24", refs: ["4339-FY2023-REV", "4339-FY2023-NI_ATTR", "4339-FY2023-FFO", "4339-FY2023-GAIN_DISP", "4339-FY2023-DIST", "4339-FY2023-DEBT"]}
    - {period: "FY2024", driver: "Rental income fell 6.0% to SAR 97.3m and net profit 63.2% to SAR 14.8m (net margin 15.2%; ROE 1.7%); finance expenses were SAR 46.8m, nearly half of revenue. A SAR 7.6m impairment reversal, outside FFO, supported profit. We calculate FFO up 9.6% to SAR 29.3m; distributions of SAR 29.7m were 101.4% of FFO. LTV 39.5%.", source: "4339_DERAYAH_REIT/2025_Annual_filed2026-03-30.pdf p.8-11", refs: ["4339-FY2024-REV", "4339-FY2024-NI_ATTR", "4339-FY2024-FFO", "4339-FY2024-DIST", "4339-FY2024-IMPAIR_CF"]}
    - {period: "FY2025", driver: "Rental income rose 3.1% to SAR 100m but net profit fell 41.2% to SAR 8.7m (net margin 8.7%; ROE 1.0%): expected credit losses rose to SAR 8.8m and impairment turned to a SAR 0.8m charge, while finance expenses fell to SAR 42.8m. We calculate FFO up 7.3% to SAR 31.5m (FFO margin 31.4%); distributions rose 25.8% to SAR 37.4m, 118.8% of FFO. Borrowings were refinanced at SAR 610m; LTV 40.9%; NAV at fair value SAR 1,038m (+2.0%).", source: "4339_DERAYAH_REIT/2025_Annual_filed2026-03-30.pdf p.8-11, p.26, p.33-34", refs: ["4339-FY2025-REV", "4339-FY2025-NI_ATTR", "4339-FY2025-FFO", "4339-FY2025-DIST", "4339-FY2025-DEBT", "4339-FY2025-NAV_FV"]}
    - {period: "9M2026", driver: "Only fact-sheet figures are printed: no revenue, net profit, book NAV or book total assets. Distributions declared in January-September 2026 were SAR 31.2m (we calculate: SAR 0.09, 0.10 and 0.10 per unit), against SAR 27.7m in 9M 2025 (+12.4%). NAV at fair value was SAR 1,031m (+0.2%) and the banking facility SAR 610m.", source: "4339_DERAYAH_REIT/2026_Q3_filed2026-10-19.pdf p.2; 4339_DERAYAH_REIT/2025_Q3_filed2025-10-14.pdf p.2; 4339_DERAYAH_REIT/2025_Annual_filed2026-03-30.pdf p.33-34", refs: ["4339-9M2026-DIST", "4339-9M2025-DIST", "4339-9M2026-NAV_FV", "4339-9M2025-NAV_FV", "4339-9M2026-DEBT"]}
  one_offs:
    - {item: "Capital gain on sale of Al-Sharq Warehouse Complex; outside revenue and FFO (GAIN_DISP)", period: "FY2023", amount_sar_m: 21.8, line: "Capital gains from investments properties sale", source: "4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.9", tax_nci: "Funds are not subject to zakat (note 18); no minority interests. Listed only: net profit kept as reported; FFO already excludes it."}
    - {item: "Other income, not explained in the notes; the same year's cash flow shows a SAR 5.96m reversal of the zakat provision; inside FFO", period: "FY2023", amount_sar_m: 6.2, line: "Other income", source: "4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.9, p.11", tax_nci: "No zakat or minority interests. Listed only: profit and FFO kept as reported (nature inferred, Medium confidence)."}
    - {item: "Reversal of impairment on investment properties; outside FFO", period: "FY2023", amount_sar_m: 15.7, line: "Reverse of impairment on investment properties", source: "4339_DERAYAH_REIT/2023_Annual_filed2024-04-01.pdf p.9", tax_nci: "Non-cash; no zakat or minority interests. Net profit kept as reported; FFO excludes it."}
    - {item: "Reversal of impairment on investment properties; outside FFO", period: "FY2024", amount_sar_m: 7.6, line: "Reversal of impairment on investment properties", source: "4339_DERAYAH_REIT/2024_Annual_filed2025-03-27.pdf p.9", tax_nci: "Non-cash; no zakat or minority interests. Net profit kept as reported; FFO excludes it."}
