what_it_means:
  improved: "Rental income stopped falling in FY2025 (+3.1% to SAR 100m), we calculate FFO up for the second year (SAR 26.8m, 29.3m, 31.5m), and the loan was refinanced at SAR 610m until 2030."
  weakened: "Net profit fell every year to SAR 8.7m (net margin 8.7%, ROE 1.0% in FY2025), occupancy fell from 96% to 92%, and distributions exceeded FFO in every year (payout 118.8% in FY2025)."
  why: "The 2023 warehouse sale removed rent, tenant defaults at Smart Tower and Motoon Tower brought expected credit losses (SAR 16.7m in FY2023, SAR 8.8m in FY2025), and finance expenses of SAR 42.8m-50.0m a year took about half of revenue."
  uncertain: "Recovery of the Smart Tower and Motoon Tower arrears depends on enforcing court rulings; the revenue lost from the two sales is not disclosed, and 9M 2026 has no revenue or profit figures."
confidence_overall: "Medium"
data_notes:
  - "No restatements affecting the tables: FY2025 note 25 reclassified only cash-flow lines for investments."
  - "Borrowings (DEBT) are long-term borrowings only; accrued finance expenses are a separate liability and are excluded (SAR 9.7m in FY2024, SAR 9.4m in FY2025, SAR 2.4m in FY2022)."
  - "DA_CF covers depreciation of investment properties plus amortisation of benefit contracts (usufruct rights), per the REIT convention. Disposal gains and losses are in GAIN_DISP (FY2023 +21.8m, FY2024 -0.1m) and FFO deducts them."
  - "FY2021 borrowings (SAR 748m) are calculated: the 2022 refinancing drew and repaid the same SAR 642.4m, so the 31 Dec 2021 balance equals 31 Dec 2022 (C). FY2021 total assets are not in the archive; FY2021 NAV at fair value is from the FY2023 fund report (unaudited)."
  - "Distributions (DIST) are those declared in the period (statement of changes); the quarterly dividend for Q4 is declared in January. 9M distributions are sums of quarterly declarations (C); the Q2 2026 declaration date is not printed and is assumed before 30 Sep 2026."
  - "9M figures come from the quarterly unitholder statements (unaudited) and are partial: NAV at fair value and the banking facility only. The Q3 2026 fair-value NAV footnote is dated 30/06/2026, but the figure differs from the Q2 2026 statement's 30/06/2026 value."
  - "The FY2025 fund report counts 24 properties while the FY2025 statements (note 24) say 23. The FY2025 NAV note uses net assets of SAR 840,887,665, SAR 8,000 above the balance sheet."
