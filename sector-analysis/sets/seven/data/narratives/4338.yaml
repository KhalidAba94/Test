what_it_means:
  improved: "The mall filled up: retail revenue rose 10.1% in FY2025 with valuer occupancy of 99.02%, and the unaudited 9M 2026 fact sheet shows revenue up 23.4% and net profit of SAR 48.2m against SAR 17.9m."
  weakened: "From FY2022 to FY2025 net profit fell from SAR 66.1m to SAR 18.4m, FFO from SAR 90.1m to SAR 49.8m and the net margin from 35.7% to 9.3%, while LTV rose from 30.4% to 37.3% and distributions exceeded FFO each year."
  why: "Finance cost rose from SAR 20.9m to SAR 49.8m as borrowings grew from SAR 589m to SAR 743m to fund the mall expansion, and the hotel lost money and was impaired by SAR 11.0m over FY2024-FY2025."
  uncertain: "The 9M 2026 figures are unaudited fact-sheet numbers whose full-year totals have differed from the audited statements (FY2025 net profit 23.4m vs 18.4m), and the revenue of the mall expansion is not disclosed."
confidence_overall: "Medium"
data_notes:
  - "9M 2025 and 9M 2026 come from unaudited quarterly fact sheets (year-to-date income statement and balance sheet; no interim statements in the archive and no comparative column). They are partial: no cash, borrowings or impairment are printed, so 9M LTV and net debt are blank and 9M FFO is net profit plus the rounded depreciation footnote (SAR 21m and SAR 21.9m) without impairments. 9M NAV at fair value is NAV per unit at market value x 137.5m units (calculated). Fact-sheet full-year totals differ from the audited statements (FY2025 direct revenues SAR 190.0m and net profit SAR 23.4m vs SAR 196.7m and SAR 18.4m)."
  - "Revenue basis (aligned across the eight REITs after the independent sample check): REV is rental income plus other property operating income (hotel revenue, service charges, finance-lease income on leased property) and excludes Murabaha, deposit and other finance income, fair-value gains, disposal gains, dividends and other income. For this fund REV is the segment-note revenue (rental plus hotel): FY2022 SAR 185.1m, FY2023 183.1m, FY2024 187.6m, FY2025 196.7m; it previously used the total revenue line, which adds rebate income and fair-value gains of SAR 0.2m to 0.4m a year (FY2025 SAR 196.9m). The fact sheets' 'Direct Revenues' used for 9M are on the same basis (other income shown separately)."
  - "DA_CF and IMPAIR_CF include depreciation and impairment of the hotel, which the FY2024 annual reclassified from investment property to property and equipment (note 27), so FFO is on the same basis as FY2022-FY2023."
  - "Restated or re-presented figures (R): FY2023 NAV at fair value SAR 1,406.6m (FY2023 annual: SAR 1,413.6m) because the FY2024 annual measures the fair-value uplift on investment properties only; FY2024 total assets SAR 1,993.0m (FY2024 annual: SAR 1,986.5m) after prepayments and unearned rentals were grossed up (FY2025 annual note 28)."
  - "No FY2022 annual is in the archive: FY2022 is the FY2023 annual's comparative column and FY2021 opening balances come from its 2022 column; FY2021 total assets and NAV at fair value are not printed."
  - "Distributions (DIST) are those declared in the period (statement of changes in net assets), i.e. the prior second-half dividend plus the current first-half dividend; 9M figures sum the declarations in the fact-sheet dividend table."
  - "The FY2025 primary statements (pp.9-12) are scanned images, read by OCR and checked visually. The FY2023-FY2025 annual files were filed on the exchange in September 2026. Ernst & Young audited FY2025; FY2024 was audited by another auditor (Other Matter, unmodified)."
