ticker: "4150"
headline: >-
  Reported revenue swung with land sales (SAR 41.4m in FY2023, SAR 96.5m in FY2025, SAR 33.4m in 9M 2026); without them revenue rose 15.0%
  in FY2023 and 8.0% in FY2024, then fell 10.5% in FY2025 after the Ta'meer market moved into the Dira associate. Attributable profit held at
  about SAR 296m in FY2024-FY2025, carried by associates and Murabaha deposit income, and fell 41.7% to SAR 147m in 9M 2026.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue (rental income from markets and centres, operating revenue of the wholesale fruit and vegetable market and
    car auction, land sales and development fees). Land sales are investment-property disposals that the company books gross in revenue (the
    cash-flow statement shows them as gains on sale of investment properties), so we move the change in land-sale revenue out of organic growth
    as a presentation step (accounting_other, calculated) and list the land-sale margin as a one-off in operating income. Perimeter = properties
    bought, sold or contributed: the 2022 property purchase and the Ta'meer market contribution to the Dira associate (1 Dec 2024) have no
    disclosed revenue, so like-for-like growth is not determinable; the Remat Al-Riyadh assets bought for shares in 2025 are land. FX is nil.
  perimeter_changes:
    - {event: "Land and buildings bought (SAR 189.9m, property not named)", date: "2022", effect: "revenue not disclosed", source: "4150_ARDCO/2022_Annual_filed2023-03-22.pdf p.25"}
    - {event: "Ta'meer market properties contributed to Dira Development Company (46.34% associate with Riyadh Holding) for shares worth SAR 705.2m", date: "2024-12-01", effect: "revenue leaves the group from Dec 2024; amount not disclosed", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.32, p.34"}
    - {event: "Two real-estate assets bought from Remat Al-Riyadh Development Company for 56.2m new shares (SAR 1,403.8m), recorded as land", date: "2025-02", effect: "no revenue disclosed", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.41, p.31"}
    - {event: "Two wholly owned subsidiaries set up (Al-Rimal Logistics Park, Hulul Salasil); first consolidated statements", date: "2025-09/10", effect: "no acquired revenue", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.14"}
  capacity_changes:
    - {event: "Completed projects moved into investment properties (SAR 2.1m in 2022, SAR 1.0m in 2023, SAR 33.0m in 2024, SAR 10.6m in 2025)", date: "2022-2025", effect: "revenue not disclosed", source: "4150_ARDCO/2023_Annual_filed2024-03-14.pdf p.12; 4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.31"}
    - {event: "Buildings received at the end of land leases (SAR 12.5m in 2025; SAR 45.1m on 18 Apr 2026 under a BOT contract)", date: "2025; 2026-04-18", effect: "revenue not disclosed", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.44; 4150_ARDCO/2026_Q3_filed2026-11-01.pdf p.12"}
  fx_exposure: "All revenue is generated in Saudi Arabia in riyals; no FX or hyperinflation effect."
  price_volume_support: >-
    Not determinable. The filings give revenue by segment and by type (rental, operating, land sales, development) but no leasable area,
    occupancy, rents, visitors or auction and market volumes.
  confidence: "High for the land-sale presentation step and the nil FX effect; not determinable for perimeter and new capacity"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Rental revenue fell 17.4% (SAR 204m to SAR 168m) in the first year without the Ta'meer market, while operating revenue, mainly the
      wholesale market, rose 2.2% (SAR 112m to SAR 115m), as we calculate from the revenue note. Rents, occupancy and market volumes are not
      disclosed, so price and volume cannot be separated.
    basis: "disclosed (revenue by type); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.43"
    refs: ["4150-FY2025-REV", "4150-FY2024-REV"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Rental revenue rose 2.1% (SAR 126m to SAR 129m) and operating revenue 9.6% (SAR 85.2m to SAR 93.4m); by segment the wholesale market
      rose 13.7% and commercial centres fell 8.3% (we calculate). No volume or price data are given.
    basis: "disclosed (revenue by type and segment); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4150_ARDCO/2026_Q3_filed2026-11-01.pdf p.24, p.26"
    refs: ["4150-9M2026-REV", "4150-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue +31.0% to SAR 339m, of which SAR 41.4m came from a land sale; without land sales revenue rose 15.0% (we calculate), with commercial centres +11.8% and the wholesale market +19.2%. Operating income rose 53.2% to SAR 159m, including a SAR 37.9m gain on the land sale, and Murabaha deposit income rose to SAR 37.9m (SAR 21.6m). The share of associates' profit halved to SAR 97.5m (SAR 190.5m), so attributable profit fell 9.6% to SAR 272m; net margin 80.1%; ROE 11.9%.", source: "4150_ARDCO/2024_Annual_filed2025-03-02.pdf p.11, p.41, p.43; 4150_ARDCO/2023_Annual_filed2024-03-14.pdf p.12, p.37", refs: ["4150-FY2023-REV", "4150-FY2023-OPINC", "4150-FY2023-FIN_INC", "4150-FY2023-SHARE_JV", "4150-FY2023-NI_ATTR"]}
    - {period: "FY2024", driver: "Revenue -5.2% to SAR 322m with no land sales (+8.0% without the FY2023 land sale, we calculate): the wholesale market rose 12.2% and commercial centres 1.0%. G&A rose to SAR 99.7m (SAR 69.1m), including a SAR 14.7m litigation provision. Operating income fell 8.5% to SAR 146m and includes a SAR 26.8m release of the Al-Shorouk land provision and a SAR 17.2m gain on contributing the Ta'meer market to Dira. Murabaha income was SAR 57.5m and the associates' share SAR 125.9m. Attributable profit +9.1% to SAR 296m; net margin 92.1%; ROE 12.0%.", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.11, p.32, p.44, p.45", refs: ["4150-FY2024-REV", "4150-FY2024-OPINC", "4150-FY2024-FIN_INC", "4150-FY2024-SHARE_JV", "4150-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue +19.5% to SAR 384m, including SAR 96.5m of land sales; without them revenue fell 10.5% as the Ta'meer market left for the Dira associate (commercial centres -24.7%) while the wholesale market grew 5.0%. Operating income +50.2% to SAR 219m includes SAR 117.8m of one-offs (we calculate), mainly the SAR 90.7m land-sale gain. EBITDA was SAR 261m (margin 68.1%). The associates' share fell to SAR 48.0m (SAR 125.9m). Attributable profit was flat at SAR 296m; net margin 77.1%; ROE 8.9% on equity enlarged by the SAR 1,403.8m share issue for the Remat assets.", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.11, p.13, p.43-45", refs: ["4150-FY2025-REV", "4150-FY2025-OPINC", "4150-FY2025-EBITDA_C", "4150-FY2025-SHARE_JV", "4150-FY2025-NI_ATTR", "4150-FY2025-EQ_ATTR"]}
    - {period: "9M2026", driver: "Revenue -17.7% to SAR 255m because land sales fell to SAR 33.4m (SAR 96.5m); without them revenue rose 3.9% (we calculate). G&A doubled to SAR 106.9m (SAR 50.1m), with SAR 18.3m of White Land Fees (a new levy from 2026) and a SAR 16.1m lawsuit provision, while other income included a SAR 45.1m non-cash gain on a building received at the end of a BOT lease. Operating income -39.6% to SAR 113m; EBITDA -33.3% to SAR 146m (margin 57.3% vs 70.6%); the associates' share was SAR 21.6m (SAR 43.3m). Attributable profit -41.7% to SAR 147m; net margin 57.4%; annualised ROE 4.7%.", source: "4150_ARDCO/2026_Q3_filed2026-11-01.pdf p.5, p.23-26", refs: ["4150-9M2026-REV", "4150-9M2026-OPINC", "4150-9M2026-EBITDA_C", "4150-9M2026-SHARE_JV", "4150-9M2026-NI_ATTR", "4150-9M2025-REV"]}
    - {period: "FY2022-9M2026", driver: "ARDCO has no borrowings. It holds large Murabaha deposits outside cash (SAR 1,025m at end-2025, SAR 925m at 30 Sep 2026), whose income (SAR 56.9m in FY2025) sits below operating income, as does the share of associates. Operating cash flow was SAR 63.9m in FY2024, SAR 146m in FY2025 and SAR 75.8m in 9M 2026 (SAR 222m in 9M 2025).", source: "4150_ARDCO/2025_Annual_filed2026-03-08.pdf p.10, p.13, p.40; 4150_ARDCO/2026_Q3_filed2026-11-01.pdf p.4, p.7", refs: ["4150-FY2025-DEBT", "4150-FY2025-FIN_INC", "4150-FY2024-CFO", "4150-FY2025-CFO", "4150-9M2026-CFO", "4150-9M2025-CFO"]}
