what_it_means:
  improved: "Without land sales, revenue rose 15.0% in FY2023, 8.0% in FY2024 and 3.9% in 9M 2026, led by the wholesale fruit and vegetable market, and the company still has no borrowings."
  weakened: "Revenue without land sales fell 10.5% in FY2025 after the Ta'meer market moved into an associate, and 9M 2026 attributable profit fell 41.7% as G&A doubled and the associates' share halved."
  why: "Much of ARDCO's profit comes from outside its own operations: Murabaha deposit income (SAR 56.9m in FY2025), associates (SAR 48.0m) and one-off land-sale and property gains (SAR 117.8m of one-offs in FY2025 operating income, we calculate)."
  uncertain: "The revenue of the property moved into Dira and of the newly received buildings is not disclosed, the Remat land has not yet produced disclosed income, and a SAR 74m lawsuit is pending."
confidence_overall: "Medium"
data_notes:
  - "No usable XBRL for ARDCO: every figure was read from the PDFs (stage A overrides). Statement text layers are garbled, so the pages were re-read by OCR at 300 dpi and cross-footed (gross profit, profit before zakat, net profit, operating cash flow, total assets = equity + liabilities)."
  - "Standalone financial statements to FY2024; consolidated from FY2025 (two wholly owned subsidiaries, no NCI). NI_NCI and DEBT are recorded as zero because there are no non-controlling interests and no borrowings."
  - "Land sales are booked gross in revenue (FY2023 SAR 41.4m, FY2025 SAR 96.5m, 9M2025 SAR 96.5m, 9M2026 SAR 33.4m). The bridge removes them as a presentation step and the one-offs register removes the land-sale margin from EBITDA."
  - "CASH is 'cash at banks' on the balance sheet. Murabaha investment deposits are excluded (FY2023 SAR 870m, FY2024 SAR 930m, FY2025 SAR 1,025m, 9M2026 SAR 925m), so net debt (lease liabilities less cash) does not reflect ARDCO's net cash position. The FY2023 cash-flow statement counts SAR 270m of short deposits as cash equivalents (SAR 315.0m vs SAR 45.0m on the balance sheet)."
  - "Murabaha deposit income is finance income (FIN_INC) and finance cost is lease interest only. The share of associates is large (Tanal 69.38%, equity-accounted without control; Dira 46.34%), so attributable profit exceeds operating income and the FY2022 net margin is 116.0%."
  - "Re-presentations: FY2024 operating cash flow SAR 66.5m to SAR 63.9m (lease interest paid moved into operating activities, FY2025 FS p.13); FY2022 capex re-split between PP&E (SAR 7.5m) and investment property under development (FY2023 FS p.12); 31 Dec 2024 balance-sheet lines reclassified (FY2025 FS note 33, p.49), totals unchanged. Operating cash flow is after lease interest from FY2024."
  - "Not treated as one-offs: White Land Fees (SAR 18.3m in 9M2026; a new annual levy) and unexplained 'other' income of SAR 12.0m in FY2023."
