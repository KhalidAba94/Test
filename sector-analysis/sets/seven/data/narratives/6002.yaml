what_it_means:
  improved: "Margins recovered after FY2024: we calculate that the EBITDA margin rose from 9.7% in FY2024 to 15.0% in FY2025 and 18.7% in 9M 2026, and the gross margin reached 28.2% in 9M 2026; net debt fell to SAR 379m as capex was cut and borrowings repaid."
  weakened: "Revenue fell in every period (-4.5% a year from FY2022 to FY2025 and -4.1% in 9M 2026) as the estate shrank from 393 to 370 restaurants, and losses of SAR 117m (FY2024) and SAR 77.5m (FY2025) cut equity from SAR 1,057m to SAR 849m."
  why: "Restaurant revenue per outlet fell in FY2023 and 9M 2026 (we calculate) and costs rose in FY2024 (rent, utilities, receivable provisions, prior-year zakat); FY2025 and 9M 2025 losses were mostly the SAR 35.7m Sudair factory write-down, and FY2025 gross profit benefited from lower staff costs and returns."
  uncertain: "The filings give no like-for-like sales and do not explain the FY2024 gross-profit fall or the later recovery, so the roles of pricing, mix and cost cuts in the 9M 2026 margin cannot be separated."
confidence_overall: "Medium"
data_notes:
  - "Herfy prepares stand-alone (not consolidated) statements: attributable profit equals net profit, attributable equity equals total equity, and there are no non-controlling interests."
  - "Stage A overrides: D&A from the cash-flow statement (DA_CF) is the four depreciation and amortisation lines only; the XBRL values had netted in the non-financial impairment line (e.g. FY2025 SAR 204.7m corrected to SAR 169.6m). The impairment add-back (IMPAIR_CF) was added or corrected (9M 2025 SAR 38.3m, not the SAR 1.9m receivable provision). FY2022 capex is marked D, not R: the FY2022 annual prints the same figures. Borrowings are nil for FY2025 and 9M 2026."
  - "The FY2021 opening balance sheet is restated (FY2022 annual note 34, IAS 8): total assets SAR 1,845m to SAR 2,000m and lease liabilities SAR 517m to SAR 619m (R flags); total equity changed by -0.44% (kept D). No later restatement was found."
  - "There is no finance-income line on the face: interest income on finance leases sits in 'Other income, net' (FY2025 SAR 0.19m, 9M 2026 SAR 0.08m), so our operating income includes it. Finance cost is almost all interest on lease liabilities (FY2025 SAR 32.5m)."
  - "Revenue includes rental income from investment properties (FY2025 SAR 26.8m), reclassified from other income in the FY2022 annual."
  - "All primary statements are scanned images and were read visually; in the FY2023 annual the cash-flow page carries the heading 'Statement of changes in equity'."
  - "Restaurant counts are owned plus leased HERFY restaurants from note 1; bakeries and Doka shops are not counted. Per-restaurant figures use the restaurants and catering segment, which also holds catering, rental income and corporate items."
  - "One-offs listed here (FY2022 SAR 1.8m, FY2023 SAR 1.4m, 9M 2026 SAR 1.2m, all gains) will lower EBITDA excluding one-offs at the next rebuild; EBITDA margins quoted above are before that adjustment."
  - "Net debt is lease liabilities less cash (no bank debt since 2024). Growth in attributable profit is n.m. in every comparison because of losses or a base below SAR 10m."
  - "Year-end 31 December; Main Market listing; not a Nomu company."
