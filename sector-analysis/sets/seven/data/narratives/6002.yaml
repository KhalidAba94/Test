ticker: "6002"
headline: >-
  Revenue fell every year, from SAR 1,244m in FY2022 to SAR 1,083m in FY2025 (-4.5% a year), and a further 4.1% in 9M 2026 as the
  restaurant count fell from 393 at end-2023 to 370; after losses of SAR 117m in FY2024 and SAR 77.5m in FY2025 (including a SAR 35.0m
  impairment), Herfy made a small profit of SAR 2.1m in 9M 2026.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue (restaurant, meat-factory and bakery sales plus rental income from investment properties). Herfy is a
    single Saudi entity with no subsidiaries, no acquisitions or disposals, SAR as its functional currency and no hyperinflationary
    operations, so perimeter, FX and hyperinflation effects are nil and organic growth equals reported growth (High confidence).
    New capacity would be the revenue of restaurants opened in the period, but Herfy reports no like-for-like or same-store sales growth
    and no revenue for opened or closed restaurants; the estate shrank on a net basis from FY2024. Like-for-like growth is therefore not
    determinable, and reported (= organic) growth is the closest measure.
  perimeter_changes:
    - {event: "None: single entity (head office, restaurants, bakeries, shops and two factory branches), no business combinations FY2022-9M2026", date: "FY2022-9M2026", effect: "none identified", source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.13; 6002_HERFY_FOODS/2026_Q3_filed2026-11-05.pdf p.8"}
  capacity_changes:
    - {event: "Restaurants (owned + leased) 386 at end-2021 and 391 at end-2022", date: "2022", effect: "revenue of new restaurants not disclosed", source: "6002_HERFY_FOODS/2022_Annual_filed2023-03-29.pdf p.11"}
    - {event: "Restaurants 393 at end-2023; Herfy Tower let from 1 March 2022 and a SR 14m building reclassified to investment property in 2023", date: "2023", effect: "rental income SAR 26.0m (FY2022: SAR 21.8m); restaurant openings revenue not disclosed", source: "6002_HERFY_FOODS/2023_Annual_filed2024-03-13.pdf p.11, p.38, p.47"}
    - {event: "Restaurants 382 at end-2024 (net 11 closures)", date: "2024", effect: "revenue lost from closures not disclosed", source: "6002_HERFY_FOODS/2024_Annual_filed2025-03-11.pdf p.12"}
    - {event: "Restaurants 372 at end-2025 (owned 41, leased 331)", date: "2025", effect: "not determinable", source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.13"}
    - {event: "Restaurants 370 at 30 Sep 2026 (372 at 30 Sep 2025)", date: "2026 (9M)", effect: "not determinable", source: "6002_HERFY_FOODS/2026_Q3_filed2026-11-05.pdf p.8; 6002_HERFY_FOODS/2025_Q3_filed2025-11-09.pdf p.8"}
  fx_exposure: "None identified: all restaurants are in Saudi Arabia, the functional currency is SAR and the company reports transactions principally in SAR and USD with no significant currency exposure (FY2025 annual p.51)."
  price_volume_support: >-
    Partial. The filings give segment revenue, gross sales before discounts, rebates and returns, and period-end restaurant counts, but no
    transactions or average ticket. We can calculate restaurant revenue per average restaurant and the discount rate on gross sales; price and
    volume cannot be separated.
  confidence: "Medium (perimeter, FX and hyperinflation nil with High confidence; new capacity not determinable)"
price_volume:
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Restaurants and catering revenue fell 8.8% (SAR 648m to SAR 591m) while the average restaurant count fell about 1.6% (377 to 371,
      mean of the opening and closing counts, we calculate), so revenue per average restaurant fell about 7.4%. Discounts fell to 5.0% of
      gross sales from 6.1%. Bakeries revenue rose 15.4% and meat-factory external sales 11.4%.
    basis: "calculated"
    confidence: "Medium (the restaurants segment also includes catering, rental income and corporate items)"
    source: "6002_HERFY_FOODS/2026_Q3_filed2026-11-05.pdf p.20 (segments), p.18 (revenue note), p.8 (counts); 6002_HERFY_FOODS/2025_Q3_filed2025-11-09.pdf p.8"
    refs: ["6002-9M2026-REV", "6002-9M2025-REV"]
  - period: "FY2025 vs FY2024"
    text: >-
      Restaurants and catering revenue fell 2.4% and the average restaurant count 2.7% (387.5 to 377), so revenue per average restaurant was
      flat (+0.3%, about SAR 2.25m, we calculate). Gross sales fell 5.3%, but returns fell to SAR 13.7m (SAR 32.1m). Bakeries revenue fell 14.3%.
    basis: "calculated"
    confidence: "Medium"
    source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.47 (segments), p.44 (revenue note), p.13 (counts)"
    refs: ["6002-FY2025-REV", "6002-FY2024-REV"]
  - period: "FY2024 vs FY2023"
    text: >-
      Restaurants and catering revenue fell 3.1% and the average restaurant count 1.1%, so revenue per average restaurant fell 2.0% (we
      calculate). Discounts rose to 6.1% of gross sales (5.5%). Bakeries revenue fell 12.0%.
    basis: "calculated"
    confidence: "Medium"
    source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.47; 6002_HERFY_FOODS/2024_Annual_filed2025-03-11.pdf p.42, p.45, p.12"
    refs: ["6002-FY2024-REV", "6002-FY2023-REV"]
  - period: "FY2023 vs FY2022"
    text: >-
      Restaurants revenue fell 8.7% while the average restaurant count rose 0.9% (388.5 to 392), so revenue per average restaurant fell 9.5%
      (SAR 2.53m to SAR 2.29m, we calculate). Meat-factory external sales rose 14.6% and rental income SAR 4.1m.
    basis: "calculated"
    confidence: "Medium"
    source: "6002_HERFY_FOODS/2023_Annual_filed2024-03-13.pdf p.50 (segments), p.47 (revenue note), p.11 (counts); 6002_HERFY_FOODS/2022_Annual_filed2023-03-29.pdf p.11"
    refs: ["6002-FY2023-REV", "6002-FY2022-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue fell 5.6% to SAR 1,174m: restaurants and catering -8.7%, meat-factory external sales +14.6%, bakeries +2.4%. Gross profit fell 7.4% (gross margin 24.2% vs 24.7%). Attributable profit rose to SAR 8.4m (SAR 3.5m) mainly because FY2022 carried a SAR 17.5m impairment of non-financial assets; finance cost fell to SAR 31.8m (SAR 37.3m). We calculate EBITDA down 4.4% and an EBITDA margin of 18.6% (FY2022: 18.3%); operating margin 3.7%.", source: "6002_HERFY_FOODS/2024_Annual_filed2025-03-11.pdf p.9 (P&L), p.45 (segments); 6002_HERFY_FOODS/2023_Annual_filed2024-03-13.pdf p.8, p.10", refs: ["6002-FY2023-REV", "6002-FY2023-GP", "6002-FY2023-NI_ATTR", "6002-FY2022-IMPAIR_CF", "6002-FY2023-FIN_COST", "6002-FY2023-EBITDA_C"]}
    - {period: "FY2024", driver: "Revenue fell 4.2% to SAR 1,125m (restaurants and catering -3.1%, bakeries -12.0%) as restaurants fell from 393 to 382. Gross profit fell 23.6% to SAR 217m (gross margin 19.3%): restaurants and catering gross profit fell from SAR 159m to SAR 98.1m, while rent expenses in cost of revenues rose to SAR 21.4m (SAR 7.3m) and utilities to SAR 64.0m (SAR 57.0m); the filings give no fuller explanation. A SAR 12.5m provision on trade receivables and zakat of SAR 14.9m, including SAR 7.8m for 2014-2022 after a ZATCA assessment, took the net loss to SAR 117m. We calculate EBITDA down 49.8% and an EBITDA margin of 9.7%; net margin -10.4%.", source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.10 (P&L), p.47 (segments); 6002_HERFY_FOODS/2024_Annual_filed2025-03-11.pdf p.43 (cost of revenues), p.37, p.42", refs: ["6002-FY2024-REV", "6002-FY2024-GP", "6002-FY2024-NI_ATTR", "6002-FY2024-ZAKAT_TAX", "6002-FY2024-EBITDA_C"]}
    - {period: "FY2025", driver: "Revenue fell 3.8% to SAR 1,083m (restaurants and catering -2.4%, bakeries -14.3%, meat-factory +2.7%) as restaurants fell to 372. Gross profit rose 19.0% to SAR 259m (gross margin 23.9%): employee costs in cost of revenues fell to SAR 203m (SAR 249m) and sales returns to SAR 13.7m (SAR 32.1m). The net loss narrowed to SAR 77.5m after a SAR 35.0m net impairment of non-financial assets, mainly SAR 35.7m on the Sudair factory, built on land leased from Modon but never brought into service. We calculate EBITDA up 48.3% and an EBITDA margin of 15.0%; operating margin -3.9%.", source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.10 (P&L), p.12 (cash flows), p.33 (impairment), p.44-45 (revenue and cost notes), p.47 (segments)", refs: ["6002-FY2025-REV", "6002-FY2025-GP", "6002-FY2025-NI_ATTR", "6002-FY2025-IMPAIR_CF", "6002-FY2025-EBITDA_C"]}
    - {period: "9M2026", driver: "Revenue fell 4.1% to SAR 784m: restaurants and catering -8.8%, bakeries +15.4%, meat-factory external sales +11.4%. Gross profit rose 10.7% (gross margin 28.2% vs 24.5%), with discounts down to 5.0% of gross sales (6.1%, we calculate). Profit before zakat was SAR 3.7m against a SAR 64.0m loss; SAR 40.6m of the swing is the move from a SAR 38.3m impairment in 9M 2025 (Sudair factory) to a SAR 2.2m reversal, and a SAR 1.2m gain on PP&E disposals is a one-off. We calculate EBITDA up 15.5% and an EBITDA margin of 18.7% (9M 2025: 15.5%); net margin 0.3%.", source: "6002_HERFY_FOODS/2026_Q3_filed2026-11-05.pdf p.5 (P&L), p.7 (cash flows), p.14 (reversal), p.18 (revenue note), p.20 (segments)", refs: ["6002-9M2026-REV", "6002-9M2026-GP", "6002-9M2026-PBT", "6002-9M2025-PBT", "6002-9M2026-IMPAIR_CF", "6002-9M2026-EBITDA_C", "6002-9M2026-NI_ATTR"]}
    - {period: "FY2022-9M2026", driver: "Operating cash flow fell from SAR 251m (FY2022) to SAR 135m (FY2024) and SAR 144m (FY2025), but capex was cut from SAR 110m to SAR 14.1m, so free cash flow stayed between SAR 116m and SAR 141m a year and was SAR 121m in 9M 2026 (SAR 94.1m). Borrowings were repaid in 2024 and lease liabilities fell to SAR 416m at 30 Sep 2026, so net debt (all of it leases) fell from SAR 580m to SAR 379m, 1.94 times annualised EBITDA (we calculate).", source: "6002_HERFY_FOODS/2025_Annual_filed2026-03-11.pdf p.12; 6002_HERFY_FOODS/2026_Q3_filed2026-11-05.pdf p.4, p.7", refs: ["6002-FY2022-CFO", "6002-FY2025-CFO", "6002-FY2025-CAPEX", "6002-9M2026-FCF", "6002-9M2026-LEASE_LIAB", "6002-9M2026-NET_DEBT"]}
