what_it_means:
  improved: "Operating cash flow rose 77.2% to SAR 1,784m in FY2025, and the charge for receivable losses fell to SAR 59.3m in 9M 2026 from SAR 234.5m."
  weakened: "Revenue has been flat since FY2023 and grew 1.9% in 9M 2026 only through new development revenue. Borrowings rose from SAR 8,987m (end-2023) to SAR 16,066m (30 Sep 2026), and net debt reached 11.7x annualised EBITDA."
  why: "Two malls left the portfolio in 2025 while the new malls are still being built: investment-property spending was SAR 2,043m in 9M 2026 alone. Reported profit depends on non-cash fair-value gains (SAR 538m in 9M 2026) and, in 2025, on the SAR 250m insurance claim."
  uncertain: "The revenue lost with the two malls is not disclosed, the Mall of Dhahran claims (SAR 788.3m, one part dismissed in October 2026) are still open, and the filings do not say when the malls under construction will add revenue."
confidence_overall: "Medium"
data_notes:
  - "Year-end changed from 31 March to 31 December: FY2022 is the nine-month transition period 1 Apr-31 Dec 2022 and FY2021 opening balances are at 31 Mar 2022 (restated for the fair-value model, note 36, transition-period FS p.65). Growth FY2023/FY2022 is n.m. FY2022 ratios cover nine months, and the FY2022 ROE of 6.0% is not annualised."
  - "Investment properties are carried at fair value. The fair-value gain (FV_IP) is kept in operating income but taken out of EBITDA; the FY2023 gain is net of a SAR 142.6m loss on terminating a project (FY2023 FS p.30). Free cash flow deducts investment-property spending (IP_CAPEX). The VAT-on-capex lines (FY2024 -SAR 283.8m; FY2025 +SAR 88.7m; 9M2025 +SAR 134.9m; 9M2026 +SAR 115.0m) are left out."
  - "Restatements and re-presentations: FY2022 cost of revenue +SAR 9.8m from G&A (FY2023 FS note 36(i), p.60); FY2022 operating cash flow SAR 871.5m to SAR 818.7m (development properties moved into operating activities, FY2023 FS p.13); FY2023 operating cash flow SAR 1,383.6m to SAR 1,390.2m (0.48%, below the R threshold); FY2024 finance income on time deposits (SAR 2.4m) moved from other operating income into net finance costs in the FY2025 FS."
  - "Finance lines (stage A override): finance costs include the contract-modification loss on related-party receivables (FY2024 SAR 53.6m; FY2025 and 9M2025 SAR 13.7m) shown inside 'net finance costs', and finance income combines related-party and time-deposit income, so operating income equals the printed 'profit before net finance costs' subtotal. The 9M2026 finance costs are net of about SAR 93m of swap fair-value gains. In FY2023, SAR 1.2m of deposit commission income sits inside other operating income."
  - "Operating cash flow is before interest paid: finance costs paid on loans and the interest portion of lease payments are financing cash flows (FY2025 FS p.15). Finance costs of SAR 372m were capitalised into projects in 9M2026 (9M2025: SAR 325.6m)."
  - "Not treated as one-offs because they recur every year in small amounts: gains on investments at FVTPL, foreign-exchange gains and losses, and compensation from landlords (lease rental concessions), all inside other operating income or expenses (net FY2023 +SAR 12.5m, FY2025 -SAR 0.3m, 9M2026 +SAR 8.6m)."
  - "IMPAIR_CF is nil in every period. The XBRL impairment line was the charge for expected credit losses on receivables, which stays inside EBITDA as an operating cost (FY2024 SAR 321.8m, FY2025 SAR 315.7m)."
  - "Lease liabilities exclude the franchise-related payable inside 'lease and other financial liabilities' (SAR 260.9m at end-2025, SAR 224.0m at 30 Sep 2026); it is not in borrowings either, so net debt excludes it."
  - "There are no figures for gross leasable area, occupancy, visitors or like-for-like rent in the filings. Primary statements are scanned images, read visually and checked by OCR."
