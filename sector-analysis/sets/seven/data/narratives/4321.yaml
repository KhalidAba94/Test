ticker: "4321"
headline: >-
  Revenue barely moved between FY2023 (SAR 2,254m) and FY2025 (SAR 2,288m) and rose 1.9% in 9M 2026, while borrowings rose from SAR 8,987m
  to SAR 16,066m to fund malls still under construction; attributable profit (SAR 1,267m in FY2025, SAR 993m in 9M 2026, down 16.6%) leans on
  non-cash fair-value gains on investment properties and, in 2025, a SAR 250m insurance claim.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue (rental income, turnover rent, service and management charges, utility commission and, from 2026,
    development revenue). Perimeter = malls acquired, sold or handed back; new capacity = malls opened. The year-end moved from 31 March to
    31 December, so FY2022 is a nine-month period and FY2023/FY2022 growth is n.m. (one 'short period' bridge row). The filings give no revenue by
    mall, so the effect of the two malls that left in 2025 (Mall of Dhahran, handed back around February 2025, and an owned mall sold in 2025)
    is not determinable, and neither is like-for-like growth. No mall opened between FY2023 and 9M 2026; FX is nil.
  perimeter_changes:
    - {event: "Two subsidiaries holding projects under construction sold to Saudi FAS Holding (no operations)", date: "2022-08-14", effect: "no revenue effect", source: "4321_CENOMI_CENTERS/2023_Annual_filed2024-04-03.pdf p.58"}
    - {event: "100% of four subsidiaries (Al Erth Almatin, Aziz Mall Trading, Arkan Salam, Al Malaz Mall Trading) acquired from common shareholders for no consideration", date: "2024", effect: "revenue contribution not disclosed", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.17"}
    - {event: "Mall of Dhahran lease terminated by court order with retrospective effect from May 2023; the landlord's revenue claim runs to 9 Feb 2025", date: "2025", effect: "revenue lost not disclosed", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.63; 4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.36"}
    - {event: "Owned mall sold (agreement 2024, title transferred 2025; net proceeds SAR 200m, gain SAR 22m)", date: "2025", effect: "revenue lost not disclosed", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.34"}
    - {event: "Land lease for the planned Jawharat Al Khobar Mall terminated (adjusting event in FY2025)", date: "2026-01", effect: "no revenue effect (project); gain SAR 11.2m", source: "4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.17"}
  capacity_changes:
    - {event: "No mall opened; projects under construction rose from SAR 5,727m (end-2023) to SAR 11,786m (30 Sep 2026) at fair value", date: "FY2023-9M2026", effect: "none", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.35; 4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.17"}
    - {event: "Completion of major construction works on one project announced; tenant fit-out in progress", date: "2026-Q3", effect: "no revenue yet", source: "4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.17"}
    - {event: "Decision to end the lease of one operating mall effective 31 Jul 2027", date: "2026 (9M)", effect: "none in the periods covered", source: "4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.17"}
  fx_exposure: "All revenue is earned in Saudi Arabia in riyals; no FX or hyperinflation effect."
  price_volume_support: >-
    Not determinable. The filings give revenue by type (rental income, turnover rent, service charges) but no gross leasable area, occupancy,
    rent per square metre or visitor numbers; occupancy appears only as a valuation input range (69%-99% at end-2025).
  confidence: "Not determinable for like-for-like growth (perimeter effects undisclosed); High for the nil FX effect"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Revenue fell SAR 55.7m (-2.4%). Rental income fell 3.9% (SAR 2,132m to SAR 2,049m) in the year the Mall of Dhahran was handed back and a
      mall was sold, while turnover rent rose 30.6% (SAR 61.4m to SAR 80.2m) and service and management charges 5.9% (SAR 145m to SAR 154m),
      as we calculate from the revenue note. Rent and occupancy are not disclosed, so price and volume cannot be separated.
    basis: "disclosed (revenue by type); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.55"
    refs: ["4321-FY2025-REV", "4321-FY2024-REV"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue rose SAR 33.6m (+1.9%). A new development revenue line added SAR 35.6m (development services for Saudi Downtown Company); rental
      income fell 0.5% (SAR 1,549m to SAR 1,542m), turnover rent and service charges each rose 2.1%. Revenue from related parties fell to SAR 86.7m
      (SAR 269.2m). Without development revenue, revenue would have been 0.1% lower (we calculate).
    basis: "disclosed (revenue by type); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.29, p.11"
    refs: ["4321-9M2026-REV", "4321-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "First 12-month year after the year-end change, so growth against the nine-month FY2022 is n.m. Revenue SAR 2,254m. Operating income of SAR 1,909m includes a SAR 239m gain on selling part of the Jawharat Riyadh land and a SAR 370m fair-value gain on investment properties (after a SAR 142.6m loss on ending a project). EBITDA, which excludes the fair-value gain, was SAR 1,556m (margin 69.1%). Attributable profit SAR 1,515m; net margin 67.2%; ROE 10.7%.", source: "4321_CENOMI_CENTERS/2024_Annual_filed2025-03-19.pdf p.10; 4321_CENOMI_CENTERS/2023_Annual_filed2024-04-03.pdf p.30, p.49", refs: ["4321-FY2023-REV", "4321-FY2023-OPINC", "4321-FY2023-FV_IP", "4321-FY2023-EBITDA_C", "4321-FY2023-NI_ATTR"]}
    - {period: "FY2024", driver: "Revenue +4.0% to SAR 2,344m. EBITDA fell 9.2% to SAR 1,414m (margin 60.3%) because FY2023 held the SAR 239m land-sale gain and the charge for expected credit losses on tenant and related-party receivables rose to SAR 322m (SAR 190m). Finance costs rose to SAR 707m (SAR 364m) as borrowings grew to SAR 12,172m; they include a SAR 53.6m modification loss on related-party receivables. The fair-value gain was SAR 565m. Attributable profit -19.7% to SAR 1,217m; net margin 51.9%; ROE 8.4%.", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.11", refs: ["4321-FY2024-REV", "4321-FY2024-EBITDA_C", "4321-FY2024-FIN_COST", "4321-FY2024-DEBT", "4321-FY2024-FV_IP", "4321-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue -2.4% to SAR 2,288m as rental income fell 3.9% after two malls left the portfolio. Operating income +2.7% to SAR 2,015m includes a SAR 250m insurance claim for the 2022 Mall of Dhahran fire, SAR 28.7m of disposal gains and SAR 22.0m of early-evacuation costs; we calculate net one-offs of SAR 266.9m inside operating income. EBITDA SAR 1,543m (margin 67.4%); fair-value gain SAR 501m; finance costs SAR 738m with borrowings at SAR 16,973m and cash at SAR 4,294m. Attributable profit +4.1% to SAR 1,267m; net margin 55.4%; ROE 8.4%.", source: "4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.11, p.55, p.56", refs: ["4321-FY2025-REV", "4321-FY2025-OPINC", "4321-FY2025-EBITDA_C", "4321-FY2025-FV_IP", "4321-FY2025-FIN_COST", "4321-FY2025-DEBT", "4321-FY2025-CASH", "4321-FY2025-NI_ATTR"]}
    - {period: "9M2026", driver: "Revenue +1.9% to SAR 1,758m, all from new development revenue (SAR 35.6m). Operating income fell 6.5% to SAR 1,613m because 9M 2025 held the SAR 250m insurance claim and SAR 31.4m of disposal gains, while the receivable-loss charge fell to SAR 59.3m (SAR 234.5m). EBITDA -10.3% to SAR 1,109m (margin 63.1% vs 71.7%). The fair-value gain was SAR 538m (SAR 505m). Finance costs of SAR 585m (SAR 529m) are net of about SAR 93m of fair-value gains on profit-rate swaps, which sit outside our operating income. Attributable profit -16.6% to SAR 993m; net margin 56.5%; annualised ROE 8.3%.", source: "4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.6, p.9, p.26, p.29", refs: ["4321-9M2026-REV", "4321-9M2026-OPINC", "4321-9M2026-EBITDA_C", "4321-9M2026-FV_IP", "4321-9M2026-FIN_COST", "4321-9M2026-NI_ATTR", "4321-9M2025-OPINC"]}
    - {period: "FY2023-9M2026", driver: "Spending on investment properties was SAR 996m in FY2023, SAR 1,680m in FY2024, SAR 1,547m in FY2025 and SAR 2,043m in 9M 2026, so free cash flow after that spend was -SAR 682m in FY2024, SAR 216m in FY2025 and -SAR 1,072m in 9M 2026. Net debt rose to SAR 17,229m at 30 Sep 2026, 11.7x annualised EBITDA (9.9x at end-2025).", source: "cash-flow statements: 4321_CENOMI_CENTERS/2025_Annual_filed2026-04-05.pdf p.14; 4321_CENOMI_CENTERS/2026_Q3_filed2026-11-16.pdf p.9", refs: ["4321-FY2023-IP_CAPEX", "4321-FY2024-IP_CAPEX", "4321-FY2025-IP_CAPEX", "4321-9M2026-IP_CAPEX", "4321-FY2024-FCF", "4321-FY2025-FCF", "4321-9M2026-FCF", "4321-9M2026-NET_DEBT"]}
