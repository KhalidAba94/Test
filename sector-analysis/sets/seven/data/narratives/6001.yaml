developments:
- date: '2023'
  category: event
  text: >-
    The Egyptian pound fell against the riyal; HB booked a SAR 27.4m translation loss in other comprehensive income (FY2022: SAR 71.3m).
  source: 6001_HB/2023_Annual_filed2024-03-18.pdf p.63, p.7
- date: '2024-03-06'
  category: event
  text: >-
    The Central Bank of Egypt floated the pound. HB booked a SAR 27.6m loss on foreign currency differences in FY2024 (restated) and
    a SAR 62.7m translation loss in other comprehensive income.
  source: 6001_HB/2023_Annual_filed2024-03-18.pdf p.63; 6001_HB/2025_Annual_filed2026-02-11.pdf p.7
- date: '2024'
  category: financing
