    Al Rajhi Bank converted SAR 65m of working-capital facilities into a medium-term murabaha repayable quarterly to September 2028.
  source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.48
- date: '2024-06-25'
  category: regulation
