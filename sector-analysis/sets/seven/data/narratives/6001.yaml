ticker: '6001'
headline: >-
  Revenue fell from SAR 1,024m (FY2022) to SAR 904m (FY2025), mostly in the Egyptian business as the pound weakened, but HB recovered
  from a SAR 98.0m loss in FY2023 to profits of SAR 44.7m and SAR 42.6m, cut borrowings from SAR 357m to SAR 153m, and in 9M 2026 raised
  attributable profit 24.9% to SAR 33.7m on 3.3% higher revenue.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue in SAR. The group did not change: the parent (Saudi Arabia) and its wholly owned Egyptian subsidiary,
    plus two non-operating Cayman holding companies. About half of revenue (49% in FY2025, 60% in FY2023) is earned in Egyptian pounds
    and translated into riyals, so reported and organic growth both include the effect of the weaker pound. HB gives neither EGP revenue
    nor average exchange rates, and reports no capacity or same-store measure, so the FX step and like-for-like growth are not determinable;
    organic growth in SAR is the closest measure.
  perimeter_changes:
  - event: 'None: same consolidated group FY2022-9M2026; no business combination, disposal or discontinued operation'
    date: FY2022-9M2026
    effect: nil
    source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.13; 6001_HB/2026_Q3_filed2026-11-05.pdf p.11
  capacity_changes:
  - event: No plant openings or capacity additions disclosed; capex SAR 7-30m a year
    date: FY2022-9M2026
    effect: not determinable
    source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.32 (capex by segment)
  fx_exposure: >-
    Egyptian pound: the Egyptian subsidiary reports in EGP and was 49% of FY2025 revenue (51% in FY2024). The pound fell against the
    riyal in 2023 and was floated on 6 Mar 2024. The translation effect on revenue cannot be calculated from the filings. Transaction
    FX losses sit below operating profit (FY2024: SAR 27.6m).
  price_volume_support: >-
    Not determinable. The filings split revenue by country, product (sesame, meat, other) and customer type, but give no volumes, prices
    or EGP amounts.
  confidence: Medium (perimeter nil with High confidence; FX and new capacity not determinable)
price_volume:
- period: FY2025 vs FY2024
  text: >-
    Revenue fell SAR 65m (-6.7%). Sesame products fell 13.7% (SAR 362m to SAR 313m), meat products 1.9% and other products 3.7%. Sales
    to other markets (exports) fell 25.6% (SAR 123.8m to SAR 92.2m). The Saudi segment fell 3.1% and the Egyptian segment 10.2% in riyals.
    Volumes and prices are not disclosed, so the split is not determinable.
  basis: disclosed (revenue by product and market); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.32-34
  refs:
  - 6001-FY2025-REV
  - 6001-FY2024-REV
- period: 9M 2026 vs 9M 2025
  text: >-
    Revenue rose SAR 22.6m (+3.3%). Meat products rose 16.4% (SAR 276m to SAR 322m), mainly in Egypt, while sesame products fell 11.1%
    and exports fell from SAR 78.5m to SAR 58.8m. The Egyptian segment grew 6.9% in riyals and the Saudi segment was flat (-0.3%). Volumes
    and prices are not disclosed.
  basis: disclosed (revenue by product and segment); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 6001_HB/2026_Q3_filed2026-11-05.pdf p.12-13
  refs:
  - 6001-9M2026-REV
  - 6001-9M2025-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: >-
      Revenue fell 13.8% to SAR 883m (restated): the Saudi segment fell 18.5% and the Egyptian segment 10.3% in riyals as the pound
      weakened. Gross margin fell to 19.4% (26.4%, we calculate) and EBITDA margin to -1.3%. Net finance cost rose to SAR 22.8m (SAR
      12.7m) and income tax on the Egyptian profit was SAR 17.6m. The group lost SAR 98.0m; the Egyptian subsidiary earned SAR 51.7m,
      so the Saudi operations lost about SAR 149.7m (we calculate). Net margin -11.1%.
    source: 6001_HB/2024_Annual_filed2025-03-04.pdf p.7, p.34; 6001_HB/2023_Annual_filed2024-03-18.pdf p.35
    refs:
    - 6001-FY2023-REV
    - 6001-FY2023-GP
    - 6001-FY2023-EBITDA_C
    - 6001-FY2023-FIN_COST
    - 6001-FY2023-NI_ATTR
  - period: FY2024
    driver: >-
      Revenue rose 9.8% to SAR 969m: the Saudi segment rose 35.9% (SAR 354m to SAR 481m) while the Egyptian segment fell 7.5% in riyals
      after the pound was floated in March 2024. Gross profit rose 69.0% and EBITDA was SAR 131m, an EBITDA margin of 13.5%. A SAR 27.6m
      loss on foreign currency differences (restated) and SAR 27.4m net finance cost sat below operating profit, while SAR 13.5m of
      provisions were written back. Attributable profit was SAR 44.7m, a net margin of 4.6%, and ROE 15.0%.
    source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.7, p.32; 6001_HB/2024_Annual_filed2025-03-04.pdf p.10
    refs:
    - 6001-FY2024-REV
    - 6001-FY2024-GP
    - 6001-FY2024-EBITDA_C
    - 6001-FY2024-FIN_COST
    - 6001-FY2024-NI_ATTR
  - period: FY2025
    driver: >-
      Revenue fell 6.7% to SAR 904m: the Saudi segment fell 3.1% and the Egyptian segment 10.2%; exports fell 25.6%. Gross margin was
      28.6% (29.8%). EBITDA fell 5.2% to SAR 124m but the EBITDA margin edged up to 13.7%, helped by an SAR 8.8m gain on selling property,
      plant and equipment and SAR 4.4m of Egyptian export support. FX losses fell to SAR 0.8m. Attributable profit fell 4.6% to SAR
      42.6m, a net margin of 4.7%; ROE 13.6%.
    source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.7, p.32-35
    refs:
    - 6001-FY2025-REV
    - 6001-FY2025-GP
    - 6001-FY2025-EBITDA_C
    - 6001-FY2025-NI_ATTR
  - period: 9M2026
    driver: >-
      Revenue rose 3.3% to SAR 705m and gross profit 2.7%. The EBITDA margin was 12.4% against 13.0% in 9M 2025, as selling costs rose
      7.8%. Finance costs fell to SAR 16.0m (SAR 24.5m) as borrowings came down, which offset a larger FX loss (SAR 3.1m vs SAR 1.0m)
      and a SAR 2.6m impairment. Attributable profit rose 24.9% to SAR 33.7m, a net margin of 4.8% (3.9%); annualised ROE 12.8%.
    source: 6001_HB/2026_Q3_filed2026-11-05.pdf p.4, p.7
    refs:
    - 6001-9M2026-REV
    - 6001-9M2026-GP
    - 6001-9M2026-EBITDA_C
    - 6001-9M2026-FIN_COST
    - 6001-9M2026-NI_ATTR
    - 6001-9M2025-NI_ATTR
  - period: FY2022-9M2026
    driver: >-
      Cash flow turned positive and debt fell. Free cash flow was -SAR 59.0m in FY2022, then SAR 48.0m, SAR 76.9m and SAR 108m in FY2023-FY2025
      (we calculate), with capex of only SAR 7-15m a year. Borrowings fell from SAR 357m (end-2023) to SAR 153m (end-2025) and SAR 128m
      (30 Sep 2026); net debt including leases was SAR 121m.
    source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.8, p.10; 6001_HB/2026_Q3_filed2026-11-05.pdf p.5, p.7
    refs:
    - 6001-FY2022-FCF
    - 6001-FY2025-FCF
    - 6001-FY2023-DEBT
    - 6001-FY2025-DEBT
    - 6001-9M2026-DEBT
    - 6001-9M2026-NET_DEBT
