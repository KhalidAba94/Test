  source: 6001_HB/2025_Annual_filed2026-02-11.pdf p.10, p.35
- date: 2023-2026
  category: financing
  text: >-
    Borrowings fell from SAR 357m at end-2023 to SAR 128m at 30 Sep 2026; short-term murabaha fell from SAR 353m to SAR 95.5m.
  source: 6001_HB/2024_Annual_filed2025-03-04.pdf p.8; 6001_HB/2026_Q3_filed2026-11-05.pdf p.5
what_it_means:
  improved: >-
    HB moved from a SAR 98.0m loss in FY2023 to profits of SAR 44.7m (FY2024) and SAR 42.6m (FY2025), with EBITDA margin rising from
    -1.3% to 13.7%; free cash flow reached SAR 108m in FY2025 and borrowings fell from SAR 357m to SAR 128m by 30 Sep 2026.
  weakened: >-
    Revenue fell 4.1% a year from FY2022 to FY2025 (CAGR) and the Egyptian segment fell in riyals every year to FY2025; FY2025 profit
    included an SAR 8.8m disposal gain and SAR 4.4m export support.
  why: >-
    The weaker Egyptian pound cut the riyal value of half the business, and the FY2023 loss came from the Saudi operations (about SAR
    150m, we calculate); the recovery came with gross margin rising from 19.4% to 29.8% in FY2024 and lower finance costs as debt was
    repaid.
  uncertain: >-
    The filings do not show how much of the revenue decline is currency translation rather than lower volumes, or why the Saudi segment
    grew 35.9% in FY2024.
confidence_overall: Medium
data_notes:
- >-
  Corrected from the PDF statements (image pages read by OCR, checked against printed subtotals; e.g. FY2025 annual p.8 and p.10): borrowings
  include all Islamic murabaha contracts (the XBRL kept only term loans or the current portion, e.g. FY2025 SAR 16.5m vs SAR 153m); lease
  liabilities are read for FY2024 to 9M 2026; D&A includes depreciation of right-of-use assets; PP&E impairments are in the impairment add-back.
- >-
  PP&E impairments (FY2023 SAR 3.7m, FY2025 SAR 2.3m, 9M 2026 SAR 2.6m) are outside EBITDA and are not one-offs under the one-off rule.
- >-
  FY2022 borrowings exclude letters-of-credit liabilities of SAR 18.3m, which the company shows apart from interest-bearing loans (FY2022
  annual note 30).
- >-
  Restatements: FY2023 comparatives reclassified in the FY2024 annual (note 36): revenue SAR 889.0m to SAR 882.7m, total assets SAR
  902.3m to SAR 951.6m, operating cash flow SAR 34.1m to SAR 55.2m. FY2024 comparatives reclassified in the FY2025 annual (note 32):
  SAR 3.0m from G&A to income tax (PBT SAR 61.8m to SAR 64.7m) and SAR 1.4m from finance cost to FX losses. Net profit unchanged.
- >-
  Basis break: FY2022 operating cash flow (-SAR 28.8m) is after finance cost paid of SAR 11.4m; FY2023 onward (restated) shows finance
  cost paid in financing activities.
- >-
  FIN_COST is the "net finance cost" line on the face; FY2023 includes treasury-bill income of SAR 4.5m netted inside it (note 10).
  FIN_INC is not shown separately.
- >-
  Our operating income (PBT + finance cost) includes the FX differences and derivative results shown below HB's "profit from operations".
  EBITDA excluding one-offs removes FX differences and derivative results in every period (FY2022 -SAR 5.2m to FY2024 -SAR 27.6m), the
  FY2022 gain on assets held for sale, the FY2024 provisions written back and the FY2025 SAR 8.8m disposal gain. Egyptian export support
  (every year: SAR 1.4m, 0.9m, 0.1m and 4.4m in FY2022-FY2025) and the small yearly PP&E disposal gains are recurring and stay in EBITDA.
- >-
  The FY2021 balance sheet is the FY2022 annual comparative. No hyperinflation accounting (IAS 29) is applied to the Egyptian subsidiary.
