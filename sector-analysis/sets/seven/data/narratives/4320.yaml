what_it_means:
  improved: "In 9M 2026 revenue rose 24.4% across all three segments, EBITDA rose 29.5% and the group returned to an attributable profit of SAR 27.2m."
  weakened: "Between FY2022 and FY2025 EBITDA fell from SAR 133m to SAR 109m and the attributable result turned into losses in FY2024 and FY2025, as associates' losses, higher finance costs and hotel impairments outweighed flat revenue."
  why: "Borrowings rose from SAR 589m to SAR 880m to buy the Yassmin tower and fund projects, and the West Jeddah Hospital associate was loss-making; the 2025 sale of Manafea Al-Andalus and the hotel renovation also weighed on revenue."
  uncertain: "The filings do not explain the 9M 2026 revenue jump or give revenue for the properties bought and sold, and the group guarantees up to SAR 766.5m of the hospital associate's debt."
confidence_overall: "Medium"
data_notes:
  - "Al-Ahli REIT Fund 1, which owns Alandalus Mall, the Al-Andalus Mall hotel, Salama Tower and QBIC Plaza, is a 68.73% subsidiary and fully consolidated; the same fund is the listed REIT 4338 in the SEVEN REIT group. Adding Alandalus and Alahli REIT 1 double-counts these properties."
  - "Stage A overrides: borrowings now add the current portion of Islamic finance facilities (FY2023 SAR 803.8m, FY2024 SAR 853.4m, FY2025 SAR 880.1m, 9M2025 SAR 869.5m, 9M2026 SAR 900.1m incl. a SAR 6.1m short-term facility), where the XBRL had taken one line only; lease liabilities FY2021 and FY2022 likewise; FY2024 depreciation corrected to SAR 40.5m; IMPAIR_CF added for the hotel (FY2024 SAR 8.0m, FY2025 SAR 3.0m) and the FY2022 investment-property impairment reversal (-SAR 1.8m)."
  - "The 9M2025 depreciation 'R' flag is not a restatement: the XBRL original added interest on lease liabilities; both interims print SAR 28.9m."
  - "Share of associates' results sits inside the company's operating profit on the face; our operating income removes it. The gain on the subsidiary sale sits below the company's operating profit but inside our operating income."
  - "There is no finance-income line on the face: deposit commission and Murabaha fund gains sit in other income (FY2022 SAR 5.3m, FY2023 SAR 5.0m, FY2024 SAR 4.5m, FY2025 SAR 2.9m) and therefore inside our operating income; the FVTPL parts are listed as one-offs."
  - "Operating cash flow is before interest on Islamic facilities and leases, which is paid in financing activities (FY2025 FS p.12). Investment properties are at cost (fair value SAR 2.35bn at end-2025 is a note disclosure only)."
  - "Primary statements are scanned images (FY2022 annual entirely), read by OCR and checked visually; the FY2023 segment note is a sideways scan."
