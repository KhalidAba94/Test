developments:
- date: '2021-12-27'
  category: M&A
  text: Merged with its former parent Mada Al Ghurair, which had bought the company from the state in December 2020; the acquisition loans moved
    onto Modern Mills' balance sheet.
  source: 2284_MODERN_MILLS/2022_Annual_filed2024-03-27.pdf p.68
- date: '2023-03-19'
  category: regulation
  text: GFSA claimed fines of SAR 21m plus recoveries of SAR 43.2m over customer approvals and sale quantities; the company provided SAR 6.42m
    in FY2022 and settled for SAR 4.4m in December 2023.
  source: 2284_MODERN_MILLS/2022_Annual_filed2024-03-27.pdf p.74; 2284_MODERN_MILLS/2023_Annual_filed2024-04-02.pdf p.44
- date: '2024-03-27'
  category: event
  text: Listed on the Saudi Exchange.
  source: 2284_MODERN_MILLS/2025_Annual_filed2026-03-08.pdf p.12
- date: '2024-10-08'
  category: financing
  text: Refinanced SAR 643m of Alinma Bank loans with SAR 751m of SNB Murabaha facilities repayable to 2038-2039, plus a SAR 275m revolving facility.
  source: 2284_MODERN_MILLS/2024_Annual_filed2025-03-10.pdf p.35
- date: '2024'
  category: regulation
