  source: 2284_MODERN_MILLS/2024_Annual_filed2025-03-10.pdf p.39
- date: 2025 to 2026
  category: capacity
  text: 'Building a new feed plant at Al Jumum: capital commitments of SAR 140m at end-2025 and SAR 108.9m at 30 Sep 2026; borrowing costs of
    SAR 8.7m were capitalised in FY2025.'
  source: 2284_MODERN_MILLS/2025_Annual_filed2026-03-08.pdf p.28; 2284_MODERN_MILLS/2026_Q3_filed2026-11-01.pdf p.20
- date: 2024 to 2026
  category: financing
  text: Paid dividends of SAR 162.0m in each of 2024 and 2025 and in 9M 2026 (SAR 1 per share twice a year).
  source: 2284_MODERN_MILLS/2025_Annual_filed2026-03-08.pdf p.10; 2284_MODERN_MILLS/2026_Q3_filed2026-11-01.pdf p.8, p.23
what_it_means:
  improved: Revenue reached SAR 1,047m in FY2025 and grew 17.2% in 9M 2026, with all three regions growing; the 2024 refinancing cut finance cost
    from SAR 54.9m to SAR 33.1m in FY2025.
  weakened: 'Margins fell: the EBITDA margin went from 33.5% (FY2022) to 29.4% in 9M 2026 as selling and freight costs grew faster than revenue,
    and capex for the new feed plant cut free cash flow from SAR 319m to SAR 123m.'
  why: Sales grew mainly with corporate customers; costs of delivering them (freight, selling staff) and investment in feed capacity rose faster.
  uncertain: No volumes, prices or capacity are disclosed, and revenue by product is given only for FY2022, so whether growth came from new capacity,
    mix or prices is not determinable.
confidence_overall: Medium
data_notes:
- 'No XBRL file exists for Modern Mills: every figure FY2021-9M2026 was read from the PDFs (stage A overrides). Primary statements in the FY2024
  and FY2025 annuals and the interims are scanned images, read by OCR and visually; totals were cross-checked.'
- FY2021 balance sheet is the restated column of the FY2022 annual (note 36, correction of errors including the 27 Dec 2021 merger with Mada Al
  Ghurair); auditor emphasis of matter.
- FY2023 operating cash flow was re-presented in the FY2024 annual (SAR 235.7m to SAR 238.8m, R).
- 'FY2024 revenue and gross profit were re-presented in the FY2025 annual (note 24.1): freight of SAR 14.7m moved from a revenue deduction to
  selling expenses (revenue SAR 1,000.2m to SAR 1,015.0m, R). FY2023 was not re-presented, so FY2024/FY2023 growth (8.1%) includes 1.6 points
  of presentation change. 9M 2025 was re-presented the same way in the 2026 Q3 interim (+SAR 18.8m, note 12.1).'
- Gross profit is after freight only up to FY2023; from FY2024 freight sits in selling expenses, which lifts the gross margin compared with earlier
  years.
- Operating cash flow is after interest paid (finance costs paid are in operating activities), unlike Arabian Mills and Fourth Milling.
- Borrowing costs capitalised on projects (SAR 6.0m in FY2024, SAR 8.7m in FY2025, SAR 2.2m in 9M 2026) are not in finance costs.
- ROE is very high (FY2022 168.7%) because equity was only SAR 97.8m at end-2021 after the merger and large dividends; it is not comparable with
  the other mills.
- Treasury shares of SAR 39.3m are deducted from equity from 2024.
- IMPAIR_CF FY2022 is the write-off of intangible assets (SAR 4.0m); no other impairments.
- Listed on 27 Mar 2024; the archive holds statements from FY2022 (with FY2021 comparatives).
