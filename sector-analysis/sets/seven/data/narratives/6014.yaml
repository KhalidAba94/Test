what_it_means:
  improved: "After two years of decline, revenue rose 6.1% in FY2025 and 18.3% in 9M 2026, attributable profit rose 24.1% and 28.9%, and the EBITDA margin recovered to 19.1% in FY2025 from 18.2% in FY2024."
  weakened: "Results are still below FY2022: FY2025 revenue was 12.1% lower and attributable profit 58.8% lower (we calculate), the net margin was 5.0% against 10.7%, and net debt rose to SAR 225m at 30 September 2026 after the acquisition loan."
  why: "Revenue fell in every region in FY2023 and FY2024, with North Africa hit by the Egyptian pound devaluations and Dunkin revenue down 21.4% and 32.1%; the recovery since FY2025 came with more restaurants (Domino's 472 to 535 between end-2024 and September 2026) and two acquisitions in Saudi Arabia."
  uncertain: "Alamar reports no same-store sales and does not disclose the revenue of the 29 acquired Makkah and Taif branches, so acquired, new-restaurant and like-for-like growth cannot be separated."
confidence_overall: "Medium"
data_notes:
  - "The XBRL files in the archive are mislabelled by year and contain nothing after FY2024; all FY2025, 9M 2025 and 9M 2026 figures were read from the PDFs (override file 6014.csv). The 30 September 2025 balance sheet comes from the 2025 Q3 interim."
  - "Cash flow re-presentations: FY2023 operating cash flow is the FY2024 AFS comparative SAR 185.7m (SAR 190.4m first reported; finance income received and loan interest moved to financing) and FY2024 is the FY2025 AFS comparative SAR 96.7m (SAR 97.0m first reported; loan interest kept in operating). Interim cash flows include lease interest within lease payments in financing."
  - "FY2023 capex is the FY2024 AFS comparative SAR 51.5m (SAR 55.0m first reported): the FY2024 AFS netted a SAR 3.5m capital-advance refund into the PP&E line. Capital advances paid are excluded from capex in other periods (FY2025 SAR 3.5m, 9M 2026 SAR 6.7m)."
  - "Impairment add-back covers property and equipment only: FY2022 corrected to nil (the XBRL value was a receivable reversal), FY2023 corrected to SAR 1.0m, FY2025 a reversal of SAR 0.9m. Receivable ECL and inventory write-downs are excluded."
  - "Finance costs are 'finance costs and bank charges', which include bank charges and lease interest (FY2025: SAR 4.7m bank charges and loan cost, SAR 11.0m lease interest)."
  - "Lease-modification gains and losses and disposal results recur every year (FY2024 gain SAR 5.8m, FY2025 loss SAR 3.5m, 9M 2026 disposal loss SAR 2.3m), so they are explained in the drivers and not treated as one-offs."
  - "No IAS 29 restatement is applied to the Lebanese subsidiary; FX effects on Egypt and Morocco are not separable. Year-end 31 December; Main Market listing from 9 August 2022."
