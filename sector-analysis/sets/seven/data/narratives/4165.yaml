ticker: '4165'
headline: >-
  Revenue grew 23.3% a year from SAR 588m (FY2022) to SAR 1,104m (FY2025) and attributable profit rose from SAR 125m to SAR 218m, with
  Gulf sales growing fastest; in 9M 2026 revenue rose 11.4% to SAR 949m but higher selling and administrative costs held attributable
  profit growth to 3.9% (SAR 182m).
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue (after sales discounts). Al Majed was a stand-alone company with Gulf branches until FY2023; FY2024
    is the first consolidated year, with a 100% Qatar subsidiary whose origin and revenue are not disclosed, so the FY2024/FY2023 perimeter
    step is not determinable. No other acquisitions or disposals. About a fifth of revenue is in the Gulf, mostly in USD-pegged currencies
    plus the Kuwaiti dinar; revenue by country is not given, so the FX step is not determinable but small. The company gives no store
    count or same-store sales, so like-for-like growth is not determinable; organic growth is the closest measure where the perimeter
    is unchanged.
  perimeter_changes:
  - event: Qatar subsidiary (100%) first consolidated; FY2024 is the first consolidated year
    date: '2024'
    effect: not determinable (no revenue disclosed)
    source: 4165_ALMAJED_OUD/2024_Annual_filed2025-03-18.pdf p.12
  - event: >-
      UAE holding company and US subsidiary established (UK after the period); no significant operations at 30 Sep 2026
    date: 2026-06 to 2026-10
    effect: nil to 9M 2026
    source: 4165_ALMAJED_OUD/2026_Q3_filed2026-11-07.pdf p.9, p.20
  - event: MoU to acquire Al-Safa Pharmaceuticals and Medical Supplies Group (not completed by 30 Sep 2026)
    date: '2025-12-30'
    effect: none yet
    source: 4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.52
  capacity_changes:
  - event: >-
      Store openings and e-commerce growth: store counts not disclosed; e-commerce and other channels SAR 73.0m in FY2024 (SAR 40.5m
      in FY2023)
    date: 2023-2024
    effect: not determinable
    source: 4165_ALMAJED_OUD/2024_Annual_filed2025-03-18.pdf p.53
  fx_exposure: >-
    GCC was 20.6% of FY2025 revenue (Kuwait, UAE, Bahrain, Oman, Qatar). All but the Kuwaiti dinar are pegged to the US dollar; Kuwaiti
    revenue is not disclosed.
  price_volume_support: >-
    Not determinable: the filings give revenue by region and gross sales less discounts, but no volumes, prices or store data.
  confidence: Medium (perimeter High except FY2024; FX and new capacity not determinable)
price_volume:
- period: FY2025 vs FY2024
  text: >-
    Revenue rose SAR 178m (+19.2%). Saudi revenue rose 12.8% (SAR 776m to SAR 876m) and Gulf revenue 52.1% (SAR 150m to SAR 228m). Gross
    sales rose 27.7% to SAR 2,159m while sales discounts rose 37.1% to SAR 1,065m, so discounts took 49.3% of gross sales (45.9% in
    FY2024, we calculate). Volumes and prices are not disclosed.
  basis: disclosed (region; gross sales and discounts); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.45, p.52
  refs:
  - 4165-FY2025-REV
  - 4165-FY2024-REV
- period: 9M 2026 vs 9M 2025
  text: >-
    Revenue rose SAR 97.3m (+11.4%): Gulf revenue rose 56.2% (SAR 136m to SAR 212m) and Saudi revenue 2.9% (SAR 715m to SAR 736m). The
    Gulf provided 78% of the increase (we calculate). No store or volume data are given.
  basis: disclosed (region); split not determinable
  confidence: High for the amounts
  source: 4165_ALMAJED_OUD/2026_Q3_filed2026-11-07.pdf p.18
  refs:
  - 4165-9M2026-REV
  - 4165-9M2025-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: >-
      Revenue rose 31.3% to SAR 772m (re-presented). Gross margin rose to 66.4% (64.1%, we calculate), but selling and marketing costs
      rose 47.0% and the EBITDA margin fell to 35.7% (38.3%). The Gulf business lost SAR 8.4m while Saudi Arabia earned SAR 157.1m.
      Attributable profit rose 18.6% to SAR 148.7m, a net margin of 19.2%; ROE 42.8%.
    source: >-
      4165_ALMAJED_OUD/2024_Annual_filed2025-03-18.pdf p.9, p.53; 4165_ALMAJED_OUD/2023_Annual_filed2024-10-01.pdf p.6
    refs:
    - 4165-FY2023-REV
    - 4165-FY2023-GP
    - 4165-FY2023-EBITDA_C
    - 4165-FY2023-NI_ATTR
  - period: FY2024
    driver: >-
      Revenue rose 19.9% to SAR 926m: Gulf revenue rose 80.9% (SAR 80.2m to SAR 145.0m) in the first consolidated year, e-commerce and
      other channels 80.1% and Saudi regions 12.8%. Selling and marketing costs rose 25.4% and SAR 5.0m of listing costs were charged,
      so the EBITDA margin fell to 32.4%. Attributable profit rose 5.6% to SAR 157.0m, a net margin of 17.0%; ROE 37.1%.
    source: >-
      4165_ALMAJED_OUD/2024_Annual_filed2025-03-18.pdf p.9, p.53; 4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.46
    refs:
    - 4165-FY2024-REV
    - 4165-FY2024-EBITDA_C
    - 4165-FY2024-NI_ATTR
  - period: FY2025
    driver: >-
      Revenue rose 19.2% to SAR 1,104m (Saudi +12.8%, Gulf +52.1%). Gross margin was 65.5% and selling costs grew more slowly (+11.2%),
      lifting the EBITDA margin to 34.2%. Other income rose to SAR 8.2m (SAR 1.8m), of which SAR 4.8m was murabaha deposit income. Attributable
      profit rose 38.6% to SAR 217.6m, a net margin of 19.7%; ROE 41.4%. Operating cash flow almost doubled to SAR 439m as inventory
      fell by SAR 51.6m.
    source: 4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.9, p.11, p.47, p.52
    refs:
    - 4165-FY2025-REV
    - 4165-FY2025-GP
    - 4165-FY2025-EBITDA_C
    - 4165-FY2025-NI_ATTR
    - 4165-FY2025-CFO
  - period: 9M2026
    driver: >-
      Revenue rose 11.4% to SAR 949m and gross profit 11.4% (both 9M gross margins 69.0% after the note 22 reclassification). Selling
      and marketing costs rose 13.4% and general and administrative costs 47.4% (SAR 58.9m vs SAR 40.0m), so the EBITDA margin fell
      to 33.7% (34.7%). Murabaha and call-account income in other income rose to SAR 9.4m (SAR 2.6m). Attributable profit rose 3.9%
      to SAR 182.2m, a net margin of 19.2% (20.6%); annualised ROE 38.9%.
    source: 4165_ALMAJED_OUD/2026_Q3_filed2026-11-07.pdf p.5, p.7, p.17, p.19
    refs:
    - 4165-9M2026-REV
    - 4165-9M2026-GP
    - 4165-9M2026-EBITDA_C
    - 4165-9M2026-NI_ATTR
    - 4165-9M2025-NI_ATTR
  - period: FY2022-9M2026
    driver: >-
      The business is cash generative and lease-funded: free cash flow was SAR 111m to SAR 404m a year (we calculate), the company has
      had no borrowings since repaying SAR 45m of short-term loans in 2024, and cash reached SAR 385m at 30 Sep 2026 after SAR 100m
      of dividends in each of 2025 and 2026. Lease liabilities were SAR 222m.
    source: >-
      4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.8, p.11-12; 4165_ALMAJED_OUD/2026_Q3_filed2026-11-07.pdf p.4, p.8
    refs:
    - 4165-FY2025-FCF
    - 4165-FY2023-DEBT
    - 4165-9M2026-CASH
    - 4165-9M2026-LEASE_LIAB
  one_offs:
  - item: >-
      Listing costs charged to profit or loss (the selling shareholders reimbursed SAR 9.6m of IPO costs through equity)
    period: FY2024
    amount_sar_m: -5.0
    line: General and administrative expenses
    source: 4165_ALMAJED_OUD/2025_Annual_filed2026-02-11.pdf p.46-48
    tax_nci: >-
      3.2% of attributable profit, listed because listing costs are outside normal operations; zakat effect not disclosed; no
      non-controlling interests: after-zakat effect not determinable, profit kept as reported
