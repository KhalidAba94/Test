what_it_means:
  improved: >-
    Revenue grew 23.3% a year from FY2022 to FY2025 and attributable profit from SAR 125m to SAR 218m; free cash flow reached SAR 404m
    in FY2025 and the company has no borrowings.
  weakened: >-
    The EBITDA margin fell from 38.3% (FY2022) to 32.4% (FY2024) before recovering to 34.2%, and in 9M 2026 it slipped to 33.7% as administrative
    costs rose 47.4%, so profit grew only 3.9% on 11.4% higher revenue.
  why: >-
    Growth came mainly from the Gulf (revenue up from SAR 80m in FY2023 to SAR 228m in FY2025) and online channels, while selling costs
    and discounts grew with sales; Saudi revenue grew 12.8% a year in FY2024-FY2025 but only 2.9% in 9M 2026.
  uncertain: >-
    The filings give no store counts or same-store sales, so growth from new stores cannot be separated, and the effect of the Qatar
    subsidiary and the planned Al-Safa acquisition is not disclosed.
confidence_overall: Medium
data_notes:
- >-
  Listed on 7 Oct 2024. FY2022 and FY2023 figures come from the company-only statements filed on 1 Oct 2024 (no XBRL); FY2021 balance
  sheet from the FY2022 annual. FY2024 is the first consolidated year.
- >-
  Restatements: FY2023 revenue re-presented from SAR 767.0m to SAR 772.5m (FY2024 annual note 35); FY2023 equity cut by SAR 50m for
  a dividend approved on 28 Dec 2023 (note 34). Both values in the tables are the restated ones but carry no R chip because the original
  filing has no XBRL.
- >-
  Gross-profit basis break: the 2026 Q3 interim moved SAR 26.5m from cost of revenue to selling and marketing for 9M 2025 (note 22).
  FY2025 annual cost of revenue appears to be on the earlier basis, so the 9M gross margins (69.0%) are not comparable with FY2025 (65.5%).
- 'Revenue is shown after large sales discounts (FY2025: gross sales SAR 2,159m less discounts SAR 1,065m).'
- >-
  Finance income is not shown on the face: murabaha deposit income sits in other income (FY2024 SAR 0.8m, FY2025 SAR 4.8m, 9M 2025 SAR
  2.6m, 9M 2026 SAR 9.4m), so it is inside our operating income and EBITDA. It is recurring and not treated as a one-off. Lease concessions
  (SAR 1.4m in FY2025) also recur.
- >-
  D&A includes amortisation of right-of-use assets (FY2025 SAR 97.9m), read from the PDF cash-flow statements; the XBRL D&A covered only
  PP&E and intangibles. Receivable credit losses are excluded from the impairment add-back.
