what_it_means:
  improved: Revenue grew 4.5% a year from FY2022 to FY2025 and attributable profit 7.2% a year; the net margin rose to 30.4% in FY2025 and the
    EBITDA margin was 40.5% in 9M 2026, with no borrowings.
  weakened: Selling costs rose faster than revenue in FY2025 and 9M 2026, and capex for the Al-Kharj expansion kept 9M 2026 free cash flow flat
    at SAR 126m (SAR 127m) despite higher operating cash flow.
  why: Growth came from all three mills, led by Madinah and Al-Kharj in FY2025 and Dammam in 9M 2026; fewer fines and write-offs and higher finance
    income lifted FY2025 profit.
  uncertain: Revenue presentation changed twice (rebates in FY2023, transport costs in FY2024), product revenue is not given after FY2024, and
    no volumes or prices are disclosed, so price, volume and capacity effects are not determinable.
confidence_overall: Medium
data_notes:
- 'No borrowings: the XBRL ''current portion of long-term loans'' was the current portion of lease liabilities, so DEBT is 0 and LEASE_LIAB is
  the total of current and non-current leases (stage A corrections, FY2023-9M2026). Net debt is leases less cash.'
- 'FY2022 and 1 Jan 2022 were restated in the FY2023 annual (note 29): leases +SAR 111.8m, PP&E -SAR 16.4m, FY2022 net profit SAR 164.9m to SAR
  163.0m (R).'
- 'FY2023 revenue was re-presented in the FY2024 annual (note 30): SAR 7.5m of rebates deducted from revenue (SAR 565.6m to SAR 558.1m, R); FY2022
  was not, so FY2023/FY2022 growth is 1.3 points lower than on a like basis.'
- 'FY2024 revenue was re-presented in the FY2025 annual (note 31): SAR 11.5m of transport costs netted against revenue (SAR 629.0m to SAR 617.5m,
  R) and operating cash flow raised by SAR 6.69m (advances moved to investing); FY2023 was not, so FY2024/FY2023 growth is 2.1 points lower than
  on a like basis. 9M 2025 was re-presented the same way (-SAR 10.8m, 2026 Q3 note 27).'
- FY2025 cash is the 2026 Q3 comparative (SAR 63.75m, R), which includes SAR 0.65m of accrued finance income reclassified from prepayments (note
  27); the FY2025 annual shows SAR 63.10m.
- Cash excludes short-term murabaha deposits (SAR 74.1m at end-2024, SAR 156.2m at end-2025, SAR 21.1m at 30 Sep 2026), so net debt overstates
  the company's net lease obligation after deposits.
- Capex excludes advances to contractors and suppliers for the Al-Kharj expansion (SAR 6.7m FY2024, SAR 43.0m FY2025, SAR 12.6m 9M 2026).
- Zakat and tax includes current and deferred income tax (part of the shareholding is foreign-owned).
- IMPAIR_CF FY2024 is the SAR 4.4m write-off of capital work in progress; other years are nil (the XBRL rows were receivable ECL and were set
  to 0).
- Operating cash flow is before lease interest paid (shown in financing); the 2026 Q3 cash-flow statement starts from profit for the period.
- Primary statements in the FY2022, FY2024 and FY2025 annuals and the interims are scanned images (read by OCR; totals cross-checked).
- Listed on 27 Oct 2024; the archive holds statements from FY2022 (with FY2021 comparatives); the FY2025 auditor replaced the FY2024 auditor.
