ticker: '2286'
headline: Revenue rose from SAR 578m (FY2022) to SAR 660m (FY2025) and attributable profit from SAR 163m to SAR 201m with no borrowings and an
  EBITDA margin of about 40%; in 9M 2026 revenue grew 12.6% and profit 15.0%, and capex rose to SAR 85.0m for the Al-Kharj expansion.
lfl_basis:
  definition_used: 'Standard bridge on IFRS revenue. Fourth Milling is a stand-alone company with no subsidiaries, acquisitions or disposals,
    so perimeter effects are nil. Revenue presentation changed twice: FY2023 was re-presented with rebates deducted (-SAR 7.5m) and FY2024 with
    transport costs netted (-SAR 11.5m), while the earlier year of each comparison was not, so these are shown as accounting steps. No volumes,
    capacity or same-store measure are disclosed, so the new-capacity step is not determinable.'
  perimeter_changes:
  - event: No subsidiaries, acquisitions or disposals FY2022-9M2026
    date: 2022 to 2026
    effect: none
    source: 2286_FOURTH_MILLING/2025_Annual_filed2026-03-15.pdf p.3
  capacity_changes:
  - event: Expansion of the Al-Kharj flour mill and feed plant under construction (completion expected H2 2027)
    date: 2025 to 2026
    effect: no revenue in the periods covered
    source: 2286_FOURTH_MILLING/2026_Q3_filed2026-11-04.pdf p.17
  fx_exposure: 'None: no foreign operations; exports were SAR 1.6m in 9M 2026.'
  price_volume_support: Not determinable. Revenue is split by product only up to FY2024 and by region and customer sector; no tonnes or prices
    are disclosed. Subsidised wheat costs SAR 180 a tonne, unchanged since 2017.
  confidence: Medium (perimeter nil with High confidence; presentation steps calculated; new-capacity effect not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Revenue rose SAR 58.9m. Dammam grew 25.8%, Madinah 6.4% and Al-Kharj 3.5%; corporate customers 14.1%. No volumes or prices are disclosed,
    so price and volume cannot be separated.
  basis: disclosed (segment and sector revenue); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2286_FOURTH_MILLING/2026_Q3_filed2026-11-04.pdf p.15-16 (segments), p.23 (sectors)
  refs:
  - 2286-9M2026-REV
  - 2286-9M2025-REV
- period: FY2024 vs FY2023
  text: On the FY2024 annual's basis, gross flour revenue rose 14.9%, bran 13.1% and feed 8.1%, while discounts and promotions deducted from revenue
    rose to SAR 32.8m (SAR 23.4m). Al-Kharj grew 29.5% and Madinah 15.2%.
  basis: disclosed; split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2286_FOURTH_MILLING/2024_Annual_filed2025-03-16.pdf p.45 (products), p.29-30 (segments)
  refs:
  - 2286-FY2024-REV
  - 2286-FY2023-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: 'Revenue fell 3.5% (2.2% before the rebate re-presentation, we calculate): feed fell 26.1%, flour rose 3.4% and discounts grew, and
      Al-Kharj revenue fell. Selling costs rose to SAR 36.6m (SAR 32.0m) and G&A to SAR 45.7m (SAR 38.5m), and a SAR 4.1m fine was booked, so
      operating income fell 16.4%; lower lease finance cost (SAR 7.9m vs SAR 14.9m) and higher finance income (SAR 5.5m vs SAR 0.3m) limited the
      fall in attributable profit to 12.4%. EBITDA margin 38.5% (we calculate).'
    source: 2286_FOURTH_MILLING/2024_Annual_filed2025-03-16.pdf p.9 (P&L), p.45-46; 2286_FOURTH_MILLING/2023_Annual_filed2024-11-07.pdf p.7, p.27,
      p.40
    refs:
    - 2286-FY2023-REV
    - 2286-FY2023-OPINC
    - 2286-FY2023-NI_ATTR
    - 2286-FY2023-FIN_COST
    - 2286-FY2023-FIN_INC
  - period: FY2024
    driver: Revenue +10.6% (+12.7% on the FY2024 annual basis, we calculate), led by Al-Kharj and Madinah and by flour. Gross margin rose to 45.8%
      (44.1%). Other expenses of SAR 8.1m included a SAR 4.4m write-off of capital work in progress and a SAR 4.0m GFSA fine provision. Attributable
      profit +19.7% to SAR 171m; net margin 27.7%.
    source: 2286_FOURTH_MILLING/2025_Annual_filed2026-03-15.pdf p.8 (P&L, re-presented); 2286_FOURTH_MILLING/2024_Annual_filed2025-03-16.pdf p.9,
      p.29-30, p.45-46
    refs:
    - 2286-FY2024-REV
    - 2286-FY2024-GP
    - 2286-FY2024-NI_ATTR
    - 2286-FY2024-IMPAIR_CF
  - period: FY2025
    driver: 'Revenue +7.0% to SAR 660m: Madinah +14.7% and Al-Kharj +13.5%, Dammam -3.6%. Gross margin 46.4%. Selling costs rose to SAR 35.5m
      (SAR 25.7m) with transport and marketing, but other items swung from an SAR 8.1m expense to SAR 1.2m of income and finance income rose to
      SAR 9.9m (SAR 7.3m); zakat and tax fell to SAR 10.9m (SAR 15.2m) with a deferred tax credit. Attributable profit +17.5% to SAR 201m; EBITDA
      margin 40.6% (we calculate).'
    source: 2286_FOURTH_MILLING/2025_Annual_filed2026-03-15.pdf p.8 (P&L), p.23 (segments), p.37 (selling expenses)
    refs:
    - 2286-FY2025-REV
    - 2286-FY2025-GP
    - 2286-FY2025-FIN_INC
    - 2286-FY2025-ZAKAT_TAX
    - 2286-FY2025-NI_ATTR
  - period: 9M2026
    driver: Revenue +12.6% to SAR 528m, mostly Dammam (+25.8%). Gross margin rose to 49.3% (45.4%), while selling costs rose to SAR 40.3m (SAR
      25.7m) and G&A to SAR 48.4m (SAR 42.7m). Zakat and tax rose to SAR 10.8m (SAR 6.0m, which had a deferred tax credit). Attributable profit
      +15.0% to SAR 160m; net margin 30.3% (29.6%); annualised ROE 26.5%.
    source: 2286_FOURTH_MILLING/2026_Q3_filed2026-11-04.pdf p.7 (P&L), p.15-16 (segments)
    refs:
    - 2286-9M2026-REV
    - 2286-9M2026-GP
    - 2286-9M2026-ZAKAT_TAX
    - 2286-9M2026-NI_ATTR
  - period: FY2022-9M2026
    driver: The company has no borrowings; net debt is lease liabilities (SAR 376m at end-2025) less cash, and net debt to EBITDA was 1.17x in
      FY2025 and 0.72x in 9M 2026 (annualised). Capex rose from SAR 10.2m (FY2023) to SAR 85.0m in 9M 2026 for the Al-Kharj expansion, and dividends
      paid were SAR 140.4m in 9M 2026.
    source: balance sheets and cash-flow statements (FY2024-FY2025 annuals; 2026 Q3 p.6, p.9, p.21)
    refs:
    - 2286-FY2025-LEASE_LIAB
    - 2286-FY2025-NET_DEBT
    - 2286-FY2023-CAPEX
    - 2286-9M2026-CAPEX
    - 2286-9M2026-DEBT
  one_offs:
