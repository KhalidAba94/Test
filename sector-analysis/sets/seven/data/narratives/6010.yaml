ticker: '6010'
headline: Revenue grew from SAR 2,694m (FY2022) to SAR 3,527m (FY2025), 9.4% a year, and a SAR 2bn rights issue in 2023 turned net debt into net cash; attributable profit peaked at SAR
  775m in FY2024 on a SAR 357m Arabian Mills gain, fell to SAR 393m in FY2025, and dropped 42.7% in 9M 2026 as revenue was flat (+0.7%) and gross margin fell to 28.6%.
lfl_basis:
  definition_used: Standard bridge on IFRS revenue. NADEC had no consolidated acquisitions or disposals from FY2022 to FY2025 (its joint ventures are equity-accounted), so perimeter
    effects are nil until AlRaie was consolidated on 31 May 2026 (SAR 9.6m of 9M 2026 revenue, disclosed). The new Protein business (from late Q4 2023) is a new-capacity item whose FY2023
    revenue is not disclosed. About 13% of revenue is outside Saudi Arabia without constant-currency data, so FX is not determinable; no hyperinflation accounting applies. No volumes
    or like-for-like sales are disclosed.
  perimeter_changes:
  - event: 'Arabian Mills: 30% of NADEC''s shares sold in the IPO, joint control lost, rest held at FVOCI'
    date: '2024'
    effect: equity-accounted; no revenue effect; gain SAR 356.5m
    source: 6010_NADEC/2024_Annual_filed2025-03-02.pdf p.31
  - event: AlRaie National Livestock joint venture (51%) set up
    date: '2024'
    effect: equity-accounted until May 2026
    source: 6010_NADEC/2024_Annual_filed2025-03-02.pdf p.31
  - event: Sudan and Qatar branches closed
    date: '2024'
    effect: treated as organic; PP&E written off SAR 7.2m
    source: 6010_NADEC/2025_Annual_filed2026-02-04.pdf p.28
  - event: 'AlRaie: remaining 49% bought, control from 31 May 2026'
    date: '2026-05-31'
    effect: 9M 2026 revenue SAR 9.6m (disclosed)
    source: 6010_NADEC/2026_Q3_filed2026-10-21.pdf p.19
  capacity_changes:
  - event: Protein segment (frozen and fresh meat) launched
    date: 2023-Q4
    effect: FY2024 revenue SAR 180.3m, FY2025 SAR 300.2m; FY2023 amount not disclosed
    source: 6010_NADEC/2024_Annual_filed2025-03-02.pdf p.24
  - event: Capex SAR 385m in FY2025 (SAR 191m in FY2024) and right-of-use additions SAR 293m
    date: '2025'
    effect: revenue from new capacity not disclosed
    source: 6010_NADEC/2025_Annual_filed2026-02-04.pdf p.12, p.29
  fx_exposure: 'FY2025 revenue: Saudi Arabia 86.7%, other GCC 9.2% (pegged currencies), other countries 4.1% (currency not stated).'
  price_volume_support: 'Not determinable: no volumes or prices are disclosed.'
  confidence: Medium (perimeter nil or disclosed; new capacity and FX not determinable)
