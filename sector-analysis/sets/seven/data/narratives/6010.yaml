profit_and_margin:
  drivers:
  - period: FY2023
    driver: Revenue +18.7% (Dairy and Food +19.2%) and gross margin up to 37.0% (30.0%). Attributable profit rose to SAR 302m despite receivable impairments of SAR 48.9m and a SAR 24.0m
      PP&E write-off; a SAR 26.0m zakat reversal helped. The Q4 2023 rights issue raised SAR 2bn, so cash rose to SAR 835m and borrowings fell to SAR 376m. We calculate an EBITDA margin
      of 18.7%.
    source: 6010_NADEC/2024_Annual_filed2025-03-02.pdf p.8-9, p.12, p.25; 6010_NADEC/2023_Annual_filed2024-02-21.pdf p.34
    refs:
    - 6010-FY2023-REV
    - 6010-FY2023-GP
    - 6010-FY2023-NI_ATTR
    - 6010-FY2023-CASH
    - 6010-FY2023-DEBT
    - 6010-FY2023-EQ_ATTR
  - period: FY2024
    driver: 'Revenue +0.7%: Dairy and Beverages fell 3.5% while the new Protein segment added SAR 180.3m. Treasury income on rights-issue cash rose to SAR 91.4m (SAR 3.9m) and finance
      cost fell to SAR 34.2m (SAR 76.0m). Attributable profit of SAR 775m includes the SAR 356.5m gain on Arabian Mills; the company reports operating profit of SAR 389m. Our operating
      income and EBITDA include the gain (EBITDA margin 30.8%).'
    source: 6010_NADEC/2025_Annual_filed2026-02-04.pdf p.9; 6010_NADEC/2024_Annual_filed2025-03-02.pdf p.9, p.24, p.31
    refs:
    - 6010-FY2024-REV
    - 6010-FY2024-NI_ATTR
    - 6010-FY2024-FIN_INC
    - 6010-FY2024-OPINC
  - period: FY2025
    driver: Revenue +9.5% from Agriculture and Protein, but gross margin fell to 33.5% (37.0%) and selling costs rose 8.4%; operating profit was SAR 377m (SAR 389m). Without the FY2024
      gain, attributable profit fell 49.2% to SAR 393m. We calculate an EBITDA margin of 19.3% and ROE of 8.8%. Capex doubled to SAR 385m and lease liabilities rose to SAR 289m.
    source: 6010_NADEC/2025_Annual_filed2026-02-04.pdf p.8-9, p.12, p.24
    refs:
    - 6010-FY2025-REV
    - 6010-FY2025-GP
    - 6010-FY2025-NI_ATTR
    - 6010-FY2025-CAPEX
    - 6010-FY2025-LEASE_LIAB
  - period: 9M2026
    driver: 'Revenue +0.7% with gross margin down to 28.6% (34.7%); the share of AlRaie''s loss was SAR 15.0m and financing income fell to SAR 52.5m (SAR 76.6m). A SAR 71.0m reversal
      of receivable impairments (9M 2025: SAR 7.1m charge) supported profit, yet attributable profit fell 42.7% to SAR 189m. We calculate an EBITDA margin of 16.7% (20.0%). Operating
      cash flow fell 83.4% to SAR 75.8m as receivables rose and payables fell, so free cash flow was -SAR 226m.'
    source: 6010_NADEC/2026_Q3_filed2026-10-21.pdf p.6, p.9
    refs:
    - 6010-9M2026-REV
    - 6010-9M2026-GP
    - 6010-9M2026-NI_ATTR
    - 6010-9M2026-SHARE_JV
    - 6010-9M2026-CFO
    - 6010-9M2026-FCF
