headline: >-
  Five leisure operators, led by the gym chain Leejam (56.2% of FY2025 revenue), grew revenue 11.4% a year from SAR 2,078m
  (FY2022) to SAR 2,874m (FY2025), but growth slowed every year (16.8%, 11.0%, 6.6%) and was 3.0% in 9M 2026. Fitness clubs drove
  the gains (Leejam, Sport Clubs and Armah), while Baan's hotel and entertainment revenue shrank. Attributable profit peaked at
  SAR 543m in FY2024, a year with Leejam's SAR 92.2m land-sale gain, and fell 64.1% to SAR 195m in FY2025 as Leejam's costs rose
  and Baan lost SAR 202m. In 9M 2026 profit rose 24.8% to SAR 316m and EBITDA 11.7%, but EBITDA excluding identified one-offs
  rose only 0.6%: Baan's joint-venture gain and insurance income carried the increase.
main_changes:
  - change: "Fitness clubs drove growth. Group revenue rose 11.4% a year from FY2022 to FY2025. Leejam contributed 12.5, 7.2 and 4.2 points of the 16.8%, 11.0% and 6.6% annual growth; Armah grew from SAR 13.2m to SAR 225m and Sport Clubs 12.0% a year, while Baan's revenue fell 3.4% a year."
    driver: "The fitness operators kept opening centres and branches: Leejam's capex reached SAR 586m in FY2024, Armah built out its centres in FY2022-FY2023 and Sport Clubs had new branches under construction every year. No company discloses club, member or site counts or same-club revenue, so growth from new and existing clubs cannot be separated (not determinable). Baan's revenue fell as leases ended and, in 2023, two hotels moved from leases to management agreements with its parent, which took their revenue out of Baan's revenue."
    evidence: "Company narratives 1830, 6022, 6018, 1820; group growth contributions in the workbook"
    refs: ["1830-FY2022-REV", "1830-FY2025-REV", "6022-FY2022-REV", "6022-FY2025-REV", "6018-FY2025-REV", "1820-FY2025-REV"]
  - change: "Growth slowed to 3.0% in 9M 2026. Leejam's revenue growth fell from 24.4% (FY2023) to 4.0% in 9M 2026 and Baan's revenue fell 9.9%, while Sport Clubs (+17.2%) and Armah (+10.6%) still grew. Leejam and Sport Clubs added 2.3 and 2.2 points, Baan took off 2.3 points."
    driver: "At Leejam, male-centre subscriptions were flat (+0.3%) while female-centre subscriptions rose 15.9%, and personal training fell 5.3%. Baan's hospitality revenue fell 17.2% and entertainment 17.9%; the revenue of the three hotels and 86 apartments it acquired for shares in May 2026 is not disclosed. Sport Clubs' men's and women's centres grew 24.8% and 33.7% as its lower-margin sport-solutions contracts fell away."
    evidence: "Leejam 2026 Q3 interim p.16-17, p.24; Baan 2026 Q3 interim p.17, p.21-22; Sport Clubs 2026 Q3 interim p.20 (company narratives)"
    refs: ["1830-9M2026-REV", "1820-9M2026-REV", "6018-9M2026-REV", "6022-9M2026-REV"]
  - change: "Margins peaked in FY2024 and fell in FY2025. We calculate a group EBITDA margin of 41.6% (FY2022), 48.9% (FY2024) and 39.0% (FY2025); excluding identified one-offs, 41.1%, 44.6% and 39.0%. Group EBITDA fell 15.0% in FY2025, or 6.7% excluding one-offs."
    driver: "FY2024 held Leejam's SAR 92.2m land-sale gain and Baan's SAR 24.8m insurance compensation. In FY2025 Leejam's cost of revenue rose 13.8% against revenue growth of 7.5% (depreciation of centres +14.6%), so its EBITDA margin fell from 56.3% to 47.2%. Baan's gross profit fell 39.4% as direct costs rose while revenue fell, and its EBITDA dropped to SAR 98.8m (margin 15.2%)."
    evidence: "One-offs register O-1830-01, O-1820-02; company narratives 1830 and 1820"
    refs: ["1830-FY2024-EBITDA_C", "1830-FY2024-EBITDA_U", "1830-FY2025-EBITDA_C", "1820-FY2024-EBITDA_C", "1820-FY2025-EBITDA_C"]
  - change: "Attributable profit swung with Baan and with one-offs: SAR 163m (FY2022), SAR 543m (FY2024) and SAR 195m (FY2025). Excluding Leejam, the other four companies together lost money in FY2022, FY2023 and FY2025."
    driver: "Baan lost money in three of four years, including SAR 202m in FY2025 after SAR 43.1m of impairments and SAR 28.2m of disposal losses; its auditor reported a material going-concern uncertainty for FY2022, FY2023 and FY2025. Leejam's profit fell 33.3% in FY2025 as finance cost rose 19.7% and the land gain did not recur. Baan took 38.1 points and Leejam 28.0 points off the group's 64.1% fall in FY2025. TECO's resort earns about SAR 10m a year at a gross loss, so its result depends on deposit interest (SAR 31.0m in FY2024, SAR 14.9m in FY2025)."
    evidence: "Baan FY2025 annual p.3 (auditor's report), p.8; company narratives 1820, 1830, 4170"
    refs: ["1820-FY2025-NI_ATTR", "1830-FY2024-NI_ATTR", "1830-FY2025-NI_ATTR", "4170-FY2024-FIN_INC", "4170-FY2025-FIN_INC"]
  - change: "9M 2026 profit rose on one-offs. Attributable profit rose 24.8% to SAR 316m and EBITDA 11.7% to SAR 971m, but EBITDA excluding identified one-offs rose 0.6% (SAR 864m to SAR 869m) and its margin fell to 39.8% (40.7%)."
    driver: "Baan contributed 39.9 points of the profit growth: a SAR 69.5m gain on selling a joint venture and a SAR 21.1m insurance settlement turned its SAR 40.4m loss into a SAR 60.9m profit. Leejam's profit fell 18.0% (cost of revenue +9.0% against revenue +4.0%; finance cost SAR 92.6m vs SAR 77.9m). Armah's profit fell 11.8% because 9M 2025 held a SAR 9.5m sublease gain and 9M 2026 carried SAR 4.2m of listing costs; Sport Clubs' rose 53.8%."
    evidence: "One-offs register O-1820-03, O-1820-04, O-1830-02, O-6022-07, O-6022-08; company narratives"
    refs: ["1820-9M2026-NI_ATTR", "1820-9M2026-EBITDA_C", "1820-9M2026-EBITDA_U", "1830-9M2026-NI_ATTR", "6022-9M2026-NI_ATTR", "6018-9M2026-NI_ATTR"]
  - change: "Investment peaked in FY2024, then cash flow rose. Capex went from SAR 397m (FY2022) to SAR 823m (FY2024, 30.5% of revenue) and SAR 565m (FY2025, 19.7%). Free cash flow rose from SAR 501m to SAR 689m (11.2% a year) and was SAR 723m in 9M 2026 (+12.9%). Net debt including lease liabilities rose from SAR 2,491m to SAR 3,456m, 3.1x EBITDA at end-2025 (2.5x annualised at 30 Sep 2026)."
    driver: "Leejam's capex was SAR 586m in FY2024; in 9M 2026 it halved to SAR 138m and advance membership payments lifted operating cash flow, so Leejam's free cash flow was SAR 619m. Sport Clubs' capex rose to SAR 133m in 9M 2026. Lease liabilities (SAR 2,740m at end-2025) are most of net debt. Baan's May 2026 share issue for three hotels and 86 apartments (fair value SAR 830m) raised group attributable equity to SAR 3,365m at 30 Sep 2026 (+21.9% on a year earlier) without cash."
    evidence: "Cash-flow statements; Baan 2026 Q3 interim p.17 (capital increase in kind)"
    refs: ["1830-FY2024-CAPEX", "1830-9M2026-CAPEX", "1830-9M2026-FCF", "6018-9M2026-CAPEX", "1820-9M2026-EQ_ATTR", "1830-FY2025-NET_DEBT"]
takeaways:
  improved: "Revenue grew every year (11.4% a year from FY2022 to FY2025) and cash generation improved: free cash flow rose from SAR 501m to SAR 689m and was SAR 723m in 9M 2026 (+12.9%). Sport Clubs and Armah grew both revenue and profit, and Baan's share issue lifted group equity to SAR 3,365m."
  weakened: "Growth slowed every year, to 3.0% in 9M 2026, and we calculate that the EBITDA margin excluding one-offs fell from 44.6% (FY2024) to 39.0% (FY2025) and 39.8% in 9M 2026 (40.7%). Leejam's attributable profit fell 33.3% in FY2025 and 18.0% in 9M 2026, and Baan lost SAR 202m in FY2025."
  why: "Leejam's depreciation, marketing and finance costs rose faster than revenue while it kept investing in centres (capex SAR 586m in FY2024). Baan's hotel and entertainment revenue shrank as leases ended while its direct costs did not fall. Reported profit also moved with one-offs: Leejam's land gain in FY2024 and Baan's joint-venture and insurance gains in 9M 2026."
  concentration: "Leejam is 56.2% of FY2025 revenue (56.3% in 9M 2026); the revenue concentration index (HHI) is about 3,900 out of 10,000. Leejam earned SAR 305m in FY2025, more than the group's SAR 195m, because the other four together lost SAR 110m. Excluding Leejam, revenue grew 7.6% a year, the other four lost money in FY2022, FY2023 and FY2025, and net debt was 4.4x EBITDA at end-2025 (group 3.1x). In 9M 2026 the other four earned SAR 131m (SAR 27.5m), but their EBITDA excluding one-offs rose only 8.4%."
  ytd_2026: "9M 2026 vs 9M 2025: revenue +3.0%, EBITDA +11.7% (+0.6% excluding identified one-offs), attributable profit +24.8%, free cash flow +12.9%. We calculate an EBITDA margin of 44.4% (41.0%), or 39.8% (40.7%) excluding one-offs. Baan's joint-venture gain and insurance income (SAR 90.6m together) exceed the SAR 62.9m rise in group profit (we calculate)."
  uncertain: "No company discloses club, member or site counts or same-club revenue, so like-for-like growth is not determinable for any of them. Baan's auditor reported a material going-concern uncertainty for FY2025, and the revenue of the hotels it acquired in May 2026 is not disclosed. Armah's 9M 2025 comparative was neither audited nor reviewed, and TECO's resort land lease ends in May 2029."
data_notes:
  - "No short years and no company-periods left out: all five companies are in every revenue, profit, EBITDA and cash-flow total (n = 5 in FY2022-FY2025, 9M 2025 and 9M 2026), so group growth uses the whole group. The exception is lease liabilities: TECO has no figure for FY2022, FY2023 and 9M 2026, so those totals cover four companies."
  - "Sport Clubs listed on Tadawul on 22 July 2025. Its FY2022-FY2024 figures come from audited pre-IPO statements filed in November 2025, and its 9M 2025 comparatives are not restated for the FY2025 annual adjustments."
  - "Armah moved from the Nomu parallel market to the Main Market on 30 August 2026. The 2026 Q3 interim is its first quarterly report, and its 9M 2025 comparative is labelled unaudited and unreviewed."
  - "TECO's revenue is below SAR 10m from FY2023 (SAR 9.3m in FY2025), so its margins and its revenue growth from FY2024 are n.m. Its profit comes from interest on deposits, which is finance income outside operating income and EBITDA. It has no borrowings, so its net cash (SAR 249m at end-2025) reduces group net debt."
  - "Operating income uses one definition for every company (profit before zakat and tax + finance costs - finance income - share of associates), so it includes disposal gains, lease gains, insurance income and impairments that companies show below their own operating profit. EBITDA excluding identified one-offs removes the items in the one-offs register: mainly Leejam's land gain (FY2024) and disposal gain (9M 2026), Baan's insurance income (FY2024, 9M 2026) and joint-venture gain (9M 2026), Armah's sublease gain (FY2025, 9M 2025) and listing costs, and Sport Clubs' IPO costs."
  - "IFRS 16: EBITDA is before rent, and net debt includes lease liabilities (SAR 2,740m of the SAR 3,456m at end-2025)."
  - "Baan restated its 31 Dec 2024 and 31 Dec 2025 balance sheets in the 2026 Q3 interim (lease terms, SOCPA Q&A 179) but not its FY2025 income statement, so its FY2025 profit and balance sheet are on different lease bases."
  - "Classification: MAF Entertainment and TIME Entertainment are in the benchmark but not listed on the Main Market, so they are not covered; MBC Group is a media company and is kept in its own group."
