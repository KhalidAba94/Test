developments:
- date: '2022-12-29'
  category: M&A
  text: Sold its stakes in Knowledge Economic City and KEC Developers to Taiba for SAR 459m.
  source: 2050_SAVOLA_GROUP/2022_Annual_filed2023-03-30.pdf p.59
- date: '2023'
  category: M&A
  text: Completed the sale of Savola Morocco (net consideration SAR 41.4m).
  source: 2050_SAVOLA_GROUP/2023_Annual_filed2024-03-26.pdf p.66
- date: '2024'
  category: financing
  text: Raised SAR 6.0bn through a rights issue and bought back its SAR 1bn sukuk; borrowings fell from SAR 8,644m to SAR 3,404m.
  source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.13, p.75
- date: '2024-12-12'
  category: M&A
  text: Cut share capital from SAR 11.3bn to SAR 3bn and distributed its whole Almarai stake to shareholders (fair value SAR 21.1bn plus SAR 12.75bn in-kind dividend).
  source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.58
- date: '2024-12-31'
  category: M&A
  text: Sold the Iran operations for SAR 705m, abandoned Sudan and took control of United Sugar Company Egypt.
  source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.67, p.76, p.78
- date: '2025'
  category: M&A
  text: Exchanged KUGU (Turkey) for a 15% stake in Tiryaki Anadolu Holding (agreed equity value SAR 274.6m).
  source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.77
- date: '2025'
  category: regulation
  text: ZATCA finalised the Company's zakat for 2019-2024, reversing SAR 247.3m of accruals.
  source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.87
- date: '2026'
  category: M&A
  text: Sold the Sudan operations (SAR 52.5m, gain SAR 42.6m) and bought Al Mehbaj (SAR 11.4m).
  source: 2050_SAVOLA_GROUP/2026_Q3_filed2026-11-09.pdf p.16, p.33
what_it_means:
  improved: Borrowings fell from SAR 8,644m (FY2023) to SAR 1,894m (FY2025) and finance cost halved; FY2025 revenue rose 13.2% and ROE was 17.3%.
  weakened: Herfy's revenue fell every year (SAR 1,213m in FY2022 to SAR 1,057m in FY2025) with segment losses in FY2024 and FY2025, Panda's 9M 2026 revenue was flat, and 9M 2026 attributable
    profit fell 22.2%.
  why: The group exited Iran, Sudan, Turkey and Almarai, which removed revenue, the share of Almarai's profit and hyperinflation effects; the Almarai distribution produced a one-off
    SAR 11,555m gain in FY2024, and FY2025 profit relied on a SAR 247m zakat reversal.
  uncertain: How much FY2025 growth came from consolidating United Sugar Egypt is not disclosed, and the changing perimeter leaves organic growth not determinable for FY2023 to FY2025.
confidence_overall: Medium
data_notes:
- 'Discontinued operations change the perimeter between years: FY2023 (FY2024 annual) excludes Iran and Sudan, FY2024 (FY2025 annual) excludes Turkey, 9M2025 (2026 Q3) excludes Turkey
  and Sudan; FY2022 includes all three. Reported growth for FY2023/FY2022 (-13.9%) and FY2024/FY2023 (-4.6%) therefore mixes perimeters.'
- 'Restated figures (R): FY2022 finance cost and CFO (reclassifications, FY2023 annual); FY2023 income statement (Iran and Sudan discontinued), CFO (lease interest paid moved into operating),
  equity attributable (NCI reallocation) and current borrowings (accrued financial charges); FY2024 income statement (Turkey discontinued); 9M2025 income statement and impairment (Turkey
  and Sudan discontinued). Reasons are in reasons_2050.csv.'
- The FY2025 annual restates FY2024 non-controlling interests by SAR -10.4m (total equity 5,579.1 to 5,568.6, also at 1 Jan 2024) without a note; FY2023 equity is kept from the FY2024
  annual per the latest-restated rule.
- 'Stage A overrides: DEBT now includes current loans and borrowings (XBRL had the non-current line only; e.g. FY2025 SAR 1,893.9m, was 0); LEASE_LIAB added for every period; FY2022
  CASH = cash and cash equivalents SAR 812.5m (XBRL had term deposits); FY2021 CASH calculated as cash and bank balances less deposits over three months (C).'
- Share of results of equity-accounted investees is shown inside "results from operating activities" on the face; our operating income removes it. Gains below net finance cost (FY2022
  investments SAR 41.9m, FY2023 Morocco SAR 18.7m, FY2024 Almarai SAR 11,554.7m and USCE -SAR 139.0m) sit inside our operating income and are listed as one-offs; FY2024 operating margin
  (52.0%) and EBITDA are distorted until EBITDA excluding one-offs is rebuilt.
- Cash flow statements include discontinued operations; the income statement shows continuing operations only. FY2023 CFO (SAR 1,539.4m) includes lease interest paid in operating activities
  (re-presented).
- Primary statements are scanned in the FY2024 and FY2025 annuals and both Q3 interims; the 2026 Q3 segment note (p.28-29) is printed sideways.
