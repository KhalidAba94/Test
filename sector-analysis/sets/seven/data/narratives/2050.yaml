ticker: '2050'
headline: 'Savola became a smaller, Saudi-focused food and retail group: revenue fell from SAR 28,055m (FY2022) to SAR 23,046m (FY2024) as Iran, Sudan and Turkey were exited and shown
  as discontinued, then rose 13.2% to SAR 26,081m in FY2025 after United Sugar Egypt was consolidated; FY2024 attributable profit of SAR 9,974m was mostly the SAR 11,555m gain on handing
  the Almarai stake to shareholders, and in 9M 2026 revenue rose 3.1% while attributable profit fell 22.2% against a period that held a SAR 247m zakat reversal.'
lfl_basis:
  definition_used: Standard bridge on IFRS revenue from continuing operations. Each year is taken from the latest filing, and each later filing re-presented the prior year for newly
    discontinued businesses, so the FY2023/FY2022 and FY2024/FY2023 comparisons mix perimeters (Iran and Sudan in FY2022 only; Turkey in FY2023 only). The removed prior-year revenue
    is not disclosed, so organic growth is not determinable for those years; the company-consistent growth on one filing is given in the bridge notes. FY2025 includes United Sugar Company
    Egypt from 31 Dec 2024 without its revenue being disclosed. Hyperinflation (IAS 29) uplifts are disclosed by country and are bridged for Turkey. No store or restaurant data are given,
    so like-for-like growth is not determinable.
  perimeter_changes:
  - event: Savola Morocco sold (held for sale at end-2022)
    date: '2023'
    effect: revenue not disclosed; gain SAR 18.7m
    source: 2050_SAVOLA_GROUP/2023_Annual_filed2024-03-26.pdf p.66
  - event: Iran (Central Asian subsidiaries) sold and Sudan abandoned; both discontinued and FY2023 re-presented
    date: '2024-12-31'
    effect: FY2023 revenue removed SAR 2,668.8m (Iran 2,519.9m, Sudan 148.9m); FY2022 amount not disclosed
    source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.75-78
  - event: United Sugar Company Egypt consolidated (step acquisition)
    date: '2024-12-31'
    effect: FY2025 revenue contribution not disclosed
    source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.67-68
  - event: Almarai stake (34.52% associate) distributed in kind
    date: '2024-12-12'
    effect: no revenue effect; share of results falls; gain SAR 11,554.7m
    source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.58
  - event: KUGU (Turkey) exchanged for 15% of Tiryaki; discontinued and FY2024 re-presented
    date: '2025'
    effect: FY2024 revenue removed SAR 941.1m; FY2023 amount not disclosed
    source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.77
  - event: Sudan operations sold for SAR 52.5m
    date: '2026'
    effect: discontinued in both 9M periods; gain SAR 42.6m
    source: 2050_SAVOLA_GROUP/2026_Q3_filed2026-11-09.pdf p.16
  - event: Al Mehbaj (spices and nuts) acquired for SAR 11.4m
    date: '2026-07-12'
    effect: immaterial
    source: 2050_SAVOLA_GROUP/2026_Q3_filed2026-11-09.pdf p.33
  capacity_changes:
  - event: Panda and Herfy network changes
    date: 2022 to 2026
    effect: not disclosed in the financial statements
    source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.89-91
  fx_exposure: 'Revenue by region (rounded, as printed): FY2025 Arabia (GCC and Levant) SR 19.7bn, Egypt SR 5.7bn, other SR 0.7bn. Egypt (pound devaluation) and until their exit Turkey,
    Iran and Sudan (IAS 29) carry the currency exposure; no constant-currency figures.'
  price_volume_support: 'Not determinable: no volumes, prices, store counts or like-for-like sales in the filings.'
  confidence: Low (perimeter not determinable in three of four comparisons)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Food Processing external revenue rose 7.0% (SAR 9,604m to 10,272m), Retail (Panda) was flat at -0.3% (SAR 8,562m to 8,534m), Food Services (Herfy) fell 4.7% and Frozen Food rose
    0.5%. Prices, volumes and store counts are not disclosed.
  basis: disclosed (segment revenue); split not determinable
  confidence: High for the amounts
  source: 2050_SAVOLA_GROUP/2026_Q3_filed2026-11-09.pdf p.28-29
  refs:
  - 2050-9M2026-REV
  - 2050-9M2025-REV
- period: FY2025 vs FY2024
  text: Food Processing rose 22.0% (SAR 10,606m to 12,943m), including United Sugar Egypt for the first time; Retail rose 6.6% (SAR 10,620m to 11,323m); Food Services fell 4.1% and Frozen
    Food rose 5.5%. Egypt revenue rose from SR 3.8bn to SR 5.7bn.
  basis: disclosed (segment and regional revenue); split not determinable
  confidence: High for the amounts
