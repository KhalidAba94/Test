  refs:
  - 2050-FY2025-REV
  - 2050-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: 'Reported revenue -13.9%, mostly because FY2023 (as re-presented) excludes Iran and Sudan; on the original FY2023 basis revenue fell 4.4%. Attributable profit rose 21.1%
      to SAR 899m: gross margin rose to 20.9% (17.4%), the share of equity-accounted results (mainly Almarai) rose to SAR 719m (SAR 661m) and an impairment reversal of SAR 130m was booked.
      We calculate an EBITDA margin of 9.8% and a net margin of 3.7%.'
    source: 2050_SAVOLA_GROUP/2024_Annual_filed2025-03-15.pdf p.10-11, p.93; 2050_SAVOLA_GROUP/2023_Annual_filed2024-03-26.pdf p.9
    refs:
    - 2050-FY2023-REV
    - 2050-FY2023-NI_ATTR
    - 2050-FY2023-GP
    - 2050-FY2023-SHARE_JV
  - period: FY2024
    driver: Revenue -4.6% as re-presented (Turkey removed from FY2024 only); Retail rose 2.8%. Attributable profit of SAR 9,974m includes the SAR 11,555m gain on distributing the Almarai
      stake, a SAR 139m loss on remeasuring USCE, impairments of SAR 386m in continuing operations (goodwill SAR 254m) and a SAR 1,383m attributable loss from discontinued operations
      (Iran sale and Sudan abandonment, including recycled translation reserves). The company reports attributable profit from continuing operations of SAR 11,357m. Margins and ROE for
      FY2024 are distorted by the gain.
    source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.11-12, p.77, p.95
    refs:
    - 2050-FY2024-NI_ATTR
    - 2050-FY2024-PBT
    - 2050-FY2024-IMPAIR_CF
    - 2050-FY2024-REV
  - period: FY2025
    driver: Revenue +13.2%, led by Food Processing (+22.0%, with United Sugar Egypt consolidated) and Retail (+6.6%). Without Almarai the share of equity-accounted results fell to SAR
      51.8m (SAR 809m); finance cost fell to SAR 481m (SAR 993m) after borrowings were cut to SAR 1,894m. A net zakat credit of SAR 217m (ZATCA reversal of SAR 247m) lifted attributable
      profit to SAR 874m. Herfy lost SAR 77m. We calculate an EBITDA margin of 8.9% and ROE of 17.3%.
    source: 2050_SAVOLA_GROUP/2025_Annual_filed2026-03-09.pdf p.11-12, p.86-87, p.90
    refs:
    - 2050-FY2025-REV
    - 2050-FY2025-NI_ATTR
    - 2050-FY2025-ZAKAT_TAX
    - 2050-FY2025-SHARE_JV
    - 2050-FY2025-FIN_COST
  - period: 9M2026
    driver: Revenue +3.1%; profit before zakat and tax rose 9.3% (SAR 660m to SAR 721m) as administrative expenses fell SAR 50m, but zakat and tax was a SAR 154m charge against a SAR
      97m credit in 9M 2025 (the ZATCA reversal), so attributable profit fell 22.2% to SAR 530m despite a SAR 43.6m profit from discontinued Sudan. Retail segment profit fell to SAR
      15.5m (SAR 72.2m). We calculate an EBITDA margin of 9.2% (9.1%); operating cash flow rose to SAR 1,469m (SAR 526m).
    source: 2050_SAVOLA_GROUP/2026_Q3_filed2026-11-09.pdf p.6-7, p.10, p.28-29
    refs:
    - 2050-9M2026-REV
    - 2050-9M2026-NI_ATTR
    - 2050-9M2026-PBT
    - 2050-9M2026-ZAKAT_TAX
    - 2050-9M2025-ZAKAT_TAX
    - 2050-9M2026-CFO
