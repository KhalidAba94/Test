developments:
- date: '2022'
  category: financing
  text: Rescheduled its long-term loan twice (grace period extended; non-equal instalments at SAIBOR + 1.6%), a modification loss of
    SR 9.2m, of which SR 5.5m was capitalised.
  source: 6022_ARMAH/2022_Annual_filed2023-11-30.pdf p.24, p.21
- date: '2023'
  category: financing
  text: Raised SR 109.9m from new shares (capital SR 328.6m, share premium SR 68.9m).
  source: 6022_ARMAH/2023_Annual_filed2024-04-02.pdf p.7, p.10
- date: '2025'
  category: event
  text: Subleased land at Al Wadi District for about 21 years (total rentals SR 127.6m), recording a SR 9.5m gain.
  source: 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.26
- date: '2026-08-30'
  category: regulation
  text: Moved from the Nomu parallel market to the Main Market (symbol 6022); the 2026 Q3 interim is its first quarterly report.
  source: 6022_ARMAH/2026_Q3_filed2026-11-02.pdf p.8
what_it_means:
  improved: Revenue grew from SAR 13.2m (FY2022) to SAR 225m (FY2025) and the EBITDA margin from 41.4% (FY2023) to 55.1% (FY2025); operating
    cash flow reached SAR 118m in 9M 2026 (+21.1%).
  weakened: In 9M 2026 revenue growth slowed to 10.6%, attributable profit fell 11.8% and the EBITDA margin fell to 48.8% (56.6%), while
    lease liabilities rose to SAR 268m.
  why: The early growth came from opening and filling new centres; 9M 2025 included a SAR 9.5m sublease gain and 9M 2026 carried SAR
    4.2m of listing costs; excluding both, we calculate EBITDA rose from SAR 82.7m to SAR 92.1m.
  uncertain: The 9M 2025 comparative was neither audited nor reviewed, and no centre or member counts are disclosed, so the growth of
    existing centres is not determinable.
confidence_overall: Medium
data_notes:
- 'Armah was listed on Nomu (symbol 9590) and reported half-yearly until its transfer to the Main Market on 30 Aug 2026. The 2026 Q3
  interim is its first quarterly report: its 9M 2025 comparative is labelled unaudited and unreviewed. No 30 Sep 2025 balance sheet
  is printed; 9M 2025 total assets, borrowings and lease liabilities come only from the 2026 Q3 XBRL file.'
- 'Restatements: FY2022 restated in the FY2023 annual (note 29); FY2023 cost of revenue re-presented in the FY2024 annual (note 31;
  49.5m to 51.6m, no profit effect); FY2024 and 1 Jan 2024 restated in the FY2025 annual (note 32: capitalised loan-modification effects
  and right-of-use depreciation reversed per CMA/SOCPA; FY2024 profit 37.8m to 38.3m; equity -7.2m) and FY2024 CFO re-presented (finance
  income received moved to investing, 95.8m to 92.9m).'
- The FY2025 annual PDF used (filed 7 May 2026) differs from the earlier XBRL file (10 Mar 2026) for FY2024 and FY2025 cost of revenue
  and gross profit; stage A took the PDF figures.
- 'Stage A overrides: D&A for EBITDA includes depreciation of right-of-use assets, which the XBRL omitted (e.g. FY2025 SR 42.8m vs 34.3m);
  capex includes intangibles; advances to suppliers and contractors (a separate investing line) are excluded from capex.'
- Right-of-use depreciation of centres under construction (SR 5.1m in FY2025) is in other expenses, outside cost of revenue. Finance
  income includes sublease interest and deposit income.
- Land is carried at revalued amounts (revaluation surplus SR 117.5m at end-2025); revaluation gains go to OCI, not profit.
