ticker: '6022'
headline: >-
  Armah grew revenue from SAR 13.2m (FY2022) to SAR 225m (FY2025) as its fitness centres filled up, turning a SAR 25.2m loss into a
  SAR 62.0m profit; in 9M 2026, its first quarterly report before moving from Nomu to the Main Market, revenue rose 10.6% to SAR 180m
  but attributable profit fell 11.8% to SAR 39.4m, because 9M 2025 (unaudited and unreviewed) included a SAR 9.5m sublease gain and
  9M 2026 carried SAR 4.2m of listing costs.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Armah is a single entity running fitness centres in Saudi Arabia through branches, with no acquisitions,
    disposals or foreign operations, so organic growth equals reported growth. Growth in FY2023-FY2024 came mainly from the ramp-up
    of new centres, but no centre count or same-centre revenue is disclosed, so like-for-like growth is not determinable.
  perimeter_changes:
  - event: None (single entity; branches in Riyadh and Jeddah)
    date: FY2022-9M2026
    effect: nil
    source: 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.12
  capacity_changes:
  - event: 'Centre build-out: capex SR 118m (FY2022) and SR 128m (FY2023), falling to SR 41.4m (FY2024)'
    date: FY2022-FY2024
    effect: not determinable
    source: 6022_ARMAH/2023_Annual_filed2024-04-02.pdf p.10; 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.10
  - event: 'New leases in 9M 2026: right-of-use assets SR 63.6m added; capex SR 69.6m plus SR 21.7m of advances'
    date: 9M2026
    effect: not determinable
    source: 6022_ARMAH/2026_Q3_filed2026-11-02.pdf p.7
  fx_exposure: 'None: all revenue in Saudi Arabia.'
  price_volume_support: 'Not determinable: revenue is split into subscriptions, personal training and other, but members, centres and
    prices are not disclosed.'
  confidence: Medium (perimeter and FX nil with High confidence; new capacity not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: >-
    Revenue rose SAR 17.2m (+10.6%). Subscriptions rose 9.6% (SAR 140m to SAR 153m) and personal training 17.3% (SAR 18.4m to SAR 21.6m).
    The 9M 2025 comparative is unaudited and unreviewed. Members and prices are not disclosed.
  basis: disclosed (revenue by type); split not determinable
  confidence: Medium (comparative not reviewed)
  source: 6022_ARMAH/2026_Q3_filed2026-11-02.pdf p.11
  refs:
  - 6022-9M2026-REV
  - 6022-9M2025-REV
- period: FY2025 vs FY2024
  text: >-
    Revenue rose SAR 47m (+26.7%). Subscriptions rose 23.9% (SAR 156m to SAR 194m) and personal training 50.9% (SAR 16.6m to SAR 25.1m).
  basis: disclosed (revenue by type)
  confidence: High for the amounts
  source: 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.31
  refs:
  - 6022-FY2025-REV
  - 6022-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: >-
      Revenue rose from SAR 13.2m to SAR 80.1m as new centres opened and filled; gross profit was SAR 28.5m (a loss of SAR 1.9m in FY2022).
      Finance cost rose to SAR 11.8m (SAR 4.3m) with higher borrowings and leases. Attributable profit was SAR 0.8m (loss of SAR 25.2m).
      EBITDA margin 41.4%; net margin 1.0%; ROE 0.2%. A SAR 109.9m share issue funded the build-out.
    source: 6022_ARMAH/2024_Annual_filed2025-03-05.pdf p.8 (P&L); 6022_ARMAH/2023_Annual_filed2024-04-02.pdf p.8, p.10
    refs:
    - 6022-FY2023-REV
    - 6022-FY2023-GP
    - 6022-FY2023-NI_ATTR
    - 6022-FY2023-EBITDA_C
  - period: FY2024
    driver: >-
      Revenue +121.5% to SAR 177m and gross profit to SAR 84.4m (gross margin 47.5%, restated). Finance cost was SAR 22.7m and a SAR
      4.5m gain on loan modification was booked. Attributable profit SAR 38.3m (restated). EBITDA margin 54.5%; net margin 21.6%; ROE
      9.1%.
    source: 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.8, p.41
    refs:
    - 6022-FY2024-REV
    - 6022-FY2024-GP
    - 6022-FY2024-NI_ATTR
    - 6022-FY2024-EBITDA_C
  - period: FY2025
    driver: >-
      Revenue +26.7% to SAR 225m (subscriptions +23.9%, personal training +50.9%) and gross margin 49.3%. Selling and marketing costs
      rose to SAR 13.7m (SAR 7.7m). A SAR 9.5m gain on subleasing land at Al Wadi and finance income of SAR 6.3m lifted attributable
      profit 62.1% to SAR 62.0m. EBITDA margin 55.1%; net margin 27.6%; ROE 12.1%.
    source: 6022_ARMAH/2025_Annual_filed2026-05-07.pdf p.8, p.26, p.31
    refs:
    - 6022-FY2025-REV
    - 6022-FY2025-GP
    - 6022-FY2025-NI_ATTR
    - 6022-FY2025-EBITDA_C
    - 6022-FY2025-FIN_INC
  - period: 9M2026
    driver: >-
      Revenue +10.6% to SAR 180m and gross profit +12.3% (gross margin 48.9% vs 48.1%). Listing fees of SAR 4.2m and no repeat of the
      SAR 9.5m sublease gain cut attributable profit 11.8% to SAR 39.4m, while finance cost fell to SAR 16.1m (SAR 18.8m). EBITDA margin
      48.8% (56.6%); we calculate EBITDA excluding the sublease gain and listing fees at SAR 92.1m (9M 2025: SAR 82.7m). Net margin
      21.9% (27.5%); ROE 9.2% (annualised).
    source: 6022_ARMAH/2026_Q3_filed2026-11-02.pdf p.4 (P&L), p.11 (revenue)
    refs:
    - 6022-9M2026-REV
    - 6022-9M2026-GP
    - 6022-9M2026-NI_ATTR
    - 6022-9M2026-EBITDA_C
    - 6022-9M2025-EBITDA_C
  - period: 9M2026
    driver: >-
      Operating cash flow rose 21.1% to SAR 118m, but capex jumped to SAR 69.6m (SAR 16.8m) and new leases added SAR 63.6m of right-of-use
      assets, so lease liabilities rose to SAR 268m (end-2025: SAR 209m) and net debt / EBITDA to 3.4x (annualised).
    source: 6022_ARMAH/2026_Q3_filed2026-11-02.pdf p.5, p.7
    refs:
    - 6022-9M2026-CFO
    - 6022-9M2026-CAPEX
    - 6022-9M2026-LEASE_LIAB
    - 6022-9M2026-NET_DEBT
