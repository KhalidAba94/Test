headline: >-
  The 13 supporting consumer-goods companies are a second tier added for context; they are not in the SEVEN benchmark. Revenue grew
  2.3% a year from FY2022 to FY2025 (11 companies), or 6.5% a year excluding Savola, whose exits from Iran, Sudan and Turkey shrank
  its reported revenue. Savola's SAR 11,555m gain on distributing its Almarai stake swamps FY2024 profit and EBITDA, so we read the
  group on EBITDA excluding identified one-offs: it grew 5.8% a year, with a margin of 16.0% in FY2022 and 17.4% in FY2025. Capex grew
  29.5% a year, led by Almarai, and free cash flow fell 7.8% a year. In 9M 2026 revenue rose 6.7% and EBITDA excluding one-offs 3.7%,
  but attributable profit fell 8.8% as SADAFCO, Savola and NADEC earned less.
main_changes:
  - change: "Savola shrank and then gave away its Almarai stake, and this drives the reported totals. Its revenue fell 13.9% in FY2023 and 4.6% in FY2024 (taking 6.9 and 2.0 points off group growth) and rose 13.2% in FY2025 (+5.1 points). In FY2024 group attributable profit rose 235.7% to SAR 14.7bn and EBITDA reached SAR 22.8bn, against SAR 11.1bn excluding one-offs."
    driver: "Each Savola filing re-presents the prior year without newly discontinued businesses (Iran and Sudan from FY2023, Turkey from FY2024), so its reported growth mixes perimeters; FY2025 includes United Sugar Company Egypt, consolidated from 31 Dec 2024, whose revenue is not disclosed. The FY2024 gain on the in-kind distribution of the 34.52% Almarai stake to Savola's shareholders was SAR 11,554.7m; it is removed in EBITDA excluding one-offs, together with a SAR 139.0m loss on derecognising the United Sugar Egypt associate. Savola's FY2024 attributable profit was SAR 9,974m, 67.6% of the group's. Excluding Savola, group profit rose 28.0% in FY2024 and fell 8.1% in FY2025."
    evidence: "Company narrative 2050; one-offs register O-2050-03, O-2050-04; sector excluding-the-largest view"
    refs: ["2050-FY2023-REV", "2050-FY2025-REV", "2050-FY2024-NI_ATTR", "2050-FY2024-EBITDA_C", "2050-FY2024-EBITDA_U"]
  - change: "Almarai is the steady core. Its revenue grew 5.6% a year to SAR 22,065m and its attributable profit 11.8% a year to SAR 2,456m, 46.7% of group profit in FY2025. It gave 2.5 points of group revenue growth in FY2024 and 3.3 points in 9M 2026, when its revenue rose 9.7%."
    driver: "All four of its segments grew; the company gives no split into price and volume. Almarai bought Pure Beverages Industry Co. (bottled water) on 31 July 2025 for SAR 1,012m; that business's revenue is not disclosed, so organic growth for FY2025 and 9M 2026 is not determinable. In 9M 2026 Almarai's profit was flat (−0.3%) as its gross margin fell to 30.3% (31.5%)."
    evidence: "Company narrative 2280; sector contributions to REV growth"
    refs: ["2280-FY2025-REV", "2280-FY2025-NI_ATTR", "2280-9M2026-REV", "2280-9M2026-NI_ATTR"]
  - change: "An investment cycle cut free cash flow. Group capex grew 29.5% a year (11 companies) and reached SAR 6,654m in FY2025, 10.3% of revenue against 5.3% in FY2022; free cash flow fell 7.8% a year."
    driver: "Almarai's capex rose from SAR 1,334m (FY2022) to SAR 4,385m (FY2025), 40.2 points of the group's FY2023 capex increase and 29.0 points of FY2024's, and its free cash flow fell from SAR 2,496m to SAR 1,078m; its capex excludes a further SAR 1,042m of FY2025 additions to biological assets. Tanmiah funded SAR 1.1bn of capex over FY2022–FY2025 with borrowings (net debt 5.4x EBITDA at end-2025). Modern Mills (a new feed plant) and Fourth Milling (the Al-Kharj expansion) also spent more. In 9M 2026 group capex fell 10.5% and free cash flow rose 42.1%, mostly at Savola (+44.6 points)."
    evidence: "Sector CAPEX and FCF totals and contributions; company narratives 2280, 2281, 2284, 2286"
    refs: ["2280-FY2022-CAPEX", "2280-FY2025-CAPEX", "2280-FY2025-FCF", "2281-FY2025-NET_DEBT", "2050-9M2026-FCF"]
  - change: "Leverage fell, mostly at Savola. Net debt including leases fell 7.6% a year (12 companies) to SAR 21.2bn at end-2025, and net debt to EBITDA from 2.9x to 1.9x. It fell 11.2% in FY2023 and 24.7% in FY2024, then rose 20.4% in FY2025 with Almarai's spending."
    driver: "Savola's net debt fell from SAR 10,215m to SAR 4,214m in FY2024 (25.7 points of the group's fall), and its borrowings from SAR 8,644m (end-2023) to SAR 1,894m (end-2025). NADEC's SAR 2bn rights issue in Q4 2023 turned its net debt into net cash (9.2 points of the FY2023 fall). Arabian Mills cut the loans inherited in its 2022 merger from SAR 1,748m to SAR 630m (30 Sep 2026). Almarai's borrowings rose to SAR 14,018m by 30 Sep 2026, and it gave 13.5 points of the FY2025 rise."
    evidence: "Sector NET_DEBT totals and contributions; company narratives 2050, 6010, 2285, 2280"
    refs: ["2050-FY2023-DEBT", "2050-FY2025-DEBT", "6010-FY2023-NET_DEBT", "2285-FY2022-DEBT", "2285-9M2026-DEBT", "2280-9M2026-DEBT"]
  - change: "The four flour mills are the most profitable part of the group: FY2025 EBITDA margins from 30.6% (Modern Mills) to 40.6% (Fourth Milling), and together 17.9% of FY2025 group profit (we calculate)."
    driver: "The General Food Security Authority (GFSA) sets the selling price of flour in large bags (45kg and above, as First Milling, Modern Mills and Arabian Mills disclose) and sells the mills subsidised wheat at SAR 180 per tonne, unchanged since 2017; other products are priced freely. No mill discloses volumes, prices or capacity, so price and volume effects are not determinable. In 9M 2026 First Milling's revenue rose 21.3%, led by feed after two feed acquisitions in late 2025; Modern Mills rose 17.2%, Fourth Milling 12.6% and Arabian Mills 4.2%."
    evidence: "Mill evidence files 2283-2286 (GFSA wheat price and regulated flour prices); company narratives 2283, 2284, 2285, 2286"
    refs: ["2283-FY2025-EBITDA_C", "2284-FY2025-EBITDA_C", "2285-FY2025-EBITDA_C", "2286-FY2025-EBITDA_C", "2283-9M2026-REV"]
  - change: "Several smaller producers lost money or lost one-off support. Group attributable profit fell 64.4% in FY2025 (8.1% excluding Savola) and 8.8% in 9M 2026."
    driver: "NADEC's FY2024 profit held a SAR 356.5m gain on Arabian Mills, so its profit fell 49.2% in FY2025, and it fell 42.7% in 9M 2026 as the gross margin dropped to 28.6% (34.7%). Entaj lost SAR 123m in FY2025 and SAR 57.5m in 9M 2026 as its gross margin fell and finance costs rose; Tanmiah lost SAR 18.8m in FY2025 (restaurant losses SAR 55.7m, finance costs SAR 108m). SADAFCO's 9M 2026 profit fell 44.7% (−4.4 points of group growth) as Polish sales fell 43.6% and 9M 2025 had held a SAR 107.4m property gain. Halwani Bros went the other way, from a SAR 98.0m loss in FY2023 to a SAR 42.6m profit in FY2025."
    evidence: "Company narratives 6010, 2287, 2281, 2270, 6001; one-offs register O-6010-01, O-2270-02"
    refs: ["6010-FY2024-NI_ATTR", "6010-FY2025-NI_ATTR", "2287-FY2025-NI_ATTR", "2281-FY2025-NI_ATTR", "2270-9M2026-NI_ATTR", "6001-FY2023-NI_ATTR"]
takeaways:
  improved: "Underlying earnings and balance sheets. EBITDA excluding identified one-offs grew 5.8% a year from FY2022 to FY2025 and 3.6% in 9M 2026; excluding Savola, revenue grew 6.5% a year and profit 9.3% a year. Net debt to EBITDA fell from 2.9x to 1.9x as Savola, NADEC, Arabian Mills and First Milling reduced debt."
  weakened: "Cash generation and recent margins. Capex rose to 10.3% of revenue in FY2025 and free cash flow fell 7.8% a year. The EBITDA margin excluding one-offs slipped from 18.6% (FY2024) to 17.4% (FY2025) and was 17.3% in 9M 2026 (17.8%). Entaj and Tanmiah made losses in FY2025."
  why: "Almarai's investment programme and debt-funded expansion at Tanmiah and Entaj raised capex and finance costs; Savola's exits removed revenue and debt; and the gains that lifted earlier periods (Savola and NADEC in FY2024, SADAFCO's property sale in 2025) did not recur."
  concentration: "Savola is the largest company by FY2025 revenue (40.3%) and Almarai the largest by profit (46.7% of FY2025 group profit; 50.6% in 9M 2026). Together they are 74.4% of revenue (we calculate; revenue HHI about 2,900, highly concentrated). Excluding Savola the group looks different: revenue grew 6.5% a year rather than 2.3%, profit 9.3% a year, and the EBITDA margin excluding one-offs was 23.1% in FY2025 (17.4% with Savola), because Savola's retail and food businesses earn lower margins (its EBITDA margin excluding one-offs was 8.9% in FY2025)."
  ytd_2026: "9M 2026 vs 9M 2025: revenue +6.7% (Almarai 3.3 points), EBITDA +1.7% (+3.6% excluding identified one-offs), attributable profit −8.8% (SAR 4,301m to SAR 3,921m), capex −10.5% and free cash flow +42.1%. The EBITDA margin excluding one-offs was 17.3% (17.8%). 9M 2025 had held SADAFCO's SAR 107.4m property gain, Almarai's SAR 43.6m associate gain and, below EBITDA, Savola's SAR 247m zakat reversal."
  uncertain: "Organic growth is not determinable for the largest companies: Almarai (Pure Beverages), Savola (United Sugar Egypt and changing discontinued operations) and First Milling (feed acquisitions) do not disclose all acquired revenue. No company gives volumes, so price and volume cannot be split, and the effect of the Egyptian pound on Almarai, Savola and Halwani Bros is not measurable. SADAFCO's FY2022 exists only as an XBRL file and cannot be checked against a filed PDF, so it is left out of the group totals."
data_notes:
  - "Left out of totals: SADAFCO's FY2023 flows (revenue, profit, EBITDA, cash flow), because FY2023 is a nine-month period (April–December 2023) after its year-end moved from 31 March. Its 31 Dec 2023 balance sheet stays in. So FY2023 flow totals cover 12 companies, flow growth 11 (FY2023/FY2022) and 12 (FY2024/FY2023), and SADAFCO's own growth across FY2023 is n.m.; FY2023 balance-sheet totals cover all 13. Its FY2022 flows (April 2022–March 2023, twelve months) are also left out of the totals: they come from XBRL only (the archive has no PDF for that year), so they cannot be checked, and the year ends three months after the other companies' FY2022. Its 31 March 2023 balance sheet stays in the FY2022 balance-sheet totals. SADAFCO has no borrowings in any period, so its net debt is net cash throughout."
  - "Entaj has no figures before FY2023 (first period available; listed in March 2025). FY2022 flow totals therefore cover 11 companies (Entaj and SADAFCO out) and FY2022 balance-sheet totals 12 (Entaj out); the 2022–2025 CAGRs cover 11 for flows (SADAFCO and Entaj out) and 12 for balance-sheet items (Entaj out). From FY2024 all 13 companies are in every total, including both 9M periods."
  - "One-offs: FY2024 EBITDA excluding one-offs removes Savola's SAR 11,554.7m Almarai distribution gain and SAR 139.0m United Sugar Egypt derecognition loss, and NADEC's SAR 356.5m Arabian Mills gain. Reported FY2024 group ratios are distorted: EBITDA margin 38.2% (18.6% excluding one-offs), net margin 24.7%, ROE 41.5% and net debt to EBITDA 0.8x (1.6x on EBITDA excluding one-offs, we calculate). The group totals include no profit figure excluding one-offs, so profit is read on the excluding-Savola view, which still includes NADEC's FY2024 gain. Savola's FY2025 profit also includes a SAR 247.3m zakat reversal, below EBITDA."
  - "Savola's perimeter changes between years: FY2022 includes Iran, Sudan and Turkey; FY2023 (as re-presented) excludes Iran and Sudan; FY2024 excludes Turkey. The prior-year revenue removed is not disclosed, so Savola's organic growth, and the group's, is not determinable for FY2023–FY2025."
  - "Flour mills: GFSA regulates the selling price of flour in large bags and supplies subsidised wheat at SAR 180 per tonne (unchanged since 2017); Fourth Milling's filings do not carry the regulated-price note. No mill discloses volumes or capacity. Revenue presentation changed at Modern Mills (freight, +1.6 points of FY2024 growth) and Fourth Milling (rebates, −1.3 points in FY2023; transport costs, −2.1 points in FY2024). Operating cash flow is after interest paid at First Milling and Modern Mills but before it at Arabian Mills and Fourth Milling."
  - "Capex excludes additions to biological assets (dairy herds, poultry flocks, breeder hens), e.g. Almarai SAR 1,042m in FY2025. NADEC's FY2022–FY2023 capex includes them and later years do not, so its capex and free cash flow are not comparable across FY2023/FY2024."
  - "Net debt deducts short-term bank deposits held outside cash (term, murabaha and time deposits): Almarai SAR 1,926m at end-2023; NADEC SAR 500m, SAR 300m and SAR 650m at end-2023 to end-2025; Savola SAR 623m, SAR 738m, SAR 547m and SAR 53.5m at end-2022 to end-2025; SADAFCO SAR 674m, SAR 223m and SAR 141m at end-2023 to end-2025; Fourth Milling SAR 74.1m and SAR 156.2m at end-2024 and end-2025. Group net debt was SAR 23.4bn at end-2023, SAR 17.6bn at end-2024 and SAR 21.2bn at end-2025."
  - "Cross-holdings (group totals are simple sums, so some profit and revenue is counted twice): Savola equity-accounted 34.52% of Almarai until 12 Dec 2024, and its share of Almarai's profit, SAR 607.5m (FY2022), SAR 707.4m (FY2023) and about SAR 771m (FY2024, to 12 Dec 2024), is also in Almarai's profit: about 15.9%, 16.7% and 5.2% of group attributable profit (FY2024 group profit includes Savola's distribution gain). That FY2024 gain of SAR 11,554.7m is a gain on Savola's stake in another group member. NADEC equity-accounted Arabian Mills until its October 2024 IPO (share of results SAR 3.3m, SAR 21.7m and SAR 24.0m in FY2022–FY2024), and its FY2024 gain of SAR 356.5m is a gain on that stake."
  - "Savola consolidates Herfy (49%), so Herfy's revenue (SAR 1,213.4m, SAR 1,148.0m, SAR 1,101.8m and SAR 1,056.7m in FY2022–FY2025) is also in the FnB group. Savola's Panda supermarkets (unlisted) add SAR 10.1bn to SAR 11.3bn of grocery-retail revenue a year to this group, not to the Retailers group."
  - "Group growth is reported growth. Acquired revenue is disclosed only in small cases (First Milling's Al-Kenan Arabia SAR 2.36m in FY2025; NADEC's AlRaie SAR 9.6m in 9M 2026), not for Almarai's Pure Beverages (from 31 July 2025) or Savola's United Sugar Egypt."
