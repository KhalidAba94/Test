what_it_means:
  improved: Revenue grew 6.6% a year from FY2022 to FY2025 and 9.7% in 9M 2026, and attributable profit rose 7.7% in FY2025 and 16.7% in 9M 2026, with an ROE of 59.8% in FY2025.
  weakened: Showroom revenue has fallen in both FY2024 (-2.4%, gross basis) and FY2025 (-5.8%) and the gross margin is lower than in FY2022 (12.5% against 13.7%).
  why: Sales moved to the website and app (e-commerce from SAR 1,192m in FY2022 to SAR 3,665m in FY2025) and to smartphones and electronics, which carry lower margins, while showroom numbers grew slowly;
    high payouts (SAR 1,032m in FY2025) keep equity near SAR 1.8bn.
  uncertain: Same-showroom sales and the revenue of new showrooms are not disclosed, and FY2022-FY2023 revenue is on the old gross basis, so long-run growth is slightly overstated against FY2024-FY2025.
confidence_overall: High
data_notes:
- 'Revenue basis break: FY2024 (FY2025 annual note 38) and 9M 2025 (2026 Q3 interim note 16) are re-presented on a net (agent) basis, by -SAR 211.7m and -SAR 183.2m; FY2022 and FY2023 remain gross. Gross
  profit is unchanged by the change, so gross margins are slightly higher on the net basis.'
- 'Stage A correction: the impairment add-back (IMPAIR_CF) now holds only reversals of impairment on investment property (FY2022 -SAR 2.6m, FY2023 -SAR 0.4m); the trade-receivable credit losses our data
  had included are excluded.'
- Investment-property spend is kept out of capex and deducted in free cash flow (IP_CAPEX SAR 6.1m FY2022, SAR 4.0m FY2023, SAR 0.4m FY2024, nil FY2025, SAR 0.4m 9M 2026).
- Other income, net includes rental income from investment properties and subleases and administrative fees from financing companies; it is inside our operating income.
- Operating cash flow is after finance costs paid and zakat paid.
- 'All attributable to shareholders: no non-controlling interests. The FY2023 annual was audited by PwC and later years by EY.'
- Primary statements are scanned images with old-style numerals; OCR readings were checked visually where they differed from XBRL.
