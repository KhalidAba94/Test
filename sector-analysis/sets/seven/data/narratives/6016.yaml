what_it_means:
  improved: "Revenue rose 13.5% a year from FY2022 to FY2025 and 27.5% in 9M 2026, and the gross margin widened from 27.3% (FY2022) to 32.3% (FY2025) and 33.4% (9M 2026); EBITDA rose 73.7% in 9M 2026."
  weakened: "Operating costs grew faster than revenue in FY2024 (administrative expenses +26.9%), cutting attributable profit 33.4%; net debt doubled to SAR 56.9m in FY2025 as lease liabilities rose to SAR 54.0m with SHOVEL."
  why: "SHOVEL provided SAR 55.7m of the SAR 71.5m rise in 9M 2026 revenue and the burger business grew 6.1%; the company reports SHOVEL's 9M 2026 net profit (SAR 9.5m) above the burger segment's (SAR 8.8m), with 40% of SHOVEL owned by minority shareholders."
  uncertain: "No restaurant count or same-store sales are disclosed, so growth from new burger restaurants cannot be separated; SHOVEL's purchase price allocation is provisional and its post-acquisition FY2025 revenue differs between filings (SAR 7.1m vs SAR 8.3m)."
confidence_overall: "Medium"
data_notes:
  - "No XBRL file: every figure was read from the PDFs and entered as an override. All primary statements used are scanned images, read by OCR and checked against the printed subtotals."
  - "Listed on Nomu from 8 Sep 2021; moved to the Main Market after approval on 13 Oct 2024. FY2021-FY2024 figures come from audited Nomu-period statements, which are stand-alone; FY2025 onward is consolidated."
  - "Restatement (FY2025 annual note 30, correction of an error: employee Iqama fees expensed rather than deferred): FY2024 cost of revenue +SAR 0.26m, so FY2024 GP, PBT, net and attributable profit (SAR 8.2m vs SAR 8.4m first reported), total assets (SAR 149m vs SAR 151m) and equity (SAR 70.3m vs SAR 72.1m) carry R; the 1 Jan 2024 balance sheet (our FY2023: total assets SAR 144m, equity SAR 67.3m) is restated by -SAR 1.5m. FY2023 profit was not restated, so FY2023 and FY2024 profit are on different bases."
  - "9M 2025 cost of revenue, GP, PBT and profit are restated (9M 2026 interim note 14, described there as a change in accounting policy; profit SAR 6.5m vs SAR 6.9m first reported). The 30 Sep 2025 balance sheet was not re-presented, so 9M 2025 total assets and equity are about SAR 2.2m higher than on the restated basis."
  - "CFO basis differs: the FY2025 annual shows finance cost paid inside operating activities (FY2025 SAR 1.4m; FY2024 restated SAR 1.1m, CFO SAR 34.9m vs SAR 36.0m first reported); FY2022-FY2023 and both 9M periods keep it in financing (9M 2026 SAR 2.3m; 9M 2025 SAR 1.0m)."
  - "Capex = purchases of property and equipment + additions to assets under construction + intangibles; the SHOVEL acquisition (SAR 10.3m) is excluded. D&A excludes transfers from assets under construction to cost of revenue (FY2025 SAR 1.4m)."
  - "No finance-income line and no associates; operating income = PBT + finance cost. The dataset shows attributable-profit growth as n.m. for FY2023, FY2025 and 9M 2026 because the prior value is below SAR 10m; absolute changes are quoted instead."
  - "SHOVEL's post-acquisition FY2025 revenue is SAR 7.1m in the audited FY2025 annual (used here) but SAR 8.3m in the 9M 2026 interim note 7."
