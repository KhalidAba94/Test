ticker: "6017"
headline: >-
  Revenue grew 13.2% a year from SAR 1,602m (FY2022) to SAR 2,324m (FY2025) and attributable profit peaked at SAR 188m in FY2024
  before falling 61.2% to SAR 73.0m in FY2025; in 9M 2026 revenue rose 37.5% to SAR 2,237m, mostly from the Snoonu acquisition in
  Qatar, while delivery revenue inside Saudi Arabia fell 10.0% and the company made an attributable loss of SAR 28.5m.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue, which is net of customer promotions and cash back (FY2025: SAR 198m deducted). Perimeter =
    revenue of acquired businesses for the months not owned in the prior period: Marn (2 January 2023, SAR 1.1m disclosed for FY2023)
    and Snoonu (76.56% from 6 October 2025, SAR 228m disclosed for FY2025; 9M 2026 not disclosed). SOL Company for Trading,
    consolidated from 26 December 2023, has no disclosed revenue, so FY2024 organic growth is not determinable. The February 2024
    buy-out of the remaining 40% of Joint Preparation Company for Meals is not a perimeter change: it was already a consolidated 60%
    subsidiary. There is no FX translation effect (no translation reserve; Gulf currencies pegged). Jahez reports no orders, users or
    same-store measures, so like-for-like growth is not determinable in any period.
  perimeter_changes:
    - {event: "Marn Business Information Technology Company (100%, SAR 60m)", date: "2023-01-02", effect: "SAR 1.1m revenue from the acquisition date in FY2023, disclosed", source: "6017_JAHEZ/2023_Annual_filed2024-03-27.pdf p.55"}
    - {event: "SOL Company for Trading (35%, controlled, SAR 5m)", date: "2023-12-26", effect: "revenue not disclosed; FY2024 perimeter not determinable", source: "6017_JAHEZ/2023_Annual_filed2024-03-27.pdf p.55"}
    - {event: "Joint Preparation Company for Meals: remaining 40% bought for SAR 4.8m (equity transaction)", date: "2024-02-04", effect: "none on revenue (consolidated before and after)", source: "6017_JAHEZ/2024_Annual_filed2025-03-17.pdf p.58; 6017_JAHEZ/2023_Annual_filed2024-03-27.pdf p.13"}
    - {event: "Snoonu Corporation Holding LLC (76.56%; Qatar and Oman delivery platform): cash SAR 802m plus treasury shares worth SAR 34.6m and a SAR 75m capital injection", date: "2025-10-06", effect: "SAR 228m revenue in FY2025, disclosed; 9M 2026 not disclosed", source: "6017_JAHEZ/2025_Annual_filed2026-04-07.pdf p.62-63"}
  capacity_changes:
    - {event: "Delivery outside the Kingdom (Bahrain, Kuwait) grew from SAR 48.5m (FY2023) to SAR 212m (FY2024)", date: "2023-2024", effect: "revenue of new markets not disclosed", source: "6017_JAHEZ/2024_Annual_filed2025-03-17.pdf p.50-51"}
    - {event: "Logi Kuwait Company for Consumer Orders Delivery started operating", date: "2026 Q1", effect: "not determinable", source: "6017_JAHEZ/2026_Q3_filed2026-11-17.pdf p.9"}
  fx_exposure: "Operations outside Saudi Arabia are in Bahrain, Kuwait and, from October 2025, Qatar and Oman. Equity has no translation reserve and other comprehensive income shows no translation differences, so no FX effect is identified."
  price_volume_support: "Not determinable: the filings give segment revenue but no orders, basket size, commission rates or active users."
  confidence: "High for the disclosed perimeter amounts (FY2023, FY2025); not determinable for FY2024 and 9M 2026 and for like-for-like growth"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Delivery revenue inside the Kingdom fell 8.6% (SAR 1,928m to SAR 1,761m) while customer promotions and cash back rose to
      SAR 198m (SAR 168m). Delivery revenue outside the Kingdom rose from SAR 212m to SAR 462m, of which Snoonu SAR 228m from
      6 October; excluding Snoonu it rose to SAR 235m (we calculate). Logistics revenue rose 1.4%. Orders and prices are not disclosed.
    basis: "disclosed (segment revenue); price/volume split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "6017_JAHEZ/2025_Annual_filed2026-04-07.pdf p.53, p.63"
    refs: ["6017-FY2025-REV", "6017-FY2024-REV"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Delivery revenue inside the Kingdom fell 10.0% (SAR 1,370m to SAR 1,232m). Delivery revenue outside the Kingdom rose from
      SAR 183m to SAR 946m with Snoonu, whose own revenue is not disclosed. Cost of goods sold rose to SAR 206m from SAR 47.1m,
      which suggests a larger share of goods sales (Snoonu sells groceries and other goods); orders and prices are not disclosed.
    basis: "disclosed (segment revenue, cost of revenue note); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "6017_JAHEZ/2026_Q3_filed2026-11-17.pdf p.31, p.35-36"
    refs: ["6017-9M2026-REV", "6017-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue +11.4% to SAR 1,785m (organic 11.3%, we calculate) and attributable profit +112.5% to SAR 125m: G&A fell from SAR 136m to SAR 106m, interest on deposits rose to SAR 46.1m (SAR 22.2m) and operating income rose 59.9% to SAR 105m. EBITDA rose 76.0% to SAR 157m (EBITDA margin 8.8%); net margin 7.0% (3.7%); ROE 11.6%. The outside-Kingdom delivery segment lost SAR 97.2m.", source: "6017_JAHEZ/2023_Annual_filed2024-03-27.pdf p.8; 6017_JAHEZ/2024_Annual_filed2025-03-17.pdf p.51", refs: ["6017-FY2023-REV", "6017-FY2023-NI_ATTR", "6017-FY2023-OPINC", "6017-FY2023-EBITDA_C"]}
    - {period: "FY2024", driver: "Revenue +24.3% to SAR 2,219m: delivery inside the Kingdom +12.3% and outside the Kingdom up from SAR 48.5m to SAR 212m. Gross margin 24.4% (22.7%); operating income +54.7% to SAR 163m (operating margin 7.3%); attributable profit +50.0% to SAR 188m (net margin 8.5%, ROE 15.7%). Capex rose to SAR 195m, mostly property and equipment (SAR 175m).", source: "6017_JAHEZ/2025_Annual_filed2026-04-07.pdf p.9, p.11; 6017_JAHEZ/2024_Annual_filed2025-03-17.pdf p.50", refs: ["6017-FY2024-REV", "6017-FY2024-OPINC", "6017-FY2024-NI_ATTR", "6017-FY2024-CAPEX"]}
    - {period: "FY2025", driver: "Revenue +4.7% to SAR 2,324m, but -5.5% excluding Snoonu's SAR 228m (we calculate). Marketing and advertising rose 34.8% to SAR 228m and G&A 16.7% to SAR 159m; a SAR 11.8m goodwill impairment (Marn) and SAR 11.3m of fair-value losses were charged. Operating income fell 76.6% to SAR 38.1m (operating margin 1.6%); EBITDA fell 35.5% to SAR 139m (EBITDA margin 6.0%); attributable profit fell 61.2% to SAR 73.0m (net margin 3.1%, ROE 5.7%). Operating cash flow fell 50.8% to SAR 99.8m, and the Snoonu payment cut cash from SAR 1,054m to SAR 428m.", source: "6017_JAHEZ/2025_Annual_filed2026-04-07.pdf p.8-9, p.11, p.36, p.52, p.63", refs: ["6017-FY2025-REV", "6017-FY2025-OPINC", "6017-FY2025-EBITDA_C", "6017-FY2025-NI_ATTR", "6017-FY2025-CFO", "6017-FY2025-CASH", "6017-FY2025-IMPAIR_CF"]}
    - {period: "9M2026", driver: "Revenue +37.5% to SAR 2,237m with Snoonu, but the gross margin fell to 20.1% (23.2%). Depreciation and amortisation rose to SAR 140m (SAR 49.8m), including SAR 10.4m amortisation of the acquired brand; marketing rose 68.4% and G&A 69.6%. We calculate an operating loss of SAR 44.3m (operating margin -2.0%); EBITDA fell 32.7% to SAR 95.8m (EBITDA margin 4.3%). Finance costs rose to SAR 17.3m (SAR 4.7m) and finance income fell to SAR 2.4m (SAR 30.3m). The attributable loss was SAR 28.5m (net margin -1.3%); minority shareholders bore SAR 27.2m of losses. Operating cash flow rose 61.4% to SAR 87.5m; capex SAR 124m; net debt SAR 208m (net debt / EBITDA 1.6x annualised).", source: "6017_JAHEZ/2026_Q3_filed2026-11-17.pdf p.3-4, p.6, p.31-32", refs: ["6017-9M2026-REV", "6017-9M2026-GP", "6017-9M2026-DA_CF", "6017-9M2026-OPINC", "6017-9M2026-EBITDA_C", "6017-9M2026-NI_ATTR", "6017-9M2026-NI_NCI", "6017-9M2026-CFO", "6017-9M2026-NET_DEBT"]}
