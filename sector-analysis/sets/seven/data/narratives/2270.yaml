ticker: '2270'
headline: SADAFCO moved its year-end from March to December, so FY2023 covers only nine months; across the two full calendar years revenue rose 5.0% to SAR 2,999m in FY2025 while attributable
  profit slipped 1.3% to SAR 477m despite a SAR 107m property-sale gain, and in 9M 2026 revenue fell 6.6% and attributable profit 44.7% as Polish sales dropped and margins narrowed.
lfl_basis:
  definition_used: Standard bridge on IFRS revenue from continuing operations. FY2023 is a nine-month period (April-December 2023), so FY2023/FY2022 and FY2024/FY2023 growth is n.m.
    and only FY2025 vs FY2024 and 9M 2026 vs 9M 2025 are bridged. The FY2025 annual and the 2026 Q3 interim re-present the prior period without the Jordan, Kuwait and Bahrain subsidiaries, so
    those comparisons share a perimeter except for SADAFCO Qatar (deconsolidated in November 2024, revenue not disclosed). Poland (zloty) is the main currency exposure and is not given
    in constant currency. No volumes or like-for-like sales are disclosed.
  perimeter_changes:
  - event: Remaining 24% of the Mlekoma group (Poland) bought from minority holders
    date: 2023 (Apr-Dec)
    effect: NCI only; no revenue effect
    source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.32
  - event: SADAFCO Qatar liquidated and deconsolidated
    date: '2024-11-17'
    effect: revenue to that date not disclosed (at most SAR 61.0m)
    source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.32
  - event: Jordan, Kuwait and Bahrain subsidiaries to be liquidated; discontinued
    date: '2025-12-25'
    effect: removed from FY2024 (SAR 105.2m revenue) and 9M 2025 as re-presented; no effect on the bridged comparisons
    source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.49
  capacity_changes:
  - event: Capex SAR 207m (FY2024), SAR 128m (FY2025), SAR 181m (9M 2026)
    date: 2024 to 2026
    effect: revenue from new capacity not disclosed
    source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.11; 2270_SADAFCO/2026_Q3_filed2026-11-09.pdf p.8
  fx_exposure: Saudi Arabia was 77.2% of FY2025 revenue, Poland 15.4%, other GCC 3.0% and others 4.3%. Poland revenue is in zloty; no constant-currency figures.
  price_volume_support: 'Not determinable: no volumes or prices are disclosed; revenue is split into drinks and non-drinks and by country only.'
  confidence: Low (short year; perimeter not determinable for FY2025 vs FY2024; FX and capacity not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Drinks revenue fell 3.1% (SAR 1,215m to 1,178m) and non-drinks 10.4% (SAR 1,103m to 988m). By country, Saudi Arabia fell 0.5% and Poland 43.6% (SAR 373m to 210m); the company
    attributes the fall mainly to lower international sales. Volumes and prices are not disclosed.
  basis: disclosed (segment and country revenue); split not determinable
  confidence: High for the amounts
  source: 2270_SADAFCO/2026_Q3_filed2026-11-09.pdf p.14-15
  refs:
  - 2270-9M2026-REV
  - 2270-9M2025-REV
- period: FY2025 vs FY2024
  text: Drinks revenue rose 3.6% (SAR 1,559m to 1,614m) and non-drinks 6.6% (SAR 1,299m to 1,385m). Saudi revenue fell 0.5% while Poland rose 29.8% (SAR 356m to 462m). Volumes and prices
    are not disclosed.
  basis: disclosed (segment and country revenue); split not determinable
  confidence: High for the amounts
  source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.52-53
  refs:
  - 2270-FY2025-REV
  - 2270-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: 'Nine months only (April-December 2023): revenue SAR 2,111m and attributable profit SAR 328m, not comparable with FY2022 (April 2022-March 2023). Gross margin was 35.6%;
      other expenses of SAR 15.9m were goodwill and disposal-group impairments on the Polish Mlekoma business, whose minority stake was bought out. ROE, annualised on the nine months, was 24.6%.'
    source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.8, p.11, p.32
    refs:
    - 2270-FY2023-REV
    - 2270-FY2023-NI_ATTR
    - 2270-FY2023-GP
    - 2270-FY2023-IMPAIR_CF
  - period: FY2024
    driver: 'First full calendar year: revenue SAR 2,858m (as re-presented without Jordan, Kuwait and Bahrain), gross margin 36.5% and attributable profit SAR 484m. We calculate an EBITDA
      margin of 20.7% and a net margin of 16.9%. Capex rose to SAR 207m.'
    source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.8, p.11
    refs:
    - 2270-FY2024-REV
    - 2270-FY2024-NI_ATTR
    - 2270-FY2024-GP
    - 2270-FY2024-CAPEX
  - period: FY2025
    driver: Revenue +5.0% but gross margin fell to 31.1% (36.5%) and gross profit 10.3%. A SAR 107.4m gain on selling a former warehouse (other operating income) kept our operating income
      +1.2%; a SAR 16.4m PP&E impairment and lower finance income (SAR 34.0m vs 49.7m) followed, and attributable profit was -1.3%. We calculate an EBITDA margin of 20.6% (including
      the gain) and ROE of 26.9%.
    source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.8, p.11, p.48
    refs:
    - 2270-FY2025-REV
    - 2270-FY2025-GP
    - 2270-FY2025-OPINC
    - 2270-FY2025-NI_ATTR
    - 2270-FY2025-IMPAIR_CF
  - period: 9M2026
    driver: Revenue -6.6% and gross margin 31.0% (33.2%); 9M 2025 also held the SAR 107.4m property gain. Our operating income fell 44.2% and attributable profit 44.7% to SAR 237m. We
      calculate an EBITDA margin of 15.5% (22.1%) and a net margin of 10.9% (18.5%). Capex rose to SAR 181m (SAR 117m).
    source: 2270_SADAFCO/2026_Q3_filed2026-11-09.pdf p.5, p.8, p.14
    refs:
    - 2270-9M2026-REV
    - 2270-9M2026-GP
    - 2270-9M2026-OPINC
    - 2270-9M2026-NI_ATTR
    - 2270-9M2026-CAPEX
  one_offs:
  - item: Loss on loss of control of SADAFCO Qatar
    period: FY2024
    amount_sar_m: -1.9
    line: not named (cash-flow add-back)
    source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.11
    tax_nci: 'Under 5% of attributable profit (0.4%), listed because the disposal of a business is outside normal operations; tax effect not disclosed: profit kept as reported'
  - item: Gain on sale of a former warehouse property (asset held for sale)
    period: 9M2025
    amount_sar_m: 107.4
