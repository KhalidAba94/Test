  source: 2270_SADAFCO/2025_Annual_filed2026-02-17.pdf p.49
- date: '2026'
  category: operations
  text: The company reports lower international sales in 9M 2026 and supply measures (supplier diversification, more inventory, alternative routes) for regional events.
  source: 2270_SADAFCO/2026_Q3_filed2026-11-09.pdf p.15
what_it_means:
  improved: Over the two comparable calendar years revenue rose 5.0% and ROE was 26.9% in FY2025; the company has no borrowings, only lease liabilities, and held net cash of SAR 534m at end-2025.
  weakened: Gross margin fell from 36.5% (FY2024) to 31.0% (9M 2026) and 9M 2026 attributable profit fell 44.7%; Poland revenue dropped 43.6% in 9M 2026.
  why: FY2025 profit held only because of a SAR 107.4m property-sale gain while gross profit fell 10.3%; in 9M 2026 lower international sales and the absence of that gain cut profit.
  uncertain: FY2022 and the March 2022 balance sheet cannot be checked against filed PDFs, and the split of the Polish decline into volume, price and currency is not disclosed.
confidence_overall: Medium
data_notes:
- 'Year-end change: FY2022 = April 2022-March 2023; FY2023 = nine months April-December 2023 (emphasis of matter in the FY2024 audit report); FY2024 onward are calendar years. Growth
  across FY2023 is n.m. FY2021 opening balances = 31 March 2022. FY2022 is left out of the Supporting group totals.'
- 'FY2022 figures and the FY2021 balance sheet are from XBRL only: the archive has no PDF of the FY Mar-2023 or Apr-Dec 2023 annual reports, so they could not be checked. In every PDF-checked
  period the XBRL D&A omitted right-of-use depreciation and the XBRL cash line was not balance-sheet cash, so FY2022 D&A, EBITDA and cash are probably understated.'
- 'The FY2021 "R" flags (TA, TE, EQ_ATTR, CASH, LEASE_LIAB) are not restatements: the first value came from the 31 December 2021 column of a quarterly XBRL file (see the Restatements sheet).'
- FY2023 ROE (24.6%) is annualised on the period's true length (nine months of profit × 12/9, over average equity). The 2022–25 CAGRs are n.m. because the span includes the short FY2023.
- 'Corrected from the PDF statements (FY2025 annual p.7 and p.11; same lines in the other filings): cash is balance-sheet cash and cash equivalents (FY2024 SAR 467.8m against SAR 66.5m in the XBRL;
  FY2025 SAR 464.2m against SAR 47.7m); D&A includes right-of-use depreciation; the impairment add-back holds only non-financial impairments (FY2023 goodwill SAR 15.9m, FY2025 PP&E SAR 16.4m),
  not receivable credit losses.'
- FY2024 and 9M 2025 income statements were re-presented for the discontinued Jordan, Kuwait and Bahrain subsidiaries (FY2024 revenue SAR 2,962.9m to 2,857.7m); FY2023 CFO was re-presented
  (finance costs paid moved to financing).
- 'No borrowings in any period: debt is recorded as nil from FY2021 to 9M 2026 (from the balance sheets; FY2021 and FY2022 from the XBRL comparative columns of the next filings, as no PDF exists).
  Net debt is lease liabilities less cash and short-term Murabaha deposits, and is negative (net cash) in every period. The deposits were SAR 674m at end-2023 (FY2024 annual note 13, p.41), SAR 223m
  at end-2024 and SAR 141m at end-2025 (FY2025 annual note 13, p.42) and SAR 337m at 30 Sep 2025 (2025 Q3 interim note 11, p.18), so net cash was SAR 959m, SAR 637m, SAR 534m and SAR 697m.'
- FY2024 annual primary statements are scanned images (read visually and checked at high resolution).
- 'Not treated as one-offs under the one-off rule (impairments, already outside EBITDA): the FY2023 goodwill and disposal-group impairment on Mlekoma (SAR 15.9m; FY2024 annual p.8, p.11) and the
  FY2025 PP&E impairment (SAR 16.4m; FY2025 annual p.11, p.52).'
