    tax_nci: '22.5% of attributable profit; zakat effect not disclosed (no minority interests): not determinable, profit kept as reported'
developments:
- date: '2023-08-22'
  category: regulation
  text: Shareholders approved moving the year-end from 31 March to 31 December; FY2023 covers nine months.
  source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.12
- date: 2023 (Apr-Dec)
  category: M&A
  text: Bought the remaining 24% of the Mlekoma group (Poland) for SAR 89.0m; ownership 100%.
  source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.32, p.11
- date: '2024'
  category: M&A
  text: Sold the 37% stake in Mlekoma Dairy and liquidated SADAFCO Qatar (17 Nov 2024).
  source: 2270_SADAFCO/2024_Annual_filed2025-03-25.pdf p.32
- date: '2025'
  category: event
  text: Sold a former warehouse property for SAR 110.3m, a gain of SAR 107.4m.
