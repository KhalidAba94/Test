headline: >-
  The three mall landlords are dominated by Cenomi Centers (78.6% of FY2025 revenue). From FY2023, the first year with twelve months of
  Cenomi figures, group revenue barely moved (SAR 2,808m to SAR 2,910m in FY2025; +3.3% and +0.3%) and it rose 0.9% in 9M 2026, because no
  Cenomi mall opened while two left its portfolio. Reported results lean on Cenomi's non-cash fair-value gains on investment property
  and on one-offs: attributable profit was SAR 1,823m (FY2023), SAR 1,482m (FY2024) and SAR 1,545m (FY2025). In 9M 2026 profit fell
  18.5% and EBITDA 11.5%, but EBITDA excluding identified one-offs rose 11.3%. Investment-property spending reached SAR 2,206m in 9M 2026
  and net debt SAR 17,978m, 9.9x annualised EBITDA.
main_changes:
  - change: "Revenue was flat. Group revenue rose 3.3% in FY2024, 0.3% in FY2025 and 0.9% in 9M 2026. Cenomi's revenue fell 2.4% in FY2025 (1.9 points off group growth) and rose 1.9% in 9M 2026."
    driver: "No Cenomi mall opened between FY2023 and 9M 2026, while the Mall of Dhahran was handed back after a court order and an owned mall was sold in 2025; the revenue lost is not disclosed. Cenomi's 9M 2026 growth came from a new development-services line (SAR 35.6m), while rental income fell 0.5%. ARDCO's revenue swings with land sales, which it books gross in revenue (SAR 96.5m in FY2025, SAR 33.4m in 9M 2026), and it lost the Ta'meer market to its Dira associate in December 2024. Alandalus's revenue rose 24.4% in 9M 2026 across all segments; the filings give no reason."
    evidence: "Cenomi FY2025 annual p.34, p.63 and 2026 Q3 interim; ARDCO FY2025 annual p.32; company narratives 4321, 4150, 4320"
    refs: ["4321-FY2025-REV", "4321-9M2026-REV", "4150-FY2025-REV", "4150-9M2026-REV", "4320-9M2026-REV"]
  - change: "The operating margin is above the EBITDA margin. We calculate an operating margin of 79.1% and an EBITDA margin of 65.8% for FY2025 (9M 2026: 81.0% and 61.2%)."
    driver: "Cenomi carries its investment properties at fair value. Its fair-value gains (SAR 370m in FY2023, SAR 565m in FY2024, SAR 501m in FY2025; SAR 538m in 9M 2026 against SAR 505m) are inside operating income but taken out of EBITDA, because they are non-cash remeasurements. Depreciation is small because property at fair value is not depreciated, so operating income exceeds EBITDA. Alandalus and ARDCO carry their property at cost and have no such gains. Cenomi's attributable profit (SAR 1,267m in FY2025) therefore depends partly on valuations."
    evidence: "Cenomi income statements (fair-value line) and data notes; metric FV_IP"
    refs: ["4321-FY2023-FV_IP", "4321-FY2024-FV_IP", "4321-FY2025-FV_IP", "4321-9M2025-FV_IP", "4321-9M2026-FV_IP", "4321-FY2025-NI_ATTR"]
  - change: "One-offs move the totals. We calculate EBITDA excluding identified one-offs of SAR 1,599m (FY2023), SAR 1,705m (FY2024) and SAR 1,525m (FY2025), against SAR 1,875m, SAR 1,734m and SAR 1,914m reported; the margin excluding one-offs fell from 56.9% to 52.4%, and EBITDA excluding one-offs fell 10.5% in FY2025."
    driver: "The main one-offs are Cenomi's SAR 238.7m gain on selling part of the Jawharat Riyadh land (FY2023) and its SAR 250m insurance claim for the 2022 Mall of Dhahran fire (FY2025 and 9M 2025), and ARDCO's land-sale gains (SAR 37.9m in FY2023, SAR 90.7m in FY2025, SAR 31.3m in 9M 2026) and a SAR 45.1m building received at the end of a land lease (9M 2026). Excluding one-offs, Cenomi took 8.1 points off the FY2025 change as its rental income fell 3.9% after two malls left."
    evidence: "One-offs register O-4321-04, O-4321-07, O-4321-12, O-4150-01, O-4150-05, O-4150-12, O-4150-13"
    refs: ["4321-FY2023-EBITDA_U", "4321-FY2025-EBITDA_C", "4321-FY2025-EBITDA_U", "4150-FY2025-EBITDA_U", "4150-9M2026-EBITDA_U"]
  - change: "In 9M 2026 reported EBITDA fell 11.5% and attributable profit 18.5%, but EBITDA excluding one-offs rose 11.3% (SAR 1,170m to SAR 1,303m), a margin of 58.5% (53.1%)."
    driver: "9M 2025 held Cenomi's SAR 250m insurance claim and ARDCO's SAR 90.9m land-sale margin. Excluding one-offs, Cenomi contributed 11.2 of the 11.3 points, as its charge for receivable losses fell to SAR 59.3m from SAR 234.5m. ARDCO's profit fell 41.7% as its G&A doubled, including SAR 18.3m of the new White Land Fees and a SAR 16.1m lawsuit provision; Alandalus returned to a SAR 27.2m profit as its associates turned to profit."
    evidence: "Cenomi 2026 Q3 interim p.29; ARDCO 2026 Q3 interim p.24-25; Alandalus 2026 Q3 interim (company narratives)"
    refs: ["4321-9M2025-EBITDA_U", "4321-9M2026-EBITDA_U", "4321-9M2026-NI_ATTR", "4150-9M2026-NI_ATTR", "4320-9M2026-NI_ATTR"]
  - change: "Malls are being built with debt. Investment-property spending was SAR 1,291m (FY2023), SAR 1,804m (FY2024), SAR 1,609m (FY2025) and SAR 2,206m in 9M 2026 (SAR 1,086m), so capex including it was 100.5% of revenue in 9M 2026. Free cash flow after this spending was -SAR 611m (FY2024), SAR 435m (FY2025) and -SAR 998m (9M 2026). Borrowings rose from SAR 9,791m (FY2023) to SAR 17,853m (FY2025), and net debt including leases from SAR 12,815m to SAR 16,118m and SAR 17,978m at 30 Sep 2026."
    driver: "Almost all of it is Cenomi: its projects under construction rose to SAR 11,786m at fair value (30 Sep 2026), and its borrowings reached SAR 16,973m at end-2025, with cash of SAR 4,294m. Group net debt was 8.4x EBITDA at end-2025 and 9.9x annualised at 30 Sep 2026 (Cenomi 11.7x). Alandalus's borrowings rose from SAR 589m to SAR 880m; ARDCO has none."
    evidence: "Cash-flow statements (investment-property lines); balance sheets; Cenomi 2026 Q3 interim p.17"
    refs: ["4321-9M2026-IP_CAPEX", "4321-FY2025-DEBT", "4321-FY2025-CASH", "4321-9M2026-NET_DEBT", "4320-FY2022-DEBT", "4320-FY2025-DEBT"]
  - change: "The two smaller landlords earned less. Excluding Cenomi, attributable profit fell from SAR 367m (FY2022) to SAR 278m (FY2025), 8.9% a year, and fell 27.9% in 9M 2026."
    driver: "Alandalus made losses in FY2024 and FY2025 as finance costs rose with its borrowings and its associates, led by West Jeddah Hospital, lost money. ARDCO's profit held at about SAR 296m in FY2024-FY2025, carried by associates and Murabaha deposit income, then fell in 9M 2026. Excluding one-offs, their combined EBITDA fell from SAR 275m to SAR 249m (-3.3% a year)."
    evidence: "Company narratives 4320 and 4150"
    refs: ["4320-FY2024-NI_ATTR", "4320-FY2025-NI_ATTR", "4150-FY2024-NI_ATTR", "4150-FY2025-NI_ATTR", "4150-9M2026-NI_ATTR"]
takeaways:
  improved: "Underlying earnings in 9M 2026: EBITDA excluding one-offs rose 11.3% and we calculate its margin at 58.5% (53.1%), as Cenomi's receivable-loss charge fell. Operating cash flow was SAR 2,096m in FY2025 (+71.9%), and Alandalus returned to profit."
  weakened: "Revenue has been flat since FY2023 (+0.3% in FY2025, +0.9% in 9M 2026), EBITDA excluding one-offs fell 10.5% in FY2025, and leverage rose: net debt was SAR 17,978m at 30 Sep 2026, 9.9x annualised EBITDA (6.8x at end-2023). Free cash flow after property spending was -SAR 998m in 9M 2026."
  why: "Cenomi is building new malls with debt while two operating malls left in 2025, so revenue has not grown; reported profit leans on fair-value gains and on one-offs (the FY2023 land sale, the 2025 insurance claim and ARDCO's land sales)."
  concentration: "Cenomi is 78.6% of FY2025 revenue (79.0% in 9M 2026; HHI about 6,400 out of 10,000) and 82.0% of profit (85.1% in 9M 2026). Excluding Cenomi, revenue grew 9.4% a year from FY2022 (including ARDCO's land sales), but EBITDA excluding one-offs fell 3.3% a year, its margin from 57.9% to 40.1%, and ROE to 6.4% in FY2025. The two smaller landlords are much less leveraged: net debt 2.4x EBITDA (group 8.4x)."
  ytd_2026: "9M 2026 vs 9M 2025: revenue +0.9%, EBITDA -11.5% (+11.3% excluding identified one-offs), attributable profit -18.5%, investment-property spending +103.1% to SAR 2,206m, net debt +11.9% to SAR 17,978m."
  uncertain: "The filings do not say when Cenomi's malls under construction will add revenue or how much revenue left with the two malls; the Mall of Dhahran landlord's claims (SAR 788.3m, part dismissed in October 2026) are open. Alandalus guarantees up to SAR 766.5m of its hospital associate's bank debt, ARDCO faces a SAR 74m lawsuit, and Cenomi's fair-value gains depend on valuations."
data_notes:
  - "Cenomi Centers' FY2022 is the nine-month transition period (1 Apr-31 Dec 2022) after its year-end moved from 31 March. Its flows are left out of group totals, so FY2022 revenue, profit, EBITDA, cash-flow and capex totals, the FY2022 margins, ROE and net debt / EBITDA, FY2023/FY2022 growth and the 2022-2025 CAGR of those flows cover Alandalus and ARDCO only (n = 2). Its 31 Dec 2022 balance sheet stays in the totals, so FY2022 borrowings (SAR 8,926m), total assets (SAR 30,530m) and net debt (SAR 10,953m) cover all three companies, as do growth and CAGRs of balance-sheet items and the FY2023 ROE (10.4%, on average equity from end-2022). From FY2023 all three companies are in every total (n = 3)."
  - "Fair-value gains on investment property (FV_IP, Cenomi only) are in operating income and net profit but outside EBITDA, so the operating margin is above the EBITDA margin. Alandalus and ARDCO carry investment property at cost."
  - "Capex intensity includes investment-property spending (capex + IP_CAPEX), and free cash flow deducts it. Cenomi's VAT-on-capex lines are left out."
  - "EBITDA excluding identified one-offs removes Cenomi's SAR 238.7m land-sale gain (FY2023), SAR 250m insurance claim (FY2025 and 9M 2025) and smaller disposal and lease items; ARDCO's land-sale margins, provision releases, the Ta'meer contribution gain, the BOT building gain and litigation provisions; and Alandalus's SAR 4.0m gain on selling a subsidiary."
  - "ARDCO books land sales gross in revenue (SAR 41.4m in FY2023, SAR 96.5m in FY2025, SAR 33.4m in 9M 2026). Its Murabaha deposits (SAR 1,025m at end-2025) are outside cash, so its net debt does not show its net cash position."
  - "Alandalus consolidates Al-Ahli REIT Fund 1 (68.73%), which is the listed REIT 4338 in the REIT group. Adding the Malls and REIT groups double-counts those properties (AlAndalus Mall, its hotel, Salama Tower and Qbic Plaza)."
  - "No company discloses gross leasable area, occupancy (it appears only as a valuation input) or visitor numbers, so price and volume effects cannot be separated."
  - "IFRS 16: net debt includes lease liabilities (SAR 2,675m at end-2025). Cenomi's 9M 2026 finance costs are net of about SAR 93m of swap fair-value gains, and it capitalised SAR 372m of finance costs into projects in 9M 2026."
