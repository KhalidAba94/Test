headline: >-
  Americana is 78.9% of the five restaurant operators' FY2025 revenue. Group revenue rose only 0.8% a year, from SAR 11,649m
  (FY2022) to SAR 11,917m (FY2025), after an 8.3% fall in FY2024 and an 11.3% recovery in FY2025, and attributable profit fell
  11.6% a year to SAR 738m. Margins widened: we calculate that the gross margin rose from 46.0% to 48.3% and the EBITDA margin from
  20.8% to 21.8%. In 9M 2026 revenue rose 11.6%, EBITDA 25.7% and attributable profit 84.5% to SAR 830m, most of it at Americana.
  Together, the four smaller operators lost money in FY2024 and FY2025, and Raydan's equity turned negative.
main_changes:
  - change: "Americana set the group's path. Group revenue fell 8.3% in FY2024, then rose 11.3% in FY2025 and 11.6% in 9M 2026; Americana contributed -7.0, +10.9 and +10.2 points."
    driver: "Americana's FY2024 revenue fell 9.0%, in every segment (Lower Gulf -29.6%, North Africa -26.5%; Egypt -31.6% in US dollars), and the company gives no reason. In FY2025 every segment grew (+14.2%), and in 9M 2026 revenue rose 12.9%. Americana reports in US dollars from 12 countries; it treats only Lebanon as hyperinflationary and does not disclose the effect of the Egyptian pound, so its organic growth is not determinable."
    evidence: "Americana FY2025 annual p.57-58 (segments); 2026 Q3 interim p.33; company narrative 6015"
    refs: ["6015-FY2023-REV", "6015-FY2024-REV", "6015-FY2025-REV", "6015-9M2026-REV"]
  - change: "Restaurant estates moved in different directions. Americana's restaurants rose from 2,183 (end-2022) to 2,749 (end-2025); Alamar's Domino's restaurants rose from 439 to 523 (535 at 30 Sep 2026) and its Dunkin' from 56 to 72 (74); Herfy's fell from 391 to 372 (370 at 30 Sep 2026)."
    driver: "Herfy's revenue fell every year (-4.5% a year) as its estate shrank. For Americana we calculate that revenue per average restaurant fell 16.3% in FY2024 and rose 7.5% in FY2025, so the estate grew faster than revenue over the period. No company reports same-store sales, and Burgerizzr and Raydan give no restaurant counts, so like-for-like growth is not determinable for any operator."
    evidence: "Restaurant counts: Americana directors' reports p.3; Herfy note 1; Alamar directors' reports and 2026 Q3 interim p.8 (company narratives 6015, 6002, 6014)"
    refs: ["6015-FY2025-REV", "6002-FY2022-REV", "6002-FY2025-REV", "6014-FY2025-REV", "6014-9M2026-REV"]
  - change: "Margins widened after FY2024. We calculate that the group gross margin rose from 46.0% (FY2022) to 48.3% (FY2025) and 50.5% in 9M 2026 (47.8%), and the EBITDA margin went from 20.8% to 19.7% (FY2024), 21.8% (FY2025) and 23.5% in 9M 2026 (20.8%)."
    driver: "Americana's gross margin rose from 51.7% to 54.4% (55.9% in 9M 2026) and its EBITDA margin from 22.0% in FY2024 to 25.1% in 9M 2026. Herfy's EBITDA margin recovered from 9.7% (FY2024) to 15.0% (FY2025) and 18.7% in 9M 2026 as staff costs, sales returns and discounts fell. Burgerizzr's rose to 14.6% in 9M 2026 (10.7%). Raydan moved the other way: from FY2025 its revenue no longer covered cost of revenue (gross margin -10.0%)."
    evidence: "Group ratios from totals; company narratives 6015, 6002, 6016, 6012"
    refs: ["6015-FY2025-GP", "6015-9M2026-EBITDA_C", "6002-FY2024-EBITDA_C", "6002-9M2026-EBITDA_C", "6016-9M2026-EBITDA_C", "6012-FY2025-GP"]
  - change: "Attributable profit fell from SAR 1,069m (FY2022) to SAR 452m (FY2024), then recovered to SAR 738m (FY2025) and SAR 830m in 9M 2026 (+84.5%)."
    driver: "In FY2024 Americana's profit fell 38.8% (37.0 points of the group's 55.7% fall), Herfy lost SAR 117m and Raydan SAR 73.1m. In FY2025 Americana's income tax and zakat rose to SAR 134m with the first Pillar Two top-up tax (SAR 52.6m), and Herfy's SAR 77.5m loss included a SAR 35.0m impairment. In 9M 2026 Americana's profit rose 60.4% to SAR 814m (68.1 points of the 84.5%), and Herfy made a SAR 2.1m profit; its 9M 2025 result had carried a SAR 38.3m impairment."
    evidence: "Americana FY2025 annual p.10, p.51-52 (tax note); Herfy FY2025 annual p.10, p.12; company narratives"
    refs: ["6015-FY2024-NI_ATTR", "6002-FY2024-NI_ATTR", "6012-FY2024-NI_ATTR", "6015-FY2025-ZAKAT_TAX", "6015-9M2026-NI_ATTR", "6002-9M2026-NI_ATTR"]
  - change: "Acquisitions added to 2026 growth. Alamar bought 29 Domino's branches (October 2025) and Five Guys Saudi Arabia (April 2026, SAR 46.9m of 9M 2026 revenue); Burgerizzr bought 60% of the SHOVEL cafe chain (October 2025, SAR 55.7m); Americana bought Pizza Hut Oman (January 2025) and Malak Al Tawouk in the UAE and Saudi Arabia (2026)."
    driver: "We calculate that Five Guys and SHOVEL together added about 1.2 points of the 11.6% revenue growth in 9M 2026. Americana and Alamar do not disclose the revenue of their other acquisitions, so group organic growth is not determinable. Without SHOVEL, Burgerizzr's revenue grew 6.1% in 9M 2026, and the company reports SHOVEL's net profit (SAR 9.5m) above its burger segment's (SAR 8.8m)."
    evidence: "Alamar 2026 Q3 interim p.12, p.18; Burgerizzr 2026 Q3 interim p.14, p.18; Americana FY2025 annual p.59-60 and 2026 Q3 interim p.36-37"
    refs: ["6014-9M2026-REV", "6016-9M2026-REV", "6016-9M2026-NI_ATTR", "6015-9M2026-REV"]
  - change: "Cash flow rose and the debt is leases. Free cash flow rose from SAR 1,480m (FY2022) to SAR 2,056m (FY2025, 11.6% a year) and SAR 1,877m in 9M 2026 (+39.7%), as capex fell from 6.1% to 4.1% of revenue. Net debt including leases rose from SAR 1,297m to SAR 1,946m, 0.7x EBITDA at end-2025 (0.6x annualised at 30 Sep 2026)."
    driver: "Borrowings are small (SAR 30.6m at end-2025; SAR 123m at 30 Sep 2026 after Alamar's SAR 85m loan for Five Guys), so lease liabilities (SAR 3,113m at end-2025) are the debt. Group cash fell from SAR 1,359m to SAR 513m in FY2023 as Americana moved cash into term deposits; these sit outside cash, but net debt deducts those due within a year (SAR 1,110m at end-2023, SAR 545m at end-2025). Raydan's equity turned negative (-SAR 22.5m at 30 Sep 2026) and its auditor reports a material going-concern uncertainty."
    evidence: "Cash-flow statements and balance sheets; Americana FY2025 annual p.42; Raydan 2026 Q3 interim p.3"
    refs: ["6015-FY2025-FCF", "6015-FY2025-LEASE_LIAB", "6015-FY2023-CASH", "6014-9M2026-DEBT", "6012-9M2026-EQ_ATTR"]
takeaways:
  improved: "Margins and cash. We calculate that the gross margin reached 50.5% and the EBITDA margin 23.5% in 9M 2026, and free cash flow was SAR 2,056m in FY2025 and SAR 1,877m in 9M 2026. Attributable profit rose 63.2% in FY2025 and 84.5% in 9M 2026."
  weakened: "Profit is still below FY2022 (SAR 738m in FY2025 against SAR 1,069m; -11.6% a year), and the four smaller operators shrank: their revenue fell 2.8% a year and they lost SAR 143m in FY2024 and SAR 83.7m in FY2025. Herfy's estate and revenue fell every year, and Raydan's equity is negative."
  why: "Americana's FY2024 revenue fell in every segment, most in Lower Gulf and North Africa, and its tax rose from FY2025. Herfy had a shrinking estate, higher costs in FY2024 and a factory write-down in FY2025; Raydan's catering and Hajj contract revenue fell away after FY2023, and in 2026 it exited branches."
  concentration: "Americana is 78.9% of FY2025 revenue (80.0% in 9M 2026; HHI about 6,400 out of 10,000) and 98.1% of 9M 2026 profit. Its FY2025 profit (SAR 822m) exceeded the group's because the other four lost SAR 83.7m together. Excluding Americana, revenue fell 2.8% a year and the EBITDA margin fell from 18.6% (FY2022) to 14.6% (FY2025); in 9M 2026 revenue rose 6.7%, helped by the Five Guys and SHOVEL acquisitions, the margin reached 16.9% and profit was SAR 15.7m (a loss of SAR 57.7m in 9M 2025)."
  ytd_2026: "9M 2026 vs 9M 2025: revenue +11.6%, EBITDA +25.7% (+25.5% excluding identified one-offs), attributable profit +84.5%, free cash flow +39.7%. We calculate an EBITDA margin of 23.5% (20.8%). Americana contributed 10.2 of the 11.6 revenue points and 68.1 of the 84.5 profit points."
  uncertain: "No operator reports same-store sales, and Americana gives no restaurant count at 30 Sep, no currency effect and no revenue for its acquisitions, so the split between existing restaurants, new restaurants, acquisitions and the Egyptian pound is not determinable. Raydan depends on a proposed capital reduction and a SAR 105m rights issue."
data_notes:
  - "No short years and no company-periods left out: all five companies are in every total (n = 5 in every period), so group growth uses the whole group."
  - "Americana reports in US dollars; amounts are converted at the peg of 3.75 SAR per USD, so the conversion adds no FX effect. Its FY2022 combines carve-out figures up to 27 June 2022 with the new group afterwards and its FY2021 equity is net parent investment, so the FY2022 group ROE (44.3%) is not comparable with later years."
  - "Americana operates restaurants in 12 countries. Lebanon is accounted for as hyperinflationary (IAS 29); Egypt is not, and the Egyptian pound's effect on revenue is not disclosed. Alamar's Egypt and Morocco revenue is also translated without constant-currency figures."
  - "Restaurant counts are quoted only where the filings give them: Americana (year-end, directors' report; none in the interims), Herfy (owned and leased Herfy restaurants; bakeries and shops not counted) and Alamar (Domino's, Dunkin' and, from 2026, 13 Five Guys). Burgerizzr gives none; Raydan lists branch registrations, which are not restaurant counts. No company reports same-store sales."
  - "Raydan's 9M figures are continuing operations: the company re-presented 9M 2025 revenue from SAR 94.4m to SAR 60.7m after exiting branches in 2026. Its statements are stand-alone from FY2025."
  - "Burgerizzr moved from Nomu to the Main Market (approval 13 Oct 2024). Its statements are stand-alone to FY2024 and consolidated from FY2025, with SHOVEL (60%) included from 27 Oct 2025."
  - "IFRS 16: EBITDA is before rent, and net debt includes lease liabilities (SAR 3,113m at end-2025, more than net debt of SAR 1,946m because cash and short-term deposits are netted). Net debt deducts Americana's term deposits due within a year (SAR 545m, USD 145.2m, at end-2025); its longer deposits (USD 117.8m) are not deducted."
  - "Cross-holding: Savola (2050, in the Supporting group) consolidates Herfy at 49%. Group totals are simple sums, so Herfy's revenue as included in Savola's (SAR 1,213.4m in FY2022, SAR 1,148.0m in FY2023, SAR 1,101.8m in FY2024 and SAR 1,056.7m in FY2025; 8.9% of FnB revenue in FY2025) is also inside the Supporting group's revenue, and adding the two groups counts it twice."
  - "Jahez, a delivery platform, is in its own group and not in these totals."
