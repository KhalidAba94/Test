what_it_means:
  improved: "9M 2026 operating income nearly tripled to SAR 60.1m as credit losses fell to SAR 3.2m from SAR 36.5m, and operations revenue kept growing (+16.9% in FY2025, +6.1% in 9M 2026)."
  weakened: "Gross profit fell from SAR 327m (FY2022) to SAR 212m (FY2025) while finance costs rose from SAR 32.0m to SAR 50.6m, so attributable profit went from SAR 34.2m to a SAR 42.2m loss and equity fell from SAR 389m to SAR 246m."
  why: "Higher gold prices lifted gold revenue and the value of gold borrowed, but the gross loss on gold widened, credit losses on gold receivables rose sharply in FY2025, and the falling Egyptian pound reduced equity through the translation reserve."
  uncertain: "The FX effect, Egypt's share of gold revenue and store growth are not disclosed, and net debt/EBITDA depends on whether gold loans are counted as debt (48.0x with them, about -0.1x without at end-2025)."
confidence_overall: "Medium"
data_notes:
  - "DEBT includes 'Accounts payable - Gold' (gold procured from banks at agreed profit rates and settled in gold; the company tags it as short-term borrowings and calls gold borrowing the majority of its debt) plus short-term murabaha facilities. The company's own net debt excludes leases (SAR 1,900m at end-2025, gearing 773%). Our NET_DEBT adds lease liabilities: SAR 1,927m and net debt/EBITDA 48.0x for FY2025. Excluding gold loans, net debt was -SAR 4.6m (end-2025) and SAR 30.5m (30 Sep 2026), about -0.1x and 0.3x EBITDA (we calculate). The gold loans are matched by gold inventories and receivables, and both move with the gold price."
  - "Stage A override: the murabaha facilities (SAR 37.0m at end-2024, SAR 39.0m at end-2025, SAR 24.2m at 30 Sep 2025, SAR 76.7m at 30 Sep 2026) were missing from the XBRL DEBT figure."
  - "FY2023 revenue, gross profit and finance costs are restated (FY2024 annual note 40): gold calibration (SAR 41.5m) and customer discounts (SAR 11.2m) are deducted from revenue. FY2022 is not re-presented, so FY2023/FY2022 revenue and gross-profit growth cross a basis break (bridge step -SAR 52.7m). The FY2022 opinion was qualified on the same calibration costs."
  - "FY2023 operating cash flow is the FY2024 annual comparative (SAR 57.5m; SAR 60.4m first reported), after 2.9m of finance costs paid moved into operating activities. Operating cash flow is after finance costs paid on gold liabilities in every year. FY2024 operating cash flow is SAR 61.6m as printed (the XBRL had SAR 61.3m)."
  - "D&A (DA_CF) includes right-of-use depreciation in every period (missing from the XBRL; added in stage A). Finance costs are 'finance costs - net' and include financing costs on gold payables (SAR 45.6m in FY2025), lease interest and end-of-service interest; bank charges (SAR 4.6m in FY2025) sit in other expenses."
  - "Gold revaluation gains and losses on inventories (e.g. SAR 9.4m gain in FY2025, SAR 5.7m loss in 9M 2026) are one leg of the company's economic hedge with its gold liabilities, and FX differences recur every year with the Egyptian operations, so neither is treated as a one-off. The SAR 8.8m impairment of gold inventories in FY2025 (inside 9M 2025) is an inventory write-down and stays in EBITDA."
  - "The FY2024 balance sheet restatement (FY2025 annual note 39) only moves SAR 4.3m from the statutory reserve to retained earnings; total equity is unchanged. The FY2021 debt figure is the FY2022 annual's re-presentation of murabaha and gold payables as 'accounts payable for gold' (SAR 941.4m)."
  - "The FY2022 annual and the FY2023 primary statements are scanned images, read visually and checked by OCR. The 9M 2025 balance sheet is from the 9M 2025 interim."
