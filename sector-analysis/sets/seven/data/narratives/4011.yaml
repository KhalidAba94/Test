ticker: "4011"
headline: >-
  Revenue rose from SAR 2,000m in FY2022 to SAR 2,905m in FY2025 mainly because gold prices rose, but gross profit fell every year and
  attributable profit turned from SAR 34.2m to a SAR 42.2m loss in FY2025 after SAR 47.1m of credit losses on gold receivables. Its debt
  is mostly gold borrowed from banks (SAR 1,932m at end-2025), so net debt/EBITDA is 48.0x. In 9M 2026 revenue rose 29.3% to SAR 2,940m
  and the company was back to a small profit of SAR 0.2m.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue, which has two parts: gold revenue (the value of the gold weight in jewellery sold, mainly to wholesale
    customers in Egypt, after gold calibration charges) and operations revenue (the value added: labour, stones and retail sales). There
    were no acquisitions; the only perimeter change was the liquidation of a small UAE trading subsidiary in 2024 (net assets SAR 1.2m),
    whose revenue is not disclosed. FY2023 is restated (FY2024 annual note 40) to deduct gold calibration and customer discounts from
    revenue, while FY2022 is not, which takes SAR 52.7m off FY2023/FY2022 growth (we calculate). The Egyptian pound lost 20.0%, 39.2% and
    6.6% against the riyal in 2023-2025 (company figures), but Egypt's gold revenue and the rates used are not disclosed, so the FX effect,
    organic growth and like-for-like growth are not determinable. Store openings and same-store sales are not disclosed.
  perimeter_changes:
    - {event: "L'azurde DMCC (UAE trading subsidiary) liquidated; net assets SAR 1.2m returned to the parent", date: "2024", effect: "revenue not disclosed; immaterial (0.06% of FY2023 revenue)", source: "4011_LAZURDE/2024_Annual_filed2025-03-17.pdf p.15"}
    - {event: "Almujwharat Almasiah LLC under liquidation, still consolidated", date: "2025-2026", effect: "no disclosed revenue effect", source: "4011_LAZURDE/2026_Q3_filed2026-11-12.pdf p.9"}
  capacity_changes:
    - {event: "Retail stores under construction (capital work in progress)", date: "2024-2026", effect: "store counts and revenue not disclosed", source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.47"}
  fx_exposure: "Egypt produced SAR 290.7m of SAR 540.4m operations revenue in FY2025 and most of the gold revenue. The company reports average EGP devaluations of 36.5% (2022), 20.0% (2023), 39.2% (2024) and 6.6% (2025); the effect on revenue cannot be calculated from the filings. IAS 29 (hyperinflation) is not applied."
  price_volume_support: "Partial. The company reports the change in the international gold price (+27% in 2024, +65% in 2025) and the grams of gold it holds and owes, but not the gold weight sold, so price and volume cannot be separated."
  confidence: "Low (FX and new capacity not determinable; the accounting step is calculated with High confidence)"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Revenue rose SAR 796m (37.8%). Gold revenue rose 43.6% (SAR 1,646m to SAR 2,364m) in a year when, the company reports, the
      international gold price rose 65%; gold calibration charges deducted from it rose to SAR 102.9m (SAR 60.8m). Operations revenue rose
      16.9% (SAR 462.4m to SAR 540.4m): wholesale +15.4% and retail +18.2%, Egypt +26.2% and Saudi Arabia +6.3% (we calculate). The gold
      the company owes fell from 4,185,079 grams to 3,719,063 grams while its value rose 46.6%. The weight of gold sold is not disclosed.
    basis: "disclosed (revenue splits, gold price change, grams held); price/volume not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.10 (P&L), p.38 (note 23), p.43 (gold grams), p.46 (gold price), p.47-48 (segments)"
    refs: ["4011-FY2025-REV", "4011-FY2024-REV", "4011-FY2025-DEBT"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue rose SAR 666m (29.3%): gold revenue +34.6% (SAR 1,852m to SAR 2,492m) and operations revenue +6.1% (SAR 422.3m to SAR 448.0m);
      in operations, wholesale rose 10.8% and retail 1.5%, Egypt 17.8% while Saudi Arabia fell 6.9% (we calculate). Gold prices and
      weights are not given in the interim.
    basis: "disclosed (revenue splits); price/volume not determinable"
    confidence: "High for the amounts"
    source: "4011_LAZURDE/2026_Q3_filed2026-11-12.pdf p.5 (P&L), p.16-17 (segments)"
    refs: ["4011-9M2026-REV", "4011-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue fell 6.8% to SAR 1,864m; SAR 52.7m of the fall is the note 40 restatement, which deducts gold calibration and customer discounts from FY2023 revenue but not from FY2022 (on a like basis -4.1%, we calculate). Egypt's operations revenue fell 19.5% in riyals (old basis) as the pound lost 20.0%. Gross profit fell 24.4% to SAR 247m, also partly the restatement. Operating income fell 6.1% to SAR 79.2m (operating margin 4.2%; EBITDA margin 6.1%), including a SAR 12.7m gain on selling property and equipment and a SAR 6.6m FX loss. Attributable profit fell 9.7% to SAR 30.8m (net margin 1.7%, ROE 8.2%).", source: "4011_LAZURDE/2024_Annual_filed2025-03-17.pdf p.10 (P&L), p.39 (note 28), p.48-49 (note 40); 4011_LAZURDE/2023_Annual_filed2024-04-07.pdf p.46-47", refs: ["4011-FY2023-REV", "4011-FY2023-GP", "4011-FY2023-OPINC", "4011-FY2023-NI_ATTR"]}
    - {period: "FY2024", driver: "Revenue rose 13.1% to SAR 2,108m: gold revenue +17.3% and operations revenue +0.4%. The gross loss on gold widened to SAR 60.8m (SAR 41.5m) and gross profit fell 9.8% to SAR 223m. Credit losses rose to SAR 8.7m (SAR 0.9m), partly offset by a one-off SAR 10.6m gain on a gold forward bought to hedge them; an FX gain of SAR 17.6m was largely offset by an unexplained SAR 14.3m 'other miscellaneous' expense. Operating income fell 19.2% to SAR 64.0m (operating margin 3.0%; EBITDA margin 4.5%). Finance costs rose 16.2% to SAR 38.8m and zakat and tax took SAR 13.5m, leaving attributable profit 62.1% lower at SAR 11.7m (net margin 0.6%, ROE 3.7%).", source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.10 (P&L), p.41 (note 30); 4011_LAZURDE/2024_Annual_filed2025-03-17.pdf p.39 (note 28)", refs: ["4011-FY2024-REV", "4011-FY2024-GP", "4011-FY2024-OPINC", "4011-FY2024-FIN_COST", "4011-FY2024-ZAKAT_TAX", "4011-FY2024-NI_ATTR"]}
    - {period: "FY2025", driver: "Revenue rose 37.8% to SAR 2,905m with the gold price, but the gross loss on gold grew to SAR 111.7m while gross profit from operations rose 14.0% to SAR 323.6m, so gross profit fell 5.0% to SAR 212m (7.3% of revenue). Credit losses jumped to SAR 47.1m as SAR 49.2m of gold receivables were written off. Operating income fell 81.0% to SAR 12.1m (operating margin 0.4%; EBITDA margin 1.4%). Finance costs rose 30.4% to SAR 50.6m as the value of the gold borrowed rose with the price. The attributable loss was SAR 42.2m (net margin -1.5%, ROE -16.1%).", source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.10 (P&L), p.36 (note 13), p.39 (note 28)", refs: ["4011-FY2025-REV", "4011-FY2025-GP", "4011-FY2025-OPINC", "4011-FY2025-FIN_COST", "4011-FY2025-NI_ATTR"]}
    - {period: "9M2026", driver: "Revenue rose 29.3% to SAR 2,940m and gross profit 9.2% to SAR 192m (6.5% of revenue vs 7.7%). Credit losses fell to SAR 3.2m (SAR 36.5m), which more than offset a SAR 5.7m loss on revaluing gold inventories (a SAR 5.9m gain in 9M 2025). Operating income nearly tripled to SAR 60.1m (operating margin 2.0% vs 0.9%; EBITDA margin 2.8% vs 1.9%), but finance costs rose 48.4% to SAR 54.8m, leaving attributable profit of SAR 0.2m against a SAR 16.8m loss (net margin 0.0%). Operating cash flow was -SAR 2.6m after SAR 63.75m spent on a gold reserve.", source: "4011_LAZURDE/2026_Q3_filed2026-11-12.pdf p.5 (P&L), p.8 (cash flow)", refs: ["4011-9M2026-REV", "4011-9M2026-GP", "4011-9M2026-OPINC", "4011-9M2026-FIN_COST", "4011-9M2026-NI_ATTR", "4011-9M2026-CFO"]}
    - {period: "FY2022-9M2026", driver: "Debt is mainly gold: accounts payable - gold (gold bought from banks on 1-9 month terms at agreed profit rates and repaid in gold) were SAR 1,932m at end-2025 plus SAR 39.0m of cash murabaha. Our net debt of SAR 1,927m gives net debt/EBITDA of 48.0x (FY2024: 14.2x; 9M 2026 annualised 15.9x). Excluding the gold loans, net debt was -SAR 4.6m at end-2025 and SAR 30.5m at 30 Sep 2026, about -0.1x and 0.3x EBITDA (we calculate). The gold loans are matched by gold inventories of SAR 1,476m and gold receivables of SAR 487m.", source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.9 (balance sheet), p.43, p.46; 4011_LAZURDE/2026_Q3_filed2026-11-12.pdf p.4", refs: ["4011-FY2025-DEBT", "4011-FY2025-NET_DEBT", "4011-FY2025-EBITDA_C", "4011-9M2026-NET_DEBT", "4011-FY2025-CASH", "4011-FY2025-LEASE_LIAB"]}
  one_offs:
    - {item: "Gain on disposal of property and equipment (proceeds SAR 18.3m)", period: "FY2023", amount_sar_m: 12.7, line: "Other expenses - net (inside operating income)", source: "4011_LAZURDE/2024_Annual_filed2025-03-17.pdf p.39", tax_nci: "Zakat and tax effect not disclosed; no minority share in profit (all attributable to the parent): after-tax effect not determinable, profit kept as reported"}
    - {item: "Gain on forward contract arranged for expected credit losses (no contract in 2023 or 2025)", period: "FY2024", amount_sar_m: 10.6, line: "Operating expenses (separate line)", source: "4011_LAZURDE/2025_Annual_filed2026-03-26.pdf p.10, p.41", tax_nci: "Zakat and tax effect not disclosed; no minority share in profit: after-tax effect not determinable, profit kept as reported"}
