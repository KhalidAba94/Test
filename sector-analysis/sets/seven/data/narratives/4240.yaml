ticker: '4240'
headline: Revenue from continuing operations rose 3.8% in FY2024, 5.3% in FY2025 and 6.3% in 9M 2026, led by international markets, but the company lost money every full year from FY2023 (attributable loss SAR 506m in FY2025) and equity attributable fell to -SAR 1,838m at 30 Sep 2026; Al Futtaim took control in September 2025 and the company was renamed AFG International.
lfl_basis:
  definition_used: 'Revenue is from continuing operations. FY2022 is a nine-month period (April-December 2022) after the year-end moved from 31 March, so FY2023/FY2022 growth is n.m. Brand disposals are perimeter changes: brands sold or held for sale are re-presented as discontinued operations in the filing that presents both years, but FY2023 and FY2024 come from different re-presentations (the FY2024 and FY2025 annuals) and some brand sales were not classified as discontinued, so the perimeter effect is not determinable; the basis difference for FY2024 (+SAR 2.6m) is calculated. International operations earn non-pegged currencies and no constant-currency figures are given, so FX is not determinable; no hyperinflation. No store counts or like-for-like sales are disclosed, so organic and like-for-like growth are not determinable.'
  perimeter_changes:
  - event: Balkan, Morocco and UK operations disposed of (discontinued)
    date: '2023-12-31'
    effect: FY2023 discontinued revenue SAR 26.2m
    source: 4240_AFG_RETAIL/2024_Annual_filed2025-04-09.pdf p.63-64
  - event: US operations disposed of and 5 fashion brands held for sale (discontinued)
    date: '2024-12-31'
    effect: FY2023 revenue SAR 72.1m and SAR 755.8m moved to discontinued operations
    source: 4240_AFG_RETAIL/2024_Annual_filed2025-04-09.pdf p.62-65
  - event: Brands sold in 2024 (consideration SAR 369.3m, gain SAR 210.2m), not shown as discontinued
    date: '2024'
    effect: not determinable
    source: 4240_AFG_RETAIL/2024_Annual_filed2025-04-09.pdf p.64
  - event: Three brands sold in 2025 (discontinued) and the assets of one more brand sold
    date: '2025'
    effect: 9M 2025 discontinued revenue SAR 23.5m; the asset sale is not determinable
    source: 4240_AFG_RETAIL/2025_Annual_filed2026-03-16.pdf p.64-65; 4240_AFG_RETAIL/2026_Q3_filed2026-11-11.pdf p.30-31
  capacity_changes:
  - event: Store openings and closures not disclosed
    date: FY2022-9M2026
    effect: not determinable
    source: 4240_AFG_RETAIL/2025_Annual_filed2026-03-16.pdf p.48
  fx_exposure: International revenue (Jordan, Egypt, Kazakhstan, Azerbaijan, Georgia, Armenia, Uzbekistan) was SAR 1,585m in FY2025 (31% of revenue, we calculate) and SAR 1,262m in 9M 2026; FX effects on revenue are not disclosed. FX losses in other operating expense were SAR 59.3m in FY2025 and SAR 57.5m in 9M 2025.
  price_volume_support: Not determinable. Revenue is split by segment, geography and product line (apparel, footwear, other) but no prices, volumes, store counts or like-for-like sales are disclosed.
  confidence: Low (perimeter, FX and new capacity not determinable; FY2022 is a short period)
price_volume:
- period: FY2025 vs FY2024
  text: Revenue rose SAR 257m (+5.3%). International revenue rose 18.8% (SAR 1,335m to SAR 1,585m) while KSA revenue was flat (+0.2%, SAR 3,512m to SAR 3,519m). By segment, fashion rose 6.5% (SAR 4,024m to SAR 4,286m), electronics was flat at SAR 495m and food and beverages fell 1.5%. Currency effects are not disclosed.
  basis: disclosed (segment and geographic revenue); split not determinable
  confidence: High for the amounts; FX and volume not determinable
  source: 4240_AFG_RETAIL/2025_Annual_filed2026-03-16.pdf p.48-49
  refs:
  - 4240-FY2025-REV
  - 4240-FY2024-REV
- period: 9M 2026 vs 9M 2025
  text: Revenue rose SAR 233m (+6.3%). International revenue rose 14.2% (SAR 1,105m to SAR 1,262m), mostly apparel; KSA revenue rose 3.0%. Electronics, all in KSA, rose 31.8% (SAR 314m to SAR 413m) and food and beverages fell 10.9% (SAR 246m to SAR 219m).
  basis: disclosed (segment, geographic and product revenue); split not determinable
  confidence: High for the amounts
  source: 4240_AFG_RETAIL/2026_Q3_filed2026-11-11.pdf p.23-24
  refs:
  - 4240-9M2026-REV
  - 4240-9M2025-REV
