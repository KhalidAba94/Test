developments:
- date: '2023-04-30'
  category: strategy
  text: The board stopped the plan to expand in Egypt; Egypt assets of SAR 7.1m were held for sale.
  source: 4003_EXTRA/2023_Annual_filed2024-02-19.pdf p.50
- date: '2024'
  category: financing
  text: Sold 30% of UIHC, the holding company of the Tas'heel consumer-finance business, in an IPO on Tadawul for SAR 990.0m while keeping control.
  source: 4003_EXTRA/2024_Annual_filed2025-02-19.pdf p.14, p.12
- date: '2025'
  category: mix
  text: UIHC set up NowAccess (75%) to offer payroll advances; it produced SAR 1.1m of income in 2025.
  source: 4003_EXTRA/2025_Annual_filed2026-02-18.pdf p.15, p.8
- date: 2025-2026
  category: financing
  text: Bought back own shares for SAR 237.9m in FY2025 and SAR 30.2m in 9M 2026.
  source: 4003_EXTRA/2025_Annual_filed2026-02-18.pdf p.12; 4003_EXTRA/2026_Q3_filed2026-11-05.pdf p.11
- date: 2026 (9M)
  category: event
  text: Management states the Middle East conflict since 28 Feb 2026 has not had a significant impact, while it monitors supply chains and customers' credit.
  source: 4003_EXTRA/2026_Q3_filed2026-11-05.pdf p.12
what_it_means:
  improved: Revenue grew 7.3% a year from FY2022 to FY2025 and the gross margin rose from 21.0% to 24.0%, with consumer finance revenue up from SAR 417m to SAR 768m.
  weakened: Attributable profit fell 5.9% in FY2025 and 9.9% in 9M 2026, and the net margin fell from 7.8% (FY2024) to 5.1% (9M 2026).
  why: Since the 2024 IPO about 31% of Tas'heel's profit goes to minorities (SAR 79.0m in FY2025), and credit losses on consumer financing rose from SAR 40.8m (FY2022) to SAR 124.8m (FY2025) and SAR 167.2m
    in 9M 2026; operating cash flow swings with the growth of the financing book.
  uncertain: Same-store sales and the revenue of new branches are not disclosed, and whether the 2026 rise in credit losses persists is not determinable from the filings.
confidence_overall: Medium
data_notes:
- Revenue includes income from Islamic financing contracts (FY2025 SAR 769.0m) and the funding cost of that business sits in cost of revenue (SAR 27.8m FY2022, SAR 63.2m FY2023, SAR 79.9m FY2024, SAR 96.8m
  FY2025; about SAR 70.4m in 9M 2025 and SAR 73.6m in 9M 2026, which we derive from the cash-flow add-back). The finance cost line on the face covers leases and other borrowings only, so our operating income
  and EBITDA are after the consumer-finance funding cost.
- 'Finance income (income from net investment in finance leases, and from 2025 a separate finance income) is inside other income, not a separate line: SAR 2.5m FY2022, SAR 2.9m FY2023, SAR 2.8m FY2024,
  SAR 4.1m FY2025.'
- Net impairment losses on financial assets (credit losses on financing) are an operating cost on the face; they are not added back in EBITDA. The impairment add-back is nil in every period (corrected
  from the PDF cash-flow statements where the XBRL had used these losses).
- 'Corrected from the PDF statements: depreciation of right-of-use assets added to D&A for FY2024 and FY2025 (FY2025 annual p.12); payments for intangible assets added to FY2022 and FY2023 capex (FY2023
  annual p.12, FY2024 annual p.12); borrowings and lease liabilities read from the balance sheets where the XBRL had none (FY2023 annual p.9, FY2024 annual p.9, 2025 Q3 and 2026 Q3 interims p.6); 9M 2026
  cash-flow items read from the 2026 Q3 interim (p.9) because the XBRL had none.'
- 'Borrowings largely fund the consumer-finance receivables, so net debt (SAR 2,045m at end-2025) is not comparable with a pure retailer''s. Net debt deducts a SAR 30.0m Islamic short-term deposit
  placed with a local bank at end-2025 (FY2025 annual note 16, p.47) and at 30 Sep 2025 (2025 Q3 interim note 7, p.24).'
- The FY2024 attributable profit and capex first read from the XBRL were the wrong lines (net profit before minorities; PP&E only); they were corrected from the PDF and are not restatements.
- The FY2022 annual is a fully scanned document and the FY2024 annual has an unreliable embedded text layer; figures were read by OCR and checked against totals.
