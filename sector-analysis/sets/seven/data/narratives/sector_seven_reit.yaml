headline: >-
  The eight REITs grew revenue (mainly rent) 5.1% a year, from SAR 1,013m (FY2022) to SAR 1,177m (FY2025), mostly by buying property with
  debt: borrowings rose from SAR 4,117m to SAR 6,171m and LTV from 33.5% to 42.8%. Funds from operations (FFO, we calculate) fell
  from SAR 477m to SAR 342m in FY2023 and recovered to SAR 428m in FY2025 (FFO margin 36.4%), while net profit fell to SAR 51.2m on
  impairments and finance costs. Distributions fell 6.9% a year to SAR 394m, and the payout fell from 120.3% of FFO (FY2023) to
  92.0% (FY2025). The 9M 2026 figures are partial and unaudited: revenue rose 9.7% for the four funds that print it and
  distributions 14.1% for all eight.
main_changes:
  - change: "Acquisitions drove revenue. Group revenue rose 1.3% in FY2023, 4.3% in FY2024 and 10.0% in FY2025 (5.1% a year). In FY2025 SEDCO Capital (4.0 points), Bonyan (3.5) and Alinma Retail (2.0) added most."
    driver: "SEDCO Capital bought Atelier La Vie in 2023 with a SAR 600m rights issue and SAR 1,019m of schools and offices in 2025 with debt (revenue SAR 138m to SAR 216m). Alinma Retail turned from regional malls to Riyadh offices (SAR 48.7m to SAR 102m). Bonyan's revenue rose 15.6% in FY2025 after it bought two Riyadh office towers in 2024, and Mulkia added the Aljada complex and the Al-Maather tower. Derayah's revenue fell from SAR 123m to SAR 100m after a warehouse sale and tenant defaults, and Musharaka's from SAR 112m to SAR 97.2m with no change in its portfolio after 2022. Most funds do not disclose the revenue of properties bought or sold, so like-for-like growth is not determinable."
    evidence: "Company narratives 4344, 4345, 4347, 4336, 4339, 4335; group growth contributions in dataset.json"
    refs: ["4344-FY2022-REV", "4344-FY2025-REV", "4345-FY2025-REV", "4347-FY2025-REV", "4339-FY2025-REV", "4335-FY2025-REV"]
  - change: "Leverage rose. Borrowings grew from SAR 4,117m (FY2022) to SAR 6,171m (FY2025), 14.4% a year, and LTV (borrowings / total assets) from 33.5% to 42.8%. At end-2025 four funds had LTV of 44.8% or more: SEDCO Capital 51.5%, Mulkia 48.7%, Musharaka 47.0% and Alinma Retail 44.8%."
    driver: "The purchases were debt-funded: SEDCO Capital's borrowings rose to SAR 1,820m and Alinma Retail's from nil to SAR 655m. Musharaka breached a covenant on its Bank Al Jazira loan at 31 Dec 2025 and had obtained no waiver, so the bank may demand repayment. Bonyan (30.3%) and MEFIC (33.5%) had the lowest LTV."
    evidence: "Fund balance sheets; Musharaka FY2025 annual (covenant note); company narratives"
    refs: ["4344-FY2025-DEBT", "4345-FY2025-DEBT", "4336-FY2025-DEBT", "4335-FY2025-DEBT", "4347-FY2025-DEBT"]
  - change: "FFO fell and recovered; net profit kept falling. We calculate group FFO of SAR 477m (FY2022), SAR 342m (FY2023) and SAR 428m (FY2025), an FFO margin of 47.1%, 33.3% and 36.4%. Net profit fell from SAR 273m to SAR 51.2m (net margin 26.9% to 4.3%)."
    driver: "FFO excludes disposal gains and impairments, so it fell less than profit. Finance costs rose with borrowings (Alahli REIT SAR 20.9m to SAR 49.8m; SEDCO Capital SAR 34.5m to SAR 100.8m), and FY2022 FFO included SEDCO Capital's SAR 21.2m swap gain. FY2023 FFO fell most at Musharaka (SAR 48.0m to SAR 7.7m) and Derayah (SAR 65.8m to SAR 26.8m). FY2025 profit was cut by impairments at Musharaka (SAR 91.9m, giving a SAR 110m loss), Mulkia (SAR 40.7m) and Alinma Retail (SAR 24.9m); Musharaka alone took 57.1 points off the group's 66.7% profit fall."
    evidence: "Fund income statements; one-offs in company narratives 4335, 4336, 4345, 4344"
    refs: ["4344-FY2022-FFO", "4335-FY2023-FFO", "4339-FY2023-FFO", "4338-FY2025-FFO", "4335-FY2025-NI_ATTR", "4336-FY2025-NI_ATTR"]
  - change: "Distributions came down towards FFO. Distributions fell from SAR 489m (FY2022) to SAR 394m (FY2025), 6.9% a year, and the payout (distributions / FFO) from 120.3% in FY2023 to 92.0% in FY2025."
    driver: "In FY2025 distributions still exceeded FFO at Musharaka (158.7%), Alahli REIT (124.3%), Derayah (118.8%) and Mulkia (110.5%), while Bonyan (85.4%), SEDCO Capital (80.9%) and Alinma Retail (99.8%) were covered. MEFIC has paid no distribution since February 2024."
    evidence: "Statements of changes in net assets (distributions declared); company narratives"
    refs: ["4335-FY2025-DIST", "4338-FY2025-DIST", "4339-FY2025-DIST", "4336-FY2025-DIST", "4347-FY2025-DIST", "4346-FY2025-DIST"]
  - change: "NAV at fair value rose with new units, then stalled: SAR 8,170m (FY2022), SAR 9,239m (FY2023) and SAR 9,285m (FY2025). Book net assets fell from SAR 7,994m (FY2023) to SAR 7,406m (FY2025)."
    driver: "SEDCO Capital's SAR 600m rights issue and Mulkia's SAR 238.2m unit issue raised NAV in FY2023. Since then losses and distributions above FFO have reduced book net assets, and NAV at fair value fell at Musharaka (SAR 895m to SAR 784m) and Mulkia (-7.1% in FY2025)."
    evidence: "Fund NAV notes (fair value); company narratives 4344, 4336, 4335"
    refs: ["4344-FY2023-NAV_FV", "4336-FY2023-NAV_FV", "4335-FY2025-NAV_FV", "4336-FY2025-NAV_FV"]
  - change: "9M 2026 (partial and unaudited): revenue +9.7% for the four funds that print it (Alahli REIT, Mulkia, Alinma Retail, Musharaka), distributions +14.1% for all eight, NAV at fair value +2.1% for six."
    driver: "Alahli REIT contributed 8.9 of the 9.7 revenue points: its fact sheet shows revenue up 23.4%, with the hotel 73% occupied against 47% a year earlier, and its FFO, the only 9M FFO available, rose 80.1% to SAR 70.1m. SEDCO Capital contributed 10.7 of the 14.1 distribution points (SAR 78.3m against SAR 47.9m declared, including its Q4 2025 dividend declared in January 2026). MEFIC reports a 9M net loss of SAR 9.5m (a profit of SAR 8.7m)."
    evidence: "Quarterly fact sheets and unitholder statements (company narratives 4338, 4344, 4346)"
    refs: ["4338-9M2026-REV", "4338-9M2026-FFO", "4344-9M2026-DIST", "4346-9M2026-NI_ATTR"]
takeaways:
  improved: "FFO recovered from SAR 342m (FY2023) to SAR 428m (FY2025; +19.7% in FY2025) and the FFO margin from 33.3% to 36.4%. Revenue rose 10.0% in FY2025, and distributions fell below FFO (payout 92.0%)."
  weakened: "Net profit fell from SAR 273m to SAR 51.2m (ROE 0.7% in FY2025), LTV rose from 33.5% to 42.8%, distributions fell 6.9% a year, and FFO is still below FY2022 (-3.6% a year). Book net assets fell from SAR 7,994m (FY2023) to SAR 7,406m."
  why: "Debt-funded purchases added rent, but finance costs rose faster; impairments on malls, compounds and towers (Musharaka, Mulkia, Alinma Retail) and tenant defaults and receivable losses (Derayah, MEFIC) cut profit. FFO, which excludes impairments and disposal gains, fell less."
  concentration: "No fund dominates: Bonyan, the largest, is 23.6% of FY2025 revenue (HHI about 1,500 out of 10,000). Bonyan also had the highest FFO margin (52.8%) and the lowest LTV (30.3%) of the eight in FY2025. Excluding Bonyan, FFO fell 7.3% a year (group -3.6%), the FFO margin was 31.3% in FY2025 (group 36.4%), the payout 95.4% (92.0%) and LTV 44.9% (42.8%), and the other seven made a combined net loss of SAR 52.5m in FY2025."
  ytd_2026: "Partial and unaudited, so not a group trend. 9M 2026 vs 9M 2025: revenue +9.7% (4 of 8 funds), net profit +45.1% (2 funds: Alahli REIT and MEFIC), FFO +80.1% (1 fund: Alahli REIT), distributions +14.1% (all 8), NAV at fair value +2.1% (6 funds), LTV 31.6% against 31.7% (2 funds: Bonyan and MEFIC)."
  uncertain: "Musharaka's lender may demand repayment after the covenant breach; the 9M data are unaudited and partial; most funds do not disclose the revenue of properties bought or sold; Alinma Retail's fall in units in Q2 2026 and MEFIC's 9M loss are not explained."
data_notes:
  - "9M 2025 and 9M 2026 come from unaudited quarterly fact sheets and unitholder statements, which print only some items, so 9M totals cover fewer funds: revenue 4 (Alahli REIT, Mulkia, Alinma Retail, Musharaka; Bonyan, SEDCO Capital, Derayah and MEFIC print none), net profit 2 (Alahli REIT, MEFIC), FFO 1 (Alahli REIT), distributions 8, NAV at fair value 6 (not Alinma Retail or Musharaka), LTV 2 (Bonyan, MEFIC) and net debt none. The 9M FFO margin, payout and net margin are Alahli REIT's alone."
  - "9M revenue bases differ: Alahli REIT's is the fact sheet's direct revenue; Mulkia, Alinma Retail and Musharaka sum quarterly rental income, which does not reconcile exactly with audited revenue (Mulkia's four 2025 quarters add to SAR 101.5m against SAR 124.4m audited rental and hotel revenue)."
  - "FFO is our calculation for every fund: net profit + depreciation and impairment of real estate - gains on property disposals. It excludes disposal gains (e.g. Alinma Retail SAR 107.9m in FY2024; Bonyan SAR 26.1m and Derayah SAR 21.8m in FY2023) and impairments and their reversals. Revenue also excludes disposal gains that funds print inside their revenue lines."
  - "Distributions are those declared in the period (statement of changes in net assets), and payout = distributions / FFO. Several funds declare their Q4 dividend in January, so declaration timing moves year-on-year comparisons."
  - "LTV = borrowings / total assets at book value. NAV at fair value is net assets with investment properties at the fair values the funds disclose in their notes; the statements carry property at cost less depreciation and impairment."
  - "No FY2022 annual is in the archive for Alahli REIT, Mulkia, Alinma Retail and Musharaka; their FY2022 figures are the FY2023 annuals' comparatives. There are no short years."
  - "The benchmark selected these REITs as retail, but their portfolios are mixed: malls, offices, hotels, schools, residential compounds and warehouses."
  - "Alahli REIT 1 (4338) is 68.73% owned and consolidated by Alandalus Property in the Malls group, so adding the two groups double-counts its properties."
