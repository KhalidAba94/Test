what_it_means:
  improved: "Revenue grew 9.3% a year from FY2022 to FY2025 as acquisitions were added, and FFO rose from SAR 16.0m in FY2023 to SAR 30.0m in FY2025, lifting the FFO margin from 14.0% to 24.0%."
  weakened: "Impairments left net profit negative in FY2022, FY2023 and FY2025 (net margin -22.6% in FY2025), distributions exceeded FFO every year (110.5% in FY2025), and LTV rose from 36.4% to 48.7% between FY2023 and FY2025."
  why: "Hotel revenue fell 13.8% in FY2025 while debt-funded purchases (Al-Maather for SAR 200m) raised financing charges to SAR 45.7m, and property values were written down by SAR 40.7m."
  uncertain: "The part-year revenue of the properties bought and sold is not disclosed, so like-for-like growth cannot be measured, and the quarterly statements behind 9M 2026 give no profit and use a revenue measure that does not reconcile with the audited figures."
confidence_overall: "Medium"
data_notes:
  - "9M 2025 and 9M 2026 are partial: the archive holds quarterly unitholder statements only. 9M revenue sums the statements' 'Rental income for current quarter' (the four 2025 quarters total SAR 101.5m against audited rental plus hotel revenue of SAR 124.4m), 9M depreciation and impairment sum the quarterly expense tables (2025 depreciation is combined with credit-loss provisions and is not used), and NAV is at fair value. No profit, cash, borrowings or book net assets are printed, so 9M FFO, margins, ROE and LTV are blank."
  - "FY2025 revenue excludes the SAR 4,935,587 capital gain on the Al Yasmin sale that the statements print inside 'Total revenues' (override, provenance C); the gain is recorded as GAIN_DISP and deducted in FFO."
  - "The FY2025 annual (note 28) reclassified the hotel part of a dual-use property from investment property to property and equipment as a correction of a prior-period error; FY2024 depreciation was split (16.8m + 3.9m) with no change in total depreciation, revenue, profit, total assets or net assets. DA_CF includes both parts."
  - "Murabaha commission income (FY2023 SAR 1.2m, FY2024 SAR 0.5m, FY2025 SAR 0.8m) is printed inside total revenues and is kept in REV."
  - "No FY2022 annual is in the archive: FY2022 is the FY2023 annual's comparative column. FY2021 net assets and cash come from its 2022 column; FY2021 NAV at fair value (SAR 675m) comes from the unaudited fund annual report; FY2021 total assets and borrowings are not printed."
  - "Distributions are those declared in the year (statement of changes in net assets): from FY2024 four quarterly dividends of SAR 0.08 per unit, the Q4 dividend being declared the following January."
  - "The statements are consolidated (Aljada Hotel Company); there are no non-controlling interests, so NI_ATTR equals net profit. Auditor's report pages are scanned images (read by OCR); opinions unmodified with no emphasis of matter."
