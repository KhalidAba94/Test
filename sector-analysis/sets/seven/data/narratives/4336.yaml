    - {item: "Finance structuring fees on new drawdowns", period: "FY2022", amount_sar_m: -2.3, line: "Finance structure fees", source: "4336_MULKIA_REIT/2023_Annual_filed2024-04-01.pdf p.9", tax_nci: "Zakat effect not disclosed; no non-controlling interests: not determinable, profit and FFO kept as reported"}
    - {item: "Dealing fees on the Al-Maather acquisition", period: "FY2024", amount_sar_m: -2.3, line: "Dealing fees", source: "4336_MULKIA_REIT/2025_Annual_filed2026-03-31_t16-55-39.pdf p.10", tax_nci: "Zakat effect not disclosed; no non-controlling interests: not determinable, profit and FFO kept as reported"}
