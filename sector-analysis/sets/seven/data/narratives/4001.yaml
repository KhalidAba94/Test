    tax_nci: 'Zakat SAR 2.5m disclosed (net SAR 97.0m); minority share not disclosed: not determinable, profit kept as reported'
  - item: Share of the Gulf Flour Milling joint venture's capital gain on the Fourth Milling IPO (outside our operating income and EBITDA; affects attributable profit only)
