developments:
- date: '2022-09-27'
  category: M&A
  text: Sold its 13.653% stake in Abdullah Al-Othaim for Investment Company to the founding shareholder for SAR 846.5m, booking a SAR 608.5m gain.
  source: 4001_A_OTHAIM_MARKET/2023_Annual_filed2024-04-14.pdf p.38, p.55
- date: 2022-08 / 2023-06
  category: M&A
  text: 'Sold two plots of land to the related Abdullah Al-Othaim Investment Company: Madinah for SAR 211.3m (2022) and Al-Mahra, Riyadh, for SAR 186.6m (2023).'
  source: 4001_A_OTHAIM_MARKET/2022_Annual_filed2023-04-10.pdf p.36; 4001_A_OTHAIM_MARKET/2023_Annual_filed2024-04-14.pdf p.37, p.55
- date: 2025-03 (FY2024 annual)
  category: event
  text: 'Restated FY2023 and the 1 January 2023 balance sheet for an error: a related-party sublease is now a finance lease; FY2023 attributable profit fell by SAR 8.7m and equity rose by SAR 54.3m.'
  source: 4001_A_OTHAIM_MARKET/2024_Annual_filed2025-04-08.pdf p.54-57
- date: '2025'
  category: mix
  text: Mueen Human Resources (68% owned) changed its revenue accounting under IFRS 15 so recoverable manpower costs are now in revenue and cost of revenue; Mueen sales reached SAR 582m in FY2025.
  source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.50, p.56
- date: 2024-2026
  category: financing
  text: Short-term loans and Murabaha rose from nil at end-2023 to SAR 665m at 30 Sep 2026; dividends paid fell to SAR 108m in 9M 2026 (SAR 306m in 9M 2025).
  source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.4, p.9; 4001_A_OTHAIM_MARKET/2024_Annual_filed2025-04-08.pdf p.8
- date: '2026-08-31'
  category: M&A
  text: Sold its 55% associate stake in Riyadh Food Industries for SAR 55m (gain SAR 10.1m).
  source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.18
- date: 2026 (9M)
  category: operations
  text: A physical inventory count found net shrinkage of SAR 124.6m; SAR 131.7m of stock was written off against the provision. Three plots of land (SAR 85.8m) were moved to assets held for sale.
  source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.19, p.26
what_it_means:
  improved: Revenue grew every year (5.1% a year from FY2022 to FY2025, we calculate), helped by the Mueen labour-services business, whose sales rose from SAR 240m in FY2022 to SAR 582m in FY2025.
  weakened: 'Profitability fell steadily: the operating margin fell from 12.0% to 3.4% between FY2022 and FY2025, attributable profit fell to SAR 250m, and 9M 2026 brought an attributable loss of SAR 92.7m
    while net debt including leases rose to SAR 2,893m.'
  why: FY2022 and FY2023 profit was lifted by SAR 818.7m of disposal gains and FY2024 by a SAR 161.3m joint-venture gain; underneath, retail and wholesale sales grew slowly and then fell 6.0% in 9M 2026,
    while shrinkage provisions and finance costs rose.
  uncertain: The filings do not give store numbers or like-for-like sales, and they do not say whether the 2026 shrinkage charge will recur; how much of the retail decline is price, traffic or store closures
    is not determinable.
confidence_overall: Medium
data_notes:
- 'FY2023 is restated (FY2024 annual note 37: a related-party sublease corrected from operating to finance lease, plus reclassifications); the 31 Dec 2022 balance sheet is taken from the restated 1 January
  2023 column of the FY2024 annual (p.8), read from the PDF.'
- 'FY2024 is re-presented in the FY2025 annual (note 36: reclassifications and the Mueen IFRS 15 change, revenue +SAR 47.2m, CFO SAR 910.3m to SAR 909.3m) and 9M 2025 in the 2026 Q3 interim (note 23, revenue
  +SAR 31.9m); FY2022 and FY2023 revenue are not on this basis, so FY2023/FY2022 and FY2024/FY2023 growth include presentation steps (see bridge).'
- Rental income (FY2025 SAR 128.5m gross, SAR 93.6m net) is shown below gross profit and is not in revenue; it is inside our operating income.
- 'Zakat and tax (ZAKAT_TAX) is net of prior-year zakat reversals: FY2024 is a net credit of SAR 0.6m (reversal SAR 17.7m) and FY2023 includes a SAR 0.8m reversal (corrected from the PDF, FY2024 annual p.9).'
- 'Capex is PP&E plus intangibles; cash spent on investment property is kept out of capex and deducted separately in free cash flow (IP_CAPEX: SAR 93.1m FY2022, SAR 224.2m FY2023, SAR 49.7m FY2024, SAR
  15.7m FY2025, SAR 6.5m 9M 2025, SAR 0.65m 9M 2026).'
- Operating cash flow is after zakat paid and before finance costs paid on leases, which are in financing activities (9M 2026 shows lease interest separately in financing).
- 'There is no XBRL file for the 2026 Q3 interim: all 9M 2026 figures were read from the PDF (scanned pages, OCR checked against totals). Primary statements in several filings are scanned images.'
- FY2022 profit includes a SAR 0.2m loss from discontinued operations; our PBT is continuing operations only.
- 'Net debt deducts short-term bank deposits held outside cash (original maturities over three months): SAR 375m at end-2022 and SAR 35.0m at end-2023 (FY2024 annual note
  16-a, p.42) and about SAR 1m at end-2024 and end-2025. End-2022 net debt is therefore SAR 1,038m (0.7x EBITDA).'
- 'Cross-holding: Othaim owns a third of Gulf Flour Milling Industrial Co., which holds Fourth Milling (100% until its October 2024 IPO, 70% after; Supporting group), so Othaim''s share of that joint
  venture''s results, SAR 46.0m (FY2022), SAR 30.1m (FY2023), SAR 28.7m (FY2024, plus the SAR 161.3m IPO gain, which is not Fourth Milling profit) and SAR 46.6m (FY2025), is profit also counted in Fourth
  Milling''s figures.'
