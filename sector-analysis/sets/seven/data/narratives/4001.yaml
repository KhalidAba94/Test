ticker: '4001'
headline: Revenue rose every year from SAR 9,550m (FY2022) to SAR 11,089m (FY2025), but attributable profit fell from SAR 1,080m to SAR 250m as large disposal gains fell away and the retail margin narrowed;
  in 9M 2026 revenue fell 3.3% and the company made an attributable loss of SAR 92.7m after SAR 153.8m of inventory provisions.
lfl_basis:
  definition_used: 'Standard bridge on IFRS revenue (net sales). Net rental income from stores and malls is shown below gross profit and is not in revenue. Othaim made no business combinations from FY2022
    to 9M 2026: the stakes it sold (Abdullah Al-Othaim for Investment Company in 2022, Riyadh Food Industries in 2026) were equity-accounted, and the subsidiaries it wound up were dormant, so perimeter
    effects are nil. Two presentation changes break the revenue series: restated FY2023 includes a SAR 29.9m reclassification not applied to FY2022, and FY2024 was re-presented by SAR 47.2m (mainly the
    Mueen IFRS 15 change) without re-presenting FY2023. Store openings and like-for-like sales are not disclosed, so new capacity and like-for-like growth are not determinable; organic growth is the closest
    measure.'
  perimeter_changes:
  - event: Sale of the 13.653% associate stake in Abdullah Al-Othaim for Investment Company to Al-Othaim Holding Company for SAR 846.5m
    date: '2022-09-27'
    effect: equity-accounted, no revenue effect; gain SAR 608.5m
    source: 4001_A_OTHAIM_MARKET/2023_Annual_filed2024-04-14.pdf p.38, p.55
  - event: Discontinued maintenance activity of Mueen Business Company for Maintenance and Operation
    date: 2021-2022
    effect: shown below continuing profit (loss SAR 0.2m in FY2022); not in revenue
    source: 4001_A_OTHAIM_MARKET/2023_Annual_filed2024-04-14.pdf p.44
  - event: Dormant subsidiaries transferred into branches and liquidated (Thamarat Al Qassim, Shurofat Al Jazeerah, Marafeq Al Tashgheel, Seven Services)
    date: 2022-2025
    effect: no activity, no revenue effect
    source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.15-16
  - event: Sale of the 55% associate stake in Riyadh Food Industries Company for SAR 55m
    date: '2026-08-31'
    effect: equity-accounted, no revenue effect; gain SAR 10.1m
    source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.18
  capacity_changes:
  - event: Store openings and closures
    date: FY2022-9M2026
    effect: not disclosed in the statements; not determinable
    source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.49
  fx_exposure: 'The Egypt subsidiary (about 2% of retail and wholesale sales: SAR 230.3m in FY2025, SAR 186.8m in 9M 2026) reports in Egyptian pounds; the translation effect is not disclosed and is not
    determinable. All other business is in riyals.'
  price_volume_support: Not determinable. The statements give segment revenue (retail and wholesale, Mueen labour services, rental) and an Egypt split, but no store count, sales area, traffic, basket or
    like-for-like figures.
  confidence: Medium (perimeter nil with High confidence; the accounting step is disclosed; new capacity is not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Revenue fell SAR 275m. Retail and wholesale sales to outside customers fell 6.0% (SAR 8,012m to SAR 7,533m), while Mueen labour-services sales rose 50.1% (SAR 405m to SAR 607m). Prices, volumes
    and store numbers are not disclosed, so the retail decline cannot be split.
  basis: disclosed (segment revenue); price/volume split not determinable
  confidence: High for the segment amounts; split not determinable
  source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.23-24 (segments)
  refs:
  - 4001-9M2026-REV
  - 4001-9M2025-REV
- period: FY2025 vs FY2024
  text: Revenue rose SAR 326m. Retail and wholesale sales rose 1.1% (SAR 10,396m to SAR 10,507m) and Mueen sales 58.6% (SAR 367m to SAR 582m), so Mueen gave about two thirds of the growth (we calculate).
  basis: disclosed (segment revenue); split not determinable
  confidence: High for the amounts
  source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.50 (segments)
  refs:
  - 4001-FY2025-REV
  - 4001-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: Revenue rose 7.2% (6.8% on a consistent basis, we calculate, after a SAR 29.9m reclassification) and the gross margin was 22.2% (21.8%). Attributable profit fell 55.3% to SAR 482m because FY2022
      included a SAR 608.5m gain on selling the stake in Abdullah Al-Othaim for Investment Company and a SAR 110.6m land-sale gain, against a SAR 99.5m land-sale gain in FY2023. Finance costs rose to SAR
      113m (SAR 83.5m). Operating margin fell from 12.0% to 5.5%.
    source: 4001_A_OTHAIM_MARKET/2024_Annual_filed2025-04-08.pdf p.9 (P&L, restated), p.57 (note 37); 4001_A_OTHAIM_MARKET/2023_Annual_filed2024-04-14.pdf p.10, p.55 (note 33)
    refs:
    - 4001-FY2023-REV
    - 4001-FY2023-NI_ATTR
    - 4001-FY2022-NI_ATTR
    - 4001-FY2023-OPINC
  - period: FY2024
    driver: 'Revenue rose 5.2%: retail and wholesale sales +4.0% and Mueen labour services +53.8% (SAR 33.5m of it from the IFRS 15 change). Our operating income fell 17.3% to SAR 465m as selling costs
      grew and finance costs rose to SAR 160m with short-term loans of SAR 315m. Attributable profit still rose 6.0% to SAR 511m because the share of joint-venture profit jumped to SAR 198m (SAR 32.3m),
      of which SAR 161.3m was Othaim''s share of the capital gain from the Fourth Milling IPO at Gulf Flour Milling, and because a SAR 17.7m prior-year zakat reversal gave a small net zakat credit. Net
      margin 4.7%.'
    source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.9 (P&L), p.50 (segments), p.56 (note 36); 4001_A_OTHAIM_MARKET/2024_Annual_filed2025-04-08.pdf p.37 (JV note)
    refs:
    - 4001-FY2024-REV
    - 4001-FY2024-OPINC
    - 4001-FY2024-SHARE_JV
    - 4001-FY2024-NI_ATTR
    - 4001-FY2024-ZAKAT_TAX
  - period: FY2025
    driver: Revenue rose 3.0% but operating income fell 19.7% to SAR 374m. Retail and wholesale sales grew only 1.1% and that segment's operating profit fell to SAR 225m (SAR 351m); the inventory shrinkage
      and slow-moving provision charge rose to SAR 61.9m (SAR 0.6m) and selling and marketing costs rose 8.7%. The share of joint-venture profit returned to SAR 51.4m. Attributable profit fell 51.1% to
      SAR 250m. Net margin 2.3%, EBITDA margin 7.4%, ROE 19.2%.
    source: 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.9 (P&L), p.12 (cash flow), p.50 (segments)
    refs:
    - 4001-FY2025-REV
    - 4001-FY2025-OPINC
    - 4001-FY2025-NI_ATTR
    - 4001-FY2025-SHARE_JV
    - 4001-FY2025-EBITDA_C
  - period: 9M2026
    driver: Revenue fell 3.3% to SAR 8,141m and the gross margin fell to 19.9% (21.1%). Inventory provisions of SAR 153.8m (SAR 30.0m) included SAR 123.7m for shrinkage after a physical count found net
      shrinkage of SAR 124.6m; the retail and wholesale segment made an operating loss of SAR 141m (profit SAR 131m). Our operating income was -SAR 18.1m, including a SAR 10.1m gain on selling Riyadh Food
      Industries. The attributable loss was SAR 92.7m (profit SAR 135m). Operating cash flow fell 31.7% to SAR 396m.
    source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.5 (P&L), p.8 (cash flow), p.19 (inventories), p.23-24 (segments)
    refs:
    - 4001-9M2026-REV
    - 4001-9M2026-GP
    - 4001-9M2026-OPINC
    - 4001-9M2026-NI_ATTR
    - 4001-9M2026-CFO
  - period: FY2022-9M2026
    driver: 'Borrowing replaced cash: short-term loans rose from nil (end-2023) to SAR 665m at 30 Sep 2026 while dividends of SAR 540m (FY2024) and SAR 414m (FY2025) exceeded profit. Net debt including
      SAR 2,347m of lease liabilities reached SAR 2,893m, or 6.8 times annualised EBITDA (we calculate), and equity attributable fell to SAR 1,049m.'
    source: 4001_A_OTHAIM_MARKET/2026_Q3_filed2026-11-17.pdf p.4 (balance sheet), p.9 (cash flow); 4001_A_OTHAIM_MARKET/2025_Annual_filed2026-03-30.pdf p.12
    refs:
    - 4001-9M2026-DEBT
    - 4001-9M2026-LEASE_LIAB
    - 4001-9M2026-NET_DEBT
    - 4001-9M2026-EQ_ATTR
  one_offs:
  - item: Gain on sale of investment in associate (Abdullah Al-Othaim for Investment Company)
