ticker: '4164'
headline: Revenue grew every year from SAR 8,616m (FY2022) to SAR 10,213m (FY2025) and 7.0% in 9M 2026 as pharma and clinic sales rose, but attributable profit slipped from SAR 888m to SAR 831m (SAR 623m in 9M 2026, -4.9%) as gross margin and the higher lease and finance costs of a larger network weighed.
lfl_basis:
  definition_used: 'Standard bridge on IFRS revenue. Nahdi made no acquisitions or disposals from FY2022 to 9M 2026: the subsidiaries (Nahdi Care clinics, Al Sakhaa, Nahdi Investment and its UAE pharmacy and drug-store companies) are unchanged, and the only new entity (Rawa Alsihha, July 2026) is a start-up, so perimeter effects are nil and organic growth equals reported growth. Revenue is in SAR and AED, both pegged to the US dollar, so FX is nil. The financial statements give no pharmacy count, no openings and no like-for-like (same-store) sales, so the new-capacity step and like-for-like growth are not determinable; organic growth is the closest available measure.'
  perimeter_changes:
  - event: No business combinations or disposals; subsidiaries unchanged FY2022-FY2025
    date: FY2022-FY2025
    effect: nil
    source: 4164_NAHDI/2024_Annual_filed2025-03-12.pdf p.12; 4164_NAHDI/2025_Annual_filed2026-03-16.pdf p.12
  - event: Rawa Alsihha Company established (supply chain and delivery start-up)
    date: '2026-07-16'
    effect: no acquired revenue
    source: 4164_NAHDI/2026_Q3_filed2026-10-29.pdf p.11
  capacity_changes:
  - event: 39 pharmacy leases terminated before expiry; openings not disclosed
    date: '2024'
    effect: not determinable
    source: 4164_NAHDI/2024_Annual_filed2025-03-12.pdf p.35
  - event: 49 pharmacy leases terminated before expiry; openings not disclosed
    date: '2025'
    effect: not determinable
    source: 4164_NAHDI/2025_Annual_filed2026-03-16.pdf p.36
  - event: Clinic and other revenue (mainly Nahdi Care clinics) rose from SAR 74.6m (FY2022) to SAR 577.8m (FY2025)
    date: FY2022-FY2025
    effect: part from new clinics not disclosed
    source: 4164_NAHDI/2023_Annual_filed2024-03-18.pdf p.46; 4164_NAHDI/2025_Annual_filed2026-03-16.pdf p.45
  fx_exposure: More than 90% of operations are in KSA; the UAE pharmacies earn AED, which is pegged to the US dollar. No FX translation effect identified.
  price_volume_support: Not determinable. The filings split revenue into front shop, pharma and other (mainly clinics) but give no basket size, transactions, prices or store counts, so price and volume cannot be separated.
  confidence: Medium (perimeter and FX nil with High confidence; new capacity not determinable)
price_volume:
