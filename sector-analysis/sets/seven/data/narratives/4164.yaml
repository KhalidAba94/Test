  text: Revenue rose SAR 767m. Front-shop revenue rose 7.4% (SAR 3,907m to SAR 4,195m), pharma 5.0% (SAR 5,183m to SAR 5,440m) and clinic and other revenue 62.3% (SAR 356m to SAR 578m). Price and volume are not disclosed.
  basis: disclosed (revenue by category); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 4164_NAHDI/2025_Annual_filed2026-03-16.pdf p.45
  refs:
  - 4164-FY2025-REV
  - 4164-FY2024-REV
- period: 9M2026 vs 9M2025
  text: Revenue rose SAR 537m (+7.0%). Pharma added SAR 344m (+8.6%), clinic and other revenue SAR 151m (+36.4%) and front shop SAR 42.5m (+1.3%), so pharma and clinics gave 92% of the increase (we calculate). Price and volume are not disclosed.
  basis: disclosed (revenue by category); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 4164_NAHDI/2026_Q3_filed2026-10-29.pdf p.25
  refs:
  - 4164-9M2026-REV
  - 4164-9M2025-REV
- period: FY2024 vs FY2023
  text: Revenue rose 8.4% as pharma grew 17.5% (SAR 4,412m to SAR 5,183m) and clinic and other revenue doubled (SAR 172m to SAR 356m), while front-shop revenue fell 5.4% (SAR 4,130m to SAR 3,907m). Pharma rose from 49.5% of revenue in FY2022 to 53.3% in FY2025 (we calculate).
  basis: disclosed (revenue by category); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 4164_NAHDI/2024_Annual_filed2025-03-12.pdf p.43; 4164_NAHDI/2023_Annual_filed2024-03-18.pdf p.46
