developments:
- date: '2022-09-15'
  category: M&A
  text: Merged with its former parent, Al Raha Al Safi Food Company, which had bought the company from the state in December 2020; the merger
    brought SAR 1,090.7m of goodwill and the acquisition loans onto First Milling's balance sheet.
  source: 2283_FIRST_MILLS/2022_Annual_filed2023-06-22.pdf p.63; 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.27
- date: '2023-06-22'
  category: event
  text: Listed on the Saudi Exchange.
  source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.11
- date: '2024'
  category: financing
  text: Took an interest-free SAR 150m working-capital loan from SIDF, fully repaid in 9M 2026; a further SIDF facility of SAR 69.4m for the Jeddah
    plant was drawn to SAR 55.2m by 30 Sep 2026.
  source: 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.25
- date: '2024-12-17'
  category: regulation
  text: GFSA raised a claim after an October 2024 inspection under the Flour Mills Law; the company provided SAR 2m and objected.
  source: 2283_FIRST_MILLS/2024_Annual_filed2025-03-19.pdf p.49; 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.48
- date: '2025-09-18'
  category: M&A
  text: Bought Al-Manar Feed Company (feed production, Jeddah) for SAR 77m, funded partly by a SAB loan.
  source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.29-30; 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.25
- date: '2025-12-01'
  category: M&A
  text: Bought 60% of Al-Kenan Arabia for Trading Company (feed and bran distribution, Buraydah) for SAR 36m; the company reports its pro-forma
    2025 revenue at SAR 16.88m.
  source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.31
- date: '2025-12-31'
  category: capacity
  text: Upgrade of Mill A (Jeddah) and a new Mill C (Qassim) were under construction, with SAR 48.9m of commitments; SAR 48.55m of the SAB facility
    was drawn in 2026 for Mill C.
  source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.34; 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.25
- date: '2026-09-16'
  category: financing
  text: 'Paid an H1 2026 dividend of SAR 99.3m (FY2025 dividends paid: SAR 152.9m).'
  source: 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.24; 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.10
what_it_means:
  improved: Revenue grew 7.9% a year from FY2022 to FY2025 and attributable profit 8.5% a year, with the EBITDA margin between 33.6% and 35.7%;
    borrowings fell every year and net debt to EBITDA eased from 4.25x to 2.91x.
  weakened: 'In 9M 2026 profit grew more slowly than revenue: the gross margin rose but selling costs jumped and interest income fell, so the
    net margin slipped to 23.6% from 25.1%, and part of the profit now belongs to minority shareholders.'
  why: Growth came from feed and flour sales in Jeddah and Qassim, helped in 2026 by the two feed businesses bought in late 2025; lower finance
    costs added to profit in FY2025.
  uncertain: The filings give no volumes, prices or capacity, so how much growth came from the new feed businesses, new mills or prices is not
    determinable; the largest customer's share fell from 19.9% to 5.7% of nine-month revenue.
confidence_overall: Medium
data_notes:
- 'Units: the XBRL files of the FY2025 annual and the 2026 Q3 interim carry SAR thousands tagged as riyals, so every FY2024, FY2025, 9M2025 and
  9M2026 figure was read from the PDFs (overrides); the PDFs are in riyals.'
- Balance-sheet figures (total assets, equity, cash, borrowings, lease liabilities) are not in the XBRL extract and were read from the PDFs for
  every period, FY2021 to 9M2026.
- 'FY2023 was re-presented in the FY2024 annual: finance costs and finance income both rose by SAR 1.05m (cost-of-hedging amortisation shown gross,
  notes 30-31) and operating cash flow fell from SAR 317.9m to SAR 307.5m (related-party movement moved to financing). Figures used are the re-presented
  ones (R).'
- FY2021 lease liabilities were re-split between current and non-current in the FY2022 annual (note 41, auditor emphasis of matter); the total
  of SAR 358.7m is unchanged.
- 'Borrowings (DEBT) exclude long-term payables to Buhler AG for machinery bought on instalments, which carry a finance cost: SAR 40.5m (FY2023),
  33.1m (FY2024), 58.6m (FY2025), 29.4m (9M2025) and 50.6m (9M2026). Net debt would be higher by these amounts.'
- Operating cash flow is after interest paid and interest received (both in operating activities); Arabian Mills and Fourth Milling show interest
  paid in financing, so their CFO is not on the same basis.
- 'The impairment add-back is nil for every period: the XBRL row is the expected credit loss on receivables, which is excluded from EBITDA add-backs
  (FY2024, FY2025 corrected to 0).'
- The September 2022 merger with the former parent added goodwill and SAR 1.17bn of loans; FY2021 (no borrowings) is not comparable with later
  years.
- Primary statements in the FY2024 annual and the 2025 Q3 interim are scanned images (read visually and by OCR); the FY2023 annual is an OCR text
  layer and was used only where it agrees with other filings.
- 'Non-controlling interests (40% of Al-Kenan Arabia) exist only from 1 Dec 2025: NI_NCI SAR 0.3m in FY2025 and SAR 8.7m in 9M 2026.'
- Listed on 22 Jun 2023; the archive holds statements from FY2022 (with FY2021 comparatives).
