ticker: '2283'
headline: Revenue grew every year from SAR 914m (FY2022) to SAR 1,146m (FY2025) and attributable profit from SAR 217m to SAR 277m, with an EBITDA
  margin of about 35%; in 9M 2026 revenue rose 21.3% to SAR 980m, led by feed sales (+57.1%) after two feed acquisitions in late 2025.
lfl_basis:
  definition_used: 'Standard bridge on IFRS revenue. First Milling was a single entity until 2024; the 2022 merger with its former parent added
    goodwill and debt but no revenue. Perimeter effects start with the late-2025 acquisitions: Al-Kenan Arabia added SAR 2.36m in FY2025 (disclosed);
    Al-Manar Feed sells only inside the group. The 9M 2026 perimeter effect is not determinable because Al-Kenan''s interim revenue is not disclosed.
    The filings give no volumes, capacity or same-store measure, so the effect of new or upgraded mills is not determinable and organic growth
    is the closest measure of the existing business.'
  perimeter_changes:
  - event: Statutory merger with former parent Al Raha Al Safi (holding company)
    date: '2022-09-15'
    effect: no revenue effect; goodwill SAR 1,090.7m and loans came in
    source: 2283_FIRST_MILLS/2022_Annual_filed2023-06-22.pdf p.63
  - event: First Food Supplies Company incorporated (distribution start-up)
    date: '2024'
    effect: no acquired revenue
    source: 2283_FIRST_MILLS/2024_Annual_filed2025-03-19.pdf p.12
  - event: Al-Manar Feed acquired (100%, SAR 77m)
    date: '2025-09-18'
    effect: revenue nil after elimination (SAR 3.34m intra-group)
    source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.30
  - event: Al-Kenan Arabia acquired (60%, SAR 36m)
    date: '2025-12-01'
    effect: SAR 2.36m of FY2025 revenue (disclosed); 9M 2026 contribution not disclosed
    source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.31
  capacity_changes:
  - event: Bran tower (Jeddah) and new Mill C (Qassim) under construction
    date: '2024'
    effect: not determinable
    source: 2283_FIRST_MILLS/2024_Annual_filed2025-03-19.pdf p.44
  - event: Mill A upgrade (Jeddah) and new Mill C (Qassim) still under progress; commitments SAR 48.9m
    date: '2025-12-31'
    effect: not determinable
    source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.34
  - event: 'Projects under progress fell to SAR 64.6m (end-2025: SAR 138.9m); SAR 48.55m drawn for Mill C'
    date: 2026 (9M)
    effect: not determinable
    source: 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.17, p.25
  fx_exposure: 'None on revenue: all revenue is earned in Saudi Arabia in riyals. Machinery bought from Buhler AG is payable in Swiss francs (exchange
    loss SAR 0.6m in FY2024), which affects costs, not revenue.'
  price_volume_support: Not determinable. Revenue is split by product (flour, feed, bran) and by region, but no tonnes, prices or capacity are
    disclosed. Flour in bags of 45kg and above is sold at GFSA-regulated prices and subsidised wheat costs SAR 180 a tonne, unchanged since 2017.
  confidence: Medium (perimeter disclosed for FY2025; not determinable for 9M 2026; new-capacity effect not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Revenue rose SAR 172m. Feed added SAR 134m (+57.1%), flour SAR 59.9m (+12.8%) and bran fell SAR 21.9m (-20.5%). By region Jeddah rose
    32.3% and Qassim 21.8%, the regions where the two acquired feed businesses operate. Volumes and prices are not disclosed, so price and volume
    cannot be separated.
  basis: disclosed (product and segment revenue); price/volume split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.27 (products), p.18 (segments)
  refs:
  - 2283-9M2026-REV
  - 2283-9M2025-REV
- period: FY2025 vs FY2024
  text: Flour revenue rose 8.8%, feed 12.8% and bran 3.6%. Jeddah grew 12.7% and Qassim 10.4%, while Al Ahsa fell 3.7%. No volumes or prices are
    disclosed.
  basis: disclosed (product and segment revenue); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.48 (products), p.25 (segments)
  refs:
  - 2283-FY2025-REV
  - 2283-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: Revenue +5.5%, led by flour (+9.0%); feed was flat. Operating income rose 12.2% as G&A fell to SAR 78.1m (SAR 102.3m), but attributable
      profit rose only 1.3% because finance costs were SAR 94.7m (SAR 36.9m) in the first full year of the loans taken on in the September 2022
      merger, partly offset by finance income of SAR 33.8m (SAR 4.8m), mainly from the profit-rate cap hedge. EBITDA margin 34.8% (we calculate).
    source: 2283_FIRST_MILLS/2024_Annual_filed2025-03-19.pdf p.8 (P&L), p.50 (finance costs and income); 2283_FIRST_MILLS/2023_Annual_filed2024-03-14.pdf
      p.44-45
    refs:
    - 2283-FY2023-REV
    - 2283-FY2023-NI_ATTR
    - 2283-FY2023-FIN_COST
    - 2283-FY2023-FIN_INC
    - 2283-FY2023-OPINC
  - period: FY2024
    driver: 'Revenue +8.8%: feed +15.1% and flour +8.4%. Gross margin recovered to 43.6% (42.8%) and attributable profit rose 13.9% to SAR 251m.
      Selling costs rose to SAR 55.6m (SAR 47.8m); finance costs (SAR 96.3m) and finance income (SAR 34.8m) were little changed. Net margin 23.9%.'
    source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.8 (P&L), p.48 (products); 2283_FIRST_MILLS/2024_Annual_filed2025-03-19.pdf p.8
    refs:
    - 2283-FY2024-REV
    - 2283-FY2024-GP
    - 2283-FY2024-NI_ATTR
    - 2283-FY2024-FIN_COST
  - period: FY2025
    driver: Revenue +9.3% to SAR 1,146m (feed +12.8%, flour +8.8%); the late-2025 acquisitions added only SAR 2.36m. Gross margin slipped to 42.1%
      and selling costs rose to SAR 67.8m (SAR 55.6m), but G&A fell to SAR 75.0m (SAR 81.9m, including SAR 4.84m of acquisition costs) and finance
      costs fell to SAR 81.5m (SAR 96.3m) as loans were repaid. Attributable profit +10.6% to SAR 277m; EBITDA margin 35.2% (we calculate).
    source: 2283_FIRST_MILLS/2025_Annual_filed2026-03-17.pdf p.8 (P&L), p.48 (products), p.30-31 (acquisitions)
    refs:
    - 2283-FY2025-REV
    - 2283-FY2025-GP
    - 2283-FY2025-NI_ATTR
    - 2283-FY2025-FIN_COST
    - 2283-FY2025-EBITDA_C
  - period: 9M2026
    driver: Revenue +21.3% and gross profit +25.3% (gross margin 44.8% vs 43.3%). Selling and distribution costs rose to SAR 71.7m (SAR 45.7m)
      and interest income fell to SAR 9.0m (SAR 19.5m), so attributable profit rose 13.9% to SAR 231m after SAR 8.7m went to the 40% minority
      in Al-Kenan Arabia. Net margin 23.6% (25.1%); annualised ROE 28.4%.
    source: 2283_FIRST_MILLS/2026_Q3_filed2026-11-02.pdf p.7 (P&L), p.27 (products)
    refs:
    - 2283-9M2026-REV
    - 2283-9M2026-GP
    - 2283-9M2026-NI_ATTR
    - 2283-9M2026-NI_NCI
    - 2283-9M2026-FIN_INC
  - period: FY2022-9M2026
    driver: 'Cash generation covered capex and dividends: operating cash flow (after interest) rose from SAR 232m to SAR 342m and free cash flow
      was SAR 257m in FY2025 and SAR 228m in 9M 2026 (we calculate). Borrowings fell from SAR 1,171m (end-2022) to SAR 981m, and net debt to EBITDA
      from 4.25x to 2.52x (annualised).'
    source: cash-flow statements and balance sheets (FY2023-FY2025 annuals; 2026 Q3 p.6, p.9)
    refs:
    - 2283-FY2022-CFO
    - 2283-FY2025-CFO
    - 2283-FY2025-FCF
    - 2283-9M2026-FCF
    - 2283-FY2022-DEBT
    - 2283-9M2026-DEBT
