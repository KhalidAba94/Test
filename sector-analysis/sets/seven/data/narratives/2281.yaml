what_it_means:
  improved: >-
    Revenue grew 15.4% a year from FY2022 to FY2025 and 18.4% in 9M 2026, and 9M 2026 EBITDA rose 20.9% with free cash flow of SAR 112m
    as capex fell.
  weakened: >-
    Finance costs rose from SAR 31.2m (FY2022) to SAR 108m (FY2025) and FY2025 ended in an attributable loss of SAR 18.8m; net debt
    including leases was SAR 1,671m at end-2025, 5.4 times EBITDA.
  why: >-
    Capex of SAR 1.1bn over FY2022-FY2025 was funded with borrowings, poultry profit fell in FY2025 as gross margin dropped to 22.8%,
    and the restaurant business lost SAR 55.7m.
  uncertain: >-
    The filings give no restaurant counts, volumes or prices, so the growth from new capacity and the outlook for restaurant losses
    cannot be measured.
confidence_overall: Medium
data_notes:
- >-
  Stage A corrections: D&A includes depreciation of right-of-use assets (FY2025 SAR 146.0m; the XBRL left it out); receivable ECL removed
  from impairments (set to 0); borrowings include the non-current portion (FY2025 SAR 1,044m vs SAR 459m in XBRL); lease liabilities
  added; FY2025 and 9M 2025 cost of revenue added; 9M 2026 read from the PDF (no XBRL file).
- >-
  FY2022 attributable profit (SAR 186.8m) includes SAR 114.3m from the discontinued SFPC operation; PBT and revenue are continuing operations
  only. The FY2021 balance sheet still consolidates SFPC.
- >-
  Basis break: annual operating cash flow (FY2022-FY2025) is after finance costs paid on borrowings; the 9M 2025 comparative was restated
  in the 2026 Q3 interim (note 16) to show them in financing (SAR 237.0m to SAR 271.0m), as is 9M 2026.
- >-
  Exchange differences sit inside finance costs (note 29: FY2024 gain SAR 3.2m, FY2025 loss SAR 8.0m, 9M 2025 loss SAR 7.5m, 9M 2026
  gain SAR 2.0m), so they are outside our operating income and EBITDA.
- >-
  No one-offs are removed from EBITDA: the disposal gain is below PBT, FX is in finance costs, and PP&E write-offs (9M 2026 SAR 1.6m)
  and the feed subsidy (SAR 45.7m accrued in FY2025) recur every year.
- >-
  The restaurant segment was first reported in the FY2025 annual (with FY2024 comparatives); FY2022-FY2024 annuals show one segment
  with a country split.
- >-
  Primary statements and annual notes are image pages, read by OCR and checked against printed subtotals; the 2024 Q3 interim file is
  unreadable (not needed).
