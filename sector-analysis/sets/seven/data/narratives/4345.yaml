what_it_means:
  improved: "Revenue grew 27.8% a year from FY2022 to FY2025 to SAR 102m as Riyadh office buildings were bought, and FFO reached SAR 41.4m in FY2025 (FFO margin 40.7%), enough to cover distributions (99.8%)."
  weakened: "Net profit was negative in FY2022, FY2023 and FY2025 (net margin -20.7% in FY2025), borrowings rose from nil to SAR 655m (LTV 44.8%), and net assets fell from SAR 906m (FY2022) to SAR 773m (FY2025) and SAR 699m at 30 Sep 2026."
  why: "The office purchases were debt-funded, so finance charges rose to SAR 43.0m in FY2025, while the regional malls lost tenants and value (impairments of SAR 125.0m over FY2023-FY2025, we calculate)."
  uncertain: "The fall in units and the exit of Tabuk Mall in Q2 2026 are unexplained, the revenue of most acquired and sold buildings is not disclosed, and the 9M figures are partial quarterly-statement data without profit."
confidence_overall: "Medium"
data_notes:
  - 'Revenue basis (aligned across the eight REITs after the independent sample check): REV is rental income plus other property operating income (hotel revenue, service charges, finance-lease income on leased property) and excludes Murabaha, deposit and other finance income, fair-value gains, disposal gains, dividends and other income. For this fund REV was already on this basis and is unchanged: rental income from investment properties only (special commission income, FVTPL income, other income and the FY2024 disposal gain are excluded).'
  - "9M 2025 and 9M 2026 are partial: the archive holds one-page quarterly statements only. 9M revenue sums 'Rental Income During the Period' for three quarters; total assets and net assets are the statements' period-end figures (book basis). No profit, depreciation, impairment, cash, borrowings or fair-value NAV are printed, so 9M FFO, margins, ROE and LTV are blank. The Q3 2026 NAV per unit (6.47) does not reconcile with net assets over 113.91m units (6.14); the total is used."
  - "FY2024 revenue excludes the SAR 107.9m gain on disposal of Al Khair Mall that the income statement places in the revenue section (recorded as GAIN_DISP and deducted in FFO)."
  - "DA_CF includes depreciation of the Dawadmi right-of-use asset (about SAR 0.48m a year), shown separately in FY2022-FY2024 and combined in FY2025."
  - "Restated (R): FY2023 NAV at fair value SAR 938.6m in the FY2024 statements (FY2023 statements: SAR 944.8m) because note 7.2 now measures the uplift against the full carrying value of investment properties. FY2024 total assets, net assets and net profit differ by SAR 1 in the FY2025 statements (rounding, not a restatement)."
  - "The audited statements for FY2023-FY2025 are scanned images, read by OCR and checked visually. No FY2022 annual is in the archive: FY2022 is the FY2023 annual's comparative column; FY2021 total assets, borrowings and fair-value NAV are not printed."
  - "Distributions are those declared in the year (prior second half plus current first half). The fund has no zakat charge from FY2023 and no non-controlling interests."
