ticker: '2280'
headline: Revenue grew every year, from SAR 18,722m (FY2022) to SAR 22,065m (FY2025), a 5.6% annual rate, and attributable profit rose faster (11.8% a year) to SAR 2,456m; in 9M 2026
  revenue rose 9.7% but attributable profit was flat (-0.3%) as margins narrowed and capex of SAR 4,385m in FY2025 cut free cash flow.
lfl_basis:
  definition_used: 'Standard bridge on IFRS revenue. Almarai made one material acquisition in the window: Pure Beverages Industry Co. (bottled water) from 31 July 2025, whose revenue
    is not disclosed, so organic growth for FY2025/FY2024 and 9M2026/9M2025 is not determinable. FY2023 and FY2024 had no business combinations. About 13% of revenue is earned outside
    the GCC (Egypt and Jordan through IDJ, exports, arable farms) without constant-currency figures, so the FX effect is not determinable in any year; no entity applies hyperinflation
    accounting. No volumes, prices or like-for-like sales are disclosed, so new-capacity and like-for-like growth are not determinable.'
  perimeter_changes:
  - event: Bakemart (UAE, Bahrain frozen bakery) acquired
    date: '2022-01-12'
    effect: in both FY2022 and FY2023; no bridge effect
    source: 2280_ALMARAI/2022_Annual_filed2023-01-22.pdf p.17
  - event: Warehouse facilities bought for SAR 187.9m (asset acquisition, not a business)
    date: '2024'
    effect: no acquired revenue
    source: 2280_ALMARAI/2024_Annual_filed2025-01-20.pdf p.15
  - event: Hammoudeh Food Industries (Jordan) purchase for SAR 263m cancelled
    date: '2025-03-17'
    effect: none
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.16
  - event: 49% associate Maria Fondomonte (Romania) sold
    date: '2025-04-30'
    effect: equity-accounted; no revenue effect; gain SAR 75.4m
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.39, p.48
  - event: Pure Beverages Industry Co. acquired for SAR 1,012m (goodwill SAR 328m)
    date: '2025-07-31'
    effect: revenue contribution not disclosed; perimeter effect not determinable for FY2025/FY2024 and 9M2026/9M2025
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.15, p.39-40
  capacity_changes:
  - event: Capex programme (capex SAR 2,530m FY2023 to SAR 4,385m FY2025); capital commitments SAR 4.4bn at end-2024 and SAR 2.6bn at end-2025, mainly poultry expansion
    date: 2023 to 2026
    effect: revenue from new capacity not disclosed
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.51; 2280_ALMARAI/2024_Annual_filed2025-01-20.pdf p.54
  fx_exposure: Saudi Arabia was 66.1% of FY2025 third-party revenue and other GCC 20.6% (pegged currencies); Other Countries 13.3% (Egyptian pound and Jordanian dinar businesses, exports
    and arable farms). No constant-currency disclosure.
  price_volume_support: 'Not determinable: revenue is given by segment and region only, with no volumes, prices or outlet counts.'
  confidence: Low (organic and like-for-like growth not determinable; perimeter nil with High confidence for FY2023 and FY2024)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Revenue rose SAR 1,608m (9.7%). By segment (third-party revenue, as re-presented in 2026 Q3), Dairy and Juice rose 6.4% (SAR 11,189m to 11,906m), Bakery 8.4% (SAR 2,030m to 2,201m),
    Protein 12.0% (SAR 3,017m to 3,380m) and Other Activities 95.9% (SAR 372m to 729m), the last including bottled water from Pure Beverages for nine months against two. By region, Saudi
    Arabia rose 8.7% and Other Countries 20.9%. Prices and volumes are not disclosed, so the split is not determinable.
  basis: disclosed (segment and regional revenue); price/volume split not determinable
  confidence: High for the amounts; split not determinable
  source: 2280_ALMARAI/2026_Q3_filed2026-10-05.pdf p.15-16
  refs:
  - 2280-9M2026-REV
  - 2280-9M2025-REV
- period: FY2025 vs FY2024
  text: Dairy and Juice third-party revenue rose 4.5% (SAR 14,007m to 14,633m), Bakery 4.8%, Poultry 3.5% and Other Activities 38.6% (SAR 516m to 715m, including water from 31 July 2025).
    Saudi Arabia rose 4.8%, other GCC 6.2% and Other Countries 5.2%. No volumes or prices are disclosed.
  basis: disclosed (segment and regional revenue); split not determinable
  confidence: High for the amounts; split not determinable
  source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.50
  refs:
  - 2280-FY2025-REV
  - 2280-FY2024-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: Revenue +4.6% and attributable profit +16.4%. Poultry revenue rose 16.8% (SAR 3,013m to 3,518m) and its profit from SAR 302m to 430m; Dairy and Juice revenue rose 3.2%. Gross
      margin rose to 30.9% (30.0%). Other expenses, net fell to SAR 64.5m from SAR 153.4m, which had included the SAR 82.9m impairment of the Romanian associate; finance cost, net rose
      to SAR 527m (SAR 428m). We calculate an EBITDA margin of 26.3% and a net margin of 10.5%.
    source: 2280_ALMARAI/2024_Annual_filed2025-01-20.pdf p.9, p.53; 2280_ALMARAI/2023_Annual_filed2024-01-21.pdf p.9, p.52
    refs:
    - 2280-FY2023-REV
    - 2280-FY2023-NI_ATTR
    - 2280-FY2023-GP
    - 2280-FY2023-EBITDA_C
  - period: FY2024
    driver: Revenue +7.2% and attributable profit +12.9%. Dairy and Juice revenue rose 8.6% (SAR 12,903m to 14,007m) and Poultry 7.8%; gross margin reached 31.8%. Impairment of receivables
      rose to SAR 103.5m (SAR 34.2m). Operating cash flow rose 34.5% to SAR 6,028m as inventories fell SAR 348m. We calculate an EBITDA margin of 25.9% and ROE of 12.6%.
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.10, p.14, p.50
    refs:
    - 2280-FY2024-REV
    - 2280-FY2024-NI_ATTR
    - 2280-FY2024-CFO
    - 2280-FY2024-EBITDA_C
  - period: FY2025
    driver: Revenue +5.2% and attributable profit +6.2%. Gross margin eased to 31.2% and selling and distribution costs rose 7.9% (SAR 2,994m to 3,231m), so our operating income grew
      only 2.2%. Lower finance cost, net (SAR 463m vs 530m) and a SAR 75.4m gain on selling the Romanian associate supported profit. We calculate an EBITDA margin of 25.2% and a net
      margin of 11.1%.
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.10, p.48-50
    refs:
    - 2280-FY2025-REV
    - 2280-FY2025-NI_ATTR
    - 2280-FY2025-OPINC
    - 2280-FY2025-GP
  - period: FY2022-FY2025
    driver: Capex rose from SAR 1,334m (FY2022) to SAR 4,385m (FY2025), so free cash flow fell from SAR 2,496m to SAR 1,078m and borrowings (incl. overdrafts) rose to SAR 12,489m; we
      calculate net debt at 2.25x EBITDA at end-2025. Capex here excludes additions to biological assets (SAR 1,042m in FY2025).
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.14
    refs:
    - 2280-FY2022-CAPEX
    - 2280-FY2025-CAPEX
    - 2280-FY2025-FCF
    - 2280-FY2025-DEBT
    - 2280-FY2025-NET_DEBT
  - period: 9M2026
    driver: Revenue +9.7% but attributable profit -0.3%. Gross margin fell to 30.3% (31.5%); selling and distribution costs rose 7.6%, other expenses, net were SAR 87.4m (SAR 29.8m,
      which included the SAR 43.6m associate gain) and finance cost, net rose to SAR 379m (SAR 343m). We calculate an EBITDA margin of 24.1% (25.6%) and a net margin of 10.9% (12.0%).
      Operating cash flow fell 9.7% as receivables rose SAR 1,486m.
    source: 2280_ALMARAI/2026_Q3_filed2026-10-05.pdf p.6, p.9
    refs:
    - 2280-9M2026-REV
    - 2280-9M2026-NI_ATTR
    - 2280-9M2026-GP
    - 2280-9M2026-CFO
    - 2280-9M2025-NI_ATTR
  one_offs:
  - item: Impairment of the 49% associate Maria Fondomonte (Romania)
    period: FY2022
    amount_sar_m: -82.9
    line: Other Expenses, net
    source: 2280_ALMARAI/2023_Annual_filed2024-01-21.pdf p.52
    tax_nci: 'Impairment: outside our EBITDA already; tax/zakat effect not disclosed: not determinable, profit kept as reported'
  - item: Gain on disposal of the associate stake (net of recovery costs)
    period: 9M2025
    amount_sar_m: 43.6
    line: Other Expenses, net
    source: 2280_ALMARAI/2025_Q3_filed2025-10-05.pdf p.13
    tax_nci: 'Zakat effect not disclosed; minority share nil in substance but not stated: not determinable, profit kept as reported'
  - item: Gain on disposal of investment in associate
    period: FY2025
    amount_sar_m: 75.4
    line: Other Expenses, net
    source: 2280_ALMARAI/2025_Annual_filed2026-01-20.pdf p.48
    tax_nci: 'Zakat effect not disclosed; minority share not stated: not determinable, profit kept as reported'
