what_it_means:
  improved: Revenue grew 5.6% a year from FY2022 to FY2025 and attributable profit 11.8% a year, with the net margin up from 9.4% to 11.1% and ROE from 10.7% to 12.5%.
  weakened: Capex more than tripled to SAR 4,385m, free cash flow fell to SAR 1,078m in FY2025 and borrowings rose to SAR 14,018m by 30 Sep 2026; in 9M 2026 the EBITDA margin slipped
    to 24.1% from 25.6%.
  why: Growth came from all four segments, led by poultry (revenue +16.8% in FY2023) and dairy and juice (+8.6% in FY2024); the company does not split this into price and volume. Profit
    growth slowed in FY2025 and stopped in 9M 2026 as gross margin and distribution costs moved against it.
  uncertain: How much of FY2025 and 9M 2026 growth came from the Pure Beverages acquisition is not disclosed, and the effect of the Egyptian pound on the 13% of revenue earned outside
    the GCC cannot be measured.
confidence_overall: Medium
data_notes:
- CASH corrected in stage A in every period to the balance-sheet 'Cash and Cash Equivalents' (the XBRL value was a sub-line of the cash note); e.g. FY2025 SAR 523.0m (was 464.8m).
- DEBT includes bank overdrafts (IDJ Egypt and Jordan facilities; FY2025 SAR 16.9m, FY2022 SAR 87.1m) in addition to loans and borrowings (stage A override).
- D&A for EBITDA includes depreciation of right-of-use assets and of biological assets (dairy herd and poultry flock carried at cost less depreciation; FY2025 SAR 635.3m). FY2022 D&A
  was corrected to include biological-asset depreciation (SAR 480.5m) omitted by XBRL.
- 'IMPAIR_CF: the XBRL value was the fair-value change of crops (a remeasurement, not an impairment); set to nil in FY2023-9M2026, and FY2022 holds the SAR 82.9m associate impairment
  that sits inside the Other Expenses, net add-back.'
- CAPEX = additions to PP&E and intangibles; it excludes additions to biological assets (FY2025 SAR 1,042m, FY2024 SAR 1,073m), so FCF on this basis is higher than cash after herd and
  flock investment. FY2024 capex includes the SAR 187.9m warehouse asset acquisition.
- The income statement shows only 'Finance Cost, net'. FIN_COST and FIN_INC are split from note 31 for full years; the interims give no split, so the 9M figures are XBRL values that
  agree with the net line. Our operating income equals the printed Operating Profit.
- FY2022 operating cash flow uses the FY2023 annual comparative (SAR 3,829.6m, R) vs SAR 3,829.3m first reported (dividend from equity investment moved into operating activities).
- 9M2025 segment revenue was re-presented in the 2026 Q3 interim for the new Protein segment (seafood and value-added meat moved out of Other Activities).
- Primary statements are scanned images in the FY2023 and FY2025 annuals and the 2025 Q3 and 2026 Q3 interims; values were read visually and checked by OCR.
- EBITDA excluding one-offs removes the associate disposal gains (9M2025 SAR 43.6m, FY2025 SAR 75.4m) once the dataset is rebuilt with this one-offs file.
