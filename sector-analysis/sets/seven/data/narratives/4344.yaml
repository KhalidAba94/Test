what_it_means:
  improved: "Rental income grew 16.3% a year from FY2022 to FY2025 (SAR 138m to SAR 216m) as the portfolio grew, and we calculate FFO up 25.3% in FY2025 to SAR 91.0m, covering distributions (payout 80.9%)."
  weakened: "Growth was bought with equity (2023) and then debt: borrowings reached SAR 1,820m and LTV 51.5% at end-2025, financing cost SAR 100.8m, and FFO was still below FY2022 (SAR 97.1m, which included a SAR 21.2m swap gain); FY2023-FY2024 distributions exceeded FFO."
  why: "Each acquisition added rent, but financing cost rose faster (SAR 34.5m in FY2022 to SAR 100.8m in FY2025) and the commission-rate swaps on the loan matured in October 2023 (note 6)."
  uncertain: "The revenue added by each acquisition is not disclosed, so like-for-like growth is not determinable; 9M 2026 has no revenue or profit, and a further SAR 707m purchase depends on a new unit issue."
confidence_overall: "Medium"
data_notes:
  - "No restatements were found: comparatives in the FY2024 and FY2025 statements equal the figures first reported. The FY2024 audited statements used were filed again in August 2025 (2024_Annual_filed2025-08-10_t15-21-03.pdf); the figures match the statements inside the annual report filed in March 2025."
  - "Revenue is rental income only; total income also holds Murabaha income (8.1m in FY2025), swap gains and losses (FY2022-FY2023) and the FY2025 forfeited deposit (5.0m)."
  - "Borrowings (DEBT) are the bank facility, non-current plus the current portion, which is accrued commission (19.4m in FY2025). A SAR 5.0m 'financing from Fund Manager' in the FY2025 related-party note is not in DEBT."
  - "FY2025 cash of SAR 182.5m includes the SAR 100.75m cheque received for Al Jazirah; the matching advance is a liability."
  - "Distributions (DIST) are those declared in the period (statement of changes). The fund report's 'for the period' basis differs (SAR 100.5m for 2025 vs SAR 73.6m declared in 2025), because the Q4 dividend is declared in January."
  - "DA_CF is depreciation of investment properties, the fund's only real-estate depreciation; there were no property disposal gains in FY2022-FY2025 (GAIN_DISP nil)."
  - "9M figures come from the quarterly unitholder statements (unaudited) and are partial: book NAV and NAV at fair value only. Their 'total assets value' appears to be on a fair-value basis and borrowing is given only as '50%', so 9M total assets and borrowings are not shown. 9M distributions are sums of quarterly declarations (C). The Q3 2026 fair-value footnote says '30 June 2025', apparently a typo."
  - "FY2021 has only net assets (book and fair value) and cash; total assets and borrowings at 31 Dec 2021 are not in the archive."
