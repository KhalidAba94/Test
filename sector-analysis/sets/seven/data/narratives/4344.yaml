ticker: "4344"
headline: >-
  SEDCO Capital REIT grew rental revenue from SAR 138m (FY2022) to SAR 216m (FY2025) by buying property: Atelier La Vie in 2023 with a
  SAR 600m rights issue, and SAR 1,019m of schools and offices in 2025 with borrowing that lifted LTV to 51.5%; we calculate FFO of SAR 91.0m
  in FY2025, still below the SAR 97.1m of FY2022, and distributions exceeded FFO in FY2023 and FY2024.
lfl_basis:
  definition_used: >-
    Revenue is rental income; Murabaha income, derivative gains and losses and other income are excluded. Perimeter = properties bought or
    sold. The audited statements give no revenue by property or segment, so the revenue added by acquisitions is not determinable; the fund
    annual report gives each property's 'annual income' (an annualised rent, unaudited), quoted for context only. The fund buys completed
    properties, so there is no new-capacity step.
  perimeter_changes:
    - {event: "Ajdan Entertainment (Al Khobar) bought in 2022 (cost SAR 178.4m)", date: "2022", effect: "revenue not disclosed", source: "4344_SEDCO_CAPITAL_REIT/2023_Annual_filed2024-04-01.pdf p.20, p.10"}
    - {event: "Atelier La Vie (Jeddah) bought with the 2023 capital increase (cost SAR 531.3m), in the portfolio from Q2 2023", date: "2023-Q2", effect: "revenue not disclosed; fund report annual income SAR 35.1m", source: "4344_SEDCO_CAPITAL_REIT/2023_Annual_filed2024-04-01.pdf p.20; 4344_SEDCO_CAPITAL_REIT/2023_Q2_filed2023-07-13.pdf p.5; 4344_SEDCO_CAPITAL_REIT/2023_Annual_filed2024-03-31.pdf p.10"}
    - {event: "Dunecrest American School, Dubai (13 May 2025, SAR 169.2m), Palm View, Diriyah (1 Jun 2025, SAR 703.6m) and Office Complex - Al Yasmin, Riyadh (6 Jul 2025, SAR 146.1m)", date: "2025", effect: "FY2025 revenue not disclosed; fund report annual incomes SAR 12.5m, 55.6m and 11.8m", source: "4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.21-22; 4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-55-45.pdf p.9"}
    - {event: "Al Jazirah Residential Complex held for sale at end-2025 (sale for SAR 100.75m completed after the year-end); Office Complex - Anas Bin Malik Road bought 19 Jan 2026 (SAR 125.8m)", date: "2025-12 / 2026-01", effect: "not determinable", source: "4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.21; 4344_SEDCO_CAPITAL_REIT/2026_Q1_filed2026-04-14.pdf p.5, p.7"}
  capacity_changes:
    - {event: "No developments: the fund acquires developed, ready-to-use properties; work in progress was limited to restoration at Irqah Plaza", date: "2022-2025", effect: "none identified", source: "4344_SEDCO_CAPITAL_REIT/2023_Annual_filed2024-04-01.pdf p.20, p.22"}
  fx_exposure: "Dunecrest American School (from May 2025) is in Dubai; AED is pegged to the US dollar, so there is no FX effect."
  price_volume_support: "Not determinable. Occupancy (97.0% to 97.9%) and WALE are reported, but not rent per square metre or revenue by property."
  confidence: "Low (all perimeter steps not determinable)"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Rental income rose SAR 42.9m (+24.7%). The company reports average occupancy of 97.9% (97.2% in FY2024) and a WALE of 5.7 years. Three
      properties bought between May and July 2025 have annual incomes of SAR 79.9m in the fund report, so most of the increase likely came from
      them, but the revenue recognised in FY2025 is not disclosed and the split is not determinable.
    basis: "disclosed (rental income, occupancy, annual income per property); split not determinable"
    confidence: "Low"
    source: "4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.8; 4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-55-45.pdf p.3-4, p.9"
    refs: ["4344-FY2025-REV", "4344-FY2024-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Rental income rose 17.7% to SAR 162m with Atelier La Vie, but net profit fell 18.4% to SAR 33.6m (net margin 20.7%; ROE 2.7%): financing cost rose from SAR 34.5m to SAR 57.2m and the swaps swung from a SAR 21.2m gain to a SAR 3.1m loss, while impairment fell to SAR 4.3m (FY2022: SAR 26.8m). We calculate FFO down 28.1% to SAR 69.8m; distributions rose 17.2% to SAR 97.7m on 69.4m new units, 140.0% of FFO. LTV fell to 33.3% as the SAR 600m rights issue paid for the purchase.", source: "4344_SEDCO_CAPITAL_REIT/2024_Annual_filed2025-08-10_t15-21-03.pdf p.8-9; 4344_SEDCO_CAPITAL_REIT/2023_Annual_filed2024-04-01.pdf p.8, p.26", refs: ["4344-FY2023-REV", "4344-FY2023-NI_ATTR", "4344-FY2023-FFO", "4344-FY2023-DIST", "4344-FY2023-EQ_ATTR"]}
    - {period: "FY2024", driver: "Rental income rose 7.3% to SAR 174m, the first full year of Atelier La Vie. Net profit fell 57.1% to SAR 14.4m (net margin 8.3%; ROE 1.0%) after a SAR 24.0m impairment charge, financing cost of SAR 63.3m and SAR 6.0m of expected credit losses. We calculate FFO up 4.0% to SAR 72.6m; distributions of SAR 93.5m were 128.7% of FFO. LTV 39.0% after SAR 167.5m of new borrowing.", source: "4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.8-10", refs: ["4344-FY2024-REV", "4344-FY2024-NI_ATTR", "4344-FY2024-FFO", "4344-FY2024-DIST", "4344-FY2024-IMPAIR_CF"]}
    - {period: "FY2025", driver: "Rental income rose 24.7% to SAR 216m after the May-July acquisitions. Net profit rose 450.0% to SAR 79.3m (net margin 36.6%; ROE 5.4%), mainly from a SAR 34.0m impairment reversal, which FFO excludes, plus a SAR 5.0m forfeited sale deposit; financing cost rose to SAR 100.8m. We calculate FFO at SAR 91.0m (+25.3%; FFO margin 42.0%). Distributions declared in the year fell to SAR 73.6m (80.9% of FFO). Borrowings rose to SAR 1,820m and LTV to 51.5%; NAV at fair value SAR 1,615m (+5.2%).", source: "4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.7-10, p.21-24", refs: ["4344-FY2025-REV", "4344-FY2025-NI_ATTR", "4344-FY2025-FFO", "4344-FY2025-DIST", "4344-FY2025-DEBT", "4344-FY2025-TA", "4344-FY2025-NAV_FV"]}
    - {period: "9M2026", driver: "Only fact-sheet figures are printed: no revenue, net profit, book total assets or borrowing amount. Distributions declared in January-September 2026 were SAR 78.3m (we calculate: three quarterly distributions, including the Q4 2025 one announced in January 2026), against SAR 47.9m in 9M 2025 (+63.4%). NAV at fair value was SAR 1,698m (+9.3%) and book NAV SAR 1,449m (+2.0%).", source: "4344_SEDCO_CAPITAL_REIT/2026_Q3_filed2026-10-14.pdf p.4-5; 4344_SEDCO_CAPITAL_REIT/2025_Q3_filed2025-10-14.pdf p.5; 4344_SEDCO_CAPITAL_REIT/2025_Annual_filed2026-03-31_t15-59-14.pdf p.24", refs: ["4344-9M2026-DIST", "4344-9M2025-DIST", "4344-9M2026-NAV_FV", "4344-9M2025-NAV_FV", "4344-9M2026-EQ_ATTR"]}
