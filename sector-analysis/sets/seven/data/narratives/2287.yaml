    tax_nci: >-
      A property disposal gain (proceeds SAR 22.3m), 12.9% of the attributable loss; zakat effect not disclosed; no non-controlling interests: after-zakat effect not determinable, loss kept as reported
  - item: Insurance proceeds
    period: FY2025
    amount_sar_m: 4.2
    line: Other income
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.44
    tax_nci: >-
      Insurance compensation; zakat effect not disclosed; no non-controlling interests: after-zakat effect not determinable, loss kept as reported
  - item: Gain on disposal of property, plant and equipment (restated comparative)
    period: 9M2025
    amount_sar_m: 15.8
    line: Other income
    source: 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.23
    tax_nci: >-
      The same property disposal as in FY2025; zakat effect not disclosed; no non-controlling interests: after-zakat effect not determinable, loss kept as reported
  - item: Insurance proceeds (restated comparative)
    period: 9M2025
    amount_sar_m: 4.2
    line: Other income
    source: 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.23
    tax_nci: >-
      Insurance compensation, the same receipt as in FY2025; zakat effect not disclosed; no non-controlling interests: after-zakat effect not determinable, loss kept as reported
  - item: Extinguishment of trade payable balances
    period: 9M2026
    amount_sar_m: 5.5
    line: Other income
    source: 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.23
