    amount_sar_m: 2.3
    line: Other income
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.44-45
    tax_nci: >-
      Insurance compensation, 8.6% of attributable profit; zakat effect not disclosed; no non-controlling interests: after-zakat effect not determinable, profit kept as reported
  - item: Gain on disposal of property, plant and equipment
