ticker: '2287'
headline: >-
  Entaj, listed in March 2025, grew revenue from SAR 1,099m (FY2023) to SAR 1,351m (FY2025) but swung from a SAR 62.7m profit to a SAR
  123m loss as margins fell and finance costs rose; in 9M 2026 revenue rose 27.2% to SAR 1,272m but the loss widened to SAR 57.5m (restated
  9M 2025: SAR 39.2m).
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Entaj is a single Saudi company with no subsidiaries, so perimeter and FX effects are nil (exports
    are sold from Saudi Arabia). FY2023 is the first period available. FY2024 revenue is the restated figure in the FY2025 annual, which
    adds SAR 34.8m of reclassified by-product and hatching-egg sales net of a rebates correction, while FY2023 was not restated; we
    treat that as an accounting step. Entaj gives no volumes or capacity, so new capacity and like-for-like growth are not determinable.
  perimeter_changes:
  - event: 'None: single company (majority-owned by ARASCO); no acquisitions or disposals'
    date: FY2023-9M2026
    effect: nil
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.14
  capacity_changes:
  - event: >-
      New leased farms (right-of-use additions SAR 64.9m in FY2024, SAR 195.7m in FY2025, SAR 159.7m in 9M 2026) and capex of SAR 191m
      in FY2023
    date: 2023-2026
    effect: not determinable (no capacity or revenue disclosed)
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.13; 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.9
  fx_exposure: 'None: all operations in Saudi Arabia; exports were SAR 31.0m in FY2025 and SAR 68.0m in 9M 2026.'
  price_volume_support: >-
    Not determinable: revenue is split by product (poultry, eggs, live birds, by-products, packaging) and export market, but no volumes
    or prices are given.
  confidence: Medium (perimeter and FX nil with High confidence; new capacity not determinable)
price_volume:
- period: FY2025 vs FY2024
  text: >-
    Revenue rose SAR 71.4m (+5.6%). Domestic poultry sales rose 2.6% (SAR 1,183m to SAR 1,213m), table eggs nearly doubled (SAR 37.5m
    to SAR 74.3m), exports rose from SAR 10.9m to SAR 31.0m and a new packaging service added SAR 12.6m, while by-product sales fell
    from SAR 31.0m to SAR 17.1m. Volumes and prices are not disclosed.
  basis: disclosed (revenue by product and market); split not determinable
  confidence: High for the amounts
  source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.25, p.42
  refs:
  - 2287-FY2025-REV
  - 2287-FY2024-REV
- period: 9M 2026 vs 9M 2025
  text: >-
    Revenue rose SAR 272m (+27.2%). Domestic poultry sales rose 24.1% (SAR 903m to SAR 1,120m), exports rose from SAR 20.3m to SAR 68.0m
    and live-bird sales from SAR 1.2m to SAR 15.1m, while table eggs fell 16.3%. Volumes and prices are not disclosed.
  basis: disclosed (revenue by product); split not determinable
  confidence: High for the amounts
  source: 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.22
  refs:
  - 2287-9M2026-REV
  - 2287-9M2025-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: >-
      First period available. Revenue was SAR 1,099m and gross margin 20.9% (we calculate). The EBITDA margin was 11.2%, including an
      SAR 2.7m gain on remeasuring broiler birds. Profit was SAR 62.7m, a net margin of 5.7%.
    source: 2287_ENTAJ/2024_Annual_filed2025-04-10.pdf p.9
    refs:
    - 2287-FY2023-REV
    - 2287-FY2023-GP
    - 2287-FY2023-EBITDA_C
    - 2287-FY2023-NI_ATTR
  - period: FY2024
    driver: >-
      Revenue rose 16.4% to SAR 1,280m (restated); without the reclassified by-product and egg sales, growth was 13.2% (we calculate).
      Gross margin fell to 14.7% (20.9%) after the note 32 error corrections added SAR 9.8m to cost of revenue. EBITDA fell 7.1% to
      SAR 114m, an EBITDA margin of 8.9%. Finance costs were only SAR 14.6m because SAR 25.4m of interest was capitalised. A farm fire
      cost SAR 3.8m (impairment) against SAR 2.3m of insurance. Profit fell 56.8% to SAR 27.1m with no zakat charge, a net margin of
      2.1%; ROE 6.0%.
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.9, p.12, p.44, p.45-48
    refs:
    - 2287-FY2024-REV
    - 2287-FY2024-GP
    - 2287-FY2024-EBITDA_C
    - 2287-FY2024-FIN_COST
    - 2287-FY2024-NI_ATTR
  - period: FY2025
    driver: >-
      Revenue rose 5.6% to SAR 1,351m but gross profit fell 32.4% to SAR 127m (gross margin 9.4%), even with an SAR 13.0m biological
      fair-value gain in cost of revenue. Selling costs rose 61.1% and administrative costs 53.4%. Other income of SAR 20.9m included
      an SAR 15.8m gain on selling property and SAR 4.2m of insurance. EBITDA fell 46.9% to SAR 60.5m, an EBITDA margin of 4.5%. Finance
      costs rose to SAR 50.7m as no interest was capitalised and lease interest rose to SAR 14.4m. The loss was SAR 123m, a net margin
      of -9.1%; ROE -31.5%.
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.9, p.12, p.44
    refs:
    - 2287-FY2025-REV
    - 2287-FY2025-GP
    - 2287-FY2025-EBITDA_C
    - 2287-FY2025-FIN_COST
    - 2287-FY2025-NI_ATTR
  - period: 9M2026
    driver: >-
      Revenue rose 27.2% to SAR 1,272m and gross profit 29.5%, a gross margin of 14.0% (13.8% restated). Selling costs rose 31.2% and
      receivable impairments were SAR 12.6m (9M 2025: SAR 1.0m reversal); other income fell to SAR 6.0m (SAR 20.4m, which held a SAR
      15.8m disposal gain) and included SAR 5.5m of payables written back. EBITDA fell 5.1% to SAR 86.5m, an EBITDA margin of 6.8% (9.1%).
      Finance costs rose 17.3% to SAR 42.6m. The loss was SAR 57.5m (SAR 39.2m), a net margin of -4.5%; annualised ROE -26.3%.
    source: 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.6, p.9, p.23
    refs:
    - 2287-9M2026-REV
    - 2287-9M2026-GP
    - 2287-9M2026-EBITDA_C
    - 2287-9M2026-FIN_COST
    - 2287-9M2026-NI_ATTR
    - 2287-9M2025-NI_ATTR
  - period: FY2023-9M2026
    driver: >-
      Leverage rose: lease liabilities grew from SAR 57.6m (FY2023) to SAR 366m (30 Sep 2026) as farms were leased, borrowings from
      SAR 517m to SAR 680m, and net debt including leases from SAR 552m to SAR 1,043m, while equity fell from SAR 437m to SAR 262m.
      At end-2025 net debt was 15.1 times EBITDA. In 9M 2026 operating cash flow rose to SAR 141m (SAR 61.8m) as trade payables grew,
      giving free cash flow of SAR 96.1m (we calculate); cash was SAR 2.5m.
    source: 2287_ENTAJ/2025_Annual_filed2026-04-23.pdf p.8; 2287_ENTAJ/2026_Q3_filed2026-11-11.pdf p.5, p.9
    refs:
    - 2287-FY2023-LEASE_LIAB
    - 2287-9M2026-LEASE_LIAB
    - 2287-9M2026-DEBT
    - 2287-9M2026-NET_DEBT
    - 2287-FY2025-NET_DEBT
    - 2287-9M2026-CFO
    - 2287-9M2026-FCF
  one_offs:
  - item: Insurance proceeds after the Amal farm fire (impairment of SAR 3.8m already outside EBITDA)
