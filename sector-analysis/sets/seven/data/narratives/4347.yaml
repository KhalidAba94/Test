  - {date: "2026-03", category: "event", text: "The company reports regional geopolitical tensions after the year-end as a non-adjusting event whose financial effect cannot yet be estimated.", source: "4347_BONYAN_REIT/2025_Annual_filed2026-03-31_t15-42-31.pdf p.40"}
what_it_means:
  improved: "FY2025 revenue rose 15.6% to SAR 278m and we calculate FFO up 21.5% to SAR 147m, so distributions rose 14.9% to SAR 125m while staying below FFO (payout 85.4%)."
  weakened: "Borrowings rose from SAR 240m (FY2023) to SAR 638m (FY2024) and finance cost from SAR 22.9m to SAR 43.8m (FY2025), lifting LTV from 13.8% to 30.3%; hotel revenue fell and hospitality occupancy was 48.7% in FY2025."
  why: "The 2024 office purchases (1991 Centre and Al Olaya Tower) drove office segment income from SAR 15.7m to SAR 49.3m; earlier profit was flattered by property-sale gains (SAR 26.1m in FY2023) and impairment reversals that FFO excludes."
  uncertain: "The filings do not give revenue by property, so like-for-like growth is not determinable; 9M 2026 has no revenue or profit figures, and the SR 110m Abha mall purchase was still unrecorded at end-2024."
confidence_overall: "Medium"
data_notes:
  - "Revenue (REV) excludes the capital gains on property disposals that the fund books inside 'Income from properties': FY2023 SAR 243.1m = 269.2m less 26.1m and FY2024 SAR 240.6m = 248.5m less 7.9m (calculated, C). The gains are in GAIN_DISP and FFO deducts them."
  - "DA_CF and IMPAIR_CF cover all real-estate items (investment properties, hotels carried as property and equipment, and intangibles), per the REIT convention. The FY2022 split between investment properties and hotels was restated in the FY2023 statements (note 24: hotels reclassified from investment properties to property and equipment); the combined totals are unchanged."
  - "Cash (CASH) follows the FY2025 definition (note 27): Murabaha deposits of three months or less are cash equivalents, so FY2024 is SAR 108.2m (R; 70.4m first reported) and FY2023 SAR 86.5m (R; from the FY2025 cash flow's opening balance; 55.8m first reported)."
  - "NAV at fair value is the fund's note figure, whose basis changed each year: FY2022 restated in the FY2023 statements (deferred rent and receivables adjustments), FY2023 re-presented in FY2024 (2,063.6m vs 2,066.4m), FY2024 restated in FY2025 (2,181.5m vs 2,162.4m, capital work in progress excluded). FY2021 is per unit (10.1769) times units, as first reported (C)."
  - "Distributions (DIST) are those declared in the period (statement of changes): two half-yearly distributions per year for six-month periods ending April and October."
  - "Borrowings include accrued finance cost (e.g. FY2025: principal 637.0m + accrued 1.1m)."
  - "9M figures come from the quarterly unitholder statements (unaudited) and are partial: no revenue, net profit or cash is printed. 9M2025 total assets and book NAV are printed; 9M2025 NAV at fair value, both 9M borrowing figures (ratio x total assets), 9M2026 book NAV (8.34 per unit x units) and 9M2026 book total assets are calculated (C). 9M2025 depreciation is the sum of three quarters."
  - "FY2021 balance-sheet items are from the 1 January 2022 column of the FY2023 statements (restated for the hotel reclassification, totals unchanged)."
  - "Other income of SAR 9.4m in FY2024 is not explained in the notes and is kept in FFO."
