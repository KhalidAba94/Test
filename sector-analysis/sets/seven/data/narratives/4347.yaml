  - {date: "2024-05", category: "M&A", text: "Bought 1991 Centre in Hittin, Riyadh, and in August 2024 Al Olaya Tower in Riyadh; SAR 455.4m was paid for properties in 2024.", source: "4347_BONYAN_REIT/2024_Annual_filed2025-03-26.pdf p.28, p.10"}
