what_it_means:
  improved: >-
    Revenue grew every year, 14.8% a year from FY2022 to FY2025, and operating cash flow stayed between SAR 673m and SAR 781m; in 9M
    2026 operating cash flow rose 14.5% and free cash flow reached SAR 619m as capex halved.
  weakened: >-
    Profitability fell after FY2024: EBITDA margin from 56.3% (FY2024) to 47.2% (FY2025) and 44.4% in 9M 2026 (46.4%), and attributable
    profit fell 33.3% in FY2025 and 18.0% in 9M 2026. Borrowings rose to SAR 760m at 30 Sep 2026.
  why: >-
    Revenue growth slowed from 24.4% (FY2023) to 7.5% (FY2025) and 4.0% (9M 2026) while depreciation, staff and marketing costs kept
    rising; FY2024 profit also included a SAR 92.2m land gain. In 9M 2026 male-centre subscriptions were flat while female-centre subscriptions
    rose 15.9%.
  uncertain: >-
    The filings give no centre counts or same-centre revenue, so we cannot tell whether the slowdown comes from existing clubs or from
    fewer openings; a SAR 9.6m other expense in 9M 2026 is not explained.
confidence_overall: Medium
data_notes:
- 'Restatement (FY2023 annual, note 37): a SOCPA ruling (Nov 2023) required depreciation of land right-of-use assets during construction
  to be expensed. FY2022 cost of revenue rose SR 2.5m; PP&E and equity fell SR 21.3m at 1 Jan 2022 and SR 23.8m at 31 Dec 2022. FY2021
  opening TA/TE and FY2022 PBT, NI, TA and TE carry R.'
- 'FY2022 operating cash flow was re-presented in the FY2023 annual (SR 669.2m to SR 673.4m): the impairment provision on advances to
  suppliers is added back in operations. CFO is after zakat and end-of-service benefits paid and before interest paid (finance cost
  and lease interest paid are in financing).'
- 'Stage A overrides: D&A for EBITDA includes depreciation of right-of-use assets; the XBRL omitted it for FY2022 and FY2023 (corrected
  to SR 232m and SR 252m). FY2022 capex now includes intangibles; FY2023 impairment add-back corrected to SR 2.1m. All 9M 2026 figures
  come from the PDF (no XBRL file for 2026 Q3).'
- 'Capex basis break: from FY2024 the PP&E line includes advances to contractors (merged in the FY2025 annual); in FY2022-FY2023 advances
  (SR 5.4m and SR 66.0m) are a separate line and are excluded, so FY2023 capex is not fully comparable.'
- 'Champs Sports and Fitness Club (Dubai) is a discontinued operation held for sale from 2024: revenue and PBT are continuing operations;
  net profit and attributable profit include the discontinued result (FY2024 SR 2.2m; FY2025 SR 0.08m; 9M 2026 SR 0.07m; 9M 2025 -SR
  0.25m).'
- 'Our operating income (PBT + finance cost - Murabaha income - share of associate) includes items the company shows below its operating
  profit: disposal gains, lease gains, write-offs, impairments and other income. FY2024 company operating profit SR 447.2m vs our SR
  555.3m (the difference is mainly the SR 92.2m disposal gain).'
- Murabaha deposit profit is treated as finance income. Lease interest is inside finance cost.
