what_it_means:
  improved: "Profit recovered in FY2025 (attributable profit +54.6% to SAR 58.0m) without large one-off gains, and borrowings fell from SAR 231m at end-2023 to nil at end-2025; 9M 2026 operating cash flow was SAR 138m."
  weakened: "Revenue grew only 0.9% a year from FY2022 to FY2025 and attributable profit fell 23.5% a year; in 9M 2026 the net margin fell to 7.0% from 8.7% as gross margin slipped and overheads rose."
  why: "Sales in Saudi Arabia fell in FY2023 and recovered only slowly, while foreign stores added SAR 44.9m in FY2023 and SAR 61.8m by FY2025; FY2024 profit depended on a SAR 43.0m related-party property gain."
  uncertain: "The filings do not explain the FY2024 fall in gross margin to 15.4%, give no same-store sales, and do not say whether the property sold to the chairman is now leased back."
confidence_overall: "Medium"
data_notes:
  - "FY2023 cost of sales and gross profit are restated (FY2024 annual note 34): right-of-use depreciation of branches (SAR 25.8m) moved from operating expenses into cost of sales. FY2022 is not re-presented, so FY2022 gross profit (SAR 206m) excludes SAR 18.4m of such depreciation; on the FY2023 basis it would be SAR 188m (25.4% of revenue, we calculate). Gross-profit growth FY2023/FY2022 crosses this basis break."
  - "Corrected from the PDF statements: D&A for FY2024 and FY2025 (the XBRL netted lease-termination gains against depreciation; FY2025 annual p.11); the impairment add-back is nil for FY2022-FY2025 (the XBRL tagged gains and losses on FVTPL funds as impairment; cash-flow statements p.11 of each annual); debt is nil at end-2025 and 30 Sep 2026 (the XBRL tagged the short-term lease liability as borrowings; FY2025 annual p.8, 2026 Q3 interim p.4), and lease liabilities at those dates include the current portion."
  - "With no borrowings since end-2025, net debt is lease liabilities less cash: SAR 173m at end-2025 and SAR 193m at 30 Sep 2026 (net debt/EBITDA 1.25x and 1.35x annualised). The SAR 80.1m of mutual funds held at 30 Sep 2026 is outside cash; counting it, net debt would be SAR 113m (we calculate)."
  - "Gains and losses on FVTPL mutual funds appear every year on their own lines above profit before zakat (FY2022 -SAR 1.6m, FY2023 SAR 0.5m, FY2024 SAR 0.1m, FY2025 SAR 0.5m, 9M 2025 SAR 0.2m, 9M 2026 SAR 2.6m). They are inside our operating income and, as fair-value results on financial investments, are listed as one-offs in every period. There is no separate finance income line."
  - "The 9M 2025 balance sheet is from the 9M 2025 interim (30 Sep 2025), because the 9M 2026 interim compares with 31 Dec 2025."
  - "Primary statements are scanned images in the FY2023-FY2025 annuals and the 2025 and 2026 Q3 interims; figures were read visually and checked by OCR."
  - "Listed on the Main Market (not Nomu) on 27 Dec 2022; the FY2022 annual is the first filing in the archive."
