ticker: "4192"
headline: >-
  Revenue was almost flat, from SAR 739m in FY2022 to SAR 759m in FY2025, while attributable profit fell from SAR 130m to SAR 58.0m;
  FY2024 profit of SAR 37.5m rested on a SAR 43.0m gain from selling land and a building to the chairman. In 9M 2026 revenue rose
  5.9% to SAR 604m but attributable profit fell 14.9% to SAR 42.2m as gross margin and overheads worsened.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Alsaif made no acquisitions or disposals: its four foreign subsidiaries (UAE and Kuwait from 2022,
    Oman 2023, Qatar 2024) are 100%-owned start-ups, so the perimeter effect is nil and organic growth equals reported growth. New
    capacity is revenue from branches opened after the start of the prior period. The company discloses revenue outside Saudi Arabia,
    which was nil in FY2022 and SAR 44.9m in FY2023, so that amount is new-store revenue; it does not disclose the revenue of new
    branches in Saudi Arabia, openings and closures within a year, or same-store sales. Like-for-like growth is therefore not
    determinable in any year and organic growth is the closest measure.
  perimeter_changes:
    - {event: "No business combinations; start-up subsidiaries in the UAE and Kuwait (2022), Oman (2023) and Qatar (2024)", date: "2022 to 2024", effect: "no acquired revenue; their sales are new capacity", source: "4192_ALSAIF_GALLERY/2022_Annual_filed2023-03-26.pdf p.11; 4192_ALSAIF_GALLERY/2023_Annual_filed2024-03-10.pdf p.12; 4192_ALSAIF_GALLERY/2024_Annual_filed2025-03-20.pdf p.12"}
  capacity_changes:
    - {event: "Leased branches 61 to 70, including the first stores in the UAE, Kuwait and Oman", date: "2023", effect: "revenue outside Saudi Arabia SAR 44.9m (FY2022: nil), disclosed; new Saudi branches not disclosed", source: "4192_ALSAIF_GALLERY/2023_Annual_filed2024-03-10.pdf p.12, p.34"}
    - {event: "Leased branches 70 to 73, including Qatar", date: "2024", effect: "not determinable; revenue outside Saudi Arabia SAR 53.7m", source: "4192_ALSAIF_GALLERY/2024_Annual_filed2025-03-20.pdf p.12, p.34"}
    - {event: "Leased branches 73 at both year-ends, with SAR 70.4m of new leases and some lease terminations", date: "2025", effect: "not determinable (net count unchanged)", source: "4192_ALSAIF_GALLERY/2025_Annual_filed2026-02-25.pdf p.12, p.11"}
    - {event: "Leased branches 75 at 30 Sep 2025 and 74 at 30 Sep 2026", date: "9M 2026", effect: "not determinable", source: "4192_ALSAIF_GALLERY/2025_Q3_filed2025-10-23.pdf p.8; 4192_ALSAIF_GALLERY/2026_Q3_filed2026-11-05.pdf p.8"}
  fx_exposure: "Foreign sales are 8.1% of FY2025 revenue (SAR 61.8m) in UAE dirham, Omani and Qatari riyals (all pegged to the US dollar) and Kuwaiti dinar, which the group calls not significant. No translation differences appear in other comprehensive income, so the FX step is nil."
  price_volume_support: "Not determinable. The filings give branch counts and revenue inside and outside Saudi Arabia, but no same-store sales, ticket size, traffic or selling area."
  confidence: "Medium (perimeter and FX nil with High confidence; new-branch revenue is disclosed only for the first foreign stores in FY2023)"
price_volume:
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue rose SAR 33.7m (5.9%). The company reports revenue in Saudi Arabia of SAR 561.5m (9M 2025: SAR 523.6m, +7.2%, we calculate)
      and outside Saudi Arabia of SAR 42.9m (SAR 47.1m, -8.9%). The number of leased branches was 74 at 30 Sep 2026 against 75 a year
      earlier, so the growth came from existing branches and the online channel rather than more stores, but price and volume cannot
      be separated.
    basis: "disclosed (geographic revenue, branch counts); split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4192_ALSAIF_GALLERY/2026_Q3_filed2026-11-05.pdf p.15 (revenue note), p.8 (branches); 4192_ALSAIF_GALLERY/2025_Q3_filed2025-10-23.pdf p.8"
    refs: ["4192-9M2026-REV", "4192-9M2025-REV"]
  - period: "FY2025 vs FY2024"
    text: >-
      Revenue rose SAR 27.3m (3.7%) with 73 leased branches at both year-ends. Revenue in Saudi Arabia rose from SAR 677.9m to SAR 697.0m
      (+2.8%) and outside from SAR 53.7m to SAR 61.8m (+15.1%, we calculate).
    basis: "disclosed (geographic revenue); split not determinable"
    confidence: "High for the amounts"
    source: "4192_ALSAIF_GALLERY/2025_Annual_filed2026-02-25.pdf p.34, p.12"
    refs: ["4192-FY2025-REV", "4192-FY2024-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Revenue fell 2.6% to SAR 720m: sales in Saudi Arabia fell 8.7% (SAR 739.1m to SAR 674.9m) while new stores abroad added SAR 44.9m. Gross profit was SAR 185m (25.7% of revenue) after the restatement that moved right-of-use depreciation into cost of sales. FY2022 is not re-presented: its reported gross margin of 27.9% excludes SAR 18.4m of such depreciation, and on the FY2023 basis its gross profit would be SAR 188m, 25.4% of revenue (we calculate). Operating income fell 21.3% to SAR 115m (operating margin 15.9%) because FY2022 had included a SAR 16.6m property-sale gain. Attributable profit fell 24.3% to SAR 98.2m (net margin 13.6%, ROE 24.1%). Operating cash flow was -SAR 8.7m as inventories rose SAR 170.5m, and capex of SAR 70.5m included two plots of land in Riyadh; short-term loans reached SAR 231m.", source: "4192_ALSAIF_GALLERY/2024_Annual_filed2025-03-20.pdf p.9 (P&L), p.11 (cash flow), p.29 (land), p.40 (note 34); 4192_ALSAIF_GALLERY/2023_Annual_filed2024-03-10.pdf p.34", refs: ["4192-FY2023-REV", "4192-FY2023-GP", "4192-FY2023-OPINC", "4192-FY2023-NI_ATTR", "4192-FY2023-CFO", "4192-FY2023-DEBT"]}
    - {period: "FY2024", driver: "Revenue rose 1.6% to SAR 732m but cost of sales rose 15.6%, so gross profit fell 38.8% to SAR 113m (15.4% of revenue) in the year inventories were cut by SAR 126.9m; the statements give no reason for the lower margin. Other income of SAR 51.9m included a SAR 43.0m gain on selling land and a building to the chairman for SAR 97m. Operating income was SAR 65.5m (operating margin 8.9%) and finance costs rose to SAR 20.6m (SAR 11.8m). Attributable profit fell 61.8% to SAR 37.5m (net margin 5.1%, ROE 8.9%); without the gain, profit before zakat would have been SAR 1.8m (we calculate). Operating cash flow was SAR 202m and the sale proceeds helped cut short-term loans from SAR 231m to SAR 65.3m.", source: "4192_ALSAIF_GALLERY/2025_Annual_filed2026-02-25.pdf p.9 (P&L), p.11 (cash flow), p.35 (note 26); 4192_ALSAIF_GALLERY/2024_Annual_filed2025-03-20.pdf p.28 (note 6.1)", refs: ["4192-FY2024-REV", "4192-FY2024-GP", "4192-FY2024-COGS", "4192-FY2024-OPINC", "4192-FY2024-PBT", "4192-FY2024-NI_ATTR", "4192-FY2024-CFO", "4192-FY2024-DEBT"]}
    - {period: "FY2025", driver: "Revenue rose 3.7% to SAR 759m and gross profit recovered 57.6% to SAR 178m (23.5% of revenue). Operating income rose 19.9% to SAR 78.5m (operating margin 10.3%; EBITDA margin 18.2%) with no large disposal gain; finance costs fell to SAR 11.4m as short-term loans were repaid in full. Attributable profit rose 54.6% to SAR 58.0m (net margin 7.6%, ROE 12.4%). Operating cash flow fell 61.0% to SAR 78.7m as inventories rose SAR 74.6m; capex was only SAR 8.7m, so free cash flow was SAR 70.0m.", source: "4192_ALSAIF_GALLERY/2025_Annual_filed2026-02-25.pdf p.9 (P&L), p.11 (cash flow), p.35 (notes 25-26)", refs: ["4192-FY2025-REV", "4192-FY2025-GP", "4192-FY2025-OPINC", "4192-FY2025-FIN_COST", "4192-FY2025-NI_ATTR", "4192-FY2025-CFO", "4192-FY2025-FCF"]}
    - {period: "9M2026", driver: "Revenue rose 5.9% to SAR 604m, but gross profit fell 2.8% to SAR 134m (22.1% of revenue vs 24.1%) and general and administrative expenses rose 29.0% to SAR 44.2m (we calculate from the P&L). Operating income fell 9.7% to SAR 58.0m (operating margin 9.6% vs 11.3%; EBITDA margin 17.8% vs 19.0%). It includes SAR 2.6m of realised and unrealised gains on mutual funds held at FVTPL (SAR 0.2m in 9M 2025), listed as one-offs. Attributable profit fell 14.9% to SAR 42.2m (net margin 7.0% vs 8.7%; annualised ROE 11.1%). Operating cash flow almost doubled to SAR 138m as inventories fell SAR 70.4m; SAR 80.1m was placed in mutual funds, which are not counted as cash.", source: "4192_ALSAIF_GALLERY/2026_Q3_filed2026-11-05.pdf p.5 (P&L), p.7 (cash flow), p.15 (note 7)", refs: ["4192-9M2026-REV", "4192-9M2026-GP", "4192-9M2026-OPINC", "4192-9M2026-NI_ATTR", "4192-9M2026-CFO", "4192-9M2026-CASH"]}
  one_offs:
