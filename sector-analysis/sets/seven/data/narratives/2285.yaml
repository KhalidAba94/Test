ticker: '2285'
headline: Revenue rose from SAR 903m (FY2022) to SAR 998m (FY2025) with a high EBITDA margin of 39.1% in FY2025, but attributable profit fell
  from SAR 255m to SAR 200m in FY2023 under the merger debt before recovering to SAR 237m as borrowings were cut from SAR 1,748m to SAR 690m;
  in 9M 2026 revenue rose 4.2% and profit 15.8%.
lfl_basis:
  definition_used: Standard bridge on IFRS revenue. Arabian Mills is a stand-alone company with no subsidiaries; the November 2022 merger with
    its former holding parent added goodwill and loans but no revenue, so perimeter effects are nil and organic growth equals reported growth.
    Revenue presentation is consistent across the comparisons used (later re-presentations moved costs, not revenue). No volumes, capacity or
    same-store measure are disclosed, so new-capacity effects are not determinable.
  perimeter_changes:
  - event: Statutory merger with the former 100% parent (holding company)
    date: '2022-11-30'
    effect: no revenue; goodwill SAR 822.4m and loans of SAR 1,747.9m at end-2022
    source: 2285_ARABIAN_MILLS/2023_Annual_filed2024-10-07.pdf p.37, p.6
  - event: No subsidiaries, acquisitions or disposals FY2023-9M2026
    date: 2023 to 2026
    effect: none
    source: 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.3
  capacity_changes:
  - event: A and B mill automation upgrade and other Riyadh projects capitalised
    date: '2025'
    effect: not determinable
    source: 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.31
  - event: New flour mill being installed at Riyadh
    date: 2026 (9M)
    effect: not yet in use at 30 Sep 2026
    source: 2285_ARABIAN_MILLS/2026_Q3_filed2026-11-08.pdf p.18
  fx_exposure: 'None: all revenue is from sales in Saudi Arabia in riyals.'
  price_volume_support: Not determinable. Revenue is split by product (annuals and the 2025 Q3 interim) and region, but no tonnes or prices are
    given. GFSA sets prices only for flour in 45kg bags and above, and subsidised wheat costs SAR 180 a tonne, unchanged since 2017.
  confidence: Medium (perimeter nil with High confidence; new-capacity effect not determinable)
price_volume:
- period: 9M 2026 vs 9M 2025
  text: Revenue rose SAR 30.3m. Jizan grew 16.5% and Riyadh 4.1%, while Hail fell 7.2%. The interim gives no product split, volumes or prices,
    so price and volume cannot be separated.
  basis: disclosed (segment revenue); split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2285_ARABIAN_MILLS/2026_Q3_filed2026-11-08.pdf p.15
  refs:
  - 2285-9M2026-REV
  - 2285-9M2025-REV
- period: FY2025 vs FY2024
  text: On the FY2025 annual's net basis, flour revenue rose 7.9%, feed 3.6% and bran fell 9.8%. Jizan grew 16.9% and Riyadh 3.2%; Hail fell 10.6%.
    No volumes or prices are disclosed.
  basis: disclosed; split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.42 (products), p.24 (segments)
  refs:
  - 2285-FY2025-REV
  - 2285-FY2024-REV
- period: FY2024 vs FY2023
  text: Feed revenue recovered 45.0% and bran rose 15.9%, while flour rose 4.9%; rebates deducted from revenue rose to SAR 22.0m (SAR 13.3m).
    Hail grew 45.4% and Jizan 15.4%.
  basis: disclosed; split not determinable
  confidence: High for the amounts; the split is not determinable
  source: 2285_ARABIAN_MILLS/2024_Annual_filed2025-03-24.pdf p.47 (products), p.32 (segments)
  refs:
  - 2285-FY2024-REV
  - 2285-FY2023-REV
profit_and_margin:
  drivers:
  - period: FY2023
    driver: 'Revenue fell 4.5%: feed fell 33.5% and discounts rose to SAR 13.3m (SAR 1.1m), while flour rose 6.2%. Gross margin rose to 49.3%
      (45.7%), in a year with a SAR 13.2m reversal of the slow-moving inventory provision. Attributable profit fell 21.5% to SAR 200m because
      finance costs rose to SAR 121.7m (SAR 20.7m) on the loans inherited in the merger, and G&A included SAR 10.0m paid to NADEC to end its distribution
      agreements; zakat and tax fell to SAR 5.2m (SAR 18.5m). EBITDA margin 44.5% (we calculate).'
    source: 2285_ARABIAN_MILLS/2024_Annual_filed2025-03-24.pdf p.11 (P&L); 2285_ARABIAN_MILLS/2023_Annual_filed2024-10-07.pdf p.43-45, p.9
    refs:
    - 2285-FY2023-REV
    - 2285-FY2023-GP
    - 2285-FY2023-NI_ATTR
    - 2285-FY2023-FIN_COST
    - 2285-FY2023-ZAKAT_TAX
  - period: FY2024
    driver: Revenue +13.0% to SAR 974m as feed and bran recovered. Gross margin fell to 46.3%; on the FY2024 annual basis selling costs rose to
      SAR 59.6m (SAR 31.4m) and G&A to SAR 100.2m (SAR 87.4m), including SAR 7.8m of new point-of-sale bank charges and a SAR 5.6m GFSA fine provision.
      Finance costs fell to SAR 83.6m as SAR 226.5m of loans was repaid. Attributable profit +6.7% to SAR 214m; net margin 21.9%.
    source: 2285_ARABIAN_MILLS/2024_Annual_filed2025-03-24.pdf p.11 (P&L), p.48 (expenses), p.13 (cash flow); 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf
      p.9
    refs:
    - 2285-FY2024-REV
    - 2285-FY2024-GP
    - 2285-FY2024-NI_ATTR
    - 2285-FY2024-FIN_COST
  - period: FY2025
    driver: Revenue +2.4% to SAR 998m, led by flour; gross margin 47.2% (46.3%). Selling costs rose to SAR 79.2m (SAR 64.1m) with marketing at
      SAR 15.6m (SAR 7.0m). Finance cost fell to SAR 70.4m (SAR 83.6m) even though it included SAR 12.4m of loan-cost amortisation as SAR 174.5m
      of principal was repaid. Attributable profit +11.0% to SAR 237m; EBITDA margin 39.1% (we calculate).
    source: 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.9 (P&L), p.11 (cash flow), p.43 (expenses)
    refs:
    - 2285-FY2025-REV
    - 2285-FY2025-GP
    - 2285-FY2025-FIN_COST
    - 2285-FY2025-NI_ATTR
    - 2285-FY2025-EBITDA_C
  - period: 9M2026
    driver: Revenue +4.2% to SAR 755m and gross profit +8.5% (gross margin 48.3% vs 46.4%). Finance costs fell to SAR 39.4m (SAR 47.4m) and finance
      income rose to SAR 8.5m (SAR 4.4m), so attributable profit rose 15.8% to SAR 209m. Net margin 27.6% (24.9%); EBITDA margin 40.7% (39.3%).
    source: 2285_ARABIAN_MILLS/2026_Q3_filed2026-11-08.pdf p.5 (P&L), p.15 (segments)
    refs:
    - 2285-9M2026-REV
    - 2285-9M2026-GP
    - 2285-9M2026-NI_ATTR
    - 2285-9M2026-FIN_COST
    - 2285-9M2026-FIN_INC
  - period: FY2022-9M2026
    driver: 'Cash went to debt reduction: operating cash flow (before interest paid) reached SAR 430m in FY2025 and borrowings fell from SAR 1,748m
      (end-2022) to SAR 630m (30 Sep 2026). Net debt to EBITDA fell from 4.13x to 1.85x (FY2025) and 1.36x (9M 2026, annualised). ROE 20.8% in
      FY2025 (we calculate).'
    source: cash-flow statements and balance sheets (FY2023-FY2025 annuals; 2026 Q3 p.4, p.7)
    refs:
    - 2285-FY2025-CFO
    - 2285-FY2022-DEBT
    - 2285-9M2026-DEBT
    - 2285-FY2025-NET_DEBT
  one_offs:
  - item: Compensation to shareholder NADEC for ending its distribution and marketing-service agreements
