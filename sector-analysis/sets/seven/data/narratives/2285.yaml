- date: 2025 to 2026
  category: financing
  text: 'First dividends as a listed company: SAR 30.3m paid in 2025 and SAR 51.3m in 2026.'
  source: 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.11; 2285_ARABIAN_MILLS/2026_Q3_filed2026-11-08.pdf p.7
what_it_means:
  improved: Debt fell sharply after the merger, from SAR 1,748m to SAR 630m, so finance costs fell and attributable profit rose in each year from
    FY2023; the EBITDA margin was between 38.8% and 44.5% in FY2022-FY2025 and 40.7% in 9M 2026.
  weakened: Revenue growth slowed to 2.4% in FY2025 and 4.2% in 9M 2026, with Hail and bran sales falling, and attributable profit in FY2025 (SAR
    237m) was still below FY2022 (SAR 255m).
  why: Profit moved mainly with finance costs on the merger loans and with one-off items (the NADEC settlement, GFSA fines), while operating income
    was broadly flat from FY2023 to FY2025.
  uncertain: No volumes, prices or capacity are disclosed, so price and volume effects and the contribution of the new Riyadh mill are not determinable;
    the VAT basis of reported sales to NADEC differs between filings.
confidence_overall: Medium
data_notes:
- XBRL lacked the balance sheet, cost of revenue and gross profit and all of FY2022; these were read from the PDFs (stage A overrides).
- The XBRL impairment add-back was the expected credit loss on receivables; it was set to 0 for FY2024, FY2025, 9M2025 and 9M2026. FY2023 IMPAIR_CF
  is the write-off of intangible assets (SAR 0.2m).
- 'FY2022 and 1 Jan 2022 were restated in the FY2023 annual (note 32): lease liabilities and right-of-use assets +SAR 107.1m, PP&E and equity
  -SAR 16.5m; total assets FY2022 SAR 2,779.7m (R).'
- 'FY2023 direct costs were re-presented in the FY2024 annual (note 31: cost-centre allocation): gross profit SAR 415.5m to SAR 425.0m (R).'
- 'FY2024 was reclassified in the FY2025 annual (note 34; auditor emphasis of matter): cost of revenue +SAR 4.2m, cash and operating cash flow
  +SAR 0.18m (R).'
- '9M 2025 was reclassified in the 2026 Q3 interim (note 26): cost of revenue +SAR 2.6m, bank charges of SAR 1.11m moved into finance costs, operating
  cash flow +SAR 1.11m (R).'
- Operating cash flow is before interest paid (interest on loans and leases is in financing; interest received in investing), unlike First Milling
  and Modern Mills.
- 'Borrowings exclude accrued interest shown as a separate line: SAR 16.2m (FY2022), 12.0m (FY2023), 15.0m (9M2025), 10.4m (9M2026).'
- Cash excludes short-term murabaha deposits of SAR 50m at 30 Sep 2025.
- Product revenue in the FY2025 annual is net of rebates (FY2024 flour SAR 534.6m) while earlier annuals show products gross with rebates deducted
  in total (FY2024 flour SAR 547.0m); product growth is quoted on matching bases only.
- Related-party sales to NADEC are shown on different VAT bases in different filings (FY2023 SAR 22.8m vs 26.2m; FY2024 SAR 24.0m vs 20.9m); revenue
  itself is not affected. Relevant for cross-checks with NADEC (6010).
- Formerly The Second Milling Company; listed on 8 Oct 2024; the archive holds statements from FY2022 (with FY2021 comparatives).
