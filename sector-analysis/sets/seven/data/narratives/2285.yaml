developments:
- date: '2022-11-30'
  category: M&A
  text: Merged with its former parent (a holding company); the merger brought SAR 822.4m of goodwill and the acquisition loans onto the balance
    sheet.
  source: 2285_ARABIAN_MILLS/2023_Annual_filed2024-10-07.pdf p.37, p.6
- date: '2022-12-21'
  category: strategy
  text: Olam International left the shareholder group; NADEC raised its stake to 14.87% and in 2023 received SAR 10m to end its exclusive distribution
    and marketing agreements with the company.
  source: 2285_ARABIAN_MILLS/2023_Annual_filed2024-10-07.pdf p.37; 2285_ARABIAN_MILLS/2022_Annual_filed2024-10-07.pdf p.42
- date: 2023 to 2026
  category: financing
  text: Repaid SAR 673.0m of loans in FY2023, SAR 226.5m in FY2024 and SAR 174.5m in FY2025; borrowings were SAR 630.3m at 30 Sep 2026.
  source: 2285_ARABIAN_MILLS/2023_Annual_filed2024-10-07.pdf p.9; 2285_ARABIAN_MILLS/2025_Annual_filed2026-03-26.pdf p.11; 2285_ARABIAN_MILLS/2026_Q3_filed2026-11-08.pdf
    p.4
- date: '2024-10-08'
  category: event
