as_of: 26 November 2026 (filings to 30 September 2026)
intro: 'Financial analysis of the 47 Saudi Main Market companies on the SEVEN priority list (34 core companies matched from the SEVEN benchmark document of 15 Nov 2026, plus 13 supporting consumer-goods
  companies), for FY2022–FY2025 and the first nine months of 2026. Built from the ''Tadawul Financials'' archive of Saudi Exchange filings (audited annual and reviewed interim statements, and the exchange''s
  XBRL renderings), with the method used for the Energy and Banks pilots: every figure traced to its archive file and PDF page, like-for-like bridges, and one-offs with their tax status. The benchmark''s
  own figures and adjustments are not used or validated here.'
sections:
- heading: 'Start here: the five rules behind every number'
  lines:
  - Full years (FY2022–FY2025) and the 2026 year-to-date (9M 2026 = 1 January to 30 September) are always shown apart. 9M 2026 is compared only with 9M 2025, never with a full year.
  - 'Each year uses the latest restated figure: the comparative in the most recent filing that shows that year. Where this differs from what was first reported, the figure is marked R (restated) in the
    Data sheet and in a cell comment, the originally reported value is shown where the archive holds it, and the Restatements sheet gives the reason.'
  - 'Group totals and ratios are built from summed company figures: a group EBITDA margin is total EBITDA ÷ total revenue, not an average of company margins. Group totals are simple sums of listed companies,
    not consolidated accounts, so where one company owns part of another on the list the same profit can appear twice (see each group''s data notes).'
  - 'Group growth uses a matched sample: only companies with figures in both periods. Each totals block shows how many companies the revenue total covers in each period; a comment names any left out.'
  - Like-for-like growth separates the existing business from acquisitions, disposals, currency and new capacity. Where the filings do not allow this, it says 'not determinable' instead of guessing.
- heading: Periods
  lines:
  - Compound annual growth (CAGR) 2022–25 = (FY2025 ÷ FY2022)^(1/3) − 1, i.e. three years of compounding. A group's CAGR uses the companies with figures in every year 2022–2025; a company whose span includes
    a short year shows its CAGR as 'n.m.'. A 2022–26 CAGR needs full-year 2026 results (expected Feb–Apr 2027) and is not shown.
  - Growth and CAGR are 'n.m.' (not meaningful) when the starting value is zero, negative or below SAR 10m, or when a profit turns into a loss. Margins are 'n.m.' when revenue is below SAR 10m (e.g. an
    investment holding with almost no revenue). Return on equity is 'n.m.' when average equity is zero or negative, and net debt / EBITDA is 'n.m.' when (annualised) EBITDA is negative or below SAR 10m.
  - 9M ratios that divide by a balance-sheet amount (ROE) and net debt ÷ EBITDA are annualised (× 12/9; a short financial year × 12 / its months). Income figures in the tables are never annualised.
  - 'All 47 companies now report to 31 December. SADAFCO''s FY2022 is its year to 31 March 2023 (the year holding most of calendar 2022); it exists in the archive only as an XBRL file and is left out of
    group totals. Four have a short year, shown with its true length, left out of group totals, and with growth across it shown as ''n.m.'': SADAFCO FY2023 (nine months, after moving from a 31 March year-end),
    Cenomi Centers FY2022 and Cenomi Retail FY2022 (nine months each, after moving from 31 March) and MBC FY2023 (its first, eight-month period). Companies listed or formed during the period have no figures
    before their first filed statements in the archive (e.g. Entaj from FY2023).'
  - REITs publish audited annual and reviewed half-yearly statements. Their nine-month figures come from the quarterly fund fact sheets, which are unaudited and print only some items (several funds give
    no nine-month rental income), so REIT 9M totals cover fewer funds and the company pages show which figures exist.
- heading: Numbers and labels
  lines:
  - 'Units: SAR million unless stated. Filings in SAR or SAR ''000 were converted using the rounding level declared in each filing, then checked against the next year''s comparatives to catch unit errors.'
  - Hover over a figure with a red corner (a cell comment) to see why it is restated, how it was calculated, or which companies a total leaves out. The Data sheet lists every figure with its source file,
    XBRL row or PDF page, provenance and the checks made against the PDF.
  - Group totals and ratios carry a comment naming the companies left out; the 'companies in the total' row and the 'Companies (FY2025)' column give the counts.
  - 'Provenance (Data sheet and comments): D = disclosed as printed; R = restated comparative from a later filing (the original value is shown); C = calculated by us (formula shown). Figures taken from
    a PDF where the XBRL file was missing, unreadable or mis-tagged carry the PDF page.'
  - A blank cell means the figure is not available; missing figures are never filled with zeros or estimates. A true zero (e.g. no borrowings) shows as 0.0. 'n.m.' = not meaningful (see Periods); 'n.a.'
    = a group figure (total, growth, ratio, share or concentration) is not shown because the companies that report it make up less than 75% of the group's FY2025 revenue (e.g. Malls in FY2022, when Cenomi
    Centers had a nine-month year; REIT nine-month figures, which only some funds print); 'not determinable' = the filings do not allow a like-for-like step to be measured; 'not assessed' = no bridge entry
    was made for that step.
  - Amounts are shown with one decimal (SAR m); the commentary rounds amounts above SAR 100m to whole numbers.
  - Yellow cells are partial-year (9M) figures.
- heading: Reading the group sheets
  lines:
  - '1. Totals: summed company figures for the group, with growth on a matched sample and the 2022–25 CAGR; the ratios below are ratios of the totals.'
  - '2. Excluding the largest company: the same block without the group''s largest company by FY2025 revenue, so a reader can see whether one company drives the group (not shown for one-company groups).'
  - '3. Contribution: each company''s share of the group total, and its contribution to group growth in percentage points (its change ÷ the group''s prior-period total); contributions add up to group growth.'
  - 'Concentration (HHI): the sum of squared revenue shares × 10,000; above 2,500 is highly concentrated, 10,000 = one company.'
  - 'YTD change: 9M 2026 against 9M 2025 for the same companies.'
- heading: Reported vs like-for-like growth
  lines:
  - Reported growth − perimeter (acquisitions/disposals) − FX translation − hyperinflation − accounting/presentation changes = organic growth.
  - Organic growth − revenue from new capacity added in the period (new stores, restaurants, clubs, malls or plants) = like-for-like growth of the existing business.
  - Price, tariff and rate changes in the existing business are part of like-for-like growth. They are not treated as non-organic.
  - The Saudi riyal is pegged to the US dollar, so FX is nil for SAR and USD business; it matters only for other currencies (e.g. Egyptian pound for Americana, Gulf and Egyptian operations for retailers).
  - Each adjustment shows its basis (disclosed, calculated, estimated, none identified, not determinable), its source page and a confidence level. 'None identified' means the filings show there was nothing
    (e.g. a single Saudi entity has no FX step); it is never assumed.
  - Same-store (like-for-like) sales growth reported by a company would be quoted, with its definition, where the filings give it. None of the 47 companies' statements in the archive does, so the new-capacity
    step is 'not determinable' for retailers and restaurant operators; store, restaurant and branch counts are quoted where given.
- heading: Measures
  lines:
  - 'Operating companies (all groups except REITs): IFRS revenue; gross profit where the income statement shows it; operating income on one definition (profit before zakat and tax + finance costs − finance
    income − share of associates); EBITDA calculated the same way for every company (operating income + depreciation and amortisation including right-of-use assets + impairments of non-financial assets,
    from the cash-flow statement); net profit attributable; operating cash flow; capex (property, plant, equipment and intangibles); free cash flow = operating cash flow − capex − spend on investment property
    (for owners of let property such as malls); borrowings, lease liabilities, cash, short-term bank deposits and net debt (borrowings + lease liabilities − cash − short-term bank deposits). Capex excludes
    right-of-use additions, key money and biological assets (e.g. dairy herds), so capex intensity is not fully comparable for agricultural companies.'
  - 'Operating income includes items some companies print below their own operating profit (FX differences, fair-value results on investments, disposal gains). One-offs: items the filing calls non-recurring,
    and items clearly outside normal operations (disposal gains and losses on property, investments or businesses; insurance and compensation receipts; IPO and listing costs; fair-value results on financial
    investments; FX differences on financing balances), are listed in the One_offs register and removed in ''EBITDA excl. identified one-offs''. Small items that recur in normal operations (equipment disposals,
    lease modifications, write-offs) are not one-offs.'
  - Operating cash flow is as reported; companies differ on whether interest paid sits in operating or financing cash flow, and lease payments are financing cash flows under IFRS 16, so free cash flow is
    before lease payments. The company's data notes state the basis where the filing makes it clear.
  - Lease-heavy businesses (restaurants, gyms, retailers, malls) report under IFRS 16, so EBITDA is before rent and net debt includes lease liabilities; net debt ÷ EBITDA is on that basis for every company.
    Borrowings and lease liabilities are shown on separate lines, so a borrowings-only view can be read from each company page.
  - 'REITs: rental (and hotel) revenue; net income; funds from operations (FFO), which we calculate as net income + depreciation and impairments of real estate − gains on property disposals; distributions
    declared; borrowings and cash; net asset value at fair value as the fund reports it; LTV = borrowings ÷ total assets; payout = distributions ÷ FFO.'
  - Americana reports in US dollars; amounts are converted to SAR at the fixed peg of 3.75 and the original currency is kept in the data sheet.
  - Operating measures (stores, restaurants, clubs, gross leasable area, same-store sales) are quoted only where they appear in the filings in the archive. None of the 47 companies' statements in the archive
    reports same-store sales growth; store and restaurant counts are given by some.
- heading: How the figures were checked
  lines:
  - 'Stage 1, by analysts: every core figure of every company and period was compared with the audited or reviewed PDF statements, page by page (5,791 checks: about 130 per operating company, 71–84 per
    REIT). Scanned pages were read by OCR and checked against printed subtotals or by eye. 3,154 matched as they were, 419 were corrected and 1,482 added where the exchange''s XBRL file was wrong or missing,
    and 736 were ''not applicable'' or ''not printed'' for that company (e.g. no gross profit line). Each correction cites its file and page (Data sheet).'
  - 'Stage 2, automatic: every disclosed figure (5,118) was searched for on its PDF page, including the OCR text of scanned pages, and the line it was found on was compared with the figure''s label. Of
    the 1,636 calculated figures, 1,577 were recomputed from their inputs and all reproduce; the other 59 are sums of printed lines checked against the PDF page.'
  - 'Stage 3, manual: the 1,733 figures the search could not place, or found on a line with a different label, were matched to the stage 1 page checks: 1,701 confirmed and 32 accepted limitations, listed
    below. An independent reviewer then re-read a random sample of 94 figures (two per company) on the PDF pages: 93 confirmed, 1 not checkable (SADAFCO FY2022, no PDF).'
  - 'Accepted limitations: SADAFCO''s year to 31 March 2023 and its 31 March 2022 balance sheet exist in the archive only as XBRL files (no PDF); the restated 30 September 2025 balance sheets of Baan, Armah
    and Cenomi Retail appear only in the 2026 Q3 XBRL files; REIT nine-month figures come from unaudited fact sheets.'
  - Calculated figures (operating income, EBITDA, free cash flow, net debt, FFO, ratios) are recomputed from their inputs; group totals and ratios on the group sheets are live Excel formulas over the company
    figures and were checked against an independent calculation.
- heading: Confidence
  lines:
  - 'High: company-disclosed amount or simple arithmetic on audited/reviewed figures.'
  - 'Medium: disclosed inputs combined with one stated assumption.'
  - 'Low: proxies or management commentary without amounts.'
  - 'Not determinable: disclosure is insufficient, so no number is shown.'
- heading: Codes used in the Data, Sources and Coverage sheets
  lines:
  - 'Provenance: D = disclosed as printed in the filing used; R = restated comparative from a later filing; C = calculated by us (formula in ''location'').'
  - 'PDF match status / how traced: text_statement or text_other = the value was found on a text page of the PDF (statement page or a note); ocr_statement or ocr_other = found on an image page by OCR; pdf_override_confirmed
    = the value was taken from the PDF page and found there again; pdf_override_page = taken from the PDF page, not re-found by search (e.g. a sum of printed lines); components_found = a sum whose parts
    were all found; later_filing = printed as a comparative in a later filing; calculated_ok = a calculated figure recomputed from its inputs; too_small or not_found = not placed by the search (then confirmed
    by hand, see the next column).'
  - 'Manual check: confirmed (p. X of file) = the value was compared with that page by an analyst; confirmed_components = the parts were compared; confirmed_nil = the page shows no such item; accepted_limitation
    = no PDF in the archive presents the figure (XBRL only).'
  - 'Sources status: used = the file was read and used; used-with-flag = used, with a note (e.g. scanned pages or a name not found in the text layer); flagged = the exchange''s label or symbol differs from
    the file''s own content, explained in read_note.'
- heading: Review record (27 November 2026)
  lines:
  - 'Left out of group totals or shown as n.a. (all other periods are included): SADAFCO FY2022 (year to 31 March 2023, XBRL only, no PDF) and FY2023 (nine months to December 2023) in the Supporting group;
    Cenomi Retail FY2022 (nine-month year) in Retailers; MBC FY2023 flows in Media; Cenomi Centers'' nine-month FY2022 makes Malls FY2022 n.a. (coverage below 75%); REIT 9M 2026 and 9M 2025 group figures
    are n.a. where coverage is below 75%.'
  - 'Net debt: the baseline deducts cash and bank deposits due within one year. Longer-term deposits are shown only as notes under ARDCO (SAR 600m end-2023, SAR 630m end-2024) and Americana (USD 117.8m
    end-2025). Within the filings checked, these are the only long-term deposit cases found. They are a sensitivity, not proof the deposits are freely available cash.'
  - 'Treatments kept and disclosed: short-term deposits in net debt; Nahdi bank charges in finance costs (memo on its page, in the Retailers notes and in the Overview note); extra one-off categories (mill
    fines, eXtra VAT refunds, Halwani provision release, Entaj payables write-back) with reasons in the One_offs register; Entaj biological fair-value gains kept in EBITDA (memo lines excluding them on
    its page and in the Overview note).'
  - 'Corrected in this version: the Entaj note that said fair-value changes were removed from EBITDA excluding one-offs; added ARDCO and Americana long-term deposit sensitivities, the Nahdi and Entaj memos,
    and a Jahez customer-funds note. No figure, formula or group total was changed.'
  - 'Group coverage rule: the 75% test of FY2025 revenue uses the same formula in all 3,178 test cells of the eight group sheets, with weights from each group''s own FY2025 revenue block. Group totals (474
    cells) were reproduced independently.'
  - 'Checks passed in our review (ours, not the analyst''s): all 17,798 formulas were recalculated with no differences or errors; operating income, EBITDA, net debt, free cash flow, gross profit, profit
    splits and EBITDA excluding one-offs were rebuilt from the Data sheet; 65 of 65 FY2025 inputs were found in the PDFs for Americana, Almarai, NADEC, Entaj and ARDCO (five companies only), plus targeted
    checks of Nahdi bank charges, SACO gross profit, SADAFCO periods and Entaj fair value.'
  - 'Not checked in review: a full re-read of the 5,791 core figures and the 94-figure sample; the PDFs of most other companies beyond targeted checks; deposit lines in scanned filings (Tanmiah, Naqi Q3
    2026, Alamar Q2 2026, Alsaif Q3 2026 and some REIT annuals); any restriction or pledge over deposits; individual coverage percentages were not recomputed from raw data.'
  - 'Analyst statements, not verified by us: the figures-checked claims in the analyst''s notes (5,791 core figures compared with the PDFs, 419 corrected, 1,482 added, 94-figure independent sample with
    93 confirmed, two internal reviews, 0 formula errors) are the analyst''s own statements. Our independent checks are limited to those listed above.'
workbook_title: 'SEVEN priority companies: financial analysis 2022–2026 (47 Saudi Main Market companies)'
coverage_note: 'File-level checks (company name, period, units, assurance) were done inside every file - see Sources. Every core figure was compared with the PDF statements by an analyst, and every disclosed
  figure was then searched for on its PDF page (Data sheet: PDF match status and manual check).'
group_word: group
overview_note: 'Notes: (1) Nahdi''s EBITDA margin (16.9%) is before SAR 53.8m of bank charges booked in finance costs; about 16.3% on the basis other retailers use. (2) Net debt / EBITDA deducts bank deposits
  due within one year; long-term deposits are not deducted (Americana FY2025 would be 0.37x instead of 0.57x with its USD 117.8m long-term deposits; ARDCO is net cash either way). (3) Entaj''s EBITDA includes
  biological fair-value gains (FY2025 SAR 13.0m; 3.5% margin without them against 4.5%). See each company page and How_to_read.'
