what_it_means:
  improved: Revenue grew 7.8% a year from FY2022 to FY2025, with wholesale and logistics growing fastest, and free cash flow held near SAR 500m a year (SAR 508m in FY2025).
  weakened: 'Profitability fell after FY2024: net margin 4.8% in FY2025 and 2.1% in 9M 2026, as selling costs outgrew revenue and a SAR 24.4m credit-loss charge was booked; 9M 2026 operating cash flow fell 63.8% to SAR 171m.'
  why: In 9M 2026 retail revenue fell 10.1% while lower-margin wholesale grew, and trade receivables rose to SAR 998m, funded partly by more short-term borrowing (SAR 716m).
  uncertain: The filings do not explain the retail decline or name the customers behind the receivables build, and give no pharmacy count or like-for-like sales; FY2024 figures were restated for prior-period errors in the FY2025 annual.
confidence_overall: Medium
data_notes:
- 'FY2024 P&L and balance sheet are restated (FY2025 annual note 34, p.50-56): profit SAR 370.1m -> 351.4m; equity SAR 1,456.5m -> 1,329.8m. FY2023 balance-sheet figures (TA SAR 4,733m, equity SAR 1,210m) are the restated 1 January 2024 column of the FY2025 annual, while FY2023 profit is not restated, so FY2023-FY2024 ROE mixes restated equity with unrestated FY2023 profit.'
- 9M 2025 P&L comparatives in the 2026 Q3 interim were not restated (impact judged immaterial, note 2.1). 9M 2025 equity (SAR 1,425m) is restated via the opening balance in the statement of changes in equity; 9M 2025 total assets (SAR 5,229m) come from the 2026 Q3 XBRL only (the 2025 Q3 PDF printed SAR 5,175m before restatement).
- FY2024 operating cash flow (SAR 692m) is the FY2025 annual comparative, after SAR 8.3m was moved to investing activities; the FY2024 annual printed SAR 683m.
- Capex includes additions to intangible assets and 9M D&A includes right-of-use depreciation (both corrected in stage A).
- FY2025 share of associates (-SAR 3.9m) excludes a SAR 0.2m write-off of an investment in unconsolidated subsidiaries, which stays in operating income.
- Debt at 30 Sep 2026 includes a SAR 25.5m bank overdraft; the cash-flow statement shows cash net of the overdraft (SAR 6.2m) while the balance sheet shows SAR 31.7m.
- Revenue is shown after a voluntary social-services contribution (SAR 44.3m FY2025, SAR 8.9m FY2024; note 23).
- The annual statements report one operating segment; the 2026 Q3 interim reports retail, wholesale and logistics segments, so segment history starts in 9M 2025.
- There is no finance income line; finance cost includes interest on the end-of-service benefit liability (SAR 15.3m in FY2025, note 27).
