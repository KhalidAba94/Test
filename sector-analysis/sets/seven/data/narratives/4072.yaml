  - {date: "2025-09-18", category: "event", text: "The Public Investment Fund acquired Istedamah's stake and became the parent company.", source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.12"}
  - {date: "2025-2026", category: "strategy", text: "Invested a further SAR 139m (FY2025) and SAR 96.8m (9M 2026) in the MBC Game Studio joint venture, whose losses are funded by the government gaming initiative.", source: "4072_MBC_GROUP/2026_Q3_filed2026-11-15.pdf p.19, p.22"}
what_it_means:
  improved: "Revenue rose 28.5% in FY2025 to SAR 5,391m, with MBC Shahid segment revenue up 28.2% and digital revenue up 25.7%; digital revenue still grew 14.8% in 9M 2026."
  weakened: "The gross margin fell from 28.7% to 23.5% in FY2025 and operating cash flow fell 69.1% to SAR 175m; in 9M 2026 revenue fell 22.8% and the attributable result was a loss of SAR 510m (net margin -17.2%)."
  why: "Reported profit has leaned on the ACSC stake (a SAR 171m sale gain in FY2024, a SAR 179m net fair-value gain in FY2025 and a SAR 575m fair-value loss in 9M 2026, all inside our operating income), while revenue swings with government-funded production (SAR 775m in FY2025, SAR 50.3m in 9M 2026) and with broadcast and technical services."
  uncertain: "The filings do not explain the 53.1% fall in broadcast and technical services revenue or say how much government funding is committed, and the remaining ACSC stake (SAR 385m at 30 September 2026) is still marked to market through profit."
confidence_overall: "Medium"
data_notes:
  - "Short year: FY2023 is the first statutory period (20 April-31 December 2023, subsidiaries consolidated from 30 June 2023, about six months of operations). There are no FY2022 or FY2021 statutory figures; the zeros the XBRL filing shows for 31 December 2022 (total assets, equity) are not used. Note 30(b) pro-forma figures are not used."
  - "Revenue = revenue from contracts with customers + other operating revenues (government funding treated as government grants, note 5). No total line is printed; the two lines are summed (FY2025: SAR 4,244m + SAR 1,147m)."
  - "Restatements: FY2023 revenue and direct costs were each raised by SAR 7.9m in the FY2024 AFS (note 31), so FY2023 direct costs are shown as restated (SAR 1,231m first reported); FY2024 direct costs moved SAR 1.8m to G&A in the FY2025 AFS (note 30, under 0.5%)."
  - "Finance costs and income are one net line on the face ('Finance income - net'), treated as finance income (FY2023: a net cost, treated as finance cost). Note 9 split: FY2025 income SAR 62.1m, costs SAR 4.1m; FY2024 SAR 60.4m and SAR 4.1m; FY2023 SAR 3.1m and SAR 6.2m. The XBRL FY2024 finance-cost value (-56.3), which double-counted the net line, is not used."
  - "Our operating income (PBT + finance cost - finance income - share of associates) includes other income, the ACSC sale and fair-value results and call-option results, so it differs from the printed 'Operating profit' (FY2025 SAR 198m; FY2024 SAR 117m)."
  - "FY2023 capex corrected to SAR 60.9m (PP&E SAR 40.2m + intangibles SAR 20.7m); the XBRL netted the two lines. FY2024 capex is as first reported: the FY2024 AFS prints the same lines; the XBRL comparative had a sign error."
  - "Borrowings exclude the interest-free shareholder loan (SAR 497m at end-2023, repaid 2024) and the interest-free loan from a related party (SAR 63.8m). Borrowings are nil from 31 December 2024 (nil rows added for FY2025, 9M 2025 and 9M 2026)."
  - "Primary statements in every PDF are scanned images and were read visually; the 30 September 2025 balance sheet comes from the 2025 Q3 interim (the 2026 Q3 interim shows 31 December 2025 only)."
  - "Year-end 31 December. Main Market listing from 8 January 2024 (no Nomu period)."
  - "Net debt / EBITDA is n.m. for 9M 2026 because EBITDA is negative (MBC holds net cash of SAR 1,099m at 30 September 2026); ROE is not shown for FY2023 because there is no opening equity for the first period."
