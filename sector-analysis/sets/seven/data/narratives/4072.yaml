ticker: "4072"
headline: >-
  Revenue rose 28.5% to SAR 5,391m in FY2025 but attributable profit fell 4.4% to SAR 383m, and in both FY2024 and FY2025 profit
  leaned on gains from the ACSC stake (SAR 171m and SAR 179m); in 9M 2026 revenue fell 22.8% to SAR 2,964m and a SAR 575m
  fair-value loss on ACSC turned the result into an attributable loss of SAR 510m. FY2023 is a short first period, so growth
  across it is n.m.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue, which MBC presents as two lines: revenue from contracts with customers and 'other operating
    revenues' (Saudi government funding for media and entertainment initiatives, treated as government grants, note 5). Both are
    in our revenue. FY2023 is MBC Group's first statutory period (20 April 2023 to 31 December 2023, with the Group entities
    consolidated from 30 June 2023), so FY2023/FY2022 and FY2024/FY2023 growth is n.m. (short period). From FY2024 there were no
    acquisitions or disposals of subsidiaries; the ACSC stake and the MBC Game Studio joint venture are outside revenue. Egyptian
    revenue (9.8% of revenue from contracts in FY2025, we calculate) carries a currency effect that cannot be measured, and MBC
    gives no capacity or subscriber measures, so like-for-like growth is not determinable; organic growth before FX equals reported
    growth.
  perimeter_changes:
    - {event: "Reorganisation under common control: new Saudi holding company (incorporated 20 April 2023) took over the MBC Group entities for nil consideration; consolidated prospectively from 30 June 2023", date: "2023-06-30", effect: "FY2023 holds about six months of operations; no FY2022 statutory figures (pro-forma 12-month 2023 revenue SAR 3,704m in note 30(b), not used)", source: "4072_MBC_GROUP/2023_Annual_filed2024-07-02.pdf p.16, p.71"}
    - {event: "Sale of 4.9% of ACSC (associate) for SAR 417m", date: "2024", effect: "no revenue effect; realised gain SAR 171m", source: "4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.52"}
    - {event: "ACSC reclassified from associate to an investment at fair value through profit or loss after loss of significant influence", date: "2025-05-15", effect: "no revenue effect; gain SAR 264m on reclassification, then fair-value losses", source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.52"}
    - {event: "Further investment in the MBC Game Studio joint venture (SAR 139m in FY2025, SAR 96.8m in 9M 2026)", date: "2025-2026", effect: "equity-accounted; no revenue effect", source: "4072_MBC_GROUP/2026_Q3_filed2026-11-15.pdf p.22"}
  capacity_changes:
    - {event: "No capacity, channel or subscriber figures in the statements", date: "FY2024-9M2026", effect: "not determinable", source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.33"}
  fx_exposure: >-
    UAE and Saudi revenue is in pegged currencies. Revenue from contracts earned in Egypt was SAR 416m in FY2025 (SAR 268m in
    FY2024); the Egyptian pound weakened, but no constant-currency figures are given, so the FX step is not determinable.
  price_volume_support: >-
    Not determinable. The notes split revenue by type (advertising, broadcast and technical services, digital, distribution,
    programme, interactivity) and by segment, but give no rates, airtime, audience or subscriber numbers.
  confidence: "Not determinable for like-for-like; High that there was no perimeter effect on revenue in FY2025 and 9M 2026"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      Revenue rose SAR 1,194m. Revenue from contracts rose 20.0% (SAR 3,537m to SAR 4,244m): advertising +4.5%, broadcast and
      technical services +26.3% and digital +25.7%. Government-funded other operating revenues rose 73.9% (SAR 659m to SAR 1,147m),
      mainly production-related initiatives (SAR 308m to SAR 775m). By segment, MBC Shahid revenue rose 28.2% (SAR 1,079m to
      SAR 1,383m). No prices or volumes are disclosed.
    basis: "disclosed (revenue by type and segment); price/volume split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.34-37"
    refs: ["4072-FY2025-REV", "4072-FY2024-REV"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue fell SAR 877m. Revenue from contracts fell 19.1% (SAR 3,178m to SAR 2,571m): broadcast and technical services fell
      53.1% (SAR 858m to SAR 403m) and advertising 21.1% (SAR 1,124m to SAR 886m), while digital revenue rose 14.8% (SAR 728m to
      SAR 836m). Other operating revenues fell 40.7% (SAR 663m to SAR 394m) as production-related funding dropped from SAR 386m to
      SAR 50.3m. MBC Shahid segment revenue rose 15.9% (SAR 1,017m to SAR 1,179m).
    basis: "disclosed (revenue by type and segment); price/volume split not determinable"
    confidence: "High for the amounts; the split is not determinable"
    source: "4072_MBC_GROUP/2026_Q3_filed2026-11-15.pdf p.16, p.19"
    refs: ["4072-9M2026-REV", "4072-9M2025-REV"]
profit_and_margin:
  drivers:
    - {period: "FY2023", driver: "Short first period (20 April to 31 December 2023, operations consolidated from 30 June 2023): revenue SAR 1,712m and attributable profit SAR 19.0m (net margin 1.1%). We calculate an operating loss of SAR 10.4m and EBITDA of SAR 25.2m (margin 1.5%); other income included SAR 54.4m of compensation for loss of business, and the Shahid segment lost SAR 126m before tax.", source: "4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.8, p.35, p.42", refs: ["4072-FY2023-REV", "4072-FY2023-NI_ATTR", "4072-FY2023-OPINC", "4072-FY2023-EBITDA_C"]}
    - {period: "FY2024", driver: "First full year as a listed group (not comparable with FY2023). Attributable profit SAR 400m, net margin 9.5% and ROE 10.1%. Our operating income of SAR 367m (margin 8.7%) and EBITDA of SAR 466m (margin 11.1%) include the SAR 171m gain on selling 4.9% of ACSC and SAR 67.7m of compensation income, together SAR 238m (we calculate). Gross margin 28.7%; operating cash flow SAR 567m.", source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.8, p.10, p.41; 4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.52", refs: ["4072-FY2024-NI_ATTR", "4072-FY2024-OPINC", "4072-FY2024-EBITDA_C", "4072-FY2024-CFO", "4072-FY2024-GP"]}
    - {period: "FY2025", driver: "Revenue +28.5% but gross profit only +5.0%: direct costs rose 37.9% (we calculate), and the gross margin fell from 28.7% to 23.5%, as government-funded production revenue carries its costs in direct costs. Operating income rose 9.8% to SAR 403m (margin 7.5%), helped by a SAR 179m net fair-value gain (ACSC reclassification gain SAR 264m less later fair-value losses); EBITDA SAR 526m (margin 9.8%). Attributable profit fell 4.4% to SAR 383m (net margin 7.1%, ROE 8.8%). Operating cash flow fell 69.1% to SAR 175m as deferred revenue fell by SAR 495m and receivables rose by SAR 550m; free cash flow was -SAR 80.6m.", source: "4072_MBC_GROUP/2025_Annual_filed2026-03-27.pdf p.8, p.10, p.34, p.52", refs: ["4072-FY2025-REV", "4072-FY2025-GP", "4072-FY2025-OPINC", "4072-FY2025-NI_ATTR", "4072-FY2025-CFO", "4072-FY2025-FCF"]}
    - {period: "9M2026", driver: "Revenue -22.8% to SAR 2,964m with the gross margin unchanged at 28.9%. A net fair-value loss of SAR 575m (ACSC marked from SAR 960m to SAR 385m) and joint-venture losses of SAR 99.1m (MBC Game Studio, offset in revenue by SAR 96.0m of gaming-initiative funding) turned the result negative: we calculate an operating loss of SAR 428m (margin -14.4%) and EBITDA of -SAR 353m (margin -11.9%). Attributable loss SAR 510m (net margin -17.2%; annualised ROE -15.8%) against a profit of SAR 403m in 9M 2025, which included a SAR 52.4m fair-value gain. Operating cash flow was SAR 197m (9M 2025: -SAR 58.0m).", source: "4072_MBC_GROUP/2026_Q3_filed2026-11-15.pdf p.4, p.6, p.16, p.19, p.22-24", refs: ["4072-9M2026-REV", "4072-9M2026-OPINC", "4072-9M2026-EBITDA_C", "4072-9M2026-NI_ATTR", "4072-9M2025-NI_ATTR", "4072-9M2026-CFO", "4072-9M2025-CFO"]}
