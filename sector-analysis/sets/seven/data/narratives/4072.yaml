developments:
  - {date: "2023-04-20", category: "strategy", text: "MBC Group Company incorporated in Riyadh as the new holding company; the Group entities were transferred from MBC Group Holdings Limited for nil consideration (legal transfer completed 22 June 2023) and consolidated from 30 June 2023.", source: "4072_MBC_GROUP/2023_Annual_filed2024-07-02.pdf p.12, p.16"}
  - {date: "2024-01-08", category: "financing", text: "Shares started trading on the Saudi Exchange after an IPO of 33.25 million new shares at SAR 25; net proceeds of SAR 764m were received in 2024.", source: "4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.12, p.58"}
  - {date: "2024", category: "financing", text: "Repaid the interest-free SAR 497m shareholder loan (used in 2022 to raise the ACSC stake) and SAR 188m of bank borrowings; no borrowings since 31 December 2024.", source: "4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.9, p.10, p.52"}
  - {date: "2024", category: "M&A", text: "Sold 4.9% of ACSC to investors for SAR 417m, a gain of SAR 171m.", source: "4072_MBC_GROUP/2024_Annual_filed2025-03-27.pdf p.52"}
