ticker: "6015"
headline: >-
  Revenue fell 9.0% in FY2024 and recovered 14.2% in FY2025 to SAR 9,408m (1.8% a year since FY2022) while the restaurant estate grew
  from 2,183 to 2,749; attributable profit of SAR 822m in FY2025 was still below the SAR 972m of FY2022, but in 9M 2026 revenue rose
  12.9% and attributable profit 60.4% to SAR 814m.
lfl_basis:
  definition_used: >-
    Standard bridge on IFRS revenue. Americana reports in US dollars; our tables convert at the peg of 3.75 SAR per USD, so the SAR/USD
    conversion itself adds no FX effect. Reported growth less acquisitions, currency translation, hyperinflation and presentation changes
    gives organic growth; organic growth less revenue from restaurants opened in the period gives like-for-like growth. Americana reports no
    like-for-like or same-store sales growth in any annual or interim statement in the archive, gives restaurant counts only at year-end
    (directors' report) and does not disclose the revenue of acquired businesses or the currency effect on revenue. Only the hyperinflation
    step can be calculated (Lebanon, IAS 29: +SAR 4.7m in FY2023, -SAR 18.0m in FY2024, +SAR 0.8m in FY2025). Organic and like-for-like
    growth are therefore not determinable; reported growth is the only measure available.
  perimeter_changes:
    - {event: "No business combinations in FY2022-FY2024; the 27 June 2022 transfer of the restaurant business from Kuwait Food Company into the Group was a common-control reorganisation of the same business", date: "2022-2024", effect: "none identified", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.13; 6015_AMERICANA/2023_Annual_filed2024-02-14.pdf p.4, p.15"}
    - {event: "Pizza Hut business in Oman acquired (100% of Fast Food & Restaurants Company SPC) for USD 10.7m (SAR 40.0m)", date: "2025-01-23", effect: "revenue contribution not disclosed (Lower Gulf segment)", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.59-60"}
    - {event: "Malak Al Tawouk acquired in the UAE (USD 19.3m, goodwill USD 1.9m) and in KSA (USD 0.9m, bargain purchase gain USD 0.9m)", date: "2026-02-26 and 2026-07-08", effect: "revenue contribution not disclosed", source: "6015_AMERICANA/2026_Q3_filed2026-10-27.pdf p.36-37"}
  capacity_changes:
    - {event: "Restaurants operated rose from 2,183 to 2,435 (12 brands); Peet's Coffee launched in Dubai and Riyadh", date: "2023", effect: "revenue of new restaurants not disclosed", source: "6015_AMERICANA/2022_Annual_filed2023-04-09.pdf p.3; 6015_AMERICANA/2023_Annual_filed2024-02-14.pdf p.3"}
    - {event: "Restaurants operated rose from 2,435 to 2,590", date: "2024", effect: "revenue of new restaurants not disclosed", source: "6015_AMERICANA/2024_Annual_filed2025-02-12.pdf p.3"}
    - {event: "Restaurants operated rose from 2,590 to 2,749 (includes the acquired Pizza Hut Oman estate)", date: "2025", effect: "revenue of new restaurants not disclosed", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.3"}
    - {event: "No restaurant count in the 2026 interims", date: "2026 (9M)", effect: "not determinable", source: "6015_AMERICANA/2026_Q3_filed2026-10-27.pdf p.10"}
  fx_exposure: >-
    Revenue comes from 12 countries and is presented in USD. The company names its main exposures as the Kuwaiti dinar, Saudi riyal, UAE
    dirham and Egyptian pound and calls the risk between the first three limited (FY2025 annual note 3, p.27). Egypt revenue in USD fell
    24.5% in FY2023 and 31.6% in FY2024 and rose 29.4% in FY2025, but no constant-currency revenue is disclosed, so the FX step is not
    determinable. Egypt is not treated as hyperinflationary; only Lebanon is (IAS 29 since September 2020).
  price_volume_support: >-
    Not determinable. The filings give no transactions, average ticket or like-for-like sales. Year-end restaurant counts allow a revenue
    per average restaurant calculation (below), which separates estate growth from revenue per restaurant but not price from volume.
  confidence: "Low (only the small hyperinflation step is quantified; perimeter, FX and new-capacity steps are not determinable)"
price_volume:
  - period: "FY2025 vs FY2024"
    text: >-
      We calculate that the average estate (mean of year-end counts) grew 6.2% (2,512.5 to 2,669.5 restaurants) while revenue rose 14.2%,
      so revenue per average restaurant rose 7.5% (SAR 3.28m to SAR 3.52m). This includes the Pizza Hut Oman acquisition. The split between
      menu prices and customer numbers is not disclosed.
    basis: "calculated"
    confidence: "Medium (assumes openings spread evenly through the year)"
    source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.3; 6015_AMERICANA/2024_Annual_filed2025-02-12.pdf p.3"
    refs: ["6015-FY2025-REV", "6015-FY2024-REV"]
  - period: "FY2024 vs FY2023"
    text: >-
      We calculate that the average estate grew 8.8% (2,309 to 2,512.5 restaurants) while revenue fell 9.0%, so revenue per average
      restaurant fell 16.3% (SAR 3.92m to SAR 3.28m). All four segments fell, Lower Gulf (-29.6%) and North Africa (-26.5%) the most.
      The filings do not explain the fall or show how much came from the Egyptian pound.
    basis: "calculated"
    confidence: "Medium (assumes openings spread evenly through the year)"
    source: "6015_AMERICANA/2024_Annual_filed2025-02-12.pdf p.3, p.61; 6015_AMERICANA/2023_Annual_filed2024-02-14.pdf p.3"
    refs: ["6015-FY2024-REV", "6015-FY2023-REV"]
  - period: "9M 2026 vs 9M 2025"
    text: >-
      Revenue rose 12.9%: Major GCC +10.9% (SAR 5,010m to SAR 5,557m), Lower Gulf +23.6%, North Africa +16.7% and Others +14.2%
      (segment revenue converted at 3.75). No restaurant count is given for 30 September, so estate growth and revenue per restaurant cannot be
      separated.
    basis: "disclosed (segment revenue); split not determinable"
    confidence: "High for the segment amounts; the split is not determinable"
    source: "6015_AMERICANA/2026_Q3_filed2026-10-27.pdf p.33"
    refs: ["6015-9M2026-REV", "6015-9M2025-REV"]
