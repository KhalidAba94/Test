    - {period: "FY2023", driver: "Revenue +1.5% to SAR 9,049m and attributable profit +0.1% to SAR 973m. Major GCC revenue rose 5.0% and Others 14.5%, while North Africa fell 19.3% (Egypt -24.5% in USD). We calculate EBITDA up 6.2%, giving an EBITDA margin of 22.6% (FY2022: 21.5%). FY2022 had included tax claim charges of SAR 84.5m; FY2023 included a SAR 42.5m write-down of the REEF derivative, partly offset by a SAR 28.2m release of deferred gain. Finance income rose to SAR 57.4m (SAR 13.6m) as cash moved into term deposits. Net margin 10.8%.", source: "6015_AMERICANA/2024_Annual_filed2025-02-12.pdf p.12 (P&L), p.61-62 (segments); 6015_AMERICANA/2023_Annual_filed2024-02-14.pdf p.48-49 (note 16)", refs: ["6015-FY2023-REV", "6015-FY2023-NI_ATTR", "6015-FY2023-EBITDA_C", "6015-FY2022-EBITDA_C", "6015-FY2023-FIN_INC"]}
    - {period: "FY2024", driver: "Revenue fell 9.0% to SAR 8,238m. All segments fell: Lower Gulf -29.6%, North Africa -26.5%, Others -14.0% and Major GCC -2.8% (in USD: KSA -1.9%, UAE -0.3%, Kuwait -9.8%, Egypt -31.6%); the filings give no reason. Selling and marketing expenses rose 0.9% to SAR 2,943m, 35.7% of revenue (FY2023: 32.2%), and impairment of non-financial assets rose to SAR 47.4m (SAR 2.4m). Attributable profit fell 38.8% to SAR 595m; non-controlling interests bore a SAR 27.6m loss. We calculate EBITDA down 11.3% and an EBITDA margin of 22.0%; operating margin 8.7%, net margin 7.2%.", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.10 (P&L), p.57-58 (segments)", refs: ["6015-FY2024-REV", "6015-FY2024-NI_ATTR", "6015-FY2024-EBITDA_C", "6015-FY2024-IMPAIR_CF", "6015-FY2024-NI_NCI", "6015-FY2024-OPINC"]}
    - {period: "FY2025", driver: "Revenue rose 14.2% to SAR 9,408m and every segment grew: Major GCC +11.2%, Lower Gulf +33.0% (including Pizza Hut Oman from 23 January 2025, revenue not disclosed), North Africa +27.8% and Others +11.1%; restaurants reached 2,749. Gross profit rose 16.9% (gross margin 54.4% vs 53.1%). Attributable profit rose 38.0% to SAR 822m. Income tax and zakat rose to SAR 134m (SAR 77.7m), including the first Pillar Two domestic minimum top-up tax of SAR 52.6m (USD 14.0m). We calculate an EBITDA margin of 23.7%; net margin 8.7%.", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.10 (P&L), p.51-52 (tax note), p.57 (segments), p.3 (restaurants)", refs: ["6015-FY2025-REV", "6015-FY2025-GP", "6015-FY2025-NI_ATTR", "6015-FY2025-ZAKAT_TAX", "6015-FY2025-EBITDA_C"]}
    - {period: "9M2026", driver: "Revenue +12.9% to SAR 7,788m, with growth in all segments; the Malak Al Tawouk businesses are included from 26 February (UAE) and 8 July 2026 (KSA) without disclosed revenue. Gross profit rose 17.5% (gross margin 55.9% vs 53.7%) while selling and marketing expenses rose 11.0%. Major GCC profit before tax rose to SAR 776m (SAR 532m). Attributable profit +60.4% to SAR 814m despite income tax and zakat of SAR 140m (SAR 96.0m). We calculate EBITDA up 26.3%, an EBITDA margin of 25.1% (9M 2025: 22.4%) and an annualised ROE of 64.8%; net margin 10.5% (7.4%).", source: "6015_AMERICANA/2026_Q3_filed2026-10-27.pdf p.6 (P&L), p.33 (segments), p.36-37 (acquisitions)", refs: ["6015-9M2026-REV", "6015-9M2026-GP", "6015-9M2026-NI_ATTR", "6015-9M2026-EBITDA_C", "6015-9M2025-EBITDA_C", "6015-9M2026-ZAKAT_TAX"]}
    - {period: "FY2022-9M2026", driver: "Cash generation rose: operating cash flow went from SAR 1,702m (FY2022) to SAR 2,209m (FY2025) while capex fell from SAR 481m to SAR 402m, so free cash flow rose from SAR 1,221m to SAR 1,807m; in 9M 2026 free cash flow was SAR 1,637m (SAR 1,168m). Lease liabilities grew 13.6% a year to SAR 2,390m; after deducting cash and the term deposits due within a year, net debt was SAR 1,267m at end-2025 (net debt / EBITDA 0.6x, we calculate). Dividends paid in 9M 2026 were SAR 1,134m (USD 302.4m).", source: "6015_AMERICANA/2025_Annual_filed2026-02-08.pdf p.13 (cash flows); 6015_AMERICANA/2026_Q3_filed2026-10-27.pdf p.9", refs: ["6015-FY2022-CFO", "6015-FY2025-CFO", "6015-FY2025-CAPEX", "6015-FY2025-FCF", "6015-9M2026-FCF", "6015-FY2025-LEASE_LIAB", "6015-FY2025-NET_DEBT"]}
