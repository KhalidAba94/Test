  source: 6018_SPORT_CLUBS/2025_Annual_filed2026-03-15.pdf p.28; 6018_SPORT_CLUBS/2026_Q3_filed2026-11-07.pdf p.8
what_it_means:
  improved: Revenue grew 12.0% a year from FY2022 to FY2025 and 17.2% in 9M 2026, and the gross margin rose from 25.8% (FY2022) to 32.1%
    in 9M 2026; attributable profit rose 53.8% in 9M 2026.
  weakened: Free cash flow is thin because capex keeps rising (SAR 133m in 9M 2026, 41.6% of revenue), and lease liabilities rose to
    SAR 436m at 30 Sep 2026 (SAR 373m at end-2025).
  why: Men’s and women’s club revenue grew 24.8% and 33.7% in 9M 2026 as new branches opened, while one-time IPO costs dropped out;
    part of FY2024 growth came from lumpy sport-solutions contracts, which fell away in 2026.
  uncertain: No club or member counts are disclosed, so growth from new clubs and from existing clubs cannot be separated, and the 9M
    2025 comparatives are not restated for the FY2025 annual adjustments.
confidence_overall: Medium
data_notes:
- 'Listed on 22 July 2025. FY2022-FY2024 figures come from audited pre-IPO statements in the archive (filed Nov 2025): FY2021 balance
  sheet and FY2022 from the FY2023 annual (consolidated, restated under note 33), FY2023 income statement and cash flow from the FY2024
  annual, FY2023 balance sheet from the FY2025 annual (restated). All read from the PDFs (no XBRL).'
- 'Restatement (FY2023 annual, note 33): SOCPA ruling on right-of-use depreciation of leased land during construction; 2022 net profit
  24.3m (standalone) to 22.7m. Revenue and finance cost unchanged.'
- 'Restatement (FY2025 annual, note 34, cited as note 35 on the face): work-permit and residency fees expensed and right-of-use depreciation
  of buildings on leased land expensed (SOCPA, 30 Oct 2025). FY2024 cost of revenue 228.9m to 230.7m; profit 38.1m to 36.1m; FY2023
  and FY2024 total assets and equity are shown as restated.'
- The 2026 Q3 interim does not restate its 9M 2025 comparatives (opening 2025 equity 168.8m, pre-restatement), so 9M 2025 is on the
  old basis while FY2024 is restated.
- 'Corrected from the PDF balance sheets: lease liabilities include the current portion (the XBRL took only the non-current portion for FY2024, FY2025 and
  9M 2025), and 9M 2026 lease liabilities are taken from the interim.'
- Finance costs include bank charges (SAR 9.9m in FY2025, SAR 6.4m in FY2024). Interest on bank deposits (SAR 0.7m in FY2025) sits in other
  income, inside our operating income.
- CFO is after zakat and end-of-service payments; lease and finance costs paid are in financing.
