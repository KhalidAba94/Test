  - {date: "2023-10-10", category: "financing", text: "The statutory reserve of SAR 27.4m was transferred to accumulated losses.", source: "6012_RAYDAN/2023_Annual_filed2024-04-02.pdf p.11"}
  - {date: "2025-01-07", category: "M&A", text: "The Egyptian subsidiary, which had no revenue after its branches were sold in 2021, was placed under liquidation; Raydan lost control and reports stand-alone statements from FY2025.", source: "6012_RAYDAN/2025_Annual_filed2026-04-09.pdf p.57"}
  - {date: "2025", category: "operations", text: "Sold four land plots (carrying amounts SAR 3.8m, SAR 1.0m and SAR 4.6m), the main warehouse and a Riyadh villa, and disposed of the Al-Qunfudhah branch and Al-Zaydi catering kitchen; proceeds SAR 9.7m.", source: "6012_RAYDAN/2025_Annual_filed2026-04-09.pdf p.66; 6012_RAYDAN/2026_Q3_filed2026-11-18.pdf p.18"}
