what_it_means:
  improved: "Borrowings were repaid from SAR 15.8m (FY2022) to nil at 30 Sep 2026, and operating cash flow was positive in FY2023-FY2025 (SAR 16.2m in FY2024)."
  weakened: "Revenue fell 26.6% in FY2025 and continuing revenue 67.4% in 9M 2026; the gross margin went from 5.4% (FY2023) to -10.0% (FY2025) and -49.8% (9M 2026), and equity fell from SAR 185m (FY2022) to -SAR 22.5m at 30 Sep 2026."
  why: "Catering and Hajj contract revenue fell away after FY2023 and branch sales fell 21.7% in FY2025. The company then wrote down branches and its associate (impairment add-backs of SAR 40.2m in FY2024 and SAR 20.2m in FY2025) and in 2026 exited branches at a SAR 17.9m disposal loss."
  uncertain: "The auditor reports a material uncertainty over going concern, and the company depends on a proposed SAR 58.5m capital reduction and SAR 105m rights issue. The filings do not explain why revenue at the continuing branches fell."
confidence_overall: "Medium"
data_notes:
  - "No XBRL filing: every figure was read from the PDF statements. The annual statements (FY2022-FY2025) and the 9M 2025 interim statements are scanned images, read by OCR and checked against the printed subtotals."
  - "Perimeter: FY2022-FY2024 statements are consolidated (Egyptian subsidiary, no revenue); FY2025 onward stand-alone after control was lost on 7 Jan 2025. The FY2025 annual prints the name as 'Ridan Company Food'."
  - "9M figures for REV, COGS, GP, PBT and finance costs are continuing operations; net profit includes discontinued operations (9M 2026 -SAR 16.3m; 9M 2025 -SAR 3.1m), so PBT less zakat does not equal net profit. The cash-flow figures (D&A, CFO, capex) cover continuing and discontinued operations together, so 9M EBITDA adds total D&A to continuing operating income; the split is not disclosed."
  - "Restated values used: 9M 2025 revenue SAR 60.7m (first reported SAR 94.4m), gross profit, PBT and finance costs re-presented for discontinued operations, and 9M 2025 CFO SAR 4.5m (first SAR 6.6m; finance costs paid moved into operating activities); FY2024 finance costs SAR 5.0m (first SAR 5.2m; Egyptian subsidiary costs moved to the liquidation line); FY2023 finance costs SAR 5.1m (first SAR 5.0m; FX now inside finance costs), FY2023 cash SAR 6.5m and CFO SAR 5.0m (first SAR 6.6m and SAR 5.1m; SAR 0.1m reclassified to receivables); FY2022 CFO -SAR 24.7m (first -SAR 18.6m) and D&A SAR 12.7m (first SAR 11.9m) after the FY2023 annual re-presented the cash-flow statement."
  - "CFO basis: finance costs paid sit inside operating activities in FY2024-FY2025 and in the 9M 2026 interim (including the re-presented 9M 2025); earlier years show no separate line."
  - "Finance items outside the finance lines: FY2022 FX loss of SAR 0.3m sits inside our operating income; FY2023 bank returns (finance income) of SAR 0.3m sit inside other income; FY2024 finance costs of SAR 0.15m sit in the liquidation-deficit line. Associate impairments (FY2023 SAR 15.7m, FY2024 SAR 2.7m, FY2025 SAR 15.9m) are inside our operating income and added back in EBITDA."
  - "The FY2025 share of the associate's loss is SAR 4.6m on the face of the income statement but SAR 4.2m in the cash-flow add-back."
  - "Ratios shown as n.m.: 9M 2026 ROE is n.m. because average equity is negative (SAR 17.1m at end-2025 to -SAR 22.5m at 30 Sep 2026); net debt / EBITDA is n.m. in every period because annualised EBITDA is below SAR 10m (it is negative except FY2023, SAR 0.1m)."
  - "Other items left in operating income: disposal results, lease-termination gains, the FY2022 FX loss and the FY2023 expropriation loss are each about 1% of the loss or less; the 9M 2026 provision for potential claims (SAR 4.1m cash-flow add-back) has no stated P&L line. Impairments are excluded from EBITDA, and the 9M 2026 branch-disposal loss (SAR 17.9m) sits in discontinued operations."
  - "Restaurant counts are not disclosed. Note 1 lists branch commercial registrations (FY2025: 17; 30 Sep 2026: 6 active), which include non-restaurant sites."
  - "Main Market listing since November 2019 (from Nomu); all periods FY2021-9M 2026 are available."
