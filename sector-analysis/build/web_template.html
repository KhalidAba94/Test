<script>
(function(){
"use strict";
// data is embedded in the standalone file; the hosted page loads it from data.json beside the page
const raw = document.getElementById('data').textContent.trim();
if (raw && raw !== 'null') boot(JSON.parse(raw));
else fetch('data.json').then(r=>{ if(!r.ok) throw new Error(String(r.status)); return r.json(); }).then(boot)
  .catch(()=>{ document.getElementById('main').innerHTML='<p style="padding:24px 0">The data file could not be loaded. Reload the page to try again.</p>'; });
function boot(D){
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MINUS='−';
const SECT = {energy:'Energy', banks:'Banks'};
const FY = ['FY2022','FY2023','FY2024','FY2025'], YTD=['9M2025','9M2026'], ALLP=[...FY,...YTD];
const PAIRS = ['FY2023/FY2022','FY2024/FY2023','FY2025/FY2024','9M2026/9M2025'];
const PL = {FY2021:'FY2021',FY2022:'FY2022',FY2023:'FY2023',FY2024:'FY2024',FY2025:'FY2025','9M2025':'9M 2025','9M2026':'9M 2026'};
const PAIRL = {'FY2023/FY2022':'FY2023 vs FY2022','FY2024/FY2023':'FY2024 vs FY2023','FY2025/FY2024':'FY2025 vs FY2024','9M2026/9M2025':'9M 2026 vs 9M 2025'};
const STOCKS = new Set(['TA','EQ_ATTR','EQ_ORD','TE','LOANS','DEPOSITS','T1_SUKUK','DEBT_ISSUED']);
const NM_TITLE = 'not meaningful: the base is zero, negative or below SAR 10m, or a profit turned into a loss';
const isNum = x => typeof x === 'number' && isFinite(x);
const sgn = (x, plus) => x<0 ? MINUS : (plus && x>0 ? '+' : '');
const NMV = x => x==='n.m.' ? 'n.m.' : '–';
// one set of formatters: amounts in SAR m with brackets for negatives; percentages with a true minus
const fm = x => isNum(x) ? (x<0?'(':'') + Math.abs(x).toLocaleString('en-US',{maximumFractionDigits: Math.abs(x)<1&&x!==0?2:Math.abs(x)<100?1:0}) + (x<0?')':'') : NMV(x);
const fpd = (x,d) => { if(!isNum(x)) return NMV(x); const r=+(x*100).toFixed(d); return (r<0?MINUS:'')+Math.abs(r).toFixed(d)+'%'; };
const fp = x => fpd(x,1);
const fg = x => { if(!isNum(x)) return NMV(x); const r=+(x*100).toFixed(1); return (r===0?'':sgn(r,true))+Math.abs(r).toFixed(1)+'%'; };
const fpp = x => { if(!isNum(x)) return '–'; const v=x*100; const d=Math.abs(v)<0.995&&v!==0?2:1; const r=+v.toFixed(d); if(r===0) return (v===0?'0.0':'<0.01')+' pp'; return sgn(r,true)+Math.abs(r).toFixed(d)+' pp'; };
const fbp = x => { if(!isNum(x)) return NMV(x); const r=Math.round(x*10000); return (r<0?MINUS:'')+Math.abs(r)+' bp'; };
const RFMT = {COR:fbp, ROA:x=>fpd(x,2), NSCI_YLD:x=>fpd(x,2)};
const fr = k => RFMT[k] || fp;
const coInfo = t => { for (const S of ['Energy','Banks']) if (D.sectors[S].companies[t]) return {S, c:D.sectors[S].companies[t], cfg:D.sectors[S].config.constituents[t]||{}}; return null; };
const coName = t => { const i=coInfo(t); return i?i.c.name:t; };
const coShort = t => { const i=coInfo(t); return i?(i.cfg.short||i.c.name):t; };

  (G.sections||[]).slice(0,1).forEach(sct=>{ h+=`<h2>${esc(sct.heading)}</h2><ul class="clean">${sct.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`; });
  h+=`<p class="note">As of ${esc(D.as_of)}. <a href="#method">How to read this analysis</a></p>`;
  return {html:h, title:'Overview'};
}
function viewMethod(){
  const G=D.guide||{}; let h=`<div class="crumbs"><a href="#overview">Overview</a> › <span>How to read</span></div><h1>How to read this analysis</h1>`;
  (G.sections||[]).filter(s=>!s.technical).forEach(sct=>{ h+=`<h2>${esc(sct.heading)}</h2><ul class="clean">${sct.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`; });
  h+=`<h2>Definitions</h2><div class="scroller"><table class="stack"><thead><tr><th>Code</th><th class="t">Metric</th><th class="t">Unit</th><th class="t">Definition</th></tr></thead><tbody>${Object.entries(D.metrics).map(([k,m])=>`<tr><td data-l="Code">${esc(k)}</td><td class="t" data-l="Metric">${esc(m.name)}</td><td class="t" data-l="Unit">${esc(m.unit)}</td><td class="t w" data-l="Definition">${esc(m.def)}</td></tr>`).join('')}</tbody></table></div>`;
  (G.sections||[]).filter(s=>s.technical).forEach(sct=>{ h+=`<details style="margin-top:24px"><summary>${esc(sct.heading)}</summary><ul class="clean">${sct.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`; });
  return {html:h, title:'How to read'};
}
function viewData(){
  let h=`<div class="crumbs"><a href="#overview">Overview</a> › <span>Sources &amp; review</span></div><h1>Coverage, sources and review</h1>
  <nav class="toc" aria-label="On this page"><a href="#d-rev" data-jump="d-rev">Review summary</a><a href="#d-trace" data-jump="d-trace">Traceability</a><a href="#d-cov" data-jump="d-cov">Coverage</a><a href="#d-log" data-jump="d-log">Review log</a><a href="#d-tpl" data-jump="d-tpl">Template changes</a><a href="#d-files" data-jump="d-files">Flagged files</a></nav>`;
  const RS=D.review_summary||{};
  h+=`<h2 id="d-rev">Independent review summary</h2>`;
  if (RS.summary) h+=`<div class="callout">${esc(RS.summary)}</div>${['checked','fixed','unresolved'].filter(k=>RS[k]).map(k=>`<h3>${k==='checked'?'What was checked':k==='fixed'?'What was fixed':'Still unresolved'}</h3><ul class="clean">${RS[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}`;
  else h+=`<p class="note">The review summary has not been embedded in this build.</p>`;
  const T=D.trace||{}; const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
  h+=`<h2 id="d-trace">Traceability of figures</h2><p>Company tables show ${T.figures} figures: ${T.disclosed} taken from filings and ${T.calculated} calculated from them. Every disclosed figure names its archive file and XBRL section and row (or PDF page). The PDF page was located by text search for ${T.with_page} of ${T.disclosed} (${pc(T.with_page,T.disclosed)}); the rest sit on scanned pages or differ by rounding. A saudiexchange.sa link is available for ${T.with_link} (${pc(T.with_link,T.disclosed)}), because the archive's manifests list the exchange address only for each company's most recent filings.</p>`;
  h+=`<h2 id="d-cov">Coverage by company and period</h2><div class="controls"><label for="covf">Sector</label><select id="covf"><option value="">Both</option><option>Energy</option><option>Banks</option></select></div><div class="scroller"><table class="stack" id="covt"><thead><tr><th>Company</th>${['FY2022','FY2023','FY2024','FY2025','9M2025','9M2026'].map(p=>`<th class="t">${PL[p]}</th>`).join('')}<th class="t">Flags</th></tr></thead><tbody>${D.coverage.map(r=>`<tr data-sec="${esc(r.sector)}"><td data-l="Company"><a href="#co-${esc(r.ticker)}">${esc(r.company)}</a></td>${['FY2022','FY2023','FY2024','FY2025','9M2025','9M2026'].map(p=>`<td class="t ${/^MISSING/.test(r[p])?'neg':''}" data-l="${PL[p]}" style="min-width:150px">${esc(r[p])}</td>`).join('')}<td class="t" data-l="Flags" style="min-width:240px">${esc(r.flags)}</td></tr>`).join('')}</tbody></table></div>`;
  const R=D.review||[];
  h+=`<h2 id="d-log">Review log (${R.length} issues)</h2>`;
  if (R.length){ const groups=[...new Set(R.map(r=>r.review))];
    groups.forEach(g=>{ const rs=R.filter(r=>r.review===g); const cnt={}; rs.forEach(r=>{ const k=(r.status||'').split(/[ (;:]/)[0]||'open'; cnt[k]=(cnt[k]||0)+1; });
      h+=`<details><summary>${esc(g)} · ${rs.length} issues (${Object.entries(cnt).map(([k,v])=>`${v} ${esc(k)}`).join(', ')})</summary><div class="scroller"><table class="stack"><thead><tr><th>Issue</th><th class="t">Severity</th><th class="t">Where</th><th class="t">Finding</th><th class="t">Status</th><th class="t">Fix</th><th class="t">Recheck</th></tr></thead><tbody>${rs.map(r=>`<tr><td data-l="Issue">${esc(r.issue_id)}</td><td class="t" data-l="Severity">${esc(r.severity)}</td><td class="t" data-l="Where" style="min-width:140px">${esc(r.where)}</td><td class="t w" data-l="Finding">${esc(r.finding)}</td><td class="t" data-l="Status">${esc(r.status)}</td><td class="t w" data-l="Fix">${esc(r.fix)}</td><td class="t" data-l="Recheck" style="min-width:160px">${esc(r.recheck)}</td></tr>`).join('')}</tbody></table></div></details>`; });
  } else h+=`<p class="note">The review log has not been embedded in this build.</p>`;
  if ((D.template_changes||[]).length) h+=`<h2 id="d-tpl">Template improvements from the pilots</h2><ul class="clean">${D.template_changes.map(r=>`<li><b>${esc(r.change)}</b> ${esc(r.reason||'')}</li>`).join('')}</ul>`;
  const bad=Object.entries(D.sources).filter(([k,v])=>v.status!=='used');
  h+=`<h2 id="d-files">Files with flags (${bad.length} of ${Object.keys(D.sources).length})</h2><p class="note">Most flags mark PDF pages without a text layer (cover, auditor's report or scanned statements); figures on those pages rest on the XBRL file. Open a company to see its files.</p>`;
  const byCo={}; bad.forEach(([k,v])=>{ const c=k.split('/')[0]; (byCo[c]=byCo[c]||[]).push([k,v]); });
  Object.keys(byCo).sort().forEach(c=>{ const t=c.split('_')[0]; h+=`<details><summary>${esc(coInfo(t)?coName(t):c)} · ${byCo[c].length} file${byCo[c].length>1?'s':''}</summary><div class="scroller"><table class="stack"><thead><tr><th>File</th><th class="t">Status</th><th class="t">Reason</th></tr></thead><tbody>${byCo[c].map(([k,v])=>`<tr><td data-l="File">${v.url?`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(k.split('/').pop())}</a>`:esc(k.split('/').pop())}</td><td class="t" data-l="Status">${esc(v.status)}</td><td class="t w" data-l="Reason">${esc(v.reason)}</td></tr>`).join('')}</tbody></table></div></details>`; });
  return {html:h, title:'Sources and review'};
}
// ---------------------------------------------------------------- post-render: n.m. explanations
function postRender(root){
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=> (n.nodeValue.indexOf('n.m.')>=0 && !n.parentNode.closest('abbr,button[data-ref],script,option,.tip,svg')) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const parts=n.nodeValue.split('n.m.'); const frag=document.createDocumentFragment();
    parts.forEach((p,i)=>{ if(p) frag.appendChild(document.createTextNode(p)); if(i<parts.length-1){ const a=document.createElement('abbr'); a.title=NM_TITLE; a.textContent='n.m.'; frag.appendChild(a); } });
    n.parentNode.replaceChild(frag,n); });
}
// ---------------------------------------------------------------- router
const jump = $('#jumpco');
jump.innerHTML = `<option value="">Go to a company…</option>` + ['Energy','Banks'].map(S=>`<optgroup label="${S}">${D.sectors[S].tickers.map(t=>`<option value="${t}">${esc(coName(t))}</option>`).join('')}</optgroup>`).join('');
jump.addEventListener('change', ()=>{ if (jump.value) location.hash='co-'+jump.value; });
function route(){
  const v=(location.hash||'#overview').slice(1)||'overview'; const m=v.match(/^(energy|banks)(?:[-\/](ex))?$/);
  if (m) return {kind:'sector', key:m[1], scope:m[2]?'ex_largest':'all', nav:m[1]};
  if (/^co-\d{4}$/.test(v) && coInfo(v.slice(3))) return {kind:'company', t:v.slice(3), nav:coSector(v.slice(3)).toLowerCase()};
  if (['budget','method','data'].includes(v)) return {kind:v, nav:v};
  return {kind:'overview', nav:'overview'};
}
function render(keepPV){
  FIGS={}; figN=0; hideDrawer(); drawerPushed=false; CW=colW(); if(!keepPV) setPV('fb');
  const r=route(); let out;
  if (r.kind==='sector') out=viewSector(r.key, r.scope); else if (r.kind==='company') out=viewCompany(r.t);
  else if (r.kind==='budget') out=viewBudget(); else if (r.kind==='method') out=viewMethod(); else if (r.kind==='data') out=viewData(); else out=viewOverview();
  $('#main').innerHTML=out.html; postRender($('#main'));
  document.querySelectorAll('nav.main a').forEach(a=>{ if(a.dataset.v===r.nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  jump.value = r.kind==='company' ? r.t : '';
  document.title = out.title + ' · Saudi Sector Financials';
  wire(r);
}
function rerender(){
  const y=window.scrollY, a=document.activeElement; let key=null;
  if (a && a!==document.body){ if (a.id) key='#'+a.id; else if (a.dataset && a.dataset.scope) key=`[data-scope="${a.dataset.scope}"]`; }
  render(true); window.scrollTo(0,y); if(key){ const el=document.querySelector(key); if(el) el.focus({preventScroll:true}); }
}
function wire(r){
  document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click', ()=>{ history.replaceState(null,'','#'+r.key+(b.dataset.scope==='all'?'':'-ex')); rerender(); }));
  const ps=$('#pairsel'); if(ps) ps.addEventListener('change', ()=>{ pairState[SECT[r.key]]=ps.value; rerender(); });
  const bs=$('#brsel'); if(bs) bs.addEventListener('change', ()=>{ window.__bridgePair=window.__bridgePair||{}; window.__bridgePair[bs.dataset.t]=bs.value; rerender(); });
  const cf=$('#clsf'), sf=$('#secf'); const ff=()=>{ document.querySelectorAll('#itbl tr[data-cls]').forEach(x=>{ const cv=cf.value; const okc=!cv || (cv.startsWith('g:')? x.dataset.grp===cv.slice(2) : x.dataset.cls===cv); x.hidden = !okc || (sf.value && x.dataset.sec!==sf.value && x.dataset.sec!=='All'); }); };
  if(cf){ cf.addEventListener('change',ff); sf.addEventListener('change',ff); }
  const cv=$('#covf'); if(cv) cv.addEventListener('change', ()=>{ document.querySelectorAll('#covt tr[data-sec]').forEach(x=>{ x.hidden = cv.value && x.dataset.sec!==cv.value; }); });
}
let rz=null; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(colW()-CW)>24) rerender(); }, 200); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); $('#main').focus({preventScroll:true}); });
setPV('fb');
render();
}
})();
</script>
