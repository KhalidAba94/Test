<title>Saudi Sector Financials</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky top bar with sector/company navigation; one reading column with wide tables in their own scrollers; a figure drawer slides in from the right (bottom sheet on phones). */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#15212c; --muted:#5a6977; --faint:#8696a5; --line:#dbe2e9;
  --accent:#0e6b70; --accent-ink:#ffffff; --accent-weak:#e1f0f0; --ytd:#fff3d1; --ytd-line:#e7cf8a;
  --pos:#1b64be; --neg:#c23b3c; --series-1:#257de0; --series-2:#f47230; --series-3:#00b894; --grid:#e8edf2;
  --chip-r:#fbe7c4; --chip-c:#dceafb; --chip-e:#ece6fb; --chip-o:#fbdada; --chip-d:#e9eef2;
  --good:#0a7d1c; --warn:#9a6a00; --bad:#b42f30;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",Arial,Helvetica,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --ink:#e4ebf1; --muted:#9aabba; --faint:#71839a; --line:#27333f;
  --accent:#55b6bb; --accent-ink:#0e141a; --accent-weak:#16343a; --ytd:#33301f; --ytd-line:#6c5d2a;
  --pos:#519ced; --neg:#eb6263; --series-1:#338ced; --series-2:#e76624; --series-3:#00a888; --grid:#222d38;
  --chip-r:#4a3a17; --chip-c:#1d3552; --chip-e:#33295a; --chip-o:#4f2223; --chip-d:#25303b;
  --good:#3cc458; --warn:#e0b23c; --bad:#f07374; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --ink:#e4ebf1; --muted:#9aabba; --faint:#71839a; --line:#27333f;
  --accent:#55b6bb; --accent-ink:#0e141a; --accent-weak:#16343a; --ytd:#33301f; --ytd-line:#6c5d2a;
  --pos:#519ced; --neg:#eb6263; --series-1:#338ced; --series-2:#e76624; --series-3:#00a888; --grid:#222d38;
  --chip-r:#4a3a17; --chip-c:#1d3552; --chip-e:#33295a; --chip-o:#4f2223; --chip-d:#25303b;
  --good:#3cc458; --warn:#e0b23c; --bad:#f07374; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font:600 17px/1.2 var(--f-head);letter-spacing:.01em;color:var(--ink);text-decoration:none;margin-right:6px}
.brand small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{font:600 14px var(--f-head);text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:var(--r)}
nav.main a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.main a:hover{color:var(--ink)}
.jump{margin-left:auto;display:flex;gap:6px;align-items:center}
.jump select{font:14px var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:220px}
main:focus{outline:none}
main{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
h1{font:600 30px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
h2{font:600 21px/1.2 var(--f-head);margin:34px 0 10px;text-wrap:balance}
h3{font:600 16px/1.3 var(--f-head);margin:20px 0 8px;letter-spacing:.01em}
.lede{color:var(--muted);max-width:75ch;margin:0 0 14px}
.note{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font:600 12px var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:600 26px/1.2 var(--f-head);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.ytd{background:var(--ytd);border-color:var(--ytd-line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:600 12px var(--f-head);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:180px;max-width:280px}
tr.sub td{color:var(--muted);font-style:italic}
tr.sub td:first-child{padding-left:20px}
tr.grp td{background:var(--bg);font:600 12px var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.ytd,th.ytd{background:var(--ytd)}
td.gap,th.gap{width:10px;padding:0;border-bottom:none;background:transparent}
.fig{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted var(--faint);font-variant-numeric:tabular-nums}
.fig:hover{color:var(--accent);border-bottom-color:var(--accent)}
.chip{display:inline-block;font:600 10.5px/1 var(--f-head);letter-spacing:.04em;padding:3px 5px;border-radius:4px;vertical-align:1px;margin-left:4px;color:var(--ink)}
.chip.D{background:var(--chip-d)}.chip.R{background:var(--chip-r)}.chip.C{background:var(--chip-c)}.chip.E{background:var(--chip-e)}.chip.O{background:var(--chip-o)}
.conf{display:inline-block;font:600 11px var(--f-head);padding:2px 7px;border-radius:10px;border:1px solid var(--line)}
.conf.High{color:var(--good)}.conf.Medium{color:var(--warn)}.conf.Low,.conf.Not{color:var(--bad)}
.neg{color:var(--neg)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.toggle button{font:600 13px var(--f-head);border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.controls label{font-size:13px;color:var(--muted)}
.controls select{font:14px var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
ul.clean{padding-left:18px;margin:6px 0}
ul.clean li{margin:5px 0}
.refs{display:inline-flex;gap:4px;flex-wrap:wrap}
.refs button{font:600 11px var(--f-head);border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:10px;padding:1px 7px;cursor:pointer}
.src{font-size:12px;color:var(--faint)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--f-body)}
.chart .lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 8px;border-radius:5px;max-width:260px;display:none}
.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 24px 18px;overflow:auto;transform:translateX(105%);transition:transform .18s ease}
.drawer.open{transform:none}
.drawer h3{margin-top:0}
.drawer dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13.5px;margin:10px 0}
.drawer dt{color:var(--muted)}
.drawer dd{margin:0;overflow-wrap:anywhere}
.drawer .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));font:600 13px var(--f-head);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r);padding:5px 10px;cursor:pointer}
@media (max-width:640px){
  .top-in{gap:6px;padding-block:6px}
  .brand small{display:none}
  nav.main{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  nav.main a{white-space:nowrap;padding:5px 8px}
  .jump label{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile .v{font-size:21px}
  .drawer{top:auto;width:100%;max-height:78vh;border-left:0;border-top:1px solid var(--line);transform:translateY(105%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:25px}
  .jump{margin-left:0;width:100%}
  .jump select{max-width:none;flex:1}
  td:first-child,th:first-child{min-width:140px}
}
.pill{display:inline-block;font:600 11px var(--f-head);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:10px;background:var(--accent-weak);color:var(--accent)}
.dir-up{color:var(--good);font-weight:600}.dir-down{color:var(--bad);font-weight:600}.dir-mixed{color:var(--warn);font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-weak);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.callout.ytd{border-left-color:var(--ytd-line);background:var(--ytd)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
details{margin:8px 0}
summary{cursor:pointer;font:600 14px var(--f-head);color:var(--accent)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

<div class="top"><div class="top-in">
  <a class="brand" href="#overview">Saudi Sector Financials<small>Pilot: Energy &amp; Banks · FY2022–FY2025 · 9M 2026</small></a>

  </nav>

</div></div>
<main id="main" tabindex="-1"></main>
<aside class="drawer" id="drawer" aria-label="Figure details" aria-hidden="true"><button class="close" id="dclose">Close</button><div id="dbody"></div></aside>
<div class="tip" id="tip" role="tooltip"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECT = {energy:'Energy', banks:'Banks'};
const FY = ['FY2022','FY2023','FY2024','FY2025'], YTD=['9M2025','9M2026'];
const PAIRS = ['FY2023/FY2022','FY2024/FY2023','FY2025/FY2024','9M2026/9M2025'];
const PL = {FY2021:'FY2021',FY2022:'FY2022',FY2023:'FY2023',FY2024:'FY2024',FY2025:'FY2025','9M2025':'9M 2025','9M2026':'9M 2026'};
const PAIRL = {'FY2023/FY2022':'FY23 vs FY22','FY2024/FY2023':'FY24 vs FY23','FY2025/FY2024':'FY25 vs FY24','9M2026/9M2025':'9M26 vs 9M25'};
const isNum = x => typeof x === 'number' && isFinite(x);
const fm = x => isNum(x) ? (x<0?'(':'') + Math.abs(x).toLocaleString('en-US',{maximumFractionDigits: Math.abs(x)<100?1:0}) + (x<0?')':'') : (x==='n.m.'?'n.m.':'–');
const fp = x => isNum(x) ? (x*100).toFixed(1)+'%' : (x==='n.m.'?'n.m.':'–');
const fpp = x => isNum(x) ? (x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+' pp' : '–';
const fg = x => isNum(x) ? (x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%' : (x==='n.m.'?'n.m.':'–');
const coName = t => { for (const S of ['Energy','Banks']) if (D.sectors[S].companies[t]) return D.sectors[S].companies[t].name; return t; };
const coSector = t => D.sectors.Energy.companies[t] ? 'Energy' : 'Banks';
const mname = m => (D.metrics[m]&&D.metrics[m].name) || m;
let FIGS = {}; let figN = 0;
function figBtn(t, p, m, v, fmt){
  const id = 'f'+(figN++); FIGS[id] = {t,p,m};
  const s = (D.sectors[coSector(t)].companies[t].series[m]||{})[p];
  const chip = s ? (s.note && s.note.indexOf('OVERRIDE')===0 ? '<span class="chip O" title="Taken from PDF">PDF</span>' : (s.prov && s.prov!=='D' ? `<span class="chip ${s.prov}" title="${s.prov==='R'?'Restated comparative':'Calculated'}">${s.prov}</span>`:'')) : '';
  const txt = (fmt||fm)(v);
  if (!s) return txt;
  return `<button class="fig" data-fig="${id}" aria-label="${esc(mname(m))} ${PL[p]} ${txt}: show source">${txt}</button>${chip}`;
}
function sumFig(S, scope, m, p, v){
  const id = 'f'+(figN++); FIGS[id] = {S, scope, m, p, sum:true};
  return `<button class="fig" data-fig="${id}">${fm(v)}</button>`;
}
// ---------------------------------------------------------------- drawer
function openDrawer(html){ $('#dbody').innerHTML = html; const d=$('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#dclose').focus(); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); }
$('#dclose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
function srcLink(sid){
  if(!sid) return '–';
  return sid.split(' | ').map(x=>{ const s=D.sources[x]; const nm=esc(x.split('/').pop());
    return s && s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${nm}</a> <span class="src">(${esc(s.type||'')}${s.assurance?', '+esc(s.assurance):''})</span>` : nm; }).join('<br>');
}
function figDetails(f){
  if (f.sum){
    const sc = D.sectors[f.S]; const blk = sc.sector[f.scope][f.m].totals[f.p];
    const rows = sc.tickers.filter(t=> f.scope==='all' || t!==sc.sector.largest_by_top_line_FY2025).map(t=>{
      const s=(sc.companies[t].series[f.m]||{})[f.p];
      return `<tr><td><a href="#co-${t}">${esc(coName(t))}</a></td><td>${s?fm(s.v):'missing'}</td></tr>`;}).join('');
    return `<h3>${esc(mname(f.m))}: ${f.S} sector, ${PL[f.p]}</h3><p class="note">${f.scope==='all'?'All companies':'Excluding the largest company'} · sum of ${blk.n} companies with data${blk.missing.length?' · missing: '+blk.missing.map(coName).join(', '):''}</p><div class="scroller"><table><tr><th>Company</th><th>SAR m</th></tr>${rows}<tr><td><b>Total</b></td><td><b>${fm(blk.v)}</b></td></tr></table></div><p class="note">Click a company to see its own figures and sources.</p>`;
  }
  const S = coSector(f.t); const s = D.sectors[S].companies[f.t].series[f.m][f.p];
  const prov = {D:'Disclosed in the filing',R:'Restated comparative (latest filing) used',C:'Calculated by us'}[s.prov]||s.prov;
  const pdf = s.pdf ? `${esc(s.pdf.split('/').pop())}${s.pages?' · page '+esc(s.pages):' · page not located by text search (scanned page or rounding)'}` : '–';
  return `<h3>${esc(coName(f.t))} · ${esc(mname(f.m))}</h3>
  <dl><dt>Period</dt><dd>${PL[f.p]} ${f.p.startsWith('9M')?'(1 Jan–30 Sep, partial year)':'(full year to 31 Dec)'}</dd>
  <dt>Value</dt><dd><b>SAR ${fm(s.v)} m</b></dd>
  <dt>Provenance</dt><dd>${esc(prov)}</dd>
  ${s.orig!=null && s.prov==='R' ? `<dt>Originally reported</dt><dd>SAR ${fm(s.orig)} m</dd>`:''}
  <dt>Source document</dt><dd>${srcLink(s.src)}</dd>
  <dt>Location</dt><dd>${esc(s.loc||'')}</dd>
  <dt>PDF check</dt><dd>${pdf}</dd>
  ${s.label?`<dt>Line item</dt><dd>${esc(s.label)}</dd>`:''}
  ${s.note?`<dt>Note</dt><dd>${esc(s.note)}</dd>`:''}
  <dt>Definition</dt><dd>${esc((D.metrics[f.m]||{}).def||'')}</dd></dl>
  <p class="note">Archive file names are shown as stored in the Drive archive; links open the original on saudiexchange.sa.</p>`;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-fig]'); if (b){ openDrawer(figDetails(FIGS[b.dataset.fig])); return; }
  const r = e.target.closest('[data-ref]'); if (r){ showRef(r.dataset.ref); return; }
});
function showRef(ref){
  // ref formats: "2222-FY2025-REV" (fact) or policy item id "F-001"
  const m = ref.match(/^(\d{4})-(FY20\d\d|9M20\d\d)-([A-Z0-9_]+)$/);
  if (m){ const s=((D.sectors[coSector(m[1])].companies[m[1]]||{}).series||{})[m[3]]; if(s&&s[m[2]]) { openDrawer(figDetails({t:m[1],p:m[2],m:m[3]})); return; } }
  const it = D.policy_items.find(x=>x.item_id===ref);
  if (it){ openDrawer(`<h3>${esc(it.item_id)} · ${esc(it.item_class.replace(/_/g,' ').toLowerCase())}</h3><dl>
    <dt>Fact / quote</dt><dd>${esc(it.fact_or_quote)}</dd><dt>Value</dt><dd>${esc(it.value)} ${esc(it.unit)}</dd>
    <dt>Speaker</dt><dd>${esc(it.speaker)}${it.role?', '+esc(it.role):''}</dd><dt>Published</dt><dd>${esc(it.pub_date)}</dd>
    <dt>Source</dt><dd>${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a>`:'–'}</dd>
    <dt>Type</dt><dd>${esc(it.primary_secondary)}; read in full: ${esc(it.read_primary)}</dd>${it.notes?`<dt>Notes</dt><dd>${esc(it.notes)}</dd>`:''}</dl>`); return; }
  openDrawer(`<p>Reference ${esc(ref)} not found.</p>`);
}
const refsHtml = refs => (refs&&refs.length) ? `<span class="refs">${refs.map(r=>`<button data-ref="${esc(r)}" title="Show the figure or source">${esc(r.replace(/^(\d{4})-/,'').replace(/-/g,' '))}</button>`).join('')}</span>` : '';
// ---------------------------------------------------------------- tooltip
const tip = $('#tip');
document.addEventListener('pointermove', e=>{ const t=e.target.closest('[data-tip]'); if(!t){tip.style.display='none';return;}
  tip.innerHTML=t.getAttribute('data-tip'); tip.style.display='block';
  const x=Math.min(e.clientX+12, window.innerWidth-tip.offsetWidth-8), y=Math.max(8,e.clientY-tip.offsetHeight-10);
  tip.style.left=x+'px'; tip.style.top=y+'px'; });
document.addEventListener('focusin', e=>{ const t=e.target.closest('[data-tip]'); if(!t) return; const r=t.getBoundingClientRect(); tip.innerHTML=t.getAttribute('data-tip'); tip.style.display='block'; tip.style.left=Math.max(8,Math.min(r.left, window.innerWidth-tip.offsetWidth-8))+'px'; tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'; });
document.addEventListener('focusout', ()=>{ tip.style.display='none'; });
// ---------------------------------------------------------------- charts (SVG, one scale per chart)
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function ticks(lo,hi,n){ const out=[]; const step=(hi-lo)/n; for(let i=0;i<=n;i++) out.push(lo+step*i); return out; }
function cols(opts){

function lines(opts){

function waterfall(steps){

  const y=v=>T+((hi+pad)-v)/((hi+pad)-(lo-pad))*(H-T-B); const bw=(W-L-R)/bars.length; let g='';
  ticks(lo-pad,hi+pad,4).forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${(t*100).toFixed(0)}%</text>`; });
  bars.forEach((b,i)=>{ const x=L+i*bw+bw*0.18, w=bw*0.64; const top=y(Math.max(b.a,b.b)), h=Math.max(1,Math.abs(y(b.a)-y(b.b)));

    g+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${col}" ${b.t?'':'fill-opacity=".55"'} tabindex="0" data-tip="${esc(b.n)}: ${b.t?fp(b.v):fpp(b.v)}"/>`;
