name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://jvxoclbgggfugmnbsosf.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vUmiT7YMOd-O9afxzOn-2g_QPTiGzmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
