name: Apply release hardening patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-hardening-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()

          s = s.replace("""import {\n  assertVoidRpc,\n  parseCoupleState,\n  parseCreateRoomResult,\n  parseJoinRoomResult,\n  parseMemoryRows,\n  parseRoundState,\n  parseUuidRpc,\n} from './lib/contracts'\n""", """import {\n  parseCoupleState,\n  parseCreateRoomResult,\n  parseJoinRoomResult,\n  parseMemoryRows,\n  parseRoundState,\n} from './lib/contracts'\n""")

          old = """    await Promise.all([hydrateRound(next.couple_id), refreshMemories(next.couple_id)])\n    setScreen('today')\n  }, [hydrateRound, refreshMemories])\n"""
          new = """    await hydrateRound(next.couple_id)\n    setScreen('today')\n    void refreshMemories(next.couple_id).catch(() => {\n      // Memory Vault availability must never block today's round.\n    })\n  }, [hydrateRound, refreshMemories])\n"""
          if old not in s:
              raise SystemExit('routeFromCouple block not found')
          s = s.replace(old, new, 1)

          old = """    try {\n      await Promise.all([hydrateRound(couple.couple_id), refreshMemories(couple.couple_id)])\n      setScreen('today')\n    } catch (e) {\n"""
          new = """    try {\n      await hydrateRound(couple.couple_id)\n      setScreen('today')\n      void refreshMemories(couple.couple_id).catch(() => {\n        // Keep Today usable even if saved-state refresh is temporarily unavailable.\n      })\n    } catch (e) {\n"""
          if old not in s:
              raise SystemExit('goToday block not found')
          s = s.replace(old, new, 1)

          old = """      const { data, error: rpcError } = await supabase.rpc('cancel_waiting_couple_room')\n      if (rpcError) throw rpcError\n      assertVoidRpc(data, 'cancel_waiting_couple_room')\n"""
          new = """      const { error: rpcError } = await supabase.rpc('cancel_waiting_couple_room')\n      if (rpcError) throw rpcError\n"""
          if old not in s:
              raise SystemExit('cancel write block not found')
          s = s.replace(old, new, 1)

          old = """      const { data, error } = await supabase.rpc('submit_answer', {\n        p_round_id: round.round_id,\n        p_answer_value: answer.trim(),\n      })\n      if (error) throw error\n      assertVoidRpc(data, 'submit_answer')\n      await onRefresh()\n"""
          new = """      const { error } = await supabase.rpc('submit_answer', {\n        p_round_id: round.round_id,\n        p_answer_value: answer.trim(),\n      })\n      if (error) throw error\n      await onRefresh()\n"""
          if old not in s:
              raise SystemExit('submit write block not found')
          s = s.replace(old, new, 1)

          old = """      const { data, error } = await supabase.rpc('save_round_to_memory', { p_round_id: round.round_id })\n      if (error) throw error\n      parseUuidRpc(data, 'save_round_to_memory')\n      await onMemorySaved()\n"""
          new = """      const { error } = await supabase.rpc('save_round_to_memory', { p_round_id: round.round_id })\n      if (error) throw error\n      await onMemorySaved().catch(() => {\n        // The save succeeded; a later Memory Vault refresh will reconcile the button state.\n      })\n"""
          if old not in s:
              raise SystemExit('save write block not found')
          s = s.replace(old, new, 1)

          app.write_text(s)

          contracts = Path('src/lib/contracts.ts')
          c = contracts.read_text()
          start = c.find("\nexport function assertVoidRpc")
          end = c.find("\nexport function parseMemoryRows", start)
          if start == -1 or end == -1:
              raise SystemExit('write acknowledgement contract block not found')
          c = c[:start] + c[end:]
          contracts.write_text(c)

          Path('vite.config.ts').write_text("""import { defineConfig, loadEnv } from 'vite'\nimport react from '@vitejs/plugin-react'\n\nconst requiredBuildEnv = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY'] as const\n\nexport default defineConfig(({ mode }) => {\n  const env = loadEnv(mode, '.', 'VITE_')\n  const missing = requiredBuildEnv.filter((key) => !env[key]?.trim())\n\n  if (missing.length > 0) {\n    throw new Error(\n      `[Two of Us] Missing required build configuration: ${missing.join(', ')}. ` +\n      'Copy .env.example to .env.local for local development or configure these variables in the deploy environment.',\n    )\n  }\n\n  return {\n    plugins: [react()],\n  }\n})\n""")

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace(
            "Access control is enforced server-side with authenticated anonymous sessions, RLS, restricted RPC grants, answer privacy rules, and join-code rate limiting.\n\n`join_couple_room` limits each anonymous user to 5 invite-code attempts per 10-minute window. Supabase also applies its own anonymous-auth rate limiting.\n",
            "Access control is enforced server-side with authenticated anonymous sessions, RLS, restricted RPC grants, and answer privacy rules. The current join throttle is an abuse guard, not a complete brute-force boundary.\n\n`join_couple_room` limits each anonymous session to 5 invite-code attempts per 10-minute window. A caller can create a fresh anonymous session (subject to Supabase Auth rate limits), so this does not substitute for IP/edge throttling or CAPTCHA if the beta becomes public. The 6-character hexadecimal code space contains 16,777,216 possibilities, which makes casual guessing impractical but does not remove the need for stronger public-launch controls.\n"
          )
          r = r.replace(
            "The application no longer contains fallback credentials; missing configuration fails explicitly instead of silently switching to another project.\n",
            "The application contains no fallback credentials. Vite validates the required Supabase variables while resolving the build config, so `npm run build` fails before producing an artifact when configuration is missing.\n"
          )
          readme.write_text(r)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify missing config fails before artifact creation
        shell: bash
        run: |
          rm -rf dist
          set +e
          env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY npm run build > /tmp/missing-env-build.log 2>&1
          status=$?
          set -e
          cat /tmp/missing-env-build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Build unexpectedly succeeded without required Supabase configuration"
            exit 1
          fi
          grep -q "Missing required build configuration" /tmp/missing-env-build.log
          test ! -d dist

      - name: Verify configured build
        env:
          VITE_SUPABASE_URL: https://jvxoclbgggfugmnbsosf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vUmiT7YMOd-O9afxzOn-2g_QPTiGzmg
        run: npm run build

      - name: Commit hardened client
        run: |
          git rm .github/workflows/release-hardening-patch.yml
          git add src/App.tsx src/lib/contracts.ts vite.config.ts README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden build and write acknowledgement flow"
          git push
