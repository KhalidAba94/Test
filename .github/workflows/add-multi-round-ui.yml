name: Add multi-round UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-multi-round-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add next-question flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          anchor = """  const loadMemories = async () => {\n"""
          insert = """  useEffect(() => {\n    if (screen !== 'today' || !couple?.couple_id || !round?.round_id || round.status !== 'revealed') return\n\n    const refreshLatestRound = async () => {\n      try {\n        const next = await hydrateRound(couple.couple_id)\n        if (next.round_id !== round.round_id) {\n          void refreshMemories(couple.couple_id).catch(() => {\n            // Saved-state history is secondary to moving both partners into the next round.\n          })\n        }\n      } catch {\n        // Realtime/polling will retry. Do not interrupt the reveal screen for a missed sync.\n      }\n    }\n\n    const channel = supabase\n      .channel(`round-list-${couple.couple_id}`)\n      .on(\n        'postgres_changes',\n        { event: 'INSERT', schema: 'public', table: 'daily_rounds', filter: `couple_id=eq.${couple.couple_id}` },\n        refreshLatestRound,\n      )\n      .subscribe()\n\n    const poll = window.setInterval(refreshLatestRound, 5000)\n    return () => {\n      window.clearInterval(poll)\n      supabase.removeChannel(channel)\n    }\n  }, [couple?.couple_id, hydrateRound, refreshMemories, round?.round_id, round?.status, screen])\n\n"""
          if anchor not in s:
              raise SystemExit('loadMemories anchor not found')
          s = s.replace(anchor, insert + anchor, 1)

          anchor = """  const cancelWaitingRoom = async () => {\n"""
          insert = """  const startNextQuestion = async () => {\n    if (!couple) return\n    setBusy(true)\n    setError('')\n    try {\n      const { data, error: rpcError } = await supabase.rpc('start_next_round', {\n        p_couple_id: couple.couple_id,\n        p_round_date: getRiyadhDate(),\n      })\n      if (rpcError) throw rpcError\n      const next = parseRoundState(data, 'start_next_round')\n      setRound(next)\n      void refreshMemories(couple.couple_id).catch(() => {\n        // History refresh is non-blocking; the new round is already authoritative.\n      })\n    } catch (e) {\n      setError(friendlyError(e))\n    } finally {\n      setBusy(false)\n    }\n  }\n\n"""
          if anchor not in s:
              raise SystemExit('cancel anchor not found')
          s = s.replace(anchor, insert + anchor, 1)

          old = """            onOpenMemories={loadMemories}\n            onMemorySaved={async () => { await refreshMemories(couple.couple_id) }}\n"""
          new = """            onOpenMemories={loadMemories}\n            onMemorySaved={async () => { await refreshMemories(couple.couple_id) }}\n            onNextQuestion={startNextQuestion}\n"""
          if old not in s:
              raise SystemExit('Today invocation anchor not found')
          s = s.replace(old, new, 1)

          old = """  onOpenMemories,\n  onMemorySaved,\n}: {\n"""
          new = """  onOpenMemories,\n  onMemorySaved,\n  onNextQuestion,\n}: {\n"""
          if old not in s:
              raise SystemExit('Today destructuring anchor not found')
          s = s.replace(old, new, 1)

          old = """  onOpenMemories: () => Promise<void>\n  onMemorySaved: () => Promise<void>\n}) {\n"""
          new = """  onOpenMemories: () => Promise<void>\n  onMemorySaved: () => Promise<void>\n  onNextQuestion: () => Promise<void>\n}) {\n"""
          if old not in s:
              raise SystemExit('Today props type anchor not found')
          s = s.replace(old, new, 1)

          old = """          <button className={`button ${saved ? 'saved' : 'primary'}`} onClick={save} disabled={busy || saved}>\n            {saved ? <><Check size={18} /> Saved to your Memory Vault</> : <><Vault size={18} /> Save this moment</>}\n          </button>\n"""
          new = old + """          <button className=\"button secondary\" onClick={onNextQuestion} disabled={busy}>\n            {busy ? <LoaderCircle className=\"spin\" size={18} /> : <Sparkles size={18} />} Next question\n          </button>\n"""
          if old not in s:
              raise SystemExit('reveal save button anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: https://jvxoclbgggfugmnbsosf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vUmiT7YMOd-O9afxzOn-2g_QPTiGzmg
        run: npm run build

      - name: Commit UI changes
        run: |
          git rm .github/workflows/add-multi-round-ui.yml
          git add src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add next question and cross-phone round sync"
          git push
